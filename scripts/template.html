<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeTop 100 复习</title>
<style>
:root {
  --bg: #ffffff; --side: #f7f7f4; --text: #23262b; --muted: #737780; --line: #e5e4df;
  --code: #f6f6f2; --hover: #eeede8; --sel: #e4e9e4; --accent: #1f6f54;
  --red: #cf4b3f; --amber: #c58a12; --green: #3b9460;
  --k: #8a3ea8; --s: #1e6b3e; --c: #8a8f98; --n: #a8580a; --f: #1456b0; --t: #2f6a86;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181b; --side: #1c1d21; --text: #e2e2de; --muted: #8d919a; --line: #2c2e33;
    --code: #1f2125; --hover: #25272c; --sel: #26302b; --accent: #6fbf9c;
    --red: #e0695e; --amber: #d9a441; --green: #5fb583;
    --k: #c79bf2; --s: #8fcf9f; --c: #747983; --n: #e0a66c; --f: #7fb4f5; --t: #7fc1d9;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.75 var(--sans); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.app { display: grid; grid-template-columns: 330px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
.main { min-width: 0; overflow-y: auto; }

/* 侧栏 */
.side-head { padding: 12px 12px 8px; }
.searchrow { display: flex; gap: 6px; }
.searchrow input { flex: 1; min-width: 0; }
#more { width: 32px; color: var(--muted); border-radius: 6px; font-size: 16px; }
#more { position: relative; }
#more:hover, #more.on { background: var(--hover); color: var(--text); }
#more.filtered::after { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.panel { margin-top: 10px; }
.panel .acts { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
.panel .acts button { color: var(--muted); } .panel .acts button:hover { color: var(--text); }
.panel .acts label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.panel[hidden] { display: none; }
.bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--line); margin-bottom: 10px; }
.bar i { display: block; }
.bar .l3 { background: var(--green); } .bar .l2 { background: var(--amber); } .bar .l1 { background: var(--red); }
.searchrow input[type=search], .panel select {
  width: 100%; height: 32px; padding: 0 9px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; outline: none;
  font-size: 13px; -webkit-appearance: none; appearance: none;
}
.searchrow input:focus, .panel select:focus { border-color: var(--accent); }
.panel .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chips button { font-size: 12px; line-height: 22px; padding: 0 8px; border-radius: 11px; color: var(--muted); border: 1px solid transparent; }
.chips button:hover { background: var(--hover); }
.chips button.on { color: var(--text); background: var(--bg); border-color: var(--line); }
.chips b { font-weight: 400; opacity: .7; margin-left: 2px; font-variant-numeric: tabular-nums; }

.list { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 4px 8px 12px; list-style: none; border-top: 1px solid var(--line); }
.list .group { padding: 12px 8px 4px; font-size: 12px; color: var(--muted); }
.item { display: grid; grid-template-columns: 24px minmax(0, 1fr) 8px; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14.5px; }
.item:hover { background: var(--hover); }
.item.active { background: var(--sel); }
.item .no { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.item .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.dot.l1 { background: var(--red); border-color: var(--red); }
.dot.l2 { background: var(--amber); border-color: var(--amber); }
.dot.l3 { background: var(--green); border-color: var(--green); }
.empty { padding: 24px 8px; color: var(--muted); font-size: 13px; text-align: center; }


:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.searchrow input:focus-visible, .panel select:focus-visible { outline: none; }

/* 正文 */
.doc { max-width: 760px; margin: 0 auto; padding: 48px 32px 80px; }
.back { display: none; color: var(--muted); }
.head { display: flex; align-items: flex-start; gap: 16px; }
.head h2.title { flex: 1; font-size: 26px; line-height: 1.35; margin: 0; font-weight: 650; }
.solve { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 8px;
  background: var(--accent); color: var(--bg); font-size: 14px; font-weight: 600; }
.solve:hover { text-decoration: none; filter: brightness(1.08); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
.tags span { font-size: 13px; line-height: 26px; padding: 0 10px; border-radius: 13px; background: var(--sel); color: var(--text); }
.tags .lv1 { color: var(--green); } .tags .lv2 { color: var(--amber); } .tags .lv3 { color: var(--red); }
.desc { margin: 16px 0 8px; padding: 12px 16px; background: var(--code); border-radius: 8px; font-size: 16px; }
.reveal { display: block; width: 100%; margin-top: 28px; padding: 32px 0; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
.reveal:hover { background: var(--code); color: var(--text); }
.end { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; padding: 6px 0; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
.seg button:hover { background: var(--hover); color: var(--text); }
.seg button.on { color: #fff; border-color: transparent; }
.seg button.on.l1 { background: var(--red); } .seg button.on.l2 { background: var(--amber); } .seg button.on.l3 { background: var(--green); }
.pager { display: flex; justify-content: space-between; gap: 16px; }
.pager a { max-width: 48%; color: var(--muted); }
.pager a:hover { color: var(--text); text-decoration: none; }
.pager .nx { margin-left: auto; text-align: right; }

.note h1 { font-size: 22px; margin: 0 0 10px; }
.note h2 { font-size: 19px; margin: 36px 0 10px; font-weight: 650; }
.note h3 { font-size: 16.5px; margin: 20px 0 6px; font-weight: 650; }
.note h4 { font-size: 16px; margin: 16px 0 4px; }
.note p { margin: 10px 0; }
.note ul, .note ol { margin: 6px 0; padding-left: 22px; }
.note li { margin: 5px 0; }
.note blockquote { margin: 10px 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.note code { font: 14px var(--mono); background: var(--code); padding: 1px 5px; border-radius: 4px; }
.code { position: relative; margin: 10px 0 14px; }
.code pre { margin: 0; padding: 14px 16px; background: var(--code); border-radius: 8px; overflow-x: auto; }
.code pre code { font: 14px/1.65 var(--mono); background: none; padding: 0; white-space: pre; tab-size: 4; }
.code .langs { position: absolute; top: 8px; right: 10px; opacity: 0; transition: opacity .15s; display: flex; gap: 2px; z-index: 1; }
.code:hover .langs, .code .langs:focus-within { opacity: 1; }
.code .langs .copy { margin-left: 4px; }
.code .langs button { font-size: 12px; padding: 0 7px; line-height: 20px; border-radius: 4px; color: var(--muted); background: var(--code); }
.code .langs button:hover { color: var(--text); }
body[data-lang=python] .langs [data-set-lang=python], body[data-lang=java] .langs [data-set-lang=java] { color: var(--text); background: var(--bg); box-shadow: 0 0 0 1px var(--line); }
body[data-lang=python] .code.multi pre[data-lang=java], body[data-lang=java] .code.multi pre[data-lang=python] { display: none; }
.code .k { color: var(--k); } .code .s { color: var(--s); } .code .c { color: var(--c); font-style: italic; }
.code .n { color: var(--n); } .code .f { color: var(--f); } .code .t { color: var(--t); }
.libs-doc h2 { font-size: 21px; margin-top: 40px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.libs-doc h3 { font-size: 17px; margin-top: 28px; scroll-margin-top: 16px; }
.toc { font-size: 14px; color: var(--muted); margin: 6px 0; }
.toc a { margin-right: 10px; white-space: nowrap; }
.welcome { color: var(--muted); padding-top: 18vh; text-align: center; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .app .main { display: none; }
  .app.detail .side { display: none; }
  .app.detail .main { display: block; }
  .doc { padding: 0 16px 60px; }
  .back { display: block; position: sticky; top: 0; z-index: 2; width: calc(100% + 32px); text-align: left; margin: 0 -16px 12px; padding: 12px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .head { flex-direction: column; gap: 12px; }
  .code .langs { opacity: 1; }
  .item { padding: 8px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="searchrow">
        <input id="q" type="search" placeholder="搜索" autocomplete="off">
        <button id="more" type="button" aria-label="更多" title="筛选 / 工具">⋯</button>
      </div>
      <div class="panel" id="panel" hidden>
        <div class="bar" id="bar"></div>
        <div class="row">
          <select id="tag" aria-label="分类"></select>
          <select id="sort" aria-label="排序">
            <option value="rank">按频度</option>
            <option value="tag">按分类</option>
            <option value="level">按掌握</option>
          </select>
        </div>
        <div class="chips" id="chips"></div>
        <div class="acts">
          <label title="先回忆，再显示笔记 (空格)"><input type="checkbox" id="recall"> 回忆</label>
          <button id="random" type="button">随机</button>
          <button id="export" type="button">导出</button>
          <button id="import" type="button">导入</button>
          <a href="#/libs">常用库</a>
          <input id="file" type="file" accept="application/json,.json" hidden>
        </div>
      </div>
    </div>
    <ol class="list" id="list"></ol>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
const DATA = /*__DATA__*/null;
const P = DATA.problems;
const byKey = Object.fromEntries(P.map(p => [p.key, p]));
const libById = Object.fromEntries(DATA.libs.sections.map(s => [s.id, s]));
const LEVELS = ['未标', '生疏', '模糊', '熟练'];
const DIFF = { '简单': 1, '中等': 2, '困难': 3 };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let progress = store.get('ct100.progress', {});          // 只存在当前浏览器：key -> { l: 0|1|2|3, t: 'YYYY-MM-DD' }
const ui = Object.assign({ tag: '', level: 'all', sort: 'rank', recall: false, lang: 'python' }, store.get('ct100.ui', {}));
let query = '', cur = null, revealed = false;

const entryOf = key => progress[key];
const levelOf = key => (entryOf(key) && entryOf(key).l) || 0;
const saveUi = () => store.set('ct100.ui', ui);

function visible() {
  const q = query.trim().toLowerCase();
  let list = P.filter(p =>
    (!ui.tag || p.tags.includes(ui.tag)) &&
    (ui.level === 'all' || levelOf(p.key) === +ui.level) &&
    (!q || (p.id + ' ' + p.title + ' ' + p.tags.join(' ')).toLowerCase().includes(q)));
  if (ui.sort === 'tag') {
    const order = tagOrder();
    list = list.slice().sort((a, b) => order.indexOf(a.tags[0]) - order.indexOf(b.tags[0]) || a.rank - b.rank);
  } else if (ui.sort === 'level') {
    const w = [2, 0, 1, 3];                                // 生疏 → 模糊 → 未标 → 熟练
    list = list.slice().sort((a, b) => w[levelOf(a.key)] - w[levelOf(b.key)] || a.rank - b.rank);
  }
  return list;
}

function tagOrder() {
  const count = {};
  P.forEach(p => { count[p.tags[0]] = (count[p.tags[0]] || 0) + 1; });
  return Object.keys(count).sort((a, b) => count[b] - count[a]);
}

function renderSide() {
  const counts = [0, 0, 0, 0];
  P.forEach(p => counts[levelOf(p.key)]++);
  $('bar').innerHTML = [3, 2, 1].map(l => `<i class="l${l}" style="width:${counts[l] / P.length * 100}%"></i>`).join('');
  $('bar').title = LEVELS.map((n, l) => `${n} ${counts[l]}`).join(' · ');
  const chip = (v, name, n) => `<button type="button" data-level="${v}" class="${String(ui.level) === String(v) ? 'on' : ''}">${name}<b>${n}</b></button>`;
  $('chips').innerHTML = chip('all', '全部', P.length) + [1, 2, 0, 3].map(l => chip(l, LEVELS[l], counts[l])).join('');

  $('more').classList.toggle('filtered', !!ui.tag || ui.level !== 'all' || ui.sort !== 'rank');
  const list = visible();
  let html = '', group = null;
  list.forEach((p, n) => {
    if (ui.sort === 'tag' && p.tags[0] !== group) {
      group = p.tags[0];
      html += `<li class="group">${esc(group)}</li>`;
    }
    html += `<li class="item${p.key === cur ? ' active' : ''}" data-key="${esc(p.key)}">
      <span class="no">${n + 1}</span><span class="tt">${esc(p.title)}</span>
      <span class="dot l${levelOf(p.key)}"></span></li>`;
  });
  $('list').innerHTML = html || '<li class="empty">无结果</li>';
}

function renderMain() {
  const main = $('main');
  if (cur === 'libs') {
    const toc = lang => DATA.libs.sections.filter(s => s.lang === lang)
      .map(s => `<a href="#/libs/${s.id}">${esc(s.name)}</a>`).join('');
    main.innerHTML = `<div class="doc"><button class="back" type="button" data-act="back">← 列表</button>
      <div class="toc">Python：${toc('python')}</div><div class="toc">Java：${toc('java')}</div>
      <div class="note libs-doc">${DATA.libs.html}</div></div>`;
    addCopy();
    return;
  }
  const p = byKey[cur];
  if (!p) { main.innerHTML = '<div class="doc welcome"></div>'; return; }
  const list = visible(), i = list.findIndex(x => x.key === cur), lv = levelOf(p.key);
  const hidden = ui.recall && !revealed;
  const prev = list[i - 1], next = i >= 0 ? list[i + 1] : null;
  main.innerHTML = `<div class="doc">
    <button class="back" type="button" data-act="back">← 列表</button>
    <div class="head">
      <h2 class="title">${esc(p.title)}</h2>
      <a class="solve" href="${esc(p.link)}" target="_blank" rel="noopener">去做题 ↗</a>
    </div>
    <div class="tags">
      <span class="lv${DIFF[p.difficulty]}">${esc(p.difficulty)}</span>
      ${p.tags.map(t => `<span>${esc(t)}</span>`).join('')}
    </div>
    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
    ${hidden ? '<button class="reveal" type="button" data-act="reveal">显示</button>' : `<div class="note">${p.html}</div>`}
    <div class="end">
      <div class="seg">${[1, 2, 3].map(l => `<button type="button" data-mark="${l}" class="l${l}${lv === l ? ' on' : ''}">${LEVELS[l]}</button>`).join('')}</div>
      <nav class="pager">
        ${prev ? `<a href="#/${esc(prev.key)}">← ${esc(prev.title)}</a>` : ''}
        ${next ? `<a class="nx" href="#/${esc(next.key)}">${esc(next.title)} →</a>` : ''}
      </nav>
    </div>
  </div>`;
  addCopy();
}

function addCopy() {
  $('main').querySelectorAll('.note .code').forEach(box => {
    let bar = box.querySelector('.langs');
    if (!bar) { bar = document.createElement('div'); bar.className = 'langs'; box.prepend(bar); }
    bar.insertAdjacentHTML('beforeend', '<button type="button" class="copy" data-act="copy">复制</button>');
  });
}
function render() { renderSide(); renderMain(); }

function route() {
  const parts = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
  const key = parts[0] || null;
  if (key !== cur) revealed = false;
  cur = key;
  $('app').classList.toggle('detail', !!cur);
  document.title = byKey[cur] ? `${byKey[cur].title} · CodeTop 100` : cur === 'libs' ? '常用库 · CodeTop 100' : 'CodeTop 100';
  if (byKey[cur]) { ui.last = cur; saveUi(); }
  render();
  if (cur === 'libs' && parts[1]) {
    const el = $('lib-' + parts[1]);
    if (el) el.scrollIntoView();
  } else {
    $('main').scrollTop = 0;
  }
  const active = document.querySelector('.item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

const go = key => { location.hash = key ? '#/' + key : ''; };
function step(d) {
  const list = visible(), i = list.findIndex(x => x.key === cur);
  const next = list[i < 0 ? 0 : i + d];
  if (next) go(next.key);
}
function mark(l) {
  if (!byKey[cur]) return;
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const t = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  if (l && levelOf(cur) !== l) progress[cur] = { l, t };
  else delete progress[cur];
  store.set('ct100.progress', progress);
  render();
}
function setLang(lang) {
  ui.lang = lang; saveUi();
  document.body.dataset.lang = lang;
  if (byKey[cur]) { const top = $('main').scrollTop; renderMain(); $('main').scrollTop = top; }
}
function randomPick() {
  const list = visible().filter(p => p.key !== cur);
  if (list.length) go(list[Math.floor(Math.random() * list.length)].key);
}

// 事件
$('list').addEventListener('click', e => { const li = e.target.closest('.item'); if (li) go(li.dataset.key); });
$('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { ui.level = b.dataset.level; saveUi(); render(); } });
$('q').addEventListener('input', e => { query = e.target.value; renderSide(); $('list').scrollTop = 0; });
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const f = visible()[0]; if (f) { go(f.key); e.target.blur(); } }
  else if (e.key === 'Escape' && e.target.value) { e.stopPropagation(); e.target.value = query = ''; renderSide(); }
});
$('tag').addEventListener('change', e => { ui.tag = e.target.value; saveUi(); render(); });
$('sort').addEventListener('change', e => { ui.sort = e.target.value; saveUi(); render(); });
$('recall').addEventListener('change', e => { ui.recall = e.target.checked; revealed = false; saveUi(); renderMain(); });
$('more').addEventListener('click', () => { const h = $('panel').hidden = !$('panel').hidden; $('more').classList.toggle('on', !h); });
$('random').addEventListener('click', randomPick);
$('main').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mark) mark(+b.dataset.mark);
  else if (b.dataset.setLang) setLang(b.dataset.setLang);
  else if (b.dataset.act === 'prev') step(-1);
  else if (b.dataset.act === 'next') step(1);
  else if (b.dataset.act === 'back') go(null);
  else if (b.dataset.act === 'copy') {
    const pre = [...b.closest('.code').querySelectorAll('pre')].find(x => x.offsetParent);
    const done = () => { b.textContent = '已复制'; setTimeout(() => { b.textContent = '复制'; }, 1200); };
    const legacy = () => { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      if (document.execCommand('copy')) done(); sel.removeAllRanges(); };
    if (navigator.clipboard) navigator.clipboard.writeText(pre.innerText).then(done, legacy); else legacy();
  }
  else if (b.dataset.act === 'reveal') { revealed = true; renderMain(); }
});
$('export').addEventListener('click', () => {
  const merged = {};
  for (const p of P) if (levelOf(p.key)) merged[p.key] = entryOf(p.key);
  const blob = new Blob([JSON.stringify({ version: 1, progress: merged }, null, 2) + '\n'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'progress.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    if (!obj || typeof obj.progress !== 'object') throw new Error('格式不对');
    progress = {};
    for (const p of P) {                                  // 文件里没有的题视为未标记
      const e = obj.progress[p.key];
      if (e && e.l) progress[p.key] = e;
    }
    store.set('ct100.progress', progress); render();
  } catch (err) { alert('导入失败：' + err.message); }
  e.target.value = '';
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'checkbox';
  if (typing) { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key;
  if (k === 'j' || k === 'ArrowRight') step(1);
  else if (k === 'k' || k === 'ArrowLeft') step(-1);
  else if (k === '1' || k === '2' || k === '3') mark(+k);
  else if (k === '0') mark(0);
  else if (k === 'r') randomPick();
  else if (k === 'l') setLang(ui.lang === 'python' ? 'java' : 'python');
  else if (k === '/') { e.preventDefault(); $('q').focus(); }
  else if (k === ' ' && ui.recall && !revealed && byKey[cur]) { e.preventDefault(); revealed = true; renderMain(); }
});
window.addEventListener('hashchange', route);

// 初始化
$('tag').innerHTML = '<option value="">全部分类</option>' +
  [...new Set(P.flatMap(p => p.tags))].map(t => [t, P.filter(p => p.tags.includes(t)).length])
    .sort((a, b) => b[1] - a[1]).map(([t, n]) => `<option value="${esc(t)}">${esc(t)}（${n}）</option>`).join('');
$('tag').value = ui.tag; $('sort').value = ui.sort; $('recall').checked = ui.recall;
document.body.dataset.lang = ui.lang;
if (!location.hash && window.matchMedia('(min-width: 821px)').matches && P.length) history.replaceState(null, '', '#/' + (byKey[ui.last] ? ui.last : visible()[0]?.key));
route();
</script>
</body>
</html>
