<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeTop 100 复习</title>
<style>
:root {
  --bg: #ffffff; --side: #f7f7f4; --text: #23262b; --muted: #737780; --line: #e5e4df;
  --code: #f6f6f2; --hover: #eeede8; --sel: #e4e9e4; --accent: #1f6f54;
  --red: #cf4b3f; --amber: #c58a12; --green: #3b9460;
  --k: #8a3ea8; --s: #1e6b3e; --c: #8a8f98; --n: #a8580a; --f: #1456b0; --t: #2f6a86;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181b; --side: #1c1d21; --text: #e2e2de; --muted: #8d919a; --line: #2c2e33;
    --code: #1f2125; --hover: #25272c; --sel: #26302b; --accent: #6fbf9c;
    --red: #e0695e; --amber: #d9a441; --green: #5fb583;
    --k: #c79bf2; --s: #8fcf9f; --c: #747983; --n: #e0a66c; --f: #7fb4f5; --t: #7fc1d9;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.7 var(--sans); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.app { display: grid; grid-template-columns: 330px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
.main { min-width: 0; overflow-y: auto; }

/* 侧栏 */
.side-head { padding: 14px 16px 10px; }
.side-head h1 { margin: 0 0 10px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.side-head h1 a { font-size: 13px; font-weight: 400; }
.bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--line); margin-bottom: 10px; }
.bar i { display: block; }
.bar .l3 { background: var(--green); } .bar .l2 { background: var(--amber); } .bar .l1 { background: var(--red); }
.controls input[type=search], .controls select {
  width: 100%; height: 32px; padding: 0 9px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; outline: none;
  font-size: 13px; -webkit-appearance: none; appearance: none;
}
.controls input:focus, .controls select:focus { border-color: var(--accent); }
.controls .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chips button { font-size: 12px; line-height: 22px; padding: 0 8px; border-radius: 11px; color: var(--muted); border: 1px solid transparent; }
.chips button:hover { background: var(--hover); }
.chips button.on { color: var(--text); background: var(--bg); border-color: var(--line); }
.chips b { font-weight: 400; opacity: .7; margin-left: 2px; font-variant-numeric: tabular-nums; }

.list { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 4px 8px 12px; list-style: none; border-top: 1px solid var(--line); }
.list .group { padding: 12px 8px 4px; font-size: 12px; color: var(--muted); }
.item { display: grid; grid-template-columns: 8px 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.item:hover { background: var(--hover); }
.item.active { background: var(--sel); }
.item .no { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.item .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .df { font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); }
.dot.l1 { background: var(--red); border-color: var(--red); }
.dot.l2 { background: var(--amber); border-color: var(--amber); }
.dot.l3 { background: var(--green); border-color: var(--green); }
.d1 { color: var(--green); } .d2 { color: var(--amber); } .d3 { color: var(--red); }
.empty { padding: 24px 8px; color: var(--muted); font-size: 13px; text-align: center; }

.side-foot { padding: 8px 16px 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.side-foot .acts { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.side-foot button { color: var(--muted); }
.side-foot button:hover { color: var(--text); }
.side-foot label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.side-foot .keys { margin-top: 4px; opacity: .8; }
kbd { font: 11px var(--mono); padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); }

/* 正文 */
.doc { max-width: 820px; margin: 0 auto; padding: 18px 32px 80px; }
.topbar { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.topbar .sp { flex: 1; }
.topbar button { color: var(--muted); padding: 2px 6px; border-radius: 4px; }
.topbar button:hover:not(:disabled) { color: var(--text); background: var(--hover); }
.topbar button:disabled { opacity: .35; cursor: default; }
.back { display: none; }
.doc h2.title { font-size: 22px; line-height: 1.35; margin: 0 0 6px; font-weight: 650; }
.doc h2.title .no { color: var(--muted); font-weight: 400; margin-right: 6px; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.marks { display: flex; align-items: center; gap: 10px; margin: 14px 0 4px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { padding: 2px 13px; font-size: 13px; color: var(--muted); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--hover); }
.seg button.on { color: #fff; }
.seg button.on.l1 { background: var(--red); } .seg button.on.l2 { background: var(--amber); } .seg button.on.l3 { background: var(--green); }
.seg button.on.plain { background: var(--sel); color: var(--text); }
.marks .when { font-size: 12px; color: var(--muted); }
.desc { margin: 14px 0 0; padding: 8px 12px; background: var(--code); border-radius: 6px; font-size: 14px; }
.usedlibs { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.usedlibs a { margin-right: 10px; font-family: var(--mono); font-size: 12.5px; }
.reveal { display: block; width: 100%; margin-top: 18px; padding: 26px 0; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
.reveal:hover { background: var(--code); color: var(--text); }

.note h1 { font-size: 22px; margin: 0 0 10px; }
.note h2 { font-size: 16px; margin: 26px 0 8px; font-weight: 650; }
.note h3 { font-size: 14.5px; margin: 20px 0 6px; font-weight: 650; }
.note h4 { font-size: 14px; margin: 16px 0 4px; }
.note p { margin: 8px 0; }
.note ul, .note ol { margin: 6px 0; padding-left: 22px; }
.note li { margin: 3px 0; }
.note blockquote { margin: 10px 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.note code { font: 13px var(--mono); background: var(--code); padding: 1px 5px; border-radius: 4px; }
.code { position: relative; margin: 10px 0 14px; }
.code pre { margin: 0; padding: 12px 14px; background: var(--code); border-radius: 8px; overflow-x: auto; }
.code pre code { font: 13px/1.6 var(--mono); background: none; padding: 0; white-space: pre; tab-size: 4; }
.code .langs { position: absolute; top: 6px; right: 8px; display: flex; gap: 2px; z-index: 1; }
.code .langs button { font-size: 12px; padding: 0 7px; line-height: 20px; border-radius: 4px; color: var(--muted); background: var(--code); }
.code .langs button:hover { color: var(--text); }
body[data-lang=python] .langs [data-set-lang=python], body[data-lang=java] .langs [data-set-lang=java] { color: var(--text); background: var(--bg); box-shadow: 0 0 0 1px var(--line); }
body[data-lang=python] .code.multi pre[data-lang=java], body[data-lang=java] .code.multi pre[data-lang=python] { display: none; }
.code .k { color: var(--k); } .code .s { color: var(--s); } .code .c { color: var(--c); font-style: italic; }
.code .n { color: var(--n); } .code .f { color: var(--f); } .code .t { color: var(--t); }
.libs-doc h2 { font-size: 19px; margin-top: 40px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.libs-doc h3 { font-size: 15.5px; margin-top: 28px; scroll-margin-top: 16px; }
.toc { font-size: 13px; color: var(--muted); margin: 6px 0; }
.toc a { margin-right: 10px; white-space: nowrap; }
.welcome { color: var(--muted); padding-top: 18vh; text-align: center; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .app .main { display: none; }
  .app.detail .side { display: none; }
  .app.detail .main { display: block; }
  .back { display: inline-block; }
  .doc { padding: 12px 16px 60px; }
  .side-foot .keys { display: none; }
  .item { padding: 8px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <h1><span>CodeTop 100 复习</span><a href="#/libs">常用库速查</a></h1>
      <div class="bar" id="bar"></div>
      <div class="controls">
        <input id="q" type="search" placeholder="搜索题号 / 标题 / 分类" autocomplete="off">
        <div class="row">
          <select id="tag" aria-label="分类"></select>
          <select id="sort" aria-label="排序">
            <option value="rank">按频度</option>
            <option value="tag">按分类</option>
            <option value="level">按掌握程度（生疏在前）</option>
          </select>
        </div>
        <div class="chips" id="chips"></div>
      </div>
    </div>
    <ol class="list" id="list"></ol>
    <div class="side-foot">
      <div class="acts">
        <label><input type="checkbox" id="recall"> 回忆模式</label>
        <button id="random" type="button">随机一题</button>
        <button id="export" type="button">导出进度</button>
        <button id="import" type="button">导入进度</button>
        <input id="file" type="file" accept="application/json,.json" hidden>
      </div>
      <div class="keys"><kbd>j</kbd>/<kbd>k</kbd> 切题　<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 标记　<kbd>空格</kbd> 显示　<kbd>l</kbd> 切语言　<kbd>r</kbd> 随机　<kbd>/</kbd> 搜索</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
const DATA = /*__DATA__*/null;
const P = DATA.problems;
const byKey = Object.fromEntries(P.map(p => [p.key, p]));
const libById = Object.fromEntries(DATA.libs.sections.map(s => [s.id, s]));
const LEVELS = ['未标', '生疏', '模糊', '熟练'];
const DIFF = { '简单': 1, '中等': 2, '困难': 3 };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const SEED = DATA.seed || {};                             // 仓库里 progress.json 的内容，作为初始值
let progress = store.get('ct100.progress', {});          // key -> { l: 0|1|2|3, t: 'YYYY-MM-DD' }，覆盖 SEED
const ui = Object.assign({ tag: '', level: 'all', sort: 'rank', recall: false, lang: 'python' }, store.get('ct100.ui', {}));
let query = '', cur = null, revealed = false;

const entryOf = key => progress[key] || SEED[key];
const levelOf = key => (entryOf(key) && entryOf(key).l) || 0;
const saveUi = () => store.set('ct100.ui', ui);
const shortId = p => p.id.replace('补充题', '补').replace('剑指 Offer ', '剑');

function visible() {
  const q = query.trim().toLowerCase();
  let list = P.filter(p =>
    (!ui.tag || p.tags.includes(ui.tag)) &&
    (ui.level === 'all' || levelOf(p.key) === +ui.level) &&
    (!q || (p.id + ' ' + p.title + ' ' + p.tags.join(' ')).toLowerCase().includes(q)));
  if (ui.sort === 'tag') {
    const order = tagOrder();
    list = list.slice().sort((a, b) => order.indexOf(a.tags[0]) - order.indexOf(b.tags[0]) || a.rank - b.rank);
  } else if (ui.sort === 'level') {
    const w = [2, 0, 1, 3];                                // 生疏 → 模糊 → 未标 → 熟练
    list = list.slice().sort((a, b) => w[levelOf(a.key)] - w[levelOf(b.key)] || a.rank - b.rank);
  }
  return list;
}

function tagOrder() {
  const count = {};
  P.forEach(p => { count[p.tags[0]] = (count[p.tags[0]] || 0) + 1; });
  return Object.keys(count).sort((a, b) => count[b] - count[a]);
}

function renderSide() {
  const counts = [0, 0, 0, 0];
  P.forEach(p => counts[levelOf(p.key)]++);
  $('bar').innerHTML = [3, 2, 1].map(l => `<i class="l${l}" style="width:${counts[l] / P.length * 100}%"></i>`).join('');
  $('bar').title = LEVELS.map((n, l) => `${n} ${counts[l]}`).join(' · ');
  const chip = (v, name, n) => `<button type="button" data-level="${v}" class="${String(ui.level) === String(v) ? 'on' : ''}">${name}<b>${n}</b></button>`;
  $('chips').innerHTML = chip('all', '全部', P.length) + [1, 2, 0, 3].map(l => chip(l, LEVELS[l], counts[l])).join('');

  const list = visible();
  let html = '', group = null;
  for (const p of list) {
    if (ui.sort === 'tag' && p.tags[0] !== group) {
      group = p.tags[0];
      html += `<li class="group">${esc(group)}</li>`;
    }
    html += `<li class="item${p.key === cur ? ' active' : ''}" data-key="${esc(p.key)}">
      <span class="dot l${levelOf(p.key)}" title="${LEVELS[levelOf(p.key)]}"></span>
      <span class="no">${esc(shortId(p))}</span><span class="tt">${esc(p.title)}</span>
      <span class="df d${DIFF[p.difficulty]}">${esc(p.difficulty)}</span></li>`;
  }
  $('list').innerHTML = html || '<li class="empty">没有符合条件的题目</li>';
}

function renderMain() {
  const main = $('main');
  if (cur === 'libs') {
    const toc = lang => DATA.libs.sections.filter(s => s.lang === lang)
      .map(s => `<a href="#/libs/${s.id}">${esc(s.name)}</a>`).join('');
    main.innerHTML = `<div class="doc"><div class="topbar"><button class="back" type="button" data-act="back">← 列表</button></div>
      <div class="toc">Python：${toc('python')}</div><div class="toc">Java：${toc('java')}</div>
      <div class="note libs-doc">${DATA.libs.html}</div></div>`;
    return;
  }
  const p = byKey[cur];
  if (!p) { main.innerHTML = '<div class="doc welcome">从左侧选一道题开始复习</div>'; return; }
  const list = visible(), i = list.findIndex(x => x.key === cur), lv = levelOf(p.key);
  const libs = p.libs.map(id => libById[id]).filter(s => s && s.lang === ui.lang);
  const hidden = ui.recall && !revealed;
  main.innerHTML = `<div class="doc">
    <div class="topbar">
      <button class="back" type="button" data-act="back">← 列表</button>
      <span>${i >= 0 ? `${i + 1} / ${list.length}` : ''}</span><span class="sp"></span>
      <button type="button" data-act="prev" ${i > 0 ? '' : 'disabled'}>← 上一题</button>
      <button type="button" data-act="next" ${i >= 0 && i < list.length - 1 ? '' : 'disabled'}>下一题 →</button>
    </div>
    <h2 class="title"><span class="no">${esc(p.id)}.</span>${esc(p.title)}</h2>
    <div class="meta">
      <span class="d${DIFF[p.difficulty]}">${esc(p.difficulty)}</span>
      <span>${p.tags.map(esc).join(' · ')}</span>
      <span>频度 ${p.freq}（第 ${p.rank}）</span>
      <a href="${esc(p.link)}" target="_blank" rel="noopener">去 LeetCode 做题 ↗</a>
    </div>
    <div class="marks">
      <span class="seg">${[1, 2, 3].map(l => `<button type="button" data-mark="${l}" class="l${l}${lv === l ? ' on' : ''}">${LEVELS[l]}</button>`).join('')}</span>
      <span class="when">${lv ? '标记于 ' + esc(entryOf(p.key).t) : '未标记'}</span>
    </div>
    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
    ${hidden ? '<button class="reveal" type="button" data-act="reveal">先回忆思路，再点这里（或按空格）显示笔记</button>' : `
    ${libs.length ? `<p class="usedlibs">用到的库：${libs.map(s => `<a href="#/libs/${s.id}">${esc(s.name)}</a>`).join('')}</p>` : ''}
    <div class="note">${p.html}</div>`}
  </div>`;
}

function render() { renderSide(); renderMain(); }

function route() {
  const parts = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
  const key = parts[0] || null;
  if (key !== cur) revealed = false;
  cur = key;
  $('app').classList.toggle('detail', !!cur);
  render();
  if (cur === 'libs' && parts[1]) {
    const el = $('lib-' + parts[1]);
    if (el) el.scrollIntoView();
  } else {
    $('main').scrollTop = 0;
  }
  const active = document.querySelector('.item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

const go = key => { location.hash = key ? '#/' + key : ''; };
function step(d) {
  const list = visible(), i = list.findIndex(x => x.key === cur);
  const next = list[i < 0 ? 0 : i + d];
  if (next) go(next.key);
}
function mark(l) {
  if (!byKey[cur]) return;
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const t = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  if (l && levelOf(cur) !== l) progress[cur] = { l, t };
  else if (SEED[cur]) progress[cur] = { l: 0, t };        // 取消标记：要盖住仓库里的初始值
  else delete progress[cur];
  store.set('ct100.progress', progress);
  render();
}
function setLang(lang) {
  ui.lang = lang; saveUi();
  document.body.dataset.lang = lang;
  if (byKey[cur]) { const top = $('main').scrollTop; renderMain(); $('main').scrollTop = top; }
}
function randomPick() {
  const list = visible().filter(p => p.key !== cur);
  if (list.length) go(list[Math.floor(Math.random() * list.length)].key);
}

// 事件
$('list').addEventListener('click', e => { const li = e.target.closest('.item'); if (li) go(li.dataset.key); });
$('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { ui.level = b.dataset.level; saveUi(); render(); } });
$('q').addEventListener('input', e => { query = e.target.value; renderSide(); });
$('tag').addEventListener('change', e => { ui.tag = e.target.value; saveUi(); render(); });
$('sort').addEventListener('change', e => { ui.sort = e.target.value; saveUi(); render(); });
$('recall').addEventListener('change', e => { ui.recall = e.target.checked; revealed = false; saveUi(); renderMain(); });
$('random').addEventListener('click', randomPick);
$('main').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mark) mark(+b.dataset.mark);
  else if (b.dataset.setLang) setLang(b.dataset.setLang);
  else if (b.dataset.act === 'prev') step(-1);
  else if (b.dataset.act === 'next') step(1);
  else if (b.dataset.act === 'back') go(null);
  else if (b.dataset.act === 'reveal') { revealed = true; renderMain(); }
});
$('export').addEventListener('click', () => {
  const merged = {};
  for (const p of P) if (levelOf(p.key)) merged[p.key] = entryOf(p.key);
  const blob = new Blob([JSON.stringify({ version: 1, progress: merged }, null, 2) + '\n'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'progress.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    if (!obj || typeof obj.progress !== 'object') throw new Error('格式不对');
    progress = {};
    for (const p of P) {                                  // 文件里没有的题视为未标记
      const e = obj.progress[p.key];
      if (e && e.l) progress[p.key] = e;
      else if (SEED[p.key]) progress[p.key] = { l: 0, t: '' };
    }
    store.set('ct100.progress', progress); render();
  } catch (err) { alert('导入失败：' + err.message); }
  e.target.value = '';
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'checkbox';
  if (typing) { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key;
  if (k === 'j' || k === 'ArrowRight') step(1);
  else if (k === 'k' || k === 'ArrowLeft') step(-1);
  else if (k === '1' || k === '2' || k === '3') mark(+k);
  else if (k === '0') mark(0);
  else if (k === 'r') randomPick();
  else if (k === 'l') setLang(ui.lang === 'python' ? 'java' : 'python');
  else if (k === '/') { e.preventDefault(); $('q').focus(); }
  else if (k === ' ' && ui.recall && !revealed && byKey[cur]) { e.preventDefault(); revealed = true; renderMain(); }
});
window.addEventListener('hashchange', route);

// 初始化
$('tag').innerHTML = '<option value="">全部分类</option>' +
  [...new Set(P.flatMap(p => p.tags))].map(t => [t, P.filter(p => p.tags.includes(t)).length])
    .sort((a, b) => b[1] - a[1]).map(([t, n]) => `<option value="${esc(t)}">${esc(t)}（${n}）</option>`).join('');
$('tag').value = ui.tag; $('sort').value = ui.sort; $('recall').checked = ui.recall;
document.body.dataset.lang = ui.lang;
if (!location.hash && window.matchMedia('(min-width: 821px)').matches && P.length) history.replaceState(null, '', '#/' + visible()[0]?.key);
route();
</script>
