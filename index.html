 <span class=\"k\">in<\/span> range(start, len(candidates)):\n                num = candidates[i]\n                <span class=\"k\">if<\/span> target - num &lt; <span class=\"n\">0<\/span>:         <span class=\"c\"># 已排序，后面的更大<\/span>\n                    <span class=\"k\">break<\/span>\n                path.append(num)\n                dfs(target - num, i)         <span class=\"c\"># 传 i：当前数可以重复选<\/span>\n                path.pop()\n\n        dfs(target, <span class=\"n\">0<\/span>)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">LinkedList<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; path = <span class=\"k\">new<\/span> <span class=\"t\">LinkedList<\/span>&lt;&gt;();\n\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; combinationSum(<span class=\"k\">int<\/span>[] candidates, <span class=\"k\">int<\/span> target) {\n        <span class=\"t\">Arrays<\/span>.sort(candidates);\n        dfs(candidates, target, <span class=\"n\">0<\/span>);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> dfs(<span class=\"k\">int<\/span>[] candidates, <span class=\"k\">int<\/span> target, <span class=\"k\">int<\/span> start) {\n        <span class=\"k\">if<\/span> (target == <span class=\"n\">0<\/span>) {\n            res.add(<span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;(path));\n            <span class=\"k\">return<\/span>;\n        }\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = start; i &lt; candidates.length; i++) {\n            <span class=\"k\">int<\/span> num = candidates[i];\n            <span class=\"k\">if<\/span> (target - num &lt; <span class=\"n\">0<\/span>) <span class=\"k\">break<\/span>;             <span class=\"c\">// 已排序，后面的更大<\/span>\n            path.add(num);\n            dfs(candidates, target - num, i);        <span class=\"c\">// 传 i：当前数可以重复选<\/span>\n            path.removeLast();\n        }\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间上界 O(n^(target/min))，实际远小于此；空间 O(target/min)（递归深度）。<\/p>"},{"key":"104","rank":71,"id":"104","title":"二叉树的最大深度","difficulty":"简单","tags":["二叉树","DFS","BFS"],"freq":92,"link":"https://leetcode.cn/problems/maximum-depth-of-binary-tree/","desc":"求二叉树的最大深度（根到最远叶子的节点数）。","libs":["python-0","java-12"],"html":"<h2>思路<\/h2>\n<ul><li><strong>DFS<\/strong>：一棵树的深度 = <code>1 + max(左子树深度, 右子树深度)<\/code>，空树为 0。后序思想：先算左右，再汇总到当前节点。<\/li><li><strong>BFS<\/strong>：层序遍历，每处理完一层 <code>depth++<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>空树返回 0，不是 1。<\/li><li>BFS 里 <code>depth++<\/code> 在每层的 for 循环结束之后；同样要先记下 <code>sz = q.size()<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：DFS<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">maxDepth<\/span>(self, root: Optional[TreeNode]) -&gt; int:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root:\n            <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">1<\/span> + max(self.maxDepth(root.left), self.maxDepth(root.right))<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> maxDepth(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n        <span class=\"k\">return<\/span> <span class=\"n\">1<\/span> + <span class=\"t\">Math<\/span>.max(maxDepth(root.left), maxDepth(root.right));\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：BFS<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">maxDepth<\/span>(self, root: Optional[TreeNode]) -&gt; int:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root:\n            <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>\n        depth, q = <span class=\"n\">0<\/span>, deque([root])\n        <span class=\"k\">while<\/span> q:\n            <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(len(q)):\n                cur = q.popleft()\n                <span class=\"k\">if<\/span> cur.left:\n                    q.append(cur.left)\n                <span class=\"k\">if<\/span> cur.right:\n                    q.append(cur.right)\n            depth += <span class=\"n\">1<\/span>                       <span class=\"c\"># 一层结束<\/span>\n        <span class=\"k\">return<\/span> depth<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> maxDepth(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n        <span class=\"k\">int<\/span> depth = <span class=\"n\">0<\/span>;\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">TreeNode<\/span>&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        q.offer(root);\n        <span class=\"k\">while<\/span> (!q.isEmpty()) {\n            <span class=\"k\">int<\/span> sz = q.size();\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; sz; i++) {\n                <span class=\"t\">TreeNode<\/span> cur = q.poll();\n                <span class=\"k\">if<\/span> (cur.left != <span class=\"k\">null<\/span>) q.offer(cur.left);\n                <span class=\"k\">if<\/span> (cur.right != <span class=\"k\">null<\/span>) q.offer(cur.right);\n            }\n            depth++;                         <span class=\"c\">// 一层结束<\/span>\n        }\n        <span class=\"k\">return<\/span> depth;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)；空间 DFS O(h)，BFS O(n)。<\/p>"},{"key":"152","rank":72,"id":"152","title":"乘积最大子数组","difficulty":"中等","tags":["动态规划"],"freq":91,"link":"https://leetcode.cn/problems/maximum-product-subarray/","desc":"求乘积最大的非空连续子数组的乘积。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>和 <a href=\"#/53\">53 最大子数组和<\/a> 的区别：乘法遇到负数会让<strong>最小值翻身变成最大值<\/strong>，所以要同时维护两个状态：<ul><li><code>dpMax<\/code>：以 <code>nums[i]<\/code> 结尾的最大乘积；<\/li><li><code>dpMin<\/code>：以 <code>nums[i]<\/code> 结尾的最小乘积。<\/li><\/ul><\/li><li>每个位置三个候选：自己重新开始 <code>nums[i]<\/code>、接在最大值后面 <code>dpMax * nums[i]<\/code>、接在最小值后面 <code>dpMin * nums[i]<\/code>。<code>dpMax<\/code> 取三者最大，<code>dpMin<\/code> 取三者最小。<\/li><li>只依赖前一个位置，压成两个变量。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>压成变量后注意更新顺序：先把旧的 <code>dpMin<\/code>（或 <code>dpMax<\/code>）存下来，否则算第二个时用到的是刚更新过的值。<\/li><li>遇到 0 乘积断开，「自己重新开始」这个候选保证了能从下一个数重新起头。<\/li><li>答案是过程中 <code>dpMax<\/code> 的最大值；初始化用 <code>nums[0]<\/code> 而不是 0 或 1。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">maxProduct<\/span>(self, nums: List[int]) -&gt; int:\n        dp_min = dp_max = res = nums[<span class=\"n\">0<\/span>]\n        <span class=\"k\">for<\/span> x <span class=\"k\">in<\/span> nums[<span class=\"n\">1<\/span>:]:\n            last_min = dp_min                <span class=\"c\"># 先存旧值<\/span>\n            dp_min = min(last_min * x, dp_max * x, x)\n            dp_max = max(last_min * x, dp_max * x, x)\n            res = max(res, dp_max)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> maxProduct(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span> dpMin = nums[<span class=\"n\">0<\/span>], dpMax = nums[<span class=\"n\">0<\/span>], res = nums[<span class=\"n\">0<\/span>];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt; nums.length; i++) {\n            <span class=\"k\">int<\/span> lastMin = dpMin;             <span class=\"c\">// 先存旧值<\/span>\n            dpMin = <span class=\"t\">Math<\/span>.min(nums[i], <span class=\"t\">Math<\/span>.min(lastMin * nums[i], dpMax * nums[i]));\n            dpMax = <span class=\"t\">Math<\/span>.max(nums[i], <span class=\"t\">Math<\/span>.max(lastMin * nums[i], dpMax * nums[i]));\n            res = <span class=\"t\">Math<\/span>.max(res, dpMax);\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"122","rank":73,"id":"122","title":"买卖股票的最佳时机 II","difficulty":"简单","tags":["贪心"],"freq":91,"link":"https://leetcode.cn/problems/best-time-to-buy-and-sell-stock-ii/","desc":"可以多次买卖股票（同一时间最多持有一股），求最大利润。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>目标是吃掉所有上涨段的利润。<\/li><li>一段连续上涨 <code>p1 → pn<\/code> 的收益 <code>pn - p1<\/code> 等于每天差值之和 <code>(p2 - p1) + (p3 - p2) + …<\/code>。<\/li><li>所以策略就是：<strong>只要今天比昨天贵，就把这一天的差价加进答案<\/strong>；否则不动。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>不要去找「最低点买、最高点卖」，那是 <a href=\"#/121\">121<\/a> 只能交易一次的思路。<\/li><li>通用解法是状态机 DP（持有 / 不持有两个状态），带冷冻期、手续费、限制次数的变体要用它。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">maxProfit<\/span>(self, prices: List[int]) -&gt; int:\n        res = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, len(prices)):\n            diff = prices[i] - prices[i - <span class=\"n\">1<\/span>]\n            <span class=\"k\">if<\/span> diff &gt; <span class=\"n\">0<\/span>:\n                res += diff\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> maxProfit(<span class=\"k\">int<\/span>[] prices) {\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt; prices.length; i++) {\n            <span class=\"k\">int<\/span> diff = prices[i] - prices[i - <span class=\"n\">1<\/span>];\n            <span class=\"k\">if<\/span> (diff &gt; <span class=\"n\">0<\/span>) res += diff;\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"110","rank":74,"id":"110","title":"平衡二叉树","difficulty":"简单","tags":["二叉树","DFS"],"freq":90,"link":"https://leetcode.cn/problems/balanced-binary-tree/","desc":"判断二叉树是否平衡：每个节点的左右子树高度差都不超过 1。","libs":["python-11"],"html":"<h2>思路<\/h2>\n<ul><li>后序 DFS 求每个节点的高度，回溯时顺便检查 <code>|左高 - 右高| &lt;= 1<\/code>。<\/li><li><code>dfs<\/code> 返回的是<strong>高度<\/strong>；是否平衡记在全局变量 <code>res<\/code> 里，一旦发现不平衡就置为 false。<\/li><li>剪枝：<code>res<\/code> 已经是 false 时直接返回，不用再算。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>必须每个节点都检查，只看根节点的左右高度差是不够的。<\/li><li>自顶向下「对每个节点分别求左右高度」是 O(n²)；后序一次遍历、边求高度边判断才是 O(n)。<\/li><li>不用全局变量的写法：用返回值 <code>-1<\/code> 表示「这棵子树已经不平衡」，一路往上传。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">isBalanced<\/span>(self, root: Optional[TreeNode]) -&gt; bool:\n        res = <span class=\"k\">True<\/span>\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(root):                       <span class=\"c\"># 返回子树高度<\/span>\n            <span class=\"k\">nonlocal<\/span> res\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root <span class=\"k\">or<\/span> <span class=\"k\">not<\/span> res:\n                <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>\n            left_depth, right_depth = dfs(root.left), dfs(root.right)\n            <span class=\"k\">if<\/span> abs(left_depth - right_depth) &gt; <span class=\"n\">1<\/span>:\n                res = <span class=\"k\">False<\/span>\n            <span class=\"k\">return<\/span> <span class=\"n\">1<\/span> + max(left_depth, right_depth)\n\n        dfs(root)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">boolean<\/span> res = <span class=\"k\">true<\/span>;\n\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> isBalanced(<span class=\"t\">TreeNode<\/span> root) {\n        dfs(root);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"c\">// 返回子树高度<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> dfs(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span> || !res) <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n        <span class=\"k\">int<\/span> leftDepth = dfs(root.left), rightDepth = dfs(root.right);\n        <span class=\"k\">if<\/span> (<span class=\"t\">Math<\/span>.abs(leftDepth - rightDepth) &gt; <span class=\"n\">1<\/span>) res = <span class=\"k\">false<\/span>;\n        <span class=\"k\">return<\/span> <span class=\"n\">1<\/span> + <span class=\"t\">Math<\/span>.max(leftDepth, rightDepth);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(h)。<\/p>"},{"key":"221","rank":75,"id":"221","title":"最大正方形","difficulty":"中等","tags":["动态规划","矩阵"],"freq":89,"link":"https://leetcode.cn/problems/maximal-square/","desc":"在由 '0' 和 '1' 组成的矩阵中，找出只含 '1' 的最大正方形，返回面积。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li><code>dp[i+1][j+1]<\/code>：<strong>以 <code>matrix[i][j]<\/code> 为右下角<\/strong>的全 1 正方形的最大边长。<code>dp<\/code> 多开一行一列，省掉越界判断。<\/li><li><code>matrix[i][j] == &#x27;1&#x27;<\/code> 时，能撑多大取决于左、上、左上三个位置里最小的那个：<\/li><\/ul>\n<p><code>dp[i+1][j+1] = min(dp[i+1][j], dp[i][j+1], dp[i][j]) + 1<\/code>。<\/p>\n<ul><li>用 <code>res<\/code> 记最大边长，返回 <code>res * res<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>下标偏移：<code>matrix[i][j]<\/code> 对应 <code>dp[i+1][j+1]<\/code>。<\/li><li>矩阵里是字符 <code>&#x27;1&#x27;<\/code>，不是数字 1。<\/li><li>题目要的是面积，别直接返回边长。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">maximalSquare<\/span>(self, matrix: List[List[str]]) -&gt; int:\n        m, n = len(matrix), len(matrix[<span class=\"n\">0<\/span>])\n        dp = [[<span class=\"n\">0<\/span>] * (n + <span class=\"n\">1<\/span>) <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(m + <span class=\"n\">1<\/span>)]\n        res = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(m):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(n):\n                <span class=\"k\">if<\/span> matrix[i][j] == <span class=\"s\">&quot;1&quot;<\/span>:\n                    dp[i + <span class=\"n\">1<\/span>][j + <span class=\"n\">1<\/span>] = <span class=\"n\">1<\/span> + min(dp[i + <span class=\"n\">1<\/span>][j],    <span class=\"c\"># 左<\/span>\n                                               dp[i][j + <span class=\"n\">1<\/span>],    <span class=\"c\"># 上<\/span>\n                                               dp[i][j])        <span class=\"c\"># 左上<\/span>\n                    res = max(res, dp[i + <span class=\"n\">1<\/span>][j + <span class=\"n\">1<\/span>])\n        <span class=\"k\">return<\/span> res * res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> maximalSquare(<span class=\"k\">char<\/span>[][] matrix) {\n        <span class=\"k\">int<\/span> m = matrix.length, n = matrix[<span class=\"n\">0<\/span>].length;\n        <span class=\"k\">int<\/span>[][] dp = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[m + <span class=\"n\">1<\/span>][n + <span class=\"n\">1<\/span>];\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; m; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">0<\/span>; j &lt; n; j++) {\n                <span class=\"k\">if<\/span> (matrix[i][j] == <span class=\"s\">&#x27;1&#x27;<\/span>) {\n                    dp[i + <span class=\"n\">1<\/span>][j + <span class=\"n\">1<\/span>] = <span class=\"n\">1<\/span> + <span class=\"t\">Math<\/span>.min(dp[i][j],                          <span class=\"c\">// 左上<\/span>\n                                           <span class=\"t\">Math<\/span>.min(dp[i + <span class=\"n\">1<\/span>][j], dp[i][j + <span class=\"n\">1<\/span>]));      <span class=\"c\">// 左、上<\/span>\n                    res = <span class=\"t\">Math<\/span>.max(res, dp[i + <span class=\"n\">1<\/span>][j + <span class=\"n\">1<\/span>]);\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> res * res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(mn)，空间 O(mn)。<\/p>"},{"key":"234","rank":76,"id":"234","title":"回文链表","difficulty":"简单","tags":["链表","双指针"],"freq":88,"link":"https://leetcode.cn/problems/palindrome-linked-list/","desc":"判断单链表是否是回文链表。","libs":[],"html":"<h2>思路<\/h2>\n<p>和 <a href=\"#/143\">143 重排链表<\/a> 同一套组合：<\/p>\n<ol><li>快慢指针找中点（<code>slow<\/code> 停在前半段最后一个节点）；<\/li><li>反转后半段；<\/li><li>两个指针分别从头和反转后的后半段出发，逐个比较。<\/li><\/ol>\n<h2>易错点<\/h2>\n<ul><li><code>fast<\/code> 从 <code>head.next<\/code> 出发：奇数长度时 <code>slow<\/code> 停在正中间，偶数长度时停在前半段末尾，两种情况都从 <code>slow.next<\/code> 开始反转。<\/li><li>后半段长度 ≤ 前半段（奇数时中间节点留在前半段，不用比），所以比到 <code>p2<\/code> 走完为止。<\/li><li>面试可能会追问「恢复原链表」：比完后把后半段再反转一次接回去。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">isPalindrome<\/span>(self, head: Optional[ListNode]) -&gt; bool:\n        slow, fast = head, head.next\n        <span class=\"k\">while<\/span> fast <span class=\"k\">and<\/span> fast.next:            <span class=\"c\"># slow 停在前半段最后一个<\/span>\n            slow = slow.next\n            fast = fast.next.next\n        p1, p2 = head, self.reverse(slow.next)\n        slow.next = <span class=\"k\">None<\/span>\n        <span class=\"k\">while<\/span> p2:                            <span class=\"c\"># 后半段不比前半段长<\/span>\n            <span class=\"k\">if<\/span> p1.val != p2.val:\n                <span class=\"k\">return<\/span> <span class=\"k\">False<\/span>\n            p1, p2 = p1.next, p2.next\n        <span class=\"k\">return<\/span> <span class=\"k\">True<\/span>\n\n    <span class=\"k\">def<\/span> <span class=\"f\">reverse<\/span>(self, head):\n        pre, cur = <span class=\"k\">None<\/span>, head\n        <span class=\"k\">while<\/span> cur:\n            nxt = cur.next\n            cur.next = pre\n            pre, cur = cur, nxt\n        <span class=\"k\">return<\/span> pre<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> isPalindrome(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"t\">ListNode<\/span> slow = head, fast = head.next;\n        <span class=\"k\">while<\/span> (fast != <span class=\"k\">null<\/span> &amp;&amp; fast.next != <span class=\"k\">null<\/span>) {      <span class=\"c\">// slow 停在前半段最后一个<\/span>\n            slow = slow.next;\n            fast = fast.next.next;\n        }\n        <span class=\"t\">ListNode<\/span> p1 = head, p2 = reverse(slow.next);\n        slow.next = <span class=\"k\">null<\/span>;\n        <span class=\"k\">while<\/span> (p2 != <span class=\"k\">null<\/span>) {                             <span class=\"c\">// 后半段不比前半段长<\/span>\n            <span class=\"k\">if<\/span> (p1.val != p2.val) <span class=\"k\">return<\/span> <span class=\"k\">false<\/span>;\n            p1 = p1.next;\n            p2 = p2.next;\n        }\n        <span class=\"k\">return<\/span> <span class=\"k\">true<\/span>;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"t\">ListNode<\/span> reverse(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"t\">ListNode<\/span> pre = <span class=\"k\">null<\/span>, cur = head;\n        <span class=\"k\">while<\/span> (cur != <span class=\"k\">null<\/span>) {\n            <span class=\"t\">ListNode<\/span> nxt = cur.next;\n            cur.next = pre;\n            pre = cur;\n            cur = nxt;\n        }\n        <span class=\"k\">return<\/span> pre;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"179","rank":77,"id":"179","title":"最大数","difficulty":"中等","tags":["排序","字符串","贪心"],"freq":85,"link":"https://leetcode.cn/problems/largest-number/","desc":"把一组非负整数重新排列，拼成一个最大的数，以字符串返回。","libs":["python-5","java-18","java-19","java-20"],"html":"<h2>思路<\/h2>\n<ul><li>全部转成字符串后<strong>自定义排序<\/strong>：比较的不是 <code>a<\/code> 和 <code>b<\/code> 本身，而是两种拼法 <code>a + b<\/code> 和 <code>b + a<\/code> 谁大——<code>a + b<\/code> 更大就让 <code>a<\/code> 排前面。<\/li><li>排完直接拼接。<\/li><li>不能用普通的字符串降序：<code>&quot;3&quot;<\/code> 和 <code>&quot;30&quot;<\/code>，降序会把 <code>&quot;30&quot;<\/code> 放前面得到 <code>303<\/code>，但 <code>330<\/code> 更大。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>比较器方向：Java 写 <code>(b + a).compareTo(a + b)<\/code> 是「拼起来大的在前」；写反就成了最小数。<\/li><li>全是 0 时排序后第一个是 <code>&quot;0&quot;<\/code>，直接返回 <code>&quot;0&quot;<\/code>，否则会得到 <code>&quot;000&quot;<\/code>。<\/li><li>结果可能远超 <code>long<\/code>，全程用字符串。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">largestNumber<\/span>(self, nums: List[int]) -&gt; str:\n        <span class=\"k\">def<\/span> <span class=\"f\">cmp<\/span>(a, b):                       <span class=\"c\"># 相当于 Java 的 (b + a).compareTo(a + b)<\/span>\n            <span class=\"k\">if<\/span> a + b &gt; b + a:\n                <span class=\"k\">return<\/span> -<span class=\"n\">1<\/span>                    <span class=\"c\"># a 排前面<\/span>\n            <span class=\"k\">if<\/span> a + b &lt; b + a:\n                <span class=\"k\">return<\/span> <span class=\"n\">1<\/span>\n            <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>\n\n        strs = sorted(map(str, nums), key=cmp_to_key(cmp))\n        <span class=\"k\">return<\/span> <span class=\"s\">&quot;0&quot;<\/span> <span class=\"k\">if<\/span> strs[<span class=\"n\">0<\/span>] == <span class=\"s\">&quot;0&quot;<\/span> <span class=\"k\">else<\/span> <span class=\"s\">&quot;&quot;<\/span>.join(strs)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">String<\/span> largestNumber(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"t\">String<\/span>[] strs = <span class=\"k\">new<\/span> <span class=\"t\">String<\/span>[nums.length];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; nums.length; i++) {\n            strs[i] = <span class=\"t\">String<\/span>.valueOf(nums[i]);\n        }\n        <span class=\"t\">Arrays<\/span>.sort(strs, (a, b) -&gt; (b + a).compareTo(a + b));   <span class=\"c\">// 拼起来大的排前面<\/span>\n        <span class=\"k\">if<\/span> (strs[<span class=\"n\">0<\/span>].equals(<span class=\"s\">&quot;0&quot;<\/span>)) <span class=\"k\">return<\/span> <span class=\"s\">&quot;0&quot;<\/span>;\n        <span class=\"t\">StringBuilder<\/span> sb = <span class=\"k\">new<\/span> <span class=\"t\">StringBuilder<\/span>();\n        <span class=\"k\">for<\/span> (<span class=\"t\">String<\/span> s : strs) sb.append(s);\n        <span class=\"k\">return<\/span> sb.toString();\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n log n)（每次比较 O(位数)），空间 O(n)。<\/p>"},{"key":"14","rank":78,"id":"14","title":"最长公共前缀","difficulty":"简单","tags":["字符串"],"freq":85,"link":"https://leetcode.cn/problems/longest-common-prefix/","desc":"求字符串数组中所有字符串的最长公共前缀。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li><strong>纵向扫描<\/strong>（按列比较）：以 <code>strs[0]<\/code> 为基准，从左到右枚举下标 <code>i<\/code>，检查所有字符串的第 <code>i<\/code> 个字符。<\/li><li>只要有一个字符串长度不够，或者字符不一样，<code>[0, i)<\/code> 就是答案。<\/li><li>基准串扫完都没问题，答案就是基准串本身。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>外层循环是字符下标、内层循环是各个字符串，别写反。<\/li><li>先判越界（<code>i &gt;= s.length()<\/code>）再取字符。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">longestCommonPrefix<\/span>(self, strs: List[str]) -&gt; str:\n        s0 = strs[<span class=\"n\">0<\/span>]\n        <span class=\"k\">for<\/span> i, c <span class=\"k\">in<\/span> enumerate(s0):\n            <span class=\"k\">for<\/span> s <span class=\"k\">in<\/span> strs:\n                <span class=\"k\">if<\/span> i &gt;= len(s) <span class=\"k\">or<\/span> s[i] != c:\n                    <span class=\"k\">return<\/span> s0[:i]\n        <span class=\"k\">return<\/span> s0<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">String<\/span> longestCommonPrefix(<span class=\"t\">String<\/span>[] strs) {\n        <span class=\"t\">String<\/span> s0 = strs[<span class=\"n\">0<\/span>];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; s0.length(); i++) {\n            <span class=\"k\">char<\/span> c = s0.charAt(i);\n            <span class=\"k\">for<\/span> (<span class=\"t\">String<\/span> s : strs) {\n                <span class=\"k\">if<\/span> (i &gt;= s.length() || s.charAt(i) != c) {\n                    <span class=\"k\">return<\/span> s0.substring(<span class=\"n\">0<\/span>, i);\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> s0;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(字符总数)，空间 O(1)。<\/p>"},{"key":"48","rank":79,"id":"48","title":"旋转图像","difficulty":"中等","tags":["矩阵"],"freq":85,"link":"https://leetcode.cn/problems/rotate-image/","desc":"把 n×n 矩阵原地顺时针旋转 90 度。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>旋转 = <strong>两次翻转<\/strong>。顺时针 90° 有两种等价的组合：<ul><li>沿主对角线翻转（转置）→ 每一行左右翻转；<\/li><li>沿副对角线翻转 → 上下翻转。<\/li><\/ul><\/li><li>其它角度同理：逆时针 90° = 转置 → 上下翻转；180° = 上下翻转 → 每行左右翻转。<\/li><li>坐标关系：主对角线 <code>(i, j) ↔ (j, i)<\/code>；副对角线 <code>(i, j) ↔ (n-1-j, n-1-i)<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>对角线翻转只遍历对角线一侧（主对角线 <code>j &gt; i<\/code>，副对角线 <code>j &lt; n - 1 - i<\/code>），遍历整个矩阵会换两次、等于没换。<\/li><li>必须原地改，不能新开矩阵。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：转置 + 左右翻转<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">rotate<\/span>(self, matrix: List[List[int]]) -&gt; <span class=\"k\">None<\/span>:\n        n = len(matrix)\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(n):                   <span class=\"c\"># 沿主对角线翻转<\/span>\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(i + <span class=\"n\">1<\/span>, n):\n                matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j]\n        <span class=\"k\">for<\/span> row <span class=\"k\">in<\/span> matrix:                   <span class=\"c\"># 每行左右翻转<\/span>\n            row.reverse()<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">void<\/span> rotate(<span class=\"k\">int<\/span>[][] matrix) {\n        <span class=\"k\">int<\/span> n = matrix.length;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; n; i++) {                <span class=\"c\">// 沿主对角线翻转<\/span>\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = i + <span class=\"n\">1<\/span>; j &lt; n; j++) {\n                <span class=\"k\">int<\/span> temp = matrix[i][j];\n                matrix[i][j] = matrix[j][i];\n                matrix[j][i] = temp;\n            }\n        }\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span>[] row : matrix) {                   <span class=\"c\">// 每行左右翻转<\/span>\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> l = <span class=\"n\">0<\/span>, r = n - <span class=\"n\">1<\/span>; l &lt; r; l++, r--) {\n                <span class=\"k\">int<\/span> temp = row[l];\n                row[l] = row[r];\n                row[r] = temp;\n            }\n        }\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：副对角线翻转 + 上下翻转<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">rotate<\/span>(self, matrix: List[List[int]]) -&gt; <span class=\"k\">None<\/span>:\n        n = len(matrix)\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(n):                   <span class=\"c\"># 沿副对角线翻转<\/span>\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(n - <span class=\"n\">1<\/span> - i):\n                matrix[i][j], matrix[n - <span class=\"n\">1<\/span> - j][n - <span class=\"n\">1<\/span> - i] = matrix[n - <span class=\"n\">1<\/span> - j][n - <span class=\"n\">1<\/span> - i], matrix[i][j]\n        matrix.reverse()                     <span class=\"c\"># 上下翻转<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">void<\/span> rotate(<span class=\"k\">int<\/span>[][] matrix) {\n        <span class=\"k\">int<\/span> n = matrix.length;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; n; i++) {                <span class=\"c\">// 沿副对角线翻转<\/span>\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">0<\/span>; j &lt; n - <span class=\"n\">1<\/span> - i; j++) {\n                <span class=\"k\">int<\/span> temp = matrix[i][j];\n                matrix[i][j] = matrix[n - <span class=\"n\">1<\/span> - j][n - <span class=\"n\">1<\/span> - i];\n                matrix[n - <span class=\"n\">1<\/span> - j][n - <span class=\"n\">1<\/span> - i] = temp;\n            }\n        }\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; n / <span class=\"n\">2<\/span>; i++) {            <span class=\"c\">// 上下翻转：直接交换行引用<\/span>\n            <span class=\"k\">int<\/span>[] temp = matrix[i];\n            matrix[i] = matrix[n - <span class=\"n\">1<\/span> - i];\n            matrix[n - <span class=\"n\">1<\/span> - i] = temp;\n        }\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n²)，空间 O(1)。<\/p>"},{"key":"240","rank":80,"id":"240","title":"搜索二维矩阵 II","difficulty":"中等","tags":["矩阵","双指针"],"freq":85,"link":"https://leetcode.cn/problems/search-a-2d-matrix-ii/","desc":"在每行从左到右递增、每列从上到下递增的矩阵中查找 target。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>从<strong>右上角<\/strong>出发做排除法。右上角的数是所在行的最大值、所在列的最小值：<ul><li>当前值 <code>&gt; target<\/code>：这一列下面的都更大，整列排除，<code>j--<\/code>；<\/li><li>当前值 <code>&lt; target<\/code>：这一行左边的都更小，整行排除，<code>i++<\/code>；<\/li><li>相等就找到了。<\/li><\/ul><\/li><li>每一步排除一行或一列，最多走 <code>m + n<\/code> 步。从左下角出发同理。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>起点只能是右上角或左下角。左上角（往右往下都变大）和右下角（都变小）没法判断该往哪走。<\/li><li>循环条件 <code>i &lt; m &amp;&amp; j &gt;= 0<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">searchMatrix<\/span>(self, matrix: List[List[int]], target: int) -&gt; bool:\n        m, n = len(matrix), len(matrix[<span class=\"n\">0<\/span>])\n        i, j = <span class=\"n\">0<\/span>, n - <span class=\"n\">1<\/span>                      <span class=\"c\"># 右上角<\/span>\n        <span class=\"k\">while<\/span> i &lt; m <span class=\"k\">and<\/span> j &gt;= <span class=\"n\">0<\/span>:\n            cur = matrix[i][j]\n            <span class=\"k\">if<\/span> cur == target:\n                <span class=\"k\">return<\/span> <span class=\"k\">True<\/span>\n            <span class=\"k\">if<\/span> cur &gt; target:\n                j -= <span class=\"n\">1<\/span>                       <span class=\"c\"># 排除这一列<\/span>\n            <span class=\"k\">else<\/span>:\n                i += <span class=\"n\">1<\/span>                       <span class=\"c\"># 排除这一行<\/span>\n        <span class=\"k\">return<\/span> <span class=\"k\">False<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> searchMatrix(<span class=\"k\">int<\/span>[][] matrix, <span class=\"k\">int<\/span> target) {\n        <span class=\"k\">int<\/span> m = matrix.length, n = matrix[<span class=\"n\">0<\/span>].length;\n        <span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>, j = n - <span class=\"n\">1<\/span>;                <span class=\"c\">// 右上角<\/span>\n        <span class=\"k\">while<\/span> (i &lt; m &amp;&amp; j &gt;= <span class=\"n\">0<\/span>) {\n            <span class=\"k\">int<\/span> cur = matrix[i][j];\n            <span class=\"k\">if<\/span> (cur == target) <span class=\"k\">return<\/span> <span class=\"k\">true<\/span>;\n            <span class=\"k\">if<\/span> (cur &gt; target) j--;           <span class=\"c\">// 排除这一列<\/span>\n            <span class=\"k\">else<\/span> i++;                        <span class=\"c\">// 排除这一行<\/span>\n        }\n        <span class=\"k\">return<\/span> <span class=\"k\">false<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(m + n)，空间 O(1)。<\/p>"},{"key":"560","rank":81,"id":"560","title":"和为K的子数组","difficulty":"中等","tags":["哈希表","前缀和"],"freq":84,"link":"https://leetcode.cn/problems/subarray-sum-equals-k/","desc":"统计数组中和恰好为 k 的连续子数组的个数（元素可以为负）。","libs":["python-2","java-15"],"html":"<h2>思路<\/h2>\n<ul><li><strong>前缀和 + 两数之和<\/strong>。子数组 <code>nums[j+1..i]<\/code> 的和 = <code>s[i] - s[j]<\/code>，要它等于 <code>k<\/code>，就是找前面有多少个前缀和等于 <code>s[i] - k<\/code>。<\/li><li>遍历时维护当前前缀和 <code>s<\/code>，用哈希表 <code>cnt<\/code> 记录「每个前缀和出现过几次」：先把 <code>cnt[s - k]<\/code> 加进答案，再把 <code>s<\/code> 记进表里。<\/li><li>初始化 <code>cnt[0] = 1<\/code>：一个元素都不取时前缀和是 0，用来统计从下标 0 开始的子数组。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>不能用滑动窗口：有负数，窗口和不单调。<\/li><li><code>cnt[0] = 1<\/code> 不能漏。<\/li><li>表里存的是<strong>次数<\/strong>不是「有没有」：同一个前缀和出现几次，就能和当前位置配出几个子数组。<\/li><li>先查再存：否则 <code>k = 0<\/code> 时会把自己和自己配上。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">subarraySum<\/span>(self, nums: List[int], k: int) -&gt; int:\n        cnt = defaultdict(int)               <span class=\"c\"># 前缀和 -&gt; 出现次数<\/span>\n        cnt[<span class=\"n\">0<\/span>] = <span class=\"n\">1<\/span>\n        res = s = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> x <span class=\"k\">in<\/span> nums:\n            s += x\n            res += cnt[s - k]\n            cnt[s] += <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> subarraySum(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> k) {\n        <span class=\"t\">Map<\/span>&lt;<span class=\"t\">Integer<\/span>, <span class=\"t\">Integer<\/span>&gt; cnt = <span class=\"k\">new<\/span> <span class=\"t\">HashMap<\/span>&lt;&gt;();     <span class=\"c\">// 前缀和 -&gt; 出现次数<\/span>\n        cnt.put(<span class=\"n\">0<\/span>, <span class=\"n\">1<\/span>);\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>, s = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> x : nums) {\n            s += x;\n            res += cnt.getOrDefault(s - k, <span class=\"n\">0<\/span>);\n            cnt.put(s, cnt.getOrDefault(s, <span class=\"n\">0<\/span>) + <span class=\"n\">1<\/span>);\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n)。<\/p>"},{"key":"662","rank":82,"id":"662","title":"二叉树最大宽度","difficulty":"中等","tags":["二叉树","BFS","DFS"],"freq":84,"link":"https://leetcode.cn/problems/maximum-width-of-binary-tree/","desc":"求二叉树的最大宽度：每层最左和最右非空节点之间的长度，中间的空位也算。","libs":["python-0","python-11","java-12","java-15"],"html":"<h2>思路<\/h2>\n<ul><li>关键在<strong>编号<\/strong>：按满二叉树给节点编号，节点 <code>code<\/code> 的左孩子是 <code>2 * code<\/code>、右孩子是 <code>2 * code + 1<\/code>。同一层的宽度 = <code>最右编号 - 最左编号 + 1<\/code>，中间缺的节点自然被算进去。<\/li><li><strong>BFS<\/strong>：队列里带着编号做层序遍历，每层用队头、队尾的编号算宽度。<\/li><li><strong>DFS<\/strong>：带着 <code>depth<\/code> 和 <code>code<\/code> 先左后右遍历，用哈希表记每层第一次遇到的编号（就是该层最左节点），每到一个节点用 <code>code - minCode[depth] + 1<\/code> 更新答案。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>宽度不是这一层的节点个数。<\/li><li>编号每层翻倍，树深了会超出 <code>int<\/code> / <code>long<\/code>：BFS 里把每层的编号都减去该层起点再往下传，就不会一直变大。（Java 即使溢出，同层编号相减的结果仍然正确，因为答案保证在 int 范围内。）<\/li><li>DFS 必须先左后右，否则每层第一次遇到的不是最左节点。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：BFS<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">widthOfBinaryTree<\/span>(self, root: Optional[TreeNode]) -&gt; int:\n        res, q = <span class=\"n\">0<\/span>, deque([(root, <span class=\"n\">0<\/span>)])       <span class=\"c\"># (节点, 编号)<\/span>\n        <span class=\"k\">while<\/span> q:\n            start = q[<span class=\"n\">0<\/span>][<span class=\"n\">1<\/span>]\n            res = max(res, q[-<span class=\"n\">1<\/span>][<span class=\"n\">1<\/span>] - start + <span class=\"n\">1<\/span>)\n            <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(len(q)):\n                node, code = q.popleft()\n                code -= start                <span class=\"c\"># 减去本层起点，防止编号越来越大<\/span>\n                <span class=\"k\">if<\/span> node.left:\n                    q.append((node.left, code * <span class=\"n\">2<\/span>))\n                <span class=\"k\">if<\/span> node.right:\n                    q.append((node.right, code * <span class=\"n\">2<\/span> + <span class=\"n\">1<\/span>))\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> widthOfBinaryTree(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">TreeNode<\/span>&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; codes = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();       <span class=\"c\">// 与 q 同步进出，存节点编号<\/span>\n        q.offer(root);\n        codes.offer(<span class=\"n\">0<\/span>);\n        <span class=\"k\">while<\/span> (!q.isEmpty()) {\n            <span class=\"k\">int<\/span> sz = q.size(), start = codes.peekFirst();\n            res = <span class=\"t\">Math<\/span>.max(res, codes.peekLast() - start + <span class=\"n\">1<\/span>);\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; sz; i++) {\n                <span class=\"t\">TreeNode<\/span> cur = q.poll();\n                <span class=\"k\">int<\/span> code = codes.poll() - start;         <span class=\"c\">// 减去本层起点，防止编号越来越大<\/span>\n                <span class=\"k\">if<\/span> (cur.left != <span class=\"k\">null<\/span>) {\n                    q.offer(cur.left);\n                    codes.offer(code * <span class=\"n\">2<\/span>);\n                }\n                <span class=\"k\">if<\/span> (cur.right != <span class=\"k\">null<\/span>) {\n                    q.offer(cur.right);\n                    codes.offer(code * <span class=\"n\">2<\/span> + <span class=\"n\">1<\/span>);\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：DFS<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">widthOfBinaryTree<\/span>(self, root: Optional[TreeNode]) -&gt; int:\n        res = <span class=\"n\">0<\/span>\n        min_code = {}                        <span class=\"c\"># depth -&gt; 该层最左节点的编号<\/span>\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(node, code, depth):\n            <span class=\"k\">nonlocal<\/span> res\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> node:\n                <span class=\"k\">return<\/span>\n            <span class=\"k\">if<\/span> depth <span class=\"k\">not<\/span> <span class=\"k\">in<\/span> min_code:        <span class=\"c\"># 先左后右，第一次到这层的就是最左节点<\/span>\n                min_code[depth] = code\n            res = max(res, code - min_code[depth] + <span class=\"n\">1<\/span>)\n            dfs(node.left, code * <span class=\"n\">2<\/span>, depth + <span class=\"n\">1<\/span>)\n            dfs(node.right, code * <span class=\"n\">2<\/span> + <span class=\"n\">1<\/span>, depth + <span class=\"n\">1<\/span>)\n\n        dfs(root, <span class=\"n\">1<\/span>, <span class=\"n\">0<\/span>)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Map<\/span>&lt;<span class=\"t\">Integer<\/span>, <span class=\"t\">Integer<\/span>&gt; minCode = <span class=\"k\">new<\/span> <span class=\"t\">HashMap<\/span>&lt;&gt;();   <span class=\"c\">// depth -&gt; 该层最左节点的编号<\/span>\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> widthOfBinaryTree(<span class=\"t\">TreeNode<\/span> root) {\n        dfs(root, <span class=\"n\">1<\/span>, <span class=\"n\">0<\/span>);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> dfs(<span class=\"t\">TreeNode<\/span> node, <span class=\"k\">int<\/span> code, <span class=\"k\">int<\/span> depth) {\n        <span class=\"k\">if<\/span> (node == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span>;\n        minCode.putIfAbsent(depth, code);                <span class=\"c\">// 先左后右，第一次到这层的就是最左节点<\/span>\n        res = <span class=\"t\">Math<\/span>.max(res, code - minCode.get(depth) + <span class=\"n\">1<\/span>);\n        dfs(node.left, code * <span class=\"n\">2<\/span>, depth + <span class=\"n\">1<\/span>);\n        dfs(node.right, code * <span class=\"n\">2<\/span> + <span class=\"n\">1<\/span>, depth + <span class=\"n\">1<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n)。<\/p>"},{"key":"98","rank":83,"id":"98","title":"验证二叉搜索树","difficulty":"中等","tags":["二叉树","DFS"],"freq":84,"link":"https://leetcode.cn/problems/validate-binary-search-tree/","desc":"判断一棵二叉树是否是有效的二叉搜索树（左子树全部 < 根 < 右子树全部）。","libs":["python-7","python-11","java-22"],"html":"<h2>思路<\/h2>\n<ul><li><strong>上下界递归<\/strong>：每个节点带一个合法的开区间 <code>(left, right)<\/code>，节点值必须落在里面；往左走把上界收紧成当前值，往右走把下界收紧成当前值。<\/li><li><strong>中序遍历<\/strong>：BST 的中序序列严格递增，遍历时记住上一个访问的值 <code>pre<\/code>，当前值必须大于它。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>只比较「左孩子 &lt; 根 &lt; 右孩子」是不够的：右子树里的每一个节点都要大于根，所以要传区间。<\/li><li>严格不等，相等也不合法。<\/li><li>节点值可能就是 <code>Integer.MIN_VALUE<\/code> / <code>MAX_VALUE<\/code>：Java 的初始边界和 <code>pre<\/code> 都要用 <code>long<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：上下界递归<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">isValidBST<\/span>(self, root: Optional[TreeNode]) -&gt; bool:\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(root, left, right):          <span class=\"c\"># root 子树的值都必须在 (left, right) 内<\/span>\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root:\n                <span class=\"k\">return<\/span> <span class=\"k\">True<\/span>\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> left &lt; root.val &lt; right:\n                <span class=\"k\">return<\/span> <span class=\"k\">False<\/span>\n            <span class=\"k\">return<\/span> dfs(root.left, left, root.val) <span class=\"k\">and<\/span> dfs(root.right, root.val, right)\n\n        <span class=\"k\">return<\/span> dfs(root, -inf, inf)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> isValidBST(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">return<\/span> dfs(root, <span class=\"t\">Long<\/span>.MIN_VALUE, <span class=\"t\">Long<\/span>.MAX_VALUE);\n    }\n\n    <span class=\"c\">// root 子树的值都必须在 (left, right) 内<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">boolean<\/span> dfs(<span class=\"t\">TreeNode<\/span> root, <span class=\"k\">long<\/span> left, <span class=\"k\">long<\/span> right) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> <span class=\"k\">true<\/span>;\n        <span class=\"k\">if<\/span> (root.val &lt;= left || root.val &gt;= right) <span class=\"k\">return<\/span> <span class=\"k\">false<\/span>;\n        <span class=\"k\">return<\/span> dfs(root.left, left, root.val) &amp;&amp; dfs(root.right, root.val, right);\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：中序遍历<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">isValidBST<\/span>(self, root: Optional[TreeNode]) -&gt; bool:\n        pre = -inf                           <span class=\"c\"># 中序遍历中上一个访问的值<\/span>\n\n        <span class=\"k\">def<\/span> <span class=\"f\">inorder<\/span>(node):\n            <span class=\"k\">nonlocal<\/span> pre\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> node:\n                <span class=\"k\">return<\/span> <span class=\"k\">True<\/span>\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> inorder(node.left):\n                <span class=\"k\">return<\/span> <span class=\"k\">False<\/span>\n            <span class=\"k\">if<\/span> node.val &lt;= pre:\n                <span class=\"k\">return<\/span> <span class=\"k\">False<\/span>\n            pre = node.val\n            <span class=\"k\">return<\/span> inorder(node.right)\n\n        <span class=\"k\">return<\/span> inorder(root)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">long<\/span> pre = <span class=\"t\">Long<\/span>.MIN_VALUE;       <span class=\"c\">// 中序遍历中上一个访问的值<\/span>\n\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> isValidBST(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> <span class=\"k\">true<\/span>;\n        <span class=\"k\">if<\/span> (!isValidBST(root.left)) <span class=\"k\">return<\/span> <span class=\"k\">false<\/span>;\n        <span class=\"k\">if<\/span> (root.val &lt;= pre) <span class=\"k\">return<\/span> <span class=\"k\">false<\/span>;\n        pre = root.val;\n        <span class=\"k\">return<\/span> isValidBST(root.right);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(h)。<\/p>"},{"key":"144","rank":84,"id":"144","title":"二叉树的前序遍历","difficulty":"简单","tags":["二叉树","栈"],"freq":84,"link":"https://leetcode.cn/problems/binary-tree-preorder-traversal/","desc":"返回二叉树的前序遍历（根 → 左 → 右）。","libs":["java-12"],"html":"<h2>思路<\/h2>\n<ul><li><strong>递归<\/strong>：访问当前节点 → <code>dfs(左)<\/code> → <code>dfs(右)<\/code>。<\/li><li><strong>迭代<\/strong>：用栈模拟。弹出一个节点就访问它，然后<strong>先压右孩子、再压左孩子<\/strong>——栈后进先出，左孩子会先被弹出来。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>迭代的压栈顺序是右 → 左。<\/li><li>空节点不入栈；空树直接返回空列表。<\/li><li>中序的迭代写法不一样，见 <a href=\"#/94\">94<\/a>。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：递归<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">preorderTraversal<\/span>(self, root: Optional[TreeNode]) -&gt; List[int]:\n        res = []\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(root):\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root:\n                <span class=\"k\">return<\/span>\n            res.append(root.val)             <span class=\"c\"># 根<\/span>\n            dfs(root.left)                   <span class=\"c\"># 左<\/span>\n            dfs(root.right)                  <span class=\"c\"># 右<\/span>\n\n        dfs(root)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; preorderTraversal(<span class=\"t\">TreeNode<\/span> root) {\n        dfs(root);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> dfs(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span>;\n        res.add(root.val);                   <span class=\"c\">// 根<\/span>\n        dfs(root.left);                      <span class=\"c\">// 左<\/span>\n        dfs(root.right);                     <span class=\"c\">// 右<\/span>\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：迭代<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">preorderTraversal<\/span>(self, root: Optional[TreeNode]) -&gt; List[int]:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root:\n            <span class=\"k\">return<\/span> []\n        res, stack = [], [root]\n        <span class=\"k\">while<\/span> stack:\n            cur = stack.pop()\n            res.append(cur.val)\n            <span class=\"k\">if<\/span> cur.right:                    <span class=\"c\"># 先压右，再压左<\/span>\n                stack.append(cur.right)\n            <span class=\"k\">if<\/span> cur.left:\n                stack.append(cur.left)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; preorderTraversal(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> res;\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">TreeNode<\/span>&gt; stack = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        stack.push(root);\n        <span class=\"k\">while<\/span> (!stack.isEmpty()) {\n            <span class=\"t\">TreeNode<\/span> cur = stack.pop();\n            res.add(cur.val);\n            <span class=\"k\">if<\/span> (cur.right != <span class=\"k\">null<\/span>) stack.push(cur.right);    <span class=\"c\">// 先压右，再压左<\/span>\n            <span class=\"k\">if<\/span> (cur.left != <span class=\"k\">null<\/span>) stack.push(cur.left);\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(h)。<\/p>"},{"key":"543","rank":85,"id":"543","title":"二叉树的直径","difficulty":"简单","tags":["二叉树","DFS"],"freq":82,"link":"https://leetcode.cn/problems/diameter-of-binary-tree/","desc":"求二叉树的直径：任意两个节点之间最长路径的边数。","libs":["python-11"],"html":"<h2>思路<\/h2>\n<ul><li>直径<strong>不一定经过根<\/strong>，所以要枚举每个节点当「拐点」：经过它的最长路径 = 左子树深度 + 右子树深度。<\/li><li>后序遍历求深度的同时，用 <code>l + r<\/code> 更新全局最大值；函数本身返回深度 <code>max(l, r) + 1<\/code>。<\/li><li>和 <a href=\"#/124\">124 最大路径和<\/a> 是同一个模型：返回值是「单边」，全局答案是「两边加起来」。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>统计的是边数，所以是 <code>l + r<\/code>，不是 <code>l + r + 1<\/code>。<\/li><li>函数返回的是深度，不是直径。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">diameterOfBinaryTree<\/span>(self, root: Optional[TreeNode]) -&gt; int:\n        res = <span class=\"n\">0<\/span>\n\n        <span class=\"k\">def<\/span> <span class=\"f\">depth<\/span>(root):\n            <span class=\"k\">nonlocal<\/span> res\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root:\n                <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>\n            l, r = depth(root.left), depth(root.right)\n            res = max(res, l + r)            <span class=\"c\"># 以 root 为拐点的路径边数<\/span>\n            <span class=\"k\">return<\/span> max(l, r) + <span class=\"n\">1<\/span>\n\n        depth(root)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> diameterOfBinaryTree(<span class=\"t\">TreeNode<\/span> root) {\n        depth(root);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> depth(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n        <span class=\"k\">int<\/span> l = depth(root.left), r = depth(root.right);\n        res = <span class=\"t\">Math<\/span>.max(res, l + r);          <span class=\"c\">// 以 root 为拐点的路径边数<\/span>\n        <span class=\"k\">return<\/span> <span class=\"t\">Math<\/span>.max(l, r) + <span class=\"n\">1<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(h)。<\/p>"},{"key":"162","rank":86,"id":"162","title":"寻找峰值","difficulty":"中等","tags":["二分"],"freq":80,"link":"https://leetcode.cn/problems/find-peak-element/","desc":"找出数组中任意一个峰值（严格大于左右相邻元素）的下标，数组两端之外视为负无穷，要求 O(log n)。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>只要任意一个峰值，不用找最高的：<strong>二分时永远往更高的一侧走<\/strong>。<\/li><li>比较 <code>nums[m]<\/code> 和 <code>nums[m + 1]<\/code>：<ul><li><code>nums[m] &lt; nums[m + 1]<\/code>：右边是上坡，往右走一定能遇到峰值（一直涨到头，最后一个元素也是峰值，因为界外是 -∞），<code>l = m + 1<\/code>；<\/li><li><code>nums[m] &gt; nums[m + 1]<\/code>：右边是下坡，<code>m<\/code> 自己或它左边一定有峰值，<code>r = m<\/code>。<\/li><\/ul><\/li><li>区间收缩到一个点就是答案。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>用闭区间 <code>[0, n - 1]<\/code> + <code>while (l &lt; r)<\/code>：此时 <code>m &lt; r &lt;= n - 1<\/code>，访问 <code>m + 1<\/code> 不会越界。若写成左闭右开 <code>r = n<\/code>，就要额外判断 <code>m == n - 1<\/code>。<\/li><li>下坡时是 <code>r = m<\/code>，不是 <code>m - 1<\/code>：<code>m<\/code> 自己可能就是峰值。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">findPeakElement<\/span>(self, nums: List[int]) -&gt; int:\n        l, r = <span class=\"n\">0<\/span>, len(nums) - <span class=\"n\">1<\/span>\n        <span class=\"k\">while<\/span> l &lt; r:\n            m = (l + r) // <span class=\"n\">2<\/span>\n            <span class=\"k\">if<\/span> nums[m] &lt; nums[m + <span class=\"n\">1<\/span>]:        <span class=\"c\"># 上坡，峰值在右边<\/span>\n                l = m + <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:                            <span class=\"c\"># 下坡，m 或它左边有峰值<\/span>\n                r = m\n        <span class=\"k\">return<\/span> l<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> findPeakElement(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span> l = <span class=\"n\">0<\/span>, r = nums.length - <span class=\"n\">1<\/span>;\n        <span class=\"k\">while<\/span> (l &lt; r) {\n            <span class=\"k\">int<\/span> m = l + (r - l) / <span class=\"n\">2<\/span>;\n            <span class=\"k\">if<\/span> (nums[m] &lt; nums[m + <span class=\"n\">1<\/span>]) {     <span class=\"c\">// 上坡，峰值在右边<\/span>\n                l = m + <span class=\"n\">1<\/span>;\n            } <span class=\"k\">else<\/span> {                         <span class=\"c\">// 下坡，m 或它左边有峰值<\/span>\n                r = m;\n            }\n        }\n        <span class=\"k\">return<\/span> l;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(log n)，空间 O(1)。<\/p>"},{"key":"113","rank":87,"id":"113","title":"路径总和 II","difficulty":"中等","tags":["二叉树","回溯"],"freq":78,"link":"https://leetcode.cn/problems/path-sum-ii/","desc":"找出所有从根到叶子、节点值之和等于 targetSum 的路径。","libs":["java-13"],"html":"<h2>思路<\/h2>\n<ul><li>DFS + 回溯：<code>path<\/code> 记录当前从根走下来的路径，<code>dfs(node, s)<\/code> 表示走到 <code>node<\/code> 之前路径和是 <code>s<\/code>。<\/li><li>进入节点：加进 <code>path<\/code>，累加和；如果是<strong>叶子<\/strong>且和等于目标，把 <code>path<\/code> 的拷贝存入结果。<\/li><li>递归左右子树；离开节点前把它从 <code>path<\/code> 里移除。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>必须是根到<strong>叶子<\/strong>：和够了还要判断左右孩子都为空。<\/li><li>存结果要拷贝 <code>path<\/code>。<\/li><li>回溯不能忘。到叶子记录答案后不要提前 <code>return<\/code>，否则跳过了下面的移除，路径会乱。<\/li><li>节点值可能为负，不能因为和已经超过目标就剪枝。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">pathSum<\/span>(self, root: Optional[TreeNode], targetSum: int) -&gt; List[List[int]]:\n        res, path = [], []\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(node, s):\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> node:\n                <span class=\"k\">return<\/span>\n            s += node.val\n            path.append(node.val)\n            <span class=\"k\">if<\/span> s == targetSum <span class=\"k\">and<\/span> <span class=\"k\">not<\/span> node.left <span class=\"k\">and<\/span> <span class=\"k\">not<\/span> node.right:\n                res.append(path[:])\n            dfs(node.left, s)\n            dfs(node.right, s)\n            path.pop()                       <span class=\"c\"># 回溯<\/span>\n\n        dfs(root, <span class=\"n\">0<\/span>)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">LinkedList<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; path = <span class=\"k\">new<\/span> <span class=\"t\">LinkedList<\/span>&lt;&gt;();\n\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; pathSum(<span class=\"t\">TreeNode<\/span> root, <span class=\"k\">int<\/span> targetSum) {\n        dfs(root, <span class=\"n\">0<\/span>, targetSum);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> dfs(<span class=\"t\">TreeNode<\/span> node, <span class=\"k\">int<\/span> s, <span class=\"k\">int<\/span> targetSum) {\n        <span class=\"k\">if<\/span> (node == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span>;\n        <span class=\"k\">int<\/span> sum = s + node.val;\n        path.add(node.val);\n        <span class=\"k\">if<\/span> (sum == targetSum &amp;&amp; node.left == <span class=\"k\">null<\/span> &amp;&amp; node.right == <span class=\"k\">null<\/span>) {\n            res.add(<span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;(path));\n        }\n        dfs(node.left, sum, targetSum);\n        dfs(node.right, sum, targetSum);\n        path.removeLast();                   <span class=\"c\">// 回溯<\/span>\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n²)（最坏每条路径拷贝一次），空间 O(h)（不计答案）。<\/p>"},{"key":"62","rank":88,"id":"62","title":"不同路径","difficulty":"中等","tags":["动态规划"],"freq":78,"link":"https://leetcode.cn/problems/unique-paths/","desc":"m×n 的网格，从左上角走到右下角，每次只能向右或向下，问有多少条不同的路径。","libs":["python-6","java-20"],"html":"<h2>思路<\/h2>\n<ul><li><code>dp(x, y)<\/code>：从 <code>(0, 0)<\/code> 走到 <code>(x, y)<\/code> 的路径数。只能从上边或左边过来：<code>dp(x, y) = dp(x-1, y) + dp(x, y-1)<\/code>。<\/li><li>边界：第一行、第一列都只有一条路，返回 1。<\/li><li>自顶向下加备忘录，或者自底向上填表；每个格子只依赖上边和左边，可以压成一维数组。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>目标是 <code>dp(m - 1, n - 1)<\/code>，下标从 0 开始。<\/li><li>备忘录用 0 表示「没算过」是可以的，因为路径数不可能是 0。<\/li><li>一维写法里 <code>dp[j] += dp[j - 1]<\/code>：加号左边的旧 <code>dp[j]<\/code> 是上边的值，<code>dp[j - 1]<\/code> 是左边的值。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：记忆化递归<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">uniquePaths<\/span>(self, m: int, n: int) -&gt; int:\n        @cache\n        <span class=\"k\">def<\/span> <span class=\"f\">dp<\/span>(x, y):                        <span class=\"c\"># 走到 (x, y) 的路径数<\/span>\n            <span class=\"k\">if<\/span> x == <span class=\"n\">0<\/span> <span class=\"k\">or<\/span> y == <span class=\"n\">0<\/span>:\n                <span class=\"k\">return<\/span> <span class=\"n\">1<\/span>\n            <span class=\"k\">return<\/span> dp(x - <span class=\"n\">1<\/span>, y) + dp(x, y - <span class=\"n\">1<\/span>)\n\n        <span class=\"k\">return<\/span> dp(m - <span class=\"n\">1<\/span>, n - <span class=\"n\">1<\/span>)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span>[][] memo;\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> uniquePaths(<span class=\"k\">int<\/span> m, <span class=\"k\">int<\/span> n) {\n        memo = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[m][n];\n        <span class=\"k\">return<\/span> dp(m - <span class=\"n\">1<\/span>, n - <span class=\"n\">1<\/span>);\n    }\n\n    <span class=\"c\">// 走到 (x, y) 的路径数<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> dp(<span class=\"k\">int<\/span> x, <span class=\"k\">int<\/span> y) {\n        <span class=\"k\">if<\/span> (x == <span class=\"n\">0<\/span> || y == <span class=\"n\">0<\/span>) <span class=\"k\">return<\/span> <span class=\"n\">1<\/span>;\n        <span class=\"k\">if<\/span> (memo[x][y] != <span class=\"n\">0<\/span>) <span class=\"k\">return<\/span> memo[x][y];\n        <span class=\"k\">return<\/span> memo[x][y] = dp(x - <span class=\"n\">1<\/span>, y) + dp(x, y - <span class=\"n\">1<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：一维 DP<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">uniquePaths<\/span>(self, m: int, n: int) -&gt; int:\n        dp = [<span class=\"n\">1<\/span>] * n                         <span class=\"c\"># 第一行全是 1<\/span>\n        <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, m):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, n):\n                dp[j] += dp[j - <span class=\"n\">1<\/span>]           <span class=\"c\"># 上边（旧 dp[j]）+ 左边<\/span>\n        <span class=\"k\">return<\/span> dp[-<span class=\"n\">1<\/span>]<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> uniquePaths(<span class=\"k\">int<\/span> m, <span class=\"k\">int<\/span> n) {\n        <span class=\"k\">int<\/span>[] dp = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[n];\n        <span class=\"t\">Arrays<\/span>.fill(dp, <span class=\"n\">1<\/span>);                  <span class=\"c\">// 第一行全是 1<\/span>\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt; m; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">1<\/span>; j &lt; n; j++) {\n                dp[j] += dp[j - <span class=\"n\">1<\/span>];          <span class=\"c\">// 上边（旧 dp[j]）+ 左边<\/span>\n            }\n        }\n        <span class=\"k\">return<\/span> dp[n - <span class=\"n\">1<\/span>];\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(mn)；空间记忆化 O(mn)，一维 DP O(n)。<\/p>"},{"key":"198","rank":89,"id":"198","title":"打家劫舍","difficulty":"中等","tags":["动态规划"],"freq":77,"link":"https://leetcode.cn/problems/house-robber/","desc":"一排房子不能偷相邻的两间，求能偷到的最大金额。","libs":["python-6","java-20"],"html":"<h2>思路<\/h2>\n<ul><li>本质：从数组里选若干个不相邻的数，使和最大。<\/li><li>对每间房只有两个选择：<ul><li>偷：拿 <code>nums[i]<\/code>，相邻的那间不能偷；<\/li><li>不偷：直接看剩下的。<\/li><\/ul><\/li><li>自底向上：<code>dp[i]<\/code> = 前 <code>i<\/code> 间房的最大金额，<code>dp[i] = max(dp[i-1], nums[i-1] + dp[i-2])<\/code>。只依赖前两项，压成两个变量。<\/li><li>自顶向下：<code>dp(i)<\/code> = 从第 <code>i<\/code> 间开始往后偷的最大金额，<code>dp(i) = max(nums[i] + dp(i+2), dp(i+1))<\/code>，越界返回 0。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>两种写法的状态定义方向相反（前缀 / 后缀），转移式别混用。<\/li><li>压成变量后更新顺序：先算出新值，再整体往后挪。<\/li><li>延伸：213 房子围成一圈（拆成两段分别算）、337 树形。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：滚动变量<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">rob<\/span>(self, nums: List[int]) -&gt; int:\n        prev2 = prev1 = <span class=\"n\">0<\/span>                    <span class=\"c\"># dp[i-2], dp[i-1]<\/span>\n        <span class=\"k\">for<\/span> x <span class=\"k\">in<\/span> nums:\n            prev2, prev1 = prev1, max(prev1, x + prev2)   <span class=\"c\"># 不偷 / 偷<\/span>\n        <span class=\"k\">return<\/span> prev1<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> rob(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span> prev2 = <span class=\"n\">0<\/span>, prev1 = <span class=\"n\">0<\/span>;            <span class=\"c\">// dp[i-2], dp[i-1]<\/span>\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> x : nums) {\n            <span class=\"k\">int<\/span> cur = <span class=\"t\">Math<\/span>.max(prev1, x + prev2);    <span class=\"c\">// 不偷 / 偷<\/span>\n            prev2 = prev1;\n            prev1 = cur;\n        }\n        <span class=\"k\">return<\/span> prev1;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：记忆化递归<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">rob<\/span>(self, nums: List[int]) -&gt; int:\n        @cache\n        <span class=\"k\">def<\/span> <span class=\"f\">dp<\/span>(i):                           <span class=\"c\"># 从第 i 间开始偷的最大金额<\/span>\n            <span class=\"k\">if<\/span> i &gt;= len(nums):\n                <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>\n            <span class=\"k\">return<\/span> max(nums[i] + dp(i + <span class=\"n\">2<\/span>), dp(i + <span class=\"n\">1<\/span>))\n\n        <span class=\"k\">return<\/span> dp(<span class=\"n\">0<\/span>)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span>[] memo;\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> rob(<span class=\"k\">int<\/span>[] nums) {\n        memo = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[nums.length];\n        <span class=\"t\">Arrays<\/span>.fill(memo, -<span class=\"n\">1<\/span>);\n        <span class=\"k\">return<\/span> dp(nums, <span class=\"n\">0<\/span>);\n    }\n\n    <span class=\"c\">// 从第 i 间开始偷的最大金额<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> dp(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> i) {\n        <span class=\"k\">if<\/span> (i &gt;= nums.length) <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n        <span class=\"k\">if<\/span> (memo[i] != -<span class=\"n\">1<\/span>) <span class=\"k\">return<\/span> memo[i];\n        <span class=\"k\">return<\/span> memo[i] = <span class=\"t\">Math<\/span>.max(nums[i] + dp(nums, i + <span class=\"n\">2<\/span>), dp(nums, i + <span class=\"n\">1<\/span>));\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)；空间滚动变量 O(1)，记忆化 O(n)。<\/p>"},{"key":"209","rank":90,"id":"209","title":"长度最小的子数组","difficulty":"中等","tags":["滑动窗口"],"freq":74,"link":"https://leetcode.cn/problems/minimum-size-subarray-sum/","desc":"在正整数数组中找出和 ≥ target 的最短连续子数组的长度，不存在返回 0。","libs":["python-7","java-22"],"html":"<h2>思路<\/h2>\n<ul><li>数组全是正数 → 窗口扩大和变大、缩小和变小，有单调性，可以用滑动窗口。<\/li><li>窗口左闭右开 <code>[left, right)<\/code>：<code>right<\/code> 右移把数加进 <code>window<\/code>；只要 <code>window &gt;= target<\/code> 就更新最短长度，然后收缩 <code>left<\/code>，直到不满足为止。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>收缩用 <code>while<\/code>，要一直缩到不满足条件。<\/li><li>左闭右开，长度是 <code>right - left<\/code>。<\/li><li>没有合法窗口时返回 0，不是初始的最大值。<\/li><li>有负数就不能用滑动窗口了（那是前缀和 + 单调队列的题）。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">minSubArrayLen<\/span>(self, target: int, nums: List[int]) -&gt; int:\n        left = right = window = <span class=\"n\">0<\/span>\n        res = inf\n        <span class=\"k\">while<\/span> right &lt; len(nums):\n            window += nums[right]\n            right += <span class=\"n\">1<\/span>\n            <span class=\"k\">while<\/span> window &gt;= target:          <span class=\"c\"># 满足条件就尽量收缩<\/span>\n                res = min(res, right - left)\n                window -= nums[left]\n                left += <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">0<\/span> <span class=\"k\">if<\/span> res == inf <span class=\"k\">else<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> minSubArrayLen(<span class=\"k\">int<\/span> target, <span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span> left = <span class=\"n\">0<\/span>, right = <span class=\"n\">0<\/span>, window = <span class=\"n\">0<\/span>;\n        <span class=\"k\">int<\/span> res = <span class=\"t\">Integer<\/span>.MAX_VALUE;\n        <span class=\"k\">while<\/span> (right &lt; nums.length) {\n            window += nums[right++];\n            <span class=\"k\">while<\/span> (window &gt;= target) {       <span class=\"c\">// 满足条件就尽量收缩<\/span>\n                res = <span class=\"t\">Math<\/span>.min(res, right - left);\n                window -= nums[left++];\n            }\n        }\n        <span class=\"k\">return<\/span> res == <span class=\"t\">Integer<\/span>.MAX_VALUE ? <span class=\"n\">0<\/span> : res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"24","rank":91,"id":"24","title":"两两交换链表中的节点","difficulty":"中等","tags":["链表"],"freq":73,"link":"https://leetcode.cn/problems/swap-nodes-in-pairs/","desc":"两两交换链表中相邻的节点（交换节点本身，不是交换值），返回头节点。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>就是 <a href=\"#/25\">25 K 个一组翻转<\/a> 在 k = 2 时的特例：处理前两个节点，后面的交给递归。<\/li><li>递归：不足两个节点直接返回；否则第二个节点 <code>newHead<\/code> 成为新头，原来的 <code>head<\/code> 变成这一组的尾，接上 <code>swapPairs(第三个节点)<\/code> 的结果。<\/li><li>迭代：<code>dummy<\/code> + 前驱 <code>pre<\/code>，每次把 <code>pre<\/code> 后面的两个节点 <code>a<\/code>、<code>b<\/code> 交换，然后 <code>pre<\/code>
