\/span>&lt;<span class=\"t\">String<\/span>&gt; path = <span class=\"k\">new<\/span> <span class=\"t\">LinkedList<\/span>&lt;&gt;();\n\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">String<\/span>&gt; restoreIpAddresses(<span class=\"t\">String<\/span> s) {\n        <span class=\"k\">if<\/span> (s.length() &lt; <span class=\"n\">4<\/span> || s.length() &gt; <span class=\"n\">12<\/span>) <span class=\"k\">return<\/span> res;\n        dfs(s, <span class=\"n\">0<\/span>);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> dfs(<span class=\"t\">String<\/span> s, <span class=\"k\">int<\/span> i) {\n        <span class=\"k\">if<\/span> (path.size() == <span class=\"n\">4<\/span>) {\n            <span class=\"k\">if<\/span> (i == s.length()) res.add(<span class=\"t\">String<\/span>.join(<span class=\"s\">&quot;.&quot;<\/span>, path));   <span class=\"c\">// 四段且刚好用完<\/span>\n            <span class=\"k\">return<\/span>;\n        }\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = i; j &lt; s.length() &amp;&amp; j &lt; i + <span class=\"n\">3<\/span>; j++) {         <span class=\"c\">// 每段最多 3 位<\/span>\n            <span class=\"t\">String<\/span> num = s.substring(i, j + <span class=\"n\">1<\/span>);\n            <span class=\"k\">if<\/span> ((num.length() &gt; <span class=\"n\">1<\/span> &amp;&amp; num.charAt(<span class=\"n\">0<\/span>) == <span class=\"s\">&#x27;0&#x27;<\/span>) || <span class=\"t\">Integer<\/span>.parseInt(num) &gt; <span class=\"n\">255<\/span>) <span class=\"k\">break<\/span>;\n            path.add(num);\n            dfs(s, j + <span class=\"n\">1<\/span>);\n            path.removeLast();\n        }\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(3⁴)，最多四层、每层三种切法，接近常数；空间 O(1)（不计答案）。<\/p>"},{"key":"124","rank":35,"id":"124","title":"二叉树中的最大路径和","difficulty":"困难","tags":["二叉树","DFS"],"freq":187,"link":"https://leetcode.cn/problems/binary-tree-maximum-path-sum/","desc":"求二叉树中任意节点到任意节点的路径的最大和（路径至少含一个节点，不能分叉）。","libs":["python-7","python-11","java-22"],"html":"<h2>思路<\/h2>\n<ul><li>树形 DP + 后序遍历。每个节点做两件事：<ol><li><strong>当拐点<\/strong>：左贡献 + 自己 + 右贡献，更新全局答案 <code>res<\/code>；<\/li><li><strong>向父节点汇报<\/strong>：只能带一条边，<code>root.val + max(l, r)<\/code>。<\/li><\/ol><\/li><li><code>dfs(root)<\/code> 的含义：<code>root<\/code> 往下的<strong>单边<\/strong>路径最多能给父节点贡献多少；贡献为负就返回 0，表示「不要这条边」。<\/li><li>因为返回值已经和 0 取过 max，拿到的 <code>l<\/code>、<code>r<\/code> 一定 ≥ 0，可以直接用。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>dfs<\/code> 的返回值不是答案，答案在全局变量里。<\/li><li>返回给父节点时不能左右都选（路径不能分叉）。<\/li><li><code>res<\/code> 初始化成最小值而不是 0（节点可能全为负）；更新 <code>res<\/code> 时也不能和 0 取 max。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">maxPathSum<\/span>(self, root: Optional[TreeNode]) -&gt; int:\n        res = -inf\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(root):                       <span class=\"c\"># root 往下的单边路径能提供的最大贡献（至少为 0）<\/span>\n            <span class=\"k\">nonlocal<\/span> res\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root:\n                <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>\n            l, r = dfs(root.left), dfs(root.right)\n            res = max(res, root.val + l + r)         <span class=\"c\"># root 当拐点<\/span>\n            <span class=\"k\">return<\/span> max(root.val + max(l, r), <span class=\"n\">0<\/span>)      <span class=\"c\"># 负贡献就不要<\/span>\n\n        dfs(root)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> res = <span class=\"t\">Integer<\/span>.MIN_VALUE;\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> maxPathSum(<span class=\"t\">TreeNode<\/span> root) {\n        dfs(root);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"c\">// root 往下的单边路径能提供的最大贡献（至少为 0）<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> dfs(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n        <span class=\"k\">int<\/span> l = dfs(root.left), r = dfs(root.right);\n        res = <span class=\"t\">Math<\/span>.max(res, root.val + l + r);           <span class=\"c\">// root 当拐点<\/span>\n        <span class=\"k\">return<\/span> <span class=\"t\">Math<\/span>.max(root.val + <span class=\"t\">Math<\/span>.max(l, r), <span class=\"n\">0<\/span>);   <span class=\"c\">// 负贡献就不要<\/span>\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(h)。<\/p>"},{"key":"82","rank":36,"id":"82","title":"删除排序链表中的重复元素 II","difficulty":"中等","tags":["链表"],"freq":187,"link":"https://leetcode.cn/problems/remove-duplicates-from-sorted-list-ii/","desc":"删除升序链表中所有出现重复的数字（一个都不留），只保留原本只出现一次的节点。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>和 <a href=\"#/83\">83<\/a> 的区别：83 重复的保留一个，这题重复的全删——头节点也可能被删，所以要 <code>dummy<\/code>。<\/li><li><code>cur<\/code> 始终站在「已确定保留」的最后一个节点上，往后看两个节点：<ul><li><code>cur.next<\/code> 和 <code>cur.next.next<\/code> 值相同 → 记下这个值 <code>val<\/code>，把后面所有等于 <code>val<\/code> 的节点全部删掉；<\/li><li>不同 → <code>cur.next<\/code> 是唯一的，<code>cur<\/code> 后移。<\/li><\/ul><\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>删完一段重复后<strong>不要移动 <code>cur<\/code><\/strong>：新的 <code>cur.next<\/code> 可能又是一段重复，要留在原地继续检查。<\/li><li>循环条件 <code>cur.next != null &amp;&amp; cur.next.next != null<\/code>，少一个就空指针。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">deleteDuplicates<\/span>(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:\n        dummy = ListNode(-<span class=\"n\">101<\/span>, head)\n        cur = dummy\n        <span class=\"k\">while<\/span> cur.next <span class=\"k\">and<\/span> cur.next.next:\n            val = cur.next.val\n            <span class=\"k\">if<\/span> val == cur.next.next.val:\n                <span class=\"k\">while<\/span> cur.next <span class=\"k\">and<\/span> cur.next.val == val:      <span class=\"c\"># 整段删掉，cur 不动<\/span>\n                    cur.next = cur.next.next\n            <span class=\"k\">else<\/span>:\n                cur = cur.next\n        <span class=\"k\">return<\/span> dummy.next<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> deleteDuplicates(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"t\">ListNode<\/span> dummy = <span class=\"k\">new<\/span> <span class=\"t\">ListNode<\/span>(-<span class=\"n\">101<\/span>, head), cur = dummy;\n        <span class=\"k\">while<\/span> (cur.next != <span class=\"k\">null<\/span> &amp;&amp; cur.next.next != <span class=\"k\">null<\/span>) {\n            <span class=\"k\">int<\/span> val = cur.next.val;\n            <span class=\"k\">if<\/span> (val == cur.next.next.val) {\n                <span class=\"k\">while<\/span> (cur.next != <span class=\"k\">null<\/span> &amp;&amp; cur.next.val == val) {   <span class=\"c\">// 整段删掉，cur 不动<\/span>\n                    cur.next = cur.next.next;\n                }\n            } <span class=\"k\">else<\/span> {\n                cur = cur.next;\n            }\n        }\n        <span class=\"k\">return<\/span> dummy.next;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"4","rank":37,"id":"4","title":"寻找两个正序数组的中位数","difficulty":"困难","tags":["二分","数组"],"freq":175,"link":"https://leetcode.cn/problems/median-of-two-sorted-arrays/","desc":"求两个有序数组合并后的中位数，要求 O(log(m+n))。","libs":["python-7","java-22"],"html":"<h2>思路<\/h2>\n<ul><li><strong>二分的是划分位置，不是值<\/strong>。把两个数组各切一刀：<code>nums1<\/code> 左边 <code>i<\/code> 个，<code>nums2<\/code> 左边 <code>j<\/code> 个，要求<ul><li>左半边总个数 = <code>(m + n + 1) / 2<\/code>（所以 <code>j<\/code> 由 <code>i<\/code> 决定）；<\/li><li>左半边所有数 ≤ 右半边所有数，即 <code>left1 &lt;= right2<\/code> 且 <code>left2 &lt;= right1<\/code>。<\/li><\/ul><\/li><li>在 <code>nums1<\/code> 上二分 <code>i<\/code>：<ul><li><code>left1 &gt; right2<\/code>：<code>nums1<\/code> 左边拿多了，<code>hi = i - 1<\/code>；<\/li><li><code>left2 &gt; right1<\/code>：<code>nums1<\/code> 左边拿少了，<code>lo = i + 1<\/code>；<\/li><li>否则划分正确：总长奇数答案是 <code>max(left1, left2)<\/code>，偶数是 <code>(max(left1, left2) + min(right1, right2)) / 2<\/code>。<\/li><\/ul><\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>先保证 <code>nums1<\/code> 是较短的那个：二分更快，更重要的是保证 <code>j<\/code> 不越界。<\/li><li>一刀切在数组最左 / 最右时，那一侧没有元素：左边缺就用 <code>-∞<\/code>，右边缺就用 <code>+∞<\/code>，省掉一堆 if。<\/li><li><code>i<\/code> 的范围是 <code>[0, m]<\/code>（m+1 种切法），循环条件 <code>lo &lt;= hi<\/code>。<\/li><li>Java 偶数情况除以 <code>2.0<\/code>，别做整数除法。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">findMedianSortedArrays<\/span>(self, nums1: List[int], nums2: List[int]) -&gt; float:\n        <span class=\"k\">if<\/span> len(nums1) &gt; len(nums2):\n            nums1, nums2 = nums2, nums1\n        m, n = len(nums1), len(nums2)\n        lo, hi = <span class=\"n\">0<\/span>, m\n        <span class=\"k\">while<\/span> lo &lt;= hi:\n            i = (lo + hi) // <span class=\"n\">2<\/span>               <span class=\"c\"># nums1 左边取 i 个<\/span>\n            j = (m + n + <span class=\"n\">1<\/span>) // <span class=\"n\">2<\/span> - i         <span class=\"c\"># nums2 左边取 j 个<\/span>\n            left1 = nums1[i - <span class=\"n\">1<\/span>] <span class=\"k\">if<\/span> i &gt; <span class=\"n\">0<\/span> <span class=\"k\">else<\/span> -inf\n            right1 = nums1[i] <span class=\"k\">if<\/span> i &lt; m <span class=\"k\">else<\/span> inf\n            left2 = nums2[j - <span class=\"n\">1<\/span>] <span class=\"k\">if<\/span> j &gt; <span class=\"n\">0<\/span> <span class=\"k\">else<\/span> -inf\n            right2 = nums2[j] <span class=\"k\">if<\/span> j &lt; n <span class=\"k\">else<\/span> inf\n            <span class=\"k\">if<\/span> left1 &gt; right2:\n                hi = i - <span class=\"n\">1<\/span>\n            <span class=\"k\">elif<\/span> left2 &gt; right1:\n                lo = i + <span class=\"n\">1<\/span>\n            <span class=\"k\">elif<\/span> (m + n) % <span class=\"n\">2<\/span>:\n                <span class=\"k\">return<\/span> max(left1, left2)\n            <span class=\"k\">else<\/span>:\n                <span class=\"k\">return<\/span> (max(left1, left2) + min(right1, right2)) / <span class=\"n\">2<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">0.0<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">double<\/span> findMedianSortedArrays(<span class=\"k\">int<\/span>[] nums1, <span class=\"k\">int<\/span>[] nums2) {\n        <span class=\"k\">if<\/span> (nums1.length &gt; nums2.length) <span class=\"k\">return<\/span> findMedianSortedArrays(nums2, nums1);\n        <span class=\"k\">int<\/span> m = nums1.length, n = nums2.length;\n        <span class=\"k\">int<\/span> lo = <span class=\"n\">0<\/span>, hi = m;\n        <span class=\"k\">while<\/span> (lo &lt;= hi) {\n            <span class=\"k\">int<\/span> i = lo + (hi - lo) / <span class=\"n\">2<\/span>;          <span class=\"c\">// nums1 左边取 i 个<\/span>\n            <span class=\"k\">int<\/span> j = (m + n + <span class=\"n\">1<\/span>) / <span class=\"n\">2<\/span> - i;         <span class=\"c\">// nums2 左边取 j 个<\/span>\n            <span class=\"k\">int<\/span> left1 = i &gt; <span class=\"n\">0<\/span> ? nums1[i - <span class=\"n\">1<\/span>] : <span class=\"t\">Integer<\/span>.MIN_VALUE;\n            <span class=\"k\">int<\/span> right1 = i &lt; m ? nums1[i] : <span class=\"t\">Integer<\/span>.MAX_VALUE;\n            <span class=\"k\">int<\/span> left2 = j &gt; <span class=\"n\">0<\/span> ? nums2[j - <span class=\"n\">1<\/span>] : <span class=\"t\">Integer<\/span>.MIN_VALUE;\n            <span class=\"k\">int<\/span> right2 = j &lt; n ? nums2[j] : <span class=\"t\">Integer<\/span>.MAX_VALUE;\n            <span class=\"k\">if<\/span> (left1 &gt; right2) {\n                hi = i - <span class=\"n\">1<\/span>;\n            } <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (left2 &gt; right1) {\n                lo = i + <span class=\"n\">1<\/span>;\n            } <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> ((m + n) % <span class=\"n\">2<\/span> != <span class=\"n\">0<\/span>) {\n                <span class=\"k\">return<\/span> <span class=\"t\">Math<\/span>.max(left1, left2);\n            } <span class=\"k\">else<\/span> {\n                <span class=\"k\">return<\/span> (<span class=\"t\">Math<\/span>.max(left1, left2) + <span class=\"t\">Math<\/span>.min(right1, right2)) / <span class=\"n\">2.0<\/span>;\n            }\n        }\n        <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(log min(m, n))，空间 O(1)。<\/p>"},{"key":"142","rank":38,"id":"142","title":"环形链表 II","difficulty":"中等","tags":["链表","双指针"],"freq":171,"link":"https://leetcode.cn/problems/linked-list-cycle-ii/","desc":"返回链表开始入环的第一个节点，无环返回 null。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>第一阶段同 <a href=\"#/141\">141<\/a>：快慢指针判断有没有环，有环时停在相遇点。<\/li><li>第二阶段：一个指针回到 <code>head<\/code>，另一个留在相遇点，<strong>同速<\/strong>前进，再次相遇的位置就是环入口。<\/li><li>推导：设头到入口 <code>a<\/code>，入口到相遇点 <code>b<\/code>，环剩余 <code>c<\/code>。<code>fast<\/code> 走的路是 <code>slow<\/code> 的两倍：<code>2(a + b) = a + b + n(b + c)<\/code> → <code>a = (n - 1)(b + c) + c<\/code>。即从头走 <code>a<\/code> 步 = 从相遇点走 <code>c<\/code> 步再绕若干圈，都到入口。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>相遇点 ≠ 环入口，不能直接返回。<\/li><li>第二阶段两个指针都是一次一步。<\/li><li>无环（<code>fast<\/code> 走到头）要返回 <code>null<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">detectCycle<\/span>(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:\n        slow = fast = head\n        <span class=\"k\">while<\/span> fast <span class=\"k\">and<\/span> fast.next:\n            slow = slow.next\n            fast = fast.next.next\n            <span class=\"k\">if<\/span> slow <span class=\"k\">is<\/span> fast:                 <span class=\"c\"># 有环：一个回到头，同速再走<\/span>\n                p1, p2 = head, slow\n                <span class=\"k\">while<\/span> p1 <span class=\"k\">is<\/span> <span class=\"k\">not<\/span> p2:\n                    p1 = p1.next\n                    p2 = p2.next\n                <span class=\"k\">return<\/span> p1\n        <span class=\"k\">return<\/span> <span class=\"k\">None<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">public<\/span> <span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> detectCycle(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"t\">ListNode<\/span> slow = head, fast = head;\n        <span class=\"k\">while<\/span> (fast != <span class=\"k\">null<\/span> &amp;&amp; fast.next != <span class=\"k\">null<\/span>) {\n            slow = slow.next;\n            fast = fast.next.next;\n            <span class=\"k\">if<\/span> (slow == fast) {              <span class=\"c\">// 有环：一个回到头，同速再走<\/span>\n                <span class=\"t\">ListNode<\/span> p1 = head, p2 = slow;\n                <span class=\"k\">while<\/span> (p1 != p2) {\n                    p1 = p1.next;\n                    p2 = p2.next;\n                }\n                <span class=\"k\">return<\/span> p1;\n            }\n        }\n        <span class=\"k\">return<\/span> <span class=\"k\">null<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"165","rank":39,"id":"165","title":"比较版本号","difficulty":"中等","tags":["字符串","双指针"],"freq":167,"link":"https://leetcode.cn/problems/compare-version-numbers/","desc":"比较两个用 . 分隔的版本号：version1 大返回 1，小返回 -1，相等返回 0。","libs":["java-19","java-22"],"html":"<h2>思路<\/h2>\n<ul><li><strong>split<\/strong>：按 <code>.<\/code> 切开，逐段转成整数比较；某个版本号段数不够就当 0。<\/li><li><strong>双指针<\/strong>（不用 split，O(1) 额外空间）：两个指针各自读出一段数字（读到 <code>.<\/code> 或末尾为止，边读边累加成整数），比较后各跳过一个 <code>.<\/code>，继续下一段。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>Java 的 <code>split<\/code> 参数是正则，<code>.<\/code> 要写成 <code>&quot;\\\\.&quot;<\/code>。<\/li><li>循环条件是「或」：较长的版本号后面还有段要比（<code>1.0.1<\/code> vs <code>1<\/code>）。<\/li><li>转成整数比较，自然忽略前导 0（<code>1.01<\/code> == <code>1.001<\/code>）。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：split<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" da lass=\"k\">if<\/span> (num1 != num2) <span class=\"k\">return<\/span> num1 &gt; num2 ? <span class=\"n\">1<\/span> : -<span class=\"n\">1<\/span>;\n        }\n        <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：双指针<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">compareVersion<\/span>(self, version1: str, version2: str) -&gt; int:\n        m, n = len(version1), len(version2)\n        i = j = <span class=\"n\">0<\/span>\n        <span class=\"k\">while<\/span> i &lt; m <span class=\"k\">or<\/span> j &lt; n:\n            num1 = <span class=\"n\">0<\/span>\n            <span class=\"k\">while<\/span> i &lt; m <span class=\"k\">and<\/span> version1[i] != <span class=\"s\">&quot;.&quot;<\/span>:\n                num1 = num1 * <span class=\"n\">10<\/span> + int(version1[i])\n                i += <span class=\"n\">1<\/span>\n            num2 = <span class=\"n\">0<\/span>\n            <span class=\"k\">while<\/span> j &lt; n <span class=\"k\">and<\/span> version2[j] != <span class=\"s\">&quot;.&quot;<\/span>:\n                num2 = num2 * <span class=\"n\">10<\/span> + int(version2[j])\n                j += <span class=\"n\">1<\/span>\n            <span class=\"k\">if<\/span> num1 != num2:\n                <span class=\"k\">return<\/span> <span class=\"n\">1<\/span> <span class=\"k\">if<\/span> num1 &gt; num2 <span class=\"k\">else<\/span> -<span class=\"n\">1<\/span>\n            i += <span class=\"n\">1<\/span>                           <span class=\"c\"># 跳过 &#x27;.&#x27;<\/span>\n            j += <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">0<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> compareVersion(<span class=\"t\">String<\/span> version1, <span class=\"t\">String<\/span> version2) {\n        <span class=\"k\">int<\/span> m = version1.length(), n = version2.length();\n        <span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>, j = <span class=\"n\">0<\/span>;\n        <span class=\"k\">while<\/span> (i &lt; m || j &lt; n) {\n            <span class=\"k\">int<\/span> num1 = <span class=\"n\">0<\/span>;\n            <span class=\"k\">while<\/span> (i &lt; m &amp;&amp; version1.charAt(i) != <span class=\"s\">&#x27;.&#x27;<\/span>) {\n                num1 = num1 * <span class=\"n\">10<\/span> + (version1.charAt(i++) - <span class=\"s\">&#x27;0&#x27;<\/span>);\n            }\n            <span class=\"k\">int<\/span> num2 = <span class=\"n\">0<\/span>;\n            <span class=\"k\">while<\/span> (j &lt; n &amp;&amp; version2.charAt(j) != <span class=\"s\">&#x27;.&#x27;<\/span>) {\n                num2 = num2 * <span class=\"n\">10<\/span> + (version2.charAt(j++) - <span class=\"s\">&#x27;0&#x27;<\/span>);\n            }\n            <span class=\"k\">if<\/span> (num1 != num2) <span class=\"k\">return<\/span> num1 &gt; num2 ? <span class=\"n\">1<\/span> : -<span class=\"n\">1<\/span>;\n            i++;                             <span class=\"c\">// 跳过 &#x27;.&#x27;<\/span>\n            j++;\n        }\n        <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(m + n)；空间 split O(m + n)，双指针 O(1)。<\/p>"},{"key":"199","rank":40,"id":"199","title":"二叉树的右视图","difficulty":"中等","tags":["二叉树","BFS","DFS"],"freq":161,"link":"https://leetcode.cn/problems/binary-tree-right-side-view/","desc":"返回从右侧看二叉树时能看到的节点值（每层最右边的节点），从上到下。","libs":["python-0","java-12"],"html":"<h2>思路<\/h2>\n<ul><li>问题就是找每层最右边的节点。<\/li><li><strong>BFS<\/strong>：层序遍历时<strong>先右孩子后左孩子<\/strong>入队，这样每层第一个出队的（<code>i == 0<\/code>）就是最右节点。<\/li><li><strong>DFS<\/strong>：按「根 → 右 → 左」的顺序走，并带上深度。第一次到达某个深度（<code>depth == res.size()<\/code>）时遇到的一定是这层最右的节点。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>BFS 的入队顺序必须是右 → 左，否则 <code>i == 0<\/code> 拿到的是最左节点（或者保持左 → 右，取每层最后一个）。<\/li><li>DFS 必须先递归右子树。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：BFS<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">rightSideView<\/span>(self, root: Optional[TreeNode]) -&gt; List[int]:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root:\n            <span class=\"k\">return<\/span> []\n        res, q = [], deque([root])\n        <span class=\"k\">while<\/span> q:\n            <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(len(q)):\n                cur = q.popleft()\n                <span class=\"k\">if<\/span> i == <span class=\"n\">0<\/span>:                   <span class=\"c\"># 每层第一个出队的就是最右节点<\/span>\n                    res.append(cur.val)\n                <span class=\"k\">if<\/span> cur.right:\n                    q.append(cur.right)\n                <span class=\"k\">if<\/span> cur.left:\n                    q.append(cur.left)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; rightSideView(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> res;\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">TreeNode<\/span>&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        q.offer(root);\n        <span class=\"k\">while<\/span> (!q.isEmpty()) {\n            <span class=\"k\">int<\/span> sz = q.size();\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; sz; i++) {\n                <span class=\"t\">TreeNode<\/span> cur = q.poll();\n                <span class=\"k\">if<\/span> (i == <span class=\"n\">0<\/span>) res.add(cur.val);            <span class=\"c\">// 每层第一个出队的就是最右节点<\/span>\n                <span class=\"k\">if<\/span> (cur.right != <span class=\"k\">null<\/span>) q.offer(cur.right);\n                <span class=\"k\">if<\/span> (cur.left != <span class=\"k\">null<\/span>) q.offer(cur.left);\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：DFS<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">rightSideView<\/span>(self, root: Optional[TreeNode]) -&gt; List[int]:\n        res = []\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(node, depth):\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> node:\n                <span class=\"k\">return<\/span>\n            <span class=\"k\">if<\/span> depth == len(res):            <span class=\"c\"># 第一次到达这一层<\/span>\n                res.append(node.val)\n            dfs(node.right, depth + <span class=\"n\">1<\/span>)\n            dfs(node.left, depth + <span class=\"n\">1<\/span>)\n\n        dfs(root, <span class=\"n\">0<\/span>)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; rightSideView(<span class=\"t\">TreeNode<\/span> root) {\n        dfs(root, <span class=\"n\">0<\/span>);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> dfs(<span class=\"t\">TreeNode<\/span> node, <span class=\"k\">int<\/span> depth) {\n        <span class=\"k\">if<\/span> (node == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span>;\n        <span class=\"k\">if<\/span> (depth == res.size()) res.add(node.val);      <span class=\"c\">// 第一次到达这一层<\/span>\n        dfs(node.right, depth + <span class=\"n\">1<\/span>);\n        dfs(node.left, depth + <span class=\"n\">1<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)；空间 BFS O(n)（队列），DFS O(h)（递归栈）。<\/p>"},{"key":"239","rank":41,"id":"239","title":"滑动窗口最大值","difficulty":"困难","tags":["滑动窗口","单调队列"],"freq":160,"link":"https://leetcode.cn/problems/sliding-window-maximum/","desc":"大小为 k 的窗口从左滑到右，返回每个窗口里的最大值。","libs":["python-0","java-12"],"html":"<h2>思路<\/h2>\n<ul><li>维护一个<strong>单调递减队列<\/strong>，队头永远是当前窗口的最大值。三个操作：<ul><li><code>push(x)<\/code>：入队前把队尾所有比 <code>x<\/code> 小的弹掉——只要 <code>x<\/code> 还在窗口里，它们永远当不了最大值；<\/li><li><code>max()<\/code>：取队头；<\/li><li><code>pop(x)<\/code>：窗口最左边的元素 <code>x<\/code> 要滑出去时，<strong>只有它等于队头才弹<\/strong>（不等说明它早就被更大的压掉了，不在队列里）。<\/li><\/ul><\/li><li>遍历到 <code>i<\/code>：先 <code>push(nums[i])<\/code>；窗口满了（<code>i &gt;= k - 1<\/code>）就记录 <code>max()<\/code>，再 <code>pop(nums[i - k + 1])<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>push<\/code> 时弹队尾用严格小于 <code>&lt;<\/code>：相等的要留着，否则 <code>pop<\/code> 时会把还在窗口里的那个相同值误删。<\/li><li>需要两端都能操作的结构：Python <code>deque<\/code>，Java <code>ArrayDeque<\/code> / <code>LinkedList<\/code>。<\/li><li>另一种常见写法是队列里存下标，用 <code>q[0] &lt;= i - k<\/code> 判断过期。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">maxSlidingWindow<\/span>(self, nums: List[int], k: int) -&gt; List[int]:\n        q, res = deque(), []                 <span class=\"c\"># 队列里的值单调递减，队头最大<\/span>\n        <span class=\"k\">for<\/span> i, x <span class=\"k\">in<\/span> enumerate(nums):\n            <span class=\"k\">while<\/span> q <span class=\"k\">and<\/span> q[-<span class=\"n\">1<\/span>] &lt; x:           <span class=\"c\"># push：压掉队尾比 x 小的<\/span>\n                q.pop()\n            q.append(x)\n            <span class=\"k\">if<\/span> i &gt;= k - <span class=\"n\">1<\/span>:                   <span class=\"c\"># 窗口已满<\/span>\n                res.append(q[<span class=\"n\">0<\/span>])             <span class=\"c\"># max<\/span>\n                <span class=\"k\">if<\/span> q[<span class=\"n\">0<\/span>] == nums[i - k + <span class=\"n\">1<\/span>]:  <span class=\"c\"># pop：滑出的元素是队头才弹<\/span>\n                    q.popleft()\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span>[] maxSlidingWindow(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> k) {\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();           <span class=\"c\">// 队列里的值单调递减，队头最大<\/span>\n        <span class=\"k\">int<\/span>[] res = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[nums.length - k + <span class=\"n\">1<\/span>];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; nums.length; i++) {\n            <span class=\"k\">while<\/span> (!q.isEmpty() &amp;&amp; q.peekLast() &lt; nums[i]) {   <span class=\"c\">// push：压掉队尾比它小的<\/span>\n                q.pollLast();\n            }\n            q.offerLast(nums[i]);\n            <span class=\"k\">if<\/span> (i &gt;= k - <span class=\"n\">1<\/span>) {                            <span class=\"c\">// 窗口已满<\/span>\n                res[i - k + <span class=\"n\">1<\/span>] = q.peekFirst();          <span class=\"c\">// max<\/span>\n                <span class=\"k\">if<\/span> (q.peekFirst() == nums[i - k + <span class=\"n\">1<\/span>]) {  <span class=\"c\">// pop：滑出的元素是队头才弹<\/span>\n                    q.pollFirst();\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)（每个元素最多入队、出队各一次），空间 O(k)。<\/p>"},{"key":"704","rank":42,"id":"704","title":"二分查找","difficulty":"简单","tags":["二分"],"freq":153,"link":"https://leetcode.cn/problems/binary-search/","desc":"在升序数组中查找 target，返回下标，不存在返回 -1。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>闭区间 <code>[l, r]<\/code> 的二分模板：<ul><li><code>nums[mid] == target<\/code> 返回；<\/li><li><code>nums[mid] &gt; target<\/code>，目标在左边，<code>r = mid - 1<\/code>；<\/li><li><code>nums[mid] &lt; target<\/code>，目标在右边，<code>l = mid + 1<\/code>。<\/li><\/ul><\/li><li>循环结束还没找到就是不存在。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>闭区间的一整套要配齐：<code>r = n - 1<\/code>、<code>while (l &lt;= r)<\/code>、<code>mid ± 1<\/code>。<\/li><li>Java 求中点写 <code>l + (r - l) / 2<\/code>，防止 <code>l + r<\/code> 溢出。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">search<\/span>(self, nums: List[int], target: int) -&gt; int:\n        l, r = <span class=\"n\">0<\/span>, len(nums) - <span class=\"n\">1<\/span>\n        <span class=\"k\">while<\/span> l &lt;= r:\n            mid = (l + r) // <span class=\"n\">2<\/span>\n            <span class=\"k\">if<\/span> nums[mid] == target:\n                <span class=\"k\">return<\/span> mid\n            <span class=\"k\">if<\/span> nums[mid] &gt; target:\n                r = mid - <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:\n                l = mid + <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> -<span class=\"n\">1<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> search(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> target) {\n        <span class=\"k\">int<\/span> l = <span class=\"n\">0<\/span>, r = nums.length - <span class=\"n\">1<\/span>;\n        <span class=\"k\">while<\/span> (l &lt;= r) {\n            <span class=\"k\">int<\/span> mid = l + (r - l) / <span class=\"n\">2<\/span>;\n            <span class=\"k\">if<\/span> (nums[mid] == target) <span class=\"k\">return<\/span> mid;\n            <span class=\"k\">if<\/span> (nums[mid] &gt; target) r = mid - <span class=\"n\">1<\/span>;\n            <span class=\"k\">else<\/span> l = mid + <span class=\"n\">1<\/span>;\n        }\n        <span class=\"k\">return<\/span> -<span class=\"n\">1<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(log n)，空间 O(1)。<\/p>"},{"key":"22","rank":43,"id":"22","title":"括号生成","difficulty":"中等","tags":["回溯","字符串"],"freq":152,"link":"https://leetcode.cn/problems/generate-parentheses/","desc":"生成 n 对括号的所有有效组合。","libs":["java-18"],"html":"<h2>思路<\/h2>\n<ul><li>回溯 + 剪枝。<code>l<\/code>、<code>r<\/code> 是<strong>还剩<\/strong>多少个左、右括号可用，<code>path<\/code> 是当前拼出来的串。<\/li><li>每一步两个选择：放 <code>(<\/code>（<code>l - 1<\/code>）或放 <code>)<\/code>（<code>r - 1<\/code>）。<\/li><li>剪枝：<ul><li><code>l &lt; 0 || r &lt; 0<\/code>：用超了；<\/li><li><code>l &gt; r<\/code>：剩下的左括号比右括号多，说明已经放的右括号比左括号多，后面怎么补都不合法。<\/li><\/ul><\/li><li><code>l == 0 &amp;&amp; r == 0<\/code> 时收集答案。有了 <code>l &gt; r<\/code> 的剪枝，生成的一定合法，不用再校验。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>l &gt; r<\/code> 是按「剩余数量」说的；如果变量记的是「已用数量」，条件要反过来（已用右括号 &gt; 已用左括号）。<\/li><li>Java 用 <code>StringBuilder<\/code> 做 <code>path<\/code>，撤销选择是 <code>deleteCharAt(path.length() - 1)<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">generateParenthesis<\/span>(self, n: int) -&gt; List[str]:\n        res, path = [], []\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(l, r):                       <span class=\"c\"># l、r：剩余的左、右括号数<\/span>\n            <span class=\"k\">if<\/span> l &lt; <span class=\"n\">0<\/span> <span class=\"k\">or<\/span> r &lt; <span class=\"n\">0<\/span> <span class=\"k\">or<\/span> l &gt; r:\n                <span class=\"k\">return<\/span>\n            <span class=\"k\">if<\/span> l == <span class=\"n\">0<\/span> <span class=\"k\">and<\/span> r == <span class=\"n\">0<\/span>:\n                res.append(<span class=\"s\">&quot;&quot;<\/span>.join(path))\n                <span class=\"k\">return<\/span>\n            path.append(<span class=\"s\">&quot;(&quot;<\/span>)\n            dfs(l - <span class=\"n\">1<\/span>, r)\n            path.pop()\n            path.append(<span class=\"s\">&quot;)&quot;<\/span>)\n            dfs(l, r - <span class=\"n\">1<\/span>)\n            path.pop()\n\n        dfs(n, n)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">String<\/span>&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">StringBuilder<\/span> path = <span class=\"k\">new<\/span> <span class=\"t\">StringBuilder<\/span>();\n\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">String<\/span>&gt; generateParenthesis(<span class=\"k\">int<\/span> n) {\n        dfs(n, n);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"c\">// l、r：剩余的左、右括号数<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> dfs(<span class=\"k\">int<\/span> l, <span class=\"k\">int<\/span> r) {\n        <span class=\"k\">if<\/span> (l &lt; <span class=\"n\">0<\/span> || r &lt; <span class=\"n\">0<\/span> || l &gt; r) <span class=\"k\">return<\/span>;\n        <span class=\"k\">if<\/span> (l == <span class=\"n\">0<\/span> &amp;&amp; r == <span class=\"n\">0<\/span>) {\n            res.add(path.toString());\n            <span class=\"k\">return<\/span>;\n        }\n        path.append(<span class=\"s\">&#x27;(&#x27;<\/span>);\n        dfs(l - <span class=\"n\">1<\/span>, r);\n        path.deleteCharAt(path.length() - <span class=\"n\">1<\/span>);\n        path.append(<span class=\"s\">&#x27;)&#x27;<\/span>);\n        dfs(l, r - <span class=\"n\">1<\/span>);\n        path.deleteCharAt(path.length() - <span class=\"n\">1<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(4ⁿ / √n)（卡特兰数），空间 O(n)（不计答案）。<\/p>"},{"key":"32","rank":44,"id":"32","title":"最长有效括号","difficulty":"困难","tags":["栈","动态规划","字符串"],"freq":151,"link":"https://leetcode.cn/problems/longest-valid-parentheses/","desc":"求只含 '(' 和 ')' 的字符串中，最长有效括号子串的长度。","libs":["java-12"],"html":"<h2>思路<\/h2>\n<ul><li><strong>栈 + DP<\/strong>：栈里放还没匹配的左括号<strong>下标<\/strong>；<code>dp[i]<\/code> 表示以 <code>s[i-1]<\/code> 结尾的最长有效括号长度（多开一位）。<ul><li>遇到 <code>)<\/code> 且栈非空：弹出与它匹配的左括号下标 <code>leftIndex<\/code>，这一段长 <code>i - leftIndex + 1<\/code>；<\/li><li>再加上紧挨在 <code>leftIndex<\/code> 前面的有效长度 <code>dp[leftIndex]<\/code>，就把 <code>&quot;()&quot; + &quot;()&quot;<\/code> 这样的相邻段拼起来了：<code>dp[i + 1] = i - leftIndex + 1 + dp[leftIndex]<\/code>。<\/li><\/ul><\/li><li><strong>双向计数，O(1) 空间<\/strong>：<code>left<\/code>、<code>right<\/code> 数左右括号。<ul><li>从左往右扫：<code>left == right<\/code> 时更新答案 <code>2 * right<\/code>；<code>right &gt; left<\/code> 说明右括号多了，这段作废，两个都清零。<\/li><li>只扫一遍会漏掉左括号一直偏多的情况（如 <code>&quot;(()&quot;<\/code>），所以再从右往左扫一遍，条件对称（<code>left &gt; right<\/code> 时清零）。<\/li><\/ul><\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>栈存下标不存字符，要靠下标算长度。<\/li><li><code>dp<\/code> 多开一位：<code>dp[leftIndex]<\/code> 正好是 <code>leftIndex<\/code> 前一个字符结尾的长度，不用处理 <code>leftIndex - 1<\/code> 越界。<\/li><li>有效子串一定以 <code>)<\/code> 结尾，只有遇到 <code>)<\/code> 才计算；栈空说明这个 <code>)<\/code> 配不上，跳过。<\/li><li>双向计数只能求长度，还原不了具体子串。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：栈 + DP<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">longestValidParentheses<\/span>(self, s: str) -&gt; int:\n        stk = []                             <span class=\"c\"># 未匹配的左括号下标<\/span>\n        dp = [<span class=\"n\">0<\/span>] * (len(s) + <span class=\"n\">1<\/span>)              <span class=\"c\"># dp[i]：以 s[i-1] 结尾的最长有效长度<\/span>\n        <span class=\"k\">for<\/span> i, c <span class=\"k\">in<\/span> enumerate(s):\n            <span class=\"k\">if<\/span> c == <span class=\"s\">&quot;(&quot;<\/span>:\n                stk.append(i)\n            <span class=\"k\">elif<\/span> stk:\n                left_index = stk.pop()\n                dp[i + <span class=\"n\">1<\/span>] = i - left_index + <span class=\"n\">1<\/span> + dp[left_index]   <span class=\"c\"># 本段 + 前面紧挨着的一段<\/span>\n        <span class=\"k\">return<\/span> max(dp)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> longestValidParentheses(<span class=\"t\">String<\/span> s) {\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; stk = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();     <span class=\"c\">// 未匹配的左括号下标<\/span>\n        <span class=\"k\">int<\/span>[] dp = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[s.length() + <span class=\"n\">1<\/span>];          <span class=\"c\">// dp[i]：以 s[i-1] 结尾的最长有效长度<\/span>\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; s.length(); i++) {\n            <span class=\"k\">if<\/span> (s.charAt(i) == <span class=\"s\">&#x27;(&#x27;<\/span>) {\n                stk.push(i);\n            } <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (!stk.isEmpty()) {\n                <span class=\"k\">int<\/span> leftIndex = stk.pop();\n                dp[i + <span class=\"n\">1<\/span>] = i - leftIndex + <span class=\"n\">1<\/span> + dp[leftIndex];   <span class=\"c\">// 本段 + 前面紧挨着的一段<\/span>\n                res = <span class=\"t\">Math<\/span>.max(res, dp[i + <span class=\"n\">1<\/span>]);\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：双向计数<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">longestValidParentheses<\/span>(self, s: str) -&gt; int:\n        res = <span class=\"n\">0<\/span>\n        left = right = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> c <span class=\"k\">in<\/span> s:                          <span class=\"c\"># 从左往右：右括号多了就作废<\/span>\n            <span class=\"k\">if<\/span> c == <span class=\"s\">&quot;(&quot;<\/span>:\n                left += <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:\n                right += <span class=\"n\">1<\/span>\n            <span class=\"k\">if<\/span> left == right:\n                res = max(res, <span class=\"n\">2<\/span> * right)\n            <span class=\"k\">elif<\/span> right &gt; left:\n                left = right = <span class=\"n\">0<\/span>\n        left = right = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> c <span class=\"k\">in<\/span> reversed(s):                <span class=\"c\"># 从右往左：左括号多了就作废<\/span>\n            <span class=\"k\">if<\/span> c == <span class=\"s\">&quot;(&quot;<\/span>:\n                left += <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:\n                right += <span class=\"n\">1<\/span>\n            <span class=\"k\">if<\/span> left == right:\n                res = max(res, <span class=\"n\">2<\/span> * left)\n            <span class=\"k\">elif<\/span> left &gt; right:\n                left = right = <span class=\"n\">0<\/span>\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> longestValidParentheses(<span class=\"t\">String<\/span> s) {\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>, left = <span class=\"n\">0<\/span>, right = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; s.length(); i++) {           <span class=\"c\">// 从左往右：右括号多了就作废<\/span>\n            <span class=\"k\">if<\/span> (s.charAt(i) == <span class=\"s\">&#x27;(&#x27;<\/span>) left++;\n            <span class=\"k\">else<\/span> right++;\n            <span class=\"k\">if<\/span> (left == right) res = <span class=\"t\">Math<\/span>.max(res, <span class=\"n\">2<\/span> * right);\n            <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (right &gt; left) left = right = <span class=\"n\">0<\/span>;\n        }\n        left = right = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = s.length() - <span class=\"n\">1<\/span>; i &gt;= <span class=\"n\">0<\/span>; i--) {      <span class=\"c\">// 从右往左：左括号多了就作废<\/span>\n            <span class=\"k\">if<\/span> (s.charAt(i) == <span class=\"s\">&#x27;(&#x27;<\/span>) left++;\n            <span class=\"k\">else<\/span> right++;\n            <span class=\"k\">if<\/span> (left == right) res = <span class=\"t\">Math<\/span>.max(res, <span class=\"n\">2<\/span> * left);\n            <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (left &gt; right) left = right = <span class=\"n\">0<\/span>;\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间都是 O(n)；空间栈 + DP 为 O(n)，双向计数 O(1)。<\/p>"},{"key":"69","rank":45,"id":"69","title":"x 的平方根","difficulty":"简单","tags":["二分","数学"],"freq":150,"link":"https://leetcode.cn/problems/sqrtx/","desc":"求非负整数 x 的平方根的整数部分（不能用内置开方函数）。","libs":["java-22"],"html":"<h2>思路<\/h2>\n<ul><li><strong>二分<\/strong>：答案是满足 <code>k * k &lt;= x<\/code> 的最大 <code>k<\/code>，在 <code>[0, x]<\/code> 上二分。<code>mid * mid &lt;= x<\/code> 时 <code>mid<\/code> 是候选答案，记到 <code>res<\/code> 里再往右找更大的；否则往左。<\/li><li><strong>牛顿迭代<\/strong>：求 <code>r² = x<\/code>，从 <code>r = x<\/code> 出发反复令 <code>r = (r + x / r) / 2<\/code>，直到 <code>r * r &lt;= x<\/code>。全程用整数除法，不用处理浮点精度。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>Java 里 <code>mid * mid<\/code> 会溢出 <code>int<\/code>：写 <code>(long) mid * mid<\/code>。注意 <code>long num = mid * mid<\/code> 没用——右边先按 <code>int<\/code> 算完溢出了才转。<\/li><li>二分找的是「最后一个满足条件的」，用 <code>res<\/code> 记录候选最不容易写错。<\/li><li>牛顿迭代 <code>x = 0<\/code> 时会除零，要特判。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：二分<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">mySqrt<\/span>(self, x: int) -&gt; int:\n        left, right, res = <span class=\"n\">0<\/span>, x, <span class=\"n\">0<\/span>\n        <span class=\"k\">while<\/span> left &lt;= right:\n            mid = (left + right) // <span class=\"n\">2<\/span>\n            <span class=\"k\">if<\/span> mid * mid &lt;= x:\n                res = mid                    <span class=\"c\"># mid 合法，继续往右找更大的<\/span>\n                left = mid + <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:\n                right = mid - <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> mySqrt(<span class=\"k\">int<\/span> x) {\n        <span class=\"k\">int<\/span> left = <span class=\"n\">0<\/span>, right = x, res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">while<\/span> (left &lt;= right) {\n            <span class=\"k\">int<\/span> mid = left + (right - left) / <span class=\"n\">2<\/span>;\n            <span class=\"k\">if<\/span> ((<span class=\"k\">long<\/span>) mid * mid &lt;= x) {\n                res = mid;                   <span class=\"c\">// mid 合法，继续往右找更大的<\/span>\n                left = mid + <span class=\"n\">1<\/span>;\n            } <span class=\"k\">else<\/span> {\n                right = mid - <span class=\"n\">1<\/span>;\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：牛顿迭代<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">mySqrt<\/span>(self, x: int) -&gt; int:\n        <span class=\"k\">if<\/span> x == <span class=\"n\">0<\/span>:\n            <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>\n        r = x\n        <span class=\"k\">while<\/span> r * r &gt; x:\n            r = (r + x // r) // <span class=\"n\">2<\/span>\n        <span class=\"k\">return<\/span> r<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> mySqrt(<span class=\"k\">int<\/span> x) {\n        <span class=\"k\">if<\/span> (x == <span class=\"n\">0<\/span>) <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n        <span class=\"k\">long<\/span> r = x;\n        <span class=\"k\">while<\/span> (r * r &gt; x) {\n            r = (r + x / r) / <span class=\"n\">2<\/span>;\n        }\n        <span class=\"k\">return<\/span> (<span class=\"k\">int<\/span>) r;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(log x)，空间 O(1)。<\/p>"},{"key":"148","rank":46,"id":"148","title":"排序链表","difficulty":"中等","tags":["链表","排序","分治"],"freq":149,"link":"https://leetcode.cn/problems/sort-list/","desc":"把链表按升序排序，要求 O(n log n)。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>链表排序用<strong>归并<\/strong>（快排依赖随机访问，不适合链表）：<ol><li>快慢指针找中点；<\/li><li>从中点断开成两条；<\/li><li>递归排序左右两条；<\/li><li>合并两个有序链表（<a href=\"#/21\">21<\/a>）。<\/li><\/ol><\/li><li>递归出口：空链表或只有一个节点，天然有序。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>fast<\/code> 要从 <code>head.next<\/code> 出发，让 <code>slow<\/code> 停在<strong>偏左<\/strong>的中点。若 <code>fast = head<\/code>，两个节点时 <code>slow<\/code> 会停在第二个节点，切完左边还是原链表，无限递归。<\/li><li>必须 <code>slow.next = null<\/code> 断开。<\/li><li>合并完别忘了接上剩余的那段。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">sortList<\/span>(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> head <span class=\"k\">or<\/span> <span class=\"k\">not<\/span> head.next:\n            <span class=\"k\">return<\/span> head\n        slow, fast = head, head.next         <span class=\"c\"># fast 先走一步，slow 停在偏左的中点<\/span>\n        <span class=\"k\">while<\/span> fast <span class=\"k\">and<\/span> fast.next:\n            slow = slow.next\n            fast = fast.next.next\n        mid = slow.next\n        slow.next = <span class=\"k\">None<\/span>                     <span class=\"c\"># 断开<\/span>\n        p1, p2 = self.sortList(head), self.sortList(mid)\n        dummy = p = ListNode(-<span class=\"n\">1<\/span>)             <span class=\"c\"># 合并两个有序链表<\/span>\n        <span class=\"k\">while<\/span> p1 <span class=\"k\">and<\/span> p2:\n            <span class=\"k\">if<\/span> p1.val &lt; p2.val:\n                p.next = p1\n                p1 = p1.next\n            <span class=\"k\">else<\/span>:\n                p.next = p2\n                p2 = p2.next\n            p = p.next\n        p.next = p1 <span class=\"k\">or<\/span> p2\n        <span class=\"k\">return<\/span> dummy.next<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> sortList(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"k\">if<\/span> (head == <span class=\"k\">null<\/span> || head.next == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> head;\n        <span class=\"t\">ListNode<\/span> slow = head, fast = head.next;      <span class=\"c\">// fast 先走一步，slow 停在偏左的中点<\/span>\n        <span class=\"k\">while<\/span> (fast != <span class=\"k\">null<\/span> &amp;&amp; fast.next != <span class=\"k\">null<\/span>) {\n            slow = slow.next;\n            fast = fast.next.next;\n        }\n        <span class=\"t\">ListNode<\/span> mid = slow.next;\n        slow.next = <span class=\"k\">null<\/span>;                            <span class=\"c\">// 断开<\/span>\n        <span class=\"k\">return<\/span> mergeTwoLists(sortList(head), sortList(mid));\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"t\">ListNode<\/span> mergeTwoLists(<span class=\"t\">ListNode<\/span> p1, <span class=\"t\">ListNode<\/span> p2) {\n        <span class=\"t\">ListNode<\/span> dummy = <span class=\"k\">new<\/span> <span class=\"t\">ListNode<\/span>(-<span class=\"n\">1<\/span>), p = dummy;\n        <span class=\"k\">while<\/span> (p1 != <span class=\"k\">null<\/span> &amp;&amp; p2 != <span class=\"k\">null<\/span>) {\n            <span class=\"k\">if<\/span> (p1.val &lt; p2.val) {\n                p.next = p1;\n                p1 = p1.next;\n            } <span class=\"k\">else<\/span> {\n                p.next = p2;\n                p2 = p2.next;\n            }\n            p = p.next;\n        }\n        p.next = p1 != <span class=\"k\">null<\/span> ? p1 : p2;\n        <span class=\"k\">return<\/span> dummy.next;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n log n)，空间 O(log n)（递归栈）。<\/p>"},{"key":"94","rank":47,"id":"94","title":"二叉树的中序遍历","difficulty":"简单","tags":["二叉树","栈"],"freq":144,"link":"https://leetcode.cn/problems/binary-tree-inorder-traversal/","desc":"返回二叉树的中序遍历（左 → 根 → 右）。","libs":["java-12"],"html":"<h2>思路<\/h2>\n<ul><li><strong>递归<\/strong>：<code>dfs(左)<\/code> → 访问当前节点 → <code>dfs(右)<\/code>。<\/li><li><strong>迭代（栈模拟递归）<\/strong>：一路向左把节点压栈；到头后弹出一个节点访问它，然后转向它的右子树，重复。<\/li><li><strong>Morris（O(1) 空间）<\/strong>：不用栈，借用「左子树最右节点」的空右指针记住回来的路。对当前节点 <code>root<\/code>：<ul><li>没有左子树：访问 <code>root<\/code>，走向右边；<\/li><li>有左子树：找到左子树的最右节点 <code>pre<\/code>（中序前驱）。<ul><li><code>pre.right<\/code> 为空 → 第一次来：连上 <code>pre.right = root<\/code>，进入左子树；<\/li><li><code>pre.right == root<\/code> → 第二次回来，左子树已经走完：拆掉线索，访问 <code>root<\/code>，走向右边。<\/li><\/ul><\/li><\/ul><\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>迭代的循环条件是 <code>root != null || 栈非空<\/code>，必须是「或」：<code>root<\/code> 为空时栈里可能还有节点；栈空时 <code>root<\/code> 可能还带着右子树。<\/li><li>Morris 找前驱时循环条件要带上 <code>pre.right != root<\/code>，否则顺着线索绕圈。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：递归<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">inorderTraversal<\/span>(self, root: Optional[TreeNode]) -&gt; List[int]:\n        res = []\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(node):\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> node:\n                <span class=\"k\">return<\/span>\n            dfs(node.left)\n            res.append(node.val)\n            dfs(node.right)\n\n        dfs(root)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; inorderTraversal(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> res;\n        inorderTraversal(root.left);\n        res.add(root.val);\n        inorderTraversal(root.right);\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：迭代<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">inorderTraversal<\/span>(self, root: Optional[TreeNode]) -&gt; List[int]:\n        res, stk = [], []\n        <span class=\"k\">while<\/span> root <span class=\"k\">or<\/span> stk:\n            <span class=\"k\">while<\/span> root:                      <span class=\"c\"># 一路向左压栈<\/span>\n                stk.append(root)\n                root = root.left\n            root = stk.pop()\n            res.append(root.val)\n            root = root.right                <span class=\"c\"># 转向右子树<\/span>\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; inorderTraversal(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">TreeNode<\/span>&gt; stk = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        <span class=\"k\">while<\/span> (root != <span class=\"k\">null<\/span> || !stk.isEmpty()) {\n            <span class=\"k\">while<\/span> (root != <span class=\"k\">null<\/span>) {           <span class=\"c\">// 一路向左压栈<\/span>\n                stk.push(root);\n                root = root.left;\n            }\n            root = stk.pop();\n            res.add(root.val);\n            root = root.right;               <span class=\"c\">// 转向右子树<\/span>\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法三：Morris<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">inorderTraversal<\/span>(self, root: Optional[TreeNode]) -&gt; List[int]:\n        res = []\n        <span class=\"k\">while<\/span> root:\n            <span class=\"k\">if<\/span> root.left:\n                pre = root.left              <span class=\"c\"># 找中序前驱：左子树的最右节点<\/span>\n                <span class=\"k\">while<\/span> pre.right <span class=\"k\">and<\/span> pre.right <span class=\"k\">is<\/span> <span class=\"k\">not<\/span> root:\n                    pre = pre.right\n                <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> pre.right:            <span class=\"c\"># 第一次来：建线索，进左子树<\/span>\n                    pre.right = root\n                    root = root.left\n                    <span class=\"k\">continue<\/span>\n                pre.right = <span class=\"k\">None<\/span>             <span class=\"c\"># 第二次回来：拆线索<\/span>\n            res.append(root.val)\n            root = root.right\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; inorderTraversal(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n        <span class=\"k\">while<\/span> (root != <span class=\"k\">null<\/span>) {\n            <span class=\"k\">if<\/span> (root.left != <span class=\"k\">null<\/span>) {\n                <span class=\"t\">TreeNode<\/span> pre = root.left;            <span class=\"c\">// 找中序前驱：左子树的最右节点<\/span>\n                <span class=\"k\">while<\/span> (pre.right != <span class=\"k\">null<\/span> &amp;&amp; pre.right != root) {\n                    pre = pre.right;\n                }\n                <span class=\"k\">if<\/span> (pre.right == <span class=\"k\">null<\/span>) {             <span class=\"c\">// 第一次来：建线索，进左子树<\/span>\n                    pre.right = root;\n                    root = root.left;\n                    <span class=\"k\">continue<\/span>;\n                }\n                pre.right = <span class=\"k\">null<\/span>;                    <span class=\"c\">// 第二次回来：拆线索<\/span>\n            }\n            res.add(root.val);\n            root = root.right;\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间都是 O(n)；空间递归 / 迭代 O(h)，Morris O(1)。<\/p>"},{"key":"232","rank":48,"id":"232","title":"用栈实现队列","difficulty":"简单","tags":["设计","栈"],"freq":143,"link":"https://leetcode.cn/problems/implement-queue-using-stacks/","desc":"只用两个栈实现先进先出的队列（push、pop、peek、empty）。","libs":["java-12"],"html":"<h2>思路<\/h2>\n<ul><li>双栈：<code>stk1<\/code> 是输入栈，负责 <code>push<\/code>；<code>stk2<\/code> 是输出栈，负责 <code>pop<\/code> / <code>peek<\/code>。<\/li><li>出队或看队首时，<strong>只有 <code>stk2<\/code> 为空<\/strong>才把 <code>stk1<\/code> 的元素全部倒进 <code>stk2<\/code>——倒一次顺序就反过来了，栈顶正好是最早进来的。<\/li><li>懒搬运：每个元素最多进 <code>stk1<\/code> 一次、搬一次、出 <code>stk2<\/code> 一次，均摊 O(1)。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>stk2<\/code> 不为空时不能搬，否则顺序就乱了。把这段逻辑抽成 <code>refresh()<\/code>，<code>pop<\/code> 和 <code>peek<\/code> 之前都调用。<\/li><li>两个栈都空才算队列为空。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">MyQueue<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">__init__<\/span>(self):\n        self.stk1 = []                       <span class=\"c\"># 输入栈<\/span>\n        self.stk2 = []                       <span class=\"c\"># 输出栈<\/span>\n\n    <span class=\"k\">def<\/span> <span class=\"f\">push<\/span>(self, x: int) -&gt; <span class=\"k\">None<\/span>:\n        self.stk1.append(x)\n\n    <span class=\"k\">def<\/span> <span class=\"f\">pop<\/span>(self) -&gt; int:\n        self.refresh()\n        <span class=\"k\">return<\/span> self.stk2.pop()\n\n    <span class=\"k\">def<\/span> <span class=\"f\">peek<\/span>(self) -&gt; int:\n        self.refresh()\n        <span class=\"k\">return<\/span> self.stk2[-<span class=\"n\">1<\/span>]\n\n    <span class=\"k\">def<\/span> <span class=\"f\">empty<\/span>(self) -&gt; bool:\n        <span class=\"k\">return<\/span> <span class=\"k\">not<\/span> self.stk1 <span class=\"k\">and<\/span> <span class=\"k\">not<\/span> self.stk2\n\n    <span class=\"k\">def<\/span> <span class=\"f\">refresh<\/span>(self):\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> self.stk2:                    <span class=\"c\"># 输出栈空了才搬<\/span>\n            <span class=\"k\">while<\/span> self.stk1:\n                self.stk2.append(self.stk1.pop())<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">MyQueue<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; stk1 = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();   <span class=\"c\">// 输入栈<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; stk2 = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();   <span class=\"c\">// 输出栈<\/span>\n\n    <span class=\"k\">public<\/span> <span class=\"t\">MyQueue<\/span>() {\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">void<\/span> push(<span class=\"k\">int<\/span> x) {\n        stk1.push(x);\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> pop() {\n        refresh();\n        <span class=\"k\">return<\/span> stk2.pop();\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> peek() {\n        refresh();\n        <span class=\"k\">return<\/span> stk2.peek();\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> empty() {\n        <span class=\"k\">return<\/span> stk1.isEmpty() &amp;&amp; stk2.isEmpty();\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> refresh() {\n        <span class=\"k\">if<\/span> (stk2.isEmpty()) {                <span class=\"c\">// 输出栈空了才搬<\/span>\n            <span class=\"k\">while<\/span> (!stk1.isEmpty()) {\n                stk2.push(stk1.pop());\n            }\n        }\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：各操作均摊 O(1)，空间 O(n)。<\/p>"},{"key":"31","rank":49,"id":"31","title":"下一个排列","difficulty":"中等","tags":["数组","双指针"],"freq":137,"link":"https://leetcode.cn/problems/next-permutation/","desc":"原地把数组改成字典序的下一个排列；已经是最大排列则变成最小排列。","libs":[],"html":"<h2>思路<\/h2>\n<p>目标是「刚好大一点」的排列，三步：<\/p>\n<ol><li>从右往左找第一个升序位置 <code>i<\/code>（<code>nums[i] &lt; nums[i+1]<\/code>）。<code>i<\/code> 右边是一段降序，已经是这些数能排出的最大值，只能让第 <code>i<\/code> 位变大。<\/li><li>从右往左找第一个比 <code>nums[i]<\/code> 大的数 <code>nums[j]<\/code>——后缀降序，所以它是比 <code>nums[i]<\/code> 大的数里最小的。交换 <code>i<\/code>、<code>j<\/code>。<\/li><li>交换后后缀仍然降序，把它反转成升序，让后面尽可能小。<\/li><\/ol>\n<h2>易错点<\/h2>\n<ul><li>找 <code>i<\/code> 和找 <code>j<\/code> 的比较都带等号（<code>&gt;=<\/code>）：有重复元素时相等不算「更大」。<\/li><li>整个数组降序时找不到 <code>i<\/code>（<code>i == -1<\/code>），跳过交换，<code>reverse(i + 1, n - 1)<\/code> 正好是整体反转，不用特判。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">nextPermutation<\/span>(self, nums: List[int]) -&gt; <span class=\"k\">None<\/span>:\n        n = len(nums)\n        i = n - <span class=\"n\">2<\/span>\n        <span class=\"k\">while<\/span> i &gt;= <span class=\"n\">0<\/span> <span class=\"k\">and<\/span> nums[i] &gt;= nums[i + <span class=\"n\">1<\/span>]:     <span class=\"c\"># 1. 从右往左找第一个升序位置<\/span>\n            i -= <span class=\"n\">1<\/span>\n        <span class=\"k\">if<\/span> i &gt;= <span class=\"n\">0<\/span>:\n            j = n - <span class=\"n\">1<\/span>\n            <span class=\"k\">while<\/span> nums[i] &gt;= nums[j]:                <span class=\"c\"># 2. 从右往左找第一个比 nums[i] 大的<\/span>\n                j -= <span class=\"n\">1<\/span>\n            nums[i], nums[j] = nums[j], nums[i]\n        lo, hi = i + <span class=\"n\">1<\/span>, n - <span class=\"n\">1<\/span>                        <span class=\"c\"># 3. 反转后缀<\/span>\n        <span class=\"k\">while<\/span> lo &lt; hi:\n            nums[lo], nums[hi] = nums[hi], nums[lo]\n            lo += <span class=\"n\">1<\/span>\n            hi -= <span class=\"n\">1<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">void<\/span> nextPermutation(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span> n = nums.length, i = n - <span class=\"n\">2<\/span>;\n        <span class=\"k\">while<\/span> (i &gt;= <span class=\"n\">0<\/span> &amp;&amp; nums[i] &gt;= nums[i + <span class=\"n\">1<\/span>]) {   <span class=\"c\">// 1. 从右往左找第一个升序位置<\/span>\n            i--;\n        }\n        <span class=\"k\">if<\/span> (i &gt;= <span class=\"n\">0<\/span>) {\n            <span class=\"k\">int<\/span> j = n - <span class=\"n\">1<\/span>;\n            <span class=\"k\">while<\/span> (nums[i] &gt;= nums[j]) {             <span class=\"c\">// 2. 从右往左找第一个比 nums[i] 大的<\/span>\n                j--;\n            }\n            swap(nums, i, j);\n        }\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> lo = i + <span class=\"n\">1<\/span>, hi = n - <span class=\"n\">1<\/span>; lo &lt; hi; lo++, hi--) {   <span class=\"c\">// 3. 反转后缀<\/span>\n            swap(nums, lo, hi);\n        }\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> swap(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> i, <span class=\"k\">int<\/span> j) {\n        <span class=\"k\">int<\/span> tmp = nums[i];\n        nums[i] = nums[j];\n        nums[j] = tmp;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"322","rank":50,"id":"322","title":"零钱兑换","difficulty":"中等","tags":["动态规划"],"freq":136,"link":"https://leetcode.cn/problems/coin-change/","desc":"用给定面额的硬币（每种无限个）凑出金额 amount，求最少硬币数，凑不出返回 -1。","libs":["java-20"],"html":"<h2>思路<\/h2>\n<ul><li>完全背包求最小个数。<code>dp[i]<\/code>：凑出金额 <code>i<\/code> 最少需要几枚硬币。<\/li><li>对每个金额 <code>i<\/code> 枚举最后一枚硬币 <code>coin<\/code>：<code>dp[i] = min(dp[i], dp[i - coin] + 1)<\/code>。<\/li><li><code>dp[0] = 0<\/code>；其余初始化成一个「不可能」的大数 <code>amount + 1<\/code>（最多也就 <code>amount<\/code> 枚 1 元硬币）。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>i - coin &lt; 0<\/code> 时这枚硬币用不上，跳过。<\/li><li>最后 <code>dp[amount]<\/code> 还是 <code>amount + 1<\/code> 说明无解，返回 -1。<\/li><li>Java 别用 <code>Integer.MAX_VALUE<\/code> 当初始值，<code>+ 1<\/code> 会溢出成负数。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">coinChange<\/span>(self, coins: List[int], amount: int) -&gt; int:\n        dp = [amount + <span class=\"n\">1<\/span>] * (amount + <span class=\"n\">1<\/span>)     <span class=\"c\"># amount + 1 表示凑不出<\/span>\n        dp[<span class=\"n\">0<\/span>] = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, amount + <span class=\"n\">1<\/span>):\n            <span class=\"k\">for<\/span> coin <span class=\"k\">in<\/span> coins:\n                <span class=\"k\">if<\/span> i - coin &gt;= <span class=\"n\">0<\/span>:\n                    dp[i] = min(dp[i], dp[i - coin] + <span class=\"n\">1<\/span>)\n        <span class=\"k\">return<\/span> -<span class=\"n\">1<\/span> <span class=\"k\">if<\/span> dp[amount] == amount + <span class=\"n\">1<\/span> <span class=\"k\">else<\/span> dp[amount]<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> coinChange(<span class=\"k\">int<\/span>[] coins, <span class=\"k\">int<\/span> amount) {\n        <span class=\"k\">int<\/span>[] dp = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[amount + <span class=\"n\">1<\/span>];\n        <span class=\"t\">Arrays<\/span>.fill(dp, amount + <span class=\"n\">1<\/span>);         <span class=\"c\">// amount + 1 表示凑不出<\/span>\n        dp[<span class=\"n\">0<\/span>] = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt;= amount; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> coin : coins) {\n                <span class=\"k\">if<\/span> (i - coin &lt; <span class=\"n\">0<\/span>) <span class=\"k\">continue<\/span>;\n                dp[i] = <span class=\"t\">Math<\/span>.min(dp[i], dp[i - coin] + <span class=\"n\">1<\/span>);\n            }\n        }\n        <span class=\"k\">return<\/span> dp[amount] == amount + <span class=\"n\">1<\/span> ? -<span class=\"n\">1<\/span> : dp[amount];\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(amount × 硬币种数)，空间 O(amount)。<\/p>"},{"key":"76","rank":51,"id":"76","title":"最小覆盖子串","difficulty":"困难","tags":["滑动窗口","哈希表"],"freq":136,"link":"https://leetcode.cn/problems/minimum-window-substring/","desc":"在 s 中找出包含 t 全部字符（含重复）的最短子串，没有则返回空串。","libs":["python-2","python-7","java-15","java-19","java-22"],"html":"<h2>思路<\/h2>\n<ul><li>滑动窗口 + 计数，窗口左闭右开 <code>[left, right)<\/code>。两张表：<code>need<\/code> 记 <code>t<\/code> 里每个字符要几个，<code>window<\/code> 记窗口里这些字符有几个。<\/li><li><code>valid<\/code>：有多少<strong>种<\/strong>字符的数量已经达标。<code>valid == need.size()<\/code> 时窗口覆盖了 <code>t<\/code>。<\/li><li>右扩：字符 <code>c<\/code> 进窗口，若在 <code>need<\/code> 里则计数加一，刚好等于需要的数量时 <code>valid++<\/code>。<\/li><li>窗口合法时不断左缩：先更新最短答案，再把左边字符 <code>d<\/code> 移出——移出前数量刚好等于需要的数量，则 <code>valid--<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>Java 里 <code>window.get(c)<\/code> 和 <code>need.get(c)<\/code> 都是 <code>Integer<\/code> 对象，必须用 <code>.equals()<\/code> 比较；<code>==<\/code> 比的是引用，只有 -128~127 走缓存，数量一大就错。<\/li><li>左缩时顺序：<strong>先判断 <code>valid<\/code> 要不要减，再把数量减一<\/strong>。<\/li><li>更新答案要在左缩之前（此时窗口还合法），长度是 <code>right - left<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">minWindow<\/span>(self, s: str, t: str) -&gt; str:\n        need = Counter(t)                    <span class=\"c\"># t 中每个字符需要几个<\/span>\n        window = defaultdict(int)            <span class=\"c\"># 窗口中这些字符有几个<\/span>\n        left = right = valid = <span class=\"n\">0<\/span>             <span class=\"c\"># valid：数量已达标的字符种数<\/span>\n        start, length = <span class=\"n\">0<\/span>, inf\n        <span class=\"k\">while<\/span> right &lt; len(s):\n            c = s[right]                     <span class=\"c\"># 右扩<\/span>\n            right += <span class=\"n\">1<\/span>\n            <span class=\"k\">if<\/span> c <span class=\"k\">in<\/span> need:\n                window[c] += <span class=\"n\">1<\/span>\n                <span class=\"k\">if<\/span> window[c] == need[c]:\n                    valid += <span class=\"n\">1<\/span>\n            <span class=\"k\">while<\/span> valid == len(need):        <span class=\"c\"># 窗口合法就左缩<\/span>\n                <span class=\"k\">if<\/span> right - left &lt; length:\n                    start, length = left, right - left\n                d = s[left]\n                left += <span class=\"n\">1<\/span>\n                <span class=\"k\">if<\/span> d <span class=\"k\">in<\/span> need:\n                    <span class=\"k\">if<\/span> window[d] == need[d]:\n                        valid -= <span class=\"n\">1<\/span>\n                    window[d] -= <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s\">&quot;&quot;<\/span> <span class=\"k\">if<\/span> length == inf <span class=\"k\">else<\/span> s[start:start + length]<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">String<\/span> minWindow(<span class=\"t\">String<\/span> s, <span class=\"t\">String<\/span> t) {\n        <span class=\"t\">Map<\/span>&lt;<span class=\"t\">Character<\/span>, <span class=\"t\">Integer<\/span>&gt; need = <span class=\"k\">new<\/span> <span class=\"t\">HashMap<\/span>&lt;&gt;();      <span class=\"c\">// t 中每个字符需要几个<\/span>\n        <span class=\"t\">Map<\/span>&lt;<span class=\"t\">Character<\/span>, <span class=\"t\">Integer<\/span>&gt; window = <span class=\"k\">new<\/span> <span class=\"t\">HashMap<\/span>&lt;&gt;();    <span class=\"c\">// 窗口中这些字符有几个<\/span>\n        <span class=\"k\">for<\/span> (<span class=\"k\">char<\/span> c : t.toCharArray()) {\n            need.put(c, need.getOrDefault(c, <span class=\"n\">0<\/span>) + <span class=\"n\">1<\/span>);\n        }\n        <span class=\"k\">int<\/span> left = <span class=\"n\">0<\/span>, right = <span class=\"n\">0<\/span>, valid = <span class=\"n\">0<\/span>;                  <span class=\"c\">// valid：数量已达标的字符种数<\/span>\n        <span class=\"k\">int<\/span> start = <span class=\"n\">0<\/span>, len = <span class=\"t\">Integer<\/span>.MAX_VALUE;\n        <span class=\"k\">while<\/span> (right &lt; s.length()) {\n            <span class=\"k\">char<\/span> c = s.charAt(right++);                      <span class=\"c\">// 右扩<\/span>\n            <span class=\"k\">if<\/span> (need.containsKey(c)) {\n                window.put(c, window.getOrDefault(c, <span class=\"n\">0<\/span>) + <span class=\"n\">1<\/span>);\n                <span class=\"k\">if<\/span> (window.get(c).equals(need.get(c))) valid++;\n            }\n            <span class=\"k\">while<\/span> (valid == need.size()) {                   <span class=\"c\">// 窗口合法就左缩<\/span>\n                <span class=\"k\">if<\/span> (right - left &lt; len) {\n                    start = left;\n                    len = right - left;\n                }\n                <span class=\"k\">char<\/span> d = s.charAt(left++);\n                <span class=\"k\">if<\/span> (need.containsKey(d)) {\n                    <span class=\"k\">if<\/span> (window.get(d).equals(need.get(d))) valid--;\n                    window.put(d, window.get(d) - <span class=\"n\">1<\/span>);\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> len == <span class=\"t\">Integer<\/span>.MAX_VALUE ? <span class=\"s\">&quot;&quot;<\/span> : s.substring(start, start + len);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(m + n)，空间 O(字符集)。<\/p>"},{"key":"70","rank":52,"id":"70","title":"爬楼梯","difficulty":"简单","tags":["动态规划"],"freq":135,"link":"https://leetcode.cn/problems/climbing-stairs/","desc":"每次可以爬 1 或 2 个台阶，求爬到第 n 阶有多少种不同的方法。","libs":["python-6"],"html":"<h2>思路<\/h2>\n<ul><li>到第 <code>n<\/code> 阶的最后一步要么从 <code>n - 1<\/code> 上来，要么从 <code>n - 2<\/code> 上来：<code>f(n) = f(n-1) + f(n-2)<\/code>，就是斐波那契。<\/li><li>边界：<code>f(1) = 1<\/code>，<code>f(2) = 2<\/code>。<\/li><li>只依赖前两项，用两个变量滚动即可；记忆化递归是同一个式子的自顶向下写法。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>f(2) = 2<\/code>（1+1 或直接 2），和标准斐波那契的起点不同。<\/li><li>不加记忆化的暴力递归是指数级。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：滚动变量<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"pyt
