const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const SEED = DATA.seed || {};                             // 仓库里 progress.json 的内容，作为初始值
let progress = store.get('ct100.progress', {});          // key -> { l: 0|1|2|3, t: 'YYYY-MM-DD' }，覆盖 SEED
const ui = Object.assign({ tag: '', level: 'all', sort: 'rank', recall: false, lang: 'python' }, store.get('ct100.ui', {}));
let query = '', cur = null, revealed = false;

const entryOf = key => progress[key] || SEED[key];
const levelOf = key => (entryOf(key) && entryOf(key).l) || 0;
const saveUi = () => store.set('ct100.ui', ui);

function visible() {
  const q = query.trim().toLowerCase();
  let list = P.filter(p =>
    (!ui.tag || p.tags.includes(ui.tag)) &&
    (ui.level === 'all' || levelOf(p.key) === +ui.level) &&
    (!q || (p.id + ' ' + p.title + ' ' + p.tags.join(' ')).toLowerCase().includes(q)));
  if (ui.sort === 'tag') {
    const order = tagOrder();
    list = list.slice().sort((a, b) => order.indexOf(a.tags[0]) - order.indexOf(b.tags[0]) || a.rank - b.rank);
  } else if (ui.sort === 'level') {
    const w = [2, 0, 1, 3];                                // 生疏 → 模糊 → 未标 → 熟练
    list = list.slice().sort((a, b) => w[levelOf(a.key)] - w[levelOf(b.key)] || a.rank - b.rank);
  }
  return list;
}

function tagOrder() {
  const count = {};
  P.forEach(p => { count[p.tags[0]] = (count[p.tags[0]] || 0) + 1; });
  return Object.keys(count).sort((a, b) => count[b] - count[a]);
}

function renderSide() {
  const counts = [0, 0, 0, 0];
  P.forEach(p => counts[levelOf(p.key)]++);
  $('bar').innerHTML = [3, 2, 1].map(l => `<i class="l${l}" style="width:${counts[l] / P.length * 100}%"></i>`).join('');
  $('bar').title = LEVELS.map((n, l) => `${n} ${counts[l]}`).join(' · ');
  const chip = (v, name, n) => `<button type="button" data-level="${v}" class="${String(ui.level) === String(v) ? 'on' : ''}">${name}<b>${n}</b></button>`;
  $('chips').innerHTML = chip('all', '全部', P.length) + [1, 2, 0, 3].map(l => chip(l, LEVELS[l], counts[l])).join('');

  $('more').classList.toggle('filtered', !!ui.tag || ui.level !== 'all' || ui.sort !== 'rank');
  const list = visible();
  let html = '', group = null;
  list.forEach((p, n) => {
    if (ui.sort === 'tag' && p.tags[0] !== group) {
      group = p.tags[0];
      html += `<li class="group">${esc(group)}</li>`;
    }
    html += `<li class="item${p.key === cur ? ' active' : ''}" data-key="${esc(p.key)}">
      <span class="no">${n + 1}</span><span class="tt">${esc(p.title)}</span>
      <span class="dot l${levelOf(p.key)}"></span></li>`;
  });
  $('list').innerHTML = html || '<li class="empty">无结果</li>';
}

function renderMain() {
  const main = $('main');
  if (cur === 'libs') {
    const toc = lang => DATA.libs.sections.filter(s => s.lang === lang)
      .map(s => `<a href="#/libs/${s.id}">${esc(s.name)}</a>`).join('');
    main.innerHTML = `<div class="doc"><button class="back" type="button" data-act="back">← 列表</button>
      <div class="toc">Python：${toc('python')}</div><div class="toc">Java：${toc('java')}</div>
      <div class="note libs-doc">${DATA.libs.html}</div></div>`;
    addCopy();
    return;
  }
  const p = byKey[cur];
  if (!p) { main.innerHTML = '<div class="doc welcome"></div>'; return; }
  const list = visible(), i = list.findIndex(x => x.key === cur), lv = levelOf(p.key);
  const hidden = ui.recall && !revealed;
  const prev = list[i - 1], next = i >= 0 ? list[i + 1] : null;
  main.innerHTML = `<div class="doc">
    <button class="back" type="button" data-act="back">← 列表</button>
    <div class="head">
      <h2 class="title">${esc(p.title)}</h2>
      <a class="solve" href="${esc(p.link)}" target="_blank" rel="noopener">去做题 ↗</a>
    </div>
    <div class="tags">
      <span class="lv${DIFF[p.difficulty]}">${esc(p.difficulty)}</span>
      ${p.tags.map(t => `<span>${esc(t)}</span>`).join('')}
    </div>
    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
    ${hidden ? '<button class="reveal" type="button" data-act="reveal">显示</button>' : `<div class="note">${p.html}</div>`}
    <div class="end">
      <div class="seg">${[1, 2, 3].map(l => `<button type="button" data-mark="${l}" class="l${l}${lv === l ? ' on' : ''}">${LEVELS[l]}</button>`).join('')}</div>
      <nav class="pager">
        ${prev ? `<a href="#/${esc(prev.key)}">← ${esc(prev.title)}</a>` : ''}
        ${next ? `<a class="nx" href="#/${esc(next.key)}">${esc(next.title)} →</a>` : ''}
      </nav>
    </div>
  </div>`;
  addCopy();
}

function addCopy() {
  $('main').querySelectorAll('.note .code').forEach(box => {
    let bar = box.querySelector('.langs');
    if (!bar) { bar = document.createElement('div'); bar.className = 'langs'; box.prepend(bar); }
    bar.insertAdjacentHTML('beforeend', '<button type="button" class="copy" data-act="copy">复制</button>');
  });
}
function render() { renderSide(); renderMain(); }

function route() {
  const parts = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
  const key = parts[0] || null;
  if (key !== cur) revealed = false;
  cur = key;
  $('app').classList.toggle('detail', !!cur);
  document.title = byKey[cur] ? `${byKey[cur].title} · CodeTop 100` : cur === 'libs' ? '常用库 · CodeTop 100' : 'CodeTop 100';
  if (byKey[cur]) { ui.last = cur; saveUi(); }
  render();
  if (cur === 'libs' && parts[1]) {
    const el = $('lib-' + parts[1]);
    if (el) el.scrollIntoView();
  } else {
    $('main').scrollTop = 0;
  }
  const active = document.querySelector('.item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

const go = key => { location.hash = key ? '#/' + key : ''; };
function step(d) {
  const list = visible(), i = list.findIndex(x => x.key === cur);
  const next = list[i < 0 ? 0 : i + d];
  if (next) go(next.key);
}
function mark(l) {
  if (!byKey[cur]) return;
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const t = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  if (l && levelOf(cur) !== l) progress[cur] = { l, t };
  else if (SEED[cur]) progress[cur] = { l: 0, t };        // 取消标记：要盖住仓库里的初始值
  else delete progress[cur];
  store.set('ct100.progress', progress);
  render();
}
function setLang(lang) {
  ui.lang = lang; saveUi();
  document.body.dataset.lang = lang;
  if (byKey[cur]) { const top = $('main').scrollTop; renderMain(); $('main').scrollTop = top; }
}
function randomPick() {
  const list = visible().filter(p => p.key !== cur);
  if (list.length) go(list[Math.floor(Math.random() * list.length)].key);
}

// 事件
$('list').addEventListener('click', e => { const li = e.target.closest('.item'); if (li) go(li.dataset.key); });
$('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { ui.level = b.dataset.level; saveUi(); render(); } });
$('q').addEventListener('input', e => { query = e.target.value; renderSide(); $('list').scrollTop = 0; });
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const f = visible()[0]; if (f) { go(f.key); e.target.blur(); } }
  else if (e.key === 'Escape' && e.target.value) { e.stopPropagation(); e.target.value = query = ''; renderSide(); }
});
$('tag').addEventListener('change', e => { ui.tag = e.target.value; saveUi(); render(); });
$('sort').addEventListener('change', e => { ui.sort = e.target.value; saveUi(); render(); });
$('recall').addEventListener('change', e => { ui.recall = e.target.checked; revealed = false; saveUi(); renderMain(); });
$('more').addEventListener('click', () => { const h = $('panel').hidden = !$('panel').hidden; $('more').classList.toggle('on', !h); });
$('random').addEventListener('click', randomPick);
$('main').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mark) mark(+b.dataset.mark);
  else if (b.dataset.setLang) setLang(b.dataset.setLang);
  else if (b.dataset.act === 'prev') step(-1);
  else if (b.dataset.act === 'next') step(1);
  else if (b.dataset.act === 'back') go(null);
  else if (b.dataset.act === 'copy') {
    const pre = [...b.closest('.code').querySelectorAll('pre')].find(x => x.offsetParent);
    const done = () => { b.textContent = '已复制'; setTimeout(() => { b.textContent = '复制'; }, 1200); };
    const legacy = () => { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      if (document.execCommand('copy')) done(); sel.removeAllRanges(); };
    if (navigator.clipboard) navigator.clipboard.writeText(pre.innerText).then(done, legacy); else legacy();
  }
  else if (b.dataset.act === 'reveal') { revealed = true; renderMain(); }
});
$('export').addEventListener('click', () => {
  const merged = {};
  for (const p of P) if (levelOf(p.key)) merged[p.key] = entryOf(p.key);
  const blob = new Blob([JSON.stringify({ version: 1, progress: merged }, null, 2) + '\n'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'progress.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    if (!obj || typeof obj.progress !== 'object') throw new Error('格式不对');
    progress = {};
    for (const p of P) {                                  // 文件里没有的题视为未标记
      const e = obj.progress[p.key];
      if (e && e.l) progress[p.key] = e;
      else if (SEED[p.key]) progress[p.key] = { l: 0, t: '' };
    }
    store.set('ct100.progress', progress); render();
  } catch (err) { alert('导入失败：' + err.message); }
  e.target.value = '';
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'checkbox';
  if (typing) { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key;
  if (k === 'j' || k === 'ArrowRight') step(1);
  else if (k === 'k' || k === 'ArrowLeft') step(-1);
  else if (k === '1' || k === '2' || k === '3') mark(+k);
  else if (k === '0') mark(0);
  else if (k === 'r') randomPick();
  else if (k === 'l') setLang(ui.lang === 'python' ? 'java' : 'python');
  else if (k === '/') { e.preventDefault(); $('q').focus(); }
  else if (k === ' ' && ui.recall && !revealed && byKey[cur]) { e.preventDefault(); revealed = true; renderMain(); }
});
window.addEventListener('hashchange', route);

// 初始化
$('tag').innerHTML = '<option value="">全部分类</option>' +
  [...new Set(P.flatMap(p => p.tags))].map(t => [t, P.filter(p => p.tags.includes(t)).length])
    .sort((a, b) => b[1] - a[1]).map(([t, n]) => `<option value="${esc(t)}">${esc(t)}（${n}）</option>`).join('');
$('tag').value = ui.tag; $('sort').value = ui.sort; $('recall').checked = ui.recall;
document.body.dataset.lang = ui.lang;
if (!location.hash && window.matchMedia('(min-width: 821px)').matches && P.length) history.replaceState(null, '', '#/' + (byKey[ui.last] ? ui.last : visible()[0]?.key));
route();
</script>
</body>
</html>
