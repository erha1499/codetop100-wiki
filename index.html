 跳到 <code>a<\/code>（交换后它在后面）。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>递归里要先用 <code>newHead.next<\/code> 求出后面的结果，再改 <code>newHead.next<\/code>，否则后面的链表丢了。<\/li><li>迭代的三步改指针有先后顺序，画一下 <code>pre → a → b → 后面<\/code> 再写。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：递归<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">swapPairs<\/span>(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> head <span class=\"k\">or<\/span> <span class=\"k\">not<\/span> head.next:\n            <span class=\"k\">return<\/span> head\n        new_head = head.next\n        head.next = self.swapPairs(new_head.next)    <span class=\"c\"># 原头变成这组的尾，接上后面的结果<\/span>\n        new_head.next = head\n        <span class=\"k\">return<\/span> new_head<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> swapPairs(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"k\">if<\/span> (head == <span class=\"k\">null<\/span> || head.next == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> head;\n        <span class=\"t\">ListNode<\/span> newHead = head.next;\n        head.next = swapPairs(newHead.next);         <span class=\"c\">// 原头变成这组的尾，接上后面的结果<\/span>\n        newHead.next = head;\n        <span class=\"k\">return<\/span> newHead;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：迭代<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">swapPairs<\/span>(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:\n        dummy = ListNode(-<span class=\"n\">1<\/span>, head)\n        pre = dummy\n        <span class=\"k\">while<\/span> pre.next <span class=\"k\">and<\/span> pre.next.next:\n            a, b = pre.next, pre.next.next           <span class=\"c\"># pre -&gt; a -&gt; b -&gt; ...<\/span>\n            a.next = b.next\n            b.next = a\n            pre.next = b                             <span class=\"c\"># pre -&gt; b -&gt; a -&gt; ...<\/span>\n            pre = a\n        <span class=\"k\">return<\/span> dummy.next<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> swapPairs(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"t\">ListNode<\/span> dummy = <span class=\"k\">new<\/span> <span class=\"t\">ListNode<\/span>(-<span class=\"n\">1<\/span>, head), pre = dummy;\n        <span class=\"k\">while<\/span> (pre.next != <span class=\"k\">null<\/span> &amp;&amp; pre.next.next != <span class=\"k\">null<\/span>) {\n            <span class=\"t\">ListNode<\/span> a = pre.next, b = a.next;       <span class=\"c\">// pre -&gt; a -&gt; b -&gt; ...<\/span>\n            a.next = b.next;\n            b.next = a;\n            pre.next = b;                            <span class=\"c\">// pre -&gt; b -&gt; a -&gt; ...<\/span>\n            pre = a;\n        }\n        <span class=\"k\">return<\/span> dummy.next;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)；空间递归 O(n)，迭代 O(1)。<\/p>"},{"key":"139","rank":92,"id":"139","title":"单词拆分","difficulty":"中等","tags":["动态规划","字符串","哈希表"],"freq":72,"link":"https://leetcode.cn/problems/word-break/","desc":"判断字符串 s 能否被拆分成若干个字典中的单词（单词可以重复使用）。","libs":["python-6","java-15","java-20"],"html":"<h2>思路<\/h2>\n<ul><li>拆分型 DP。<\/li><li><strong>自顶向下<\/strong>：<code>dp(i)<\/code> = 后缀 <code>s[i:]<\/code> 能否被拆分。从 <code>i<\/code> 开始枚举第一个单词的长度，如果 <code>s[i, i+len)<\/code> 在字典里并且 <code>dp(i + len)<\/code> 为真，就成立。<code>i<\/code> 走到末尾返回 true。<\/li><li><strong>自底向上<\/strong>：<code>dp[i]<\/code> = 前缀 <code>s[:i]<\/code> 能否被拆分。枚举最后一个单词的起点 <code>j<\/code>：<code>dp[j]<\/code> 为真且 <code>s[j:i]<\/code> 在字典里，则 <code>dp[i]<\/code> 为真。<code>dp[0] = true<\/code>。<\/li><li>字典先转成 <code>HashSet<\/code>，查询 O(1)。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>不加备忘录会重复递归同一个位置，超时。<\/li><li>Java 的备忘录要区分三种状态（未计算 / false / true），不能只用 boolean 数组。<\/li><li>只问「能不能」，找到一种拆法就可以返回。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：记忆化递归<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">wordBreak<\/span>(self, s: str, wordDict: List[str]) -&gt; bool:\n        word_set = set(wordDict)\n\n        @cache\n        <span class=\"k\">def<\/span> <span class=\"f\">dp<\/span>(i):                           <span class=\"c\"># s[i:] 能否被拆分<\/span>\n            <span class=\"k\">if<\/span> i == len(s):\n                <span class=\"k\">return<\/span> <span class=\"k\">True<\/span>\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(i + <span class=\"n\">1<\/span>, len(s) + <span class=\"n\">1<\/span>):\n                <span class=\"k\">if<\/span> s[i:j] <span class=\"k\">in<\/span> word_set <span class=\"k\">and<\/span> dp(j):\n                    <span class=\"k\">return<\/span> <span class=\"k\">True<\/span>\n            <span class=\"k\">return<\/span> <span class=\"k\">False<\/span>\n\n        <span class=\"k\">return<\/span> dp(<span class=\"n\">0<\/span>)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span>[] memo;                      <span class=\"c\">// -1 未计算，0 false，1 true<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Set<\/span>&lt;<span class=\"t\">String<\/span>&gt; wordSet = <span class=\"k\">new<\/span> <span class=\"t\">HashSet<\/span>&lt;&gt;();\n\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> wordBreak(<span class=\"t\">String<\/span> s, <span class=\"t\">List<\/span>&lt;<span class=\"t\">String<\/span>&gt; wordDict) {\n        memo = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[s.length()];\n        <span class=\"t\">Arrays<\/span>.fill(memo, -<span class=\"n\">1<\/span>);\n        wordSet.addAll(wordDict);\n        <span class=\"k\">return<\/span> dp(s, <span class=\"n\">0<\/span>);\n    }\n\n    <span class=\"c\">// s[i..] 能否被拆分<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">boolean<\/span> dp(<span class=\"t\">String<\/span> s, <span class=\"k\">int<\/span> i) {\n        <span class=\"k\">if<\/span> (i == s.length()) <span class=\"k\">return<\/span> <span class=\"k\">true<\/span>;\n        <span class=\"k\">if<\/span> (memo[i] != -<span class=\"n\">1<\/span>) <span class=\"k\">return<\/span> memo[i] == <span class=\"n\">1<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> len = <span class=\"n\">1<\/span>; i + len &lt;= s.length(); len++) {\n            <span class=\"k\">if<\/span> (wordSet.contains(s.substring(i, i + len)) &amp;&amp; dp(s, i + len)) {\n                memo[i] = <span class=\"n\">1<\/span>;\n                <span class=\"k\">return<\/span> <span class=\"k\">true<\/span>;\n            }\n        }\n        memo[i] = <span class=\"n\">0<\/span>;\n        <span class=\"k\">return<\/span> <span class=\"k\">false<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：自底向上<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">wordBreak<\/span>(self, s: str, wordDict: List[str]) -&gt; bool:\n        word_set = set(wordDict)\n        n = len(s)\n        dp = [<span class=\"k\">True<\/span>] + [<span class=\"k\">False<\/span>] * n            <span class=\"c\"># dp[i]：s[:i] 能否被拆分<\/span>\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, n + <span class=\"n\">1<\/span>):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(i):\n                <span class=\"k\">if<\/span> dp[j] <span class=\"k\">and<\/span> s[j:i] <span class=\"k\">in<\/span> word_set:\n                    dp[i] = <span class=\"k\">True<\/span>\n                    <span class=\"k\">break<\/span>\n        <span class=\"k\">return<\/span> dp[n]<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> wordBreak(<span class=\"t\">String<\/span> s, <span class=\"t\">List<\/span>&lt;<span class=\"t\">String<\/span>&gt; wordDict) {\n        <span class=\"t\">Set<\/span>&lt;<span class=\"t\">String<\/span>&gt; wordSet = <span class=\"k\">new<\/span> <span class=\"t\">HashSet<\/span>&lt;&gt;(wordDict);\n        <span class=\"k\">int<\/span> n = s.length();\n        <span class=\"k\">boolean<\/span>[] dp = <span class=\"k\">new<\/span> <span class=\"k\">boolean<\/span>[n + <span class=\"n\">1<\/span>];   <span class=\"c\">// dp[i]：s 的前 i 个字符能否被拆分<\/span>\n        dp[<span class=\"n\">0<\/span>] = <span class=\"k\">true<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt;= n; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">0<\/span>; j &lt; i; j++) {\n                <span class=\"k\">if<\/span> (dp[j] &amp;&amp; wordSet.contains(s.substring(j, i))) {\n                    dp[i] = <span class=\"k\">true<\/span>;\n                    <span class=\"k\">break<\/span>;\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> dp[n];\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n²) 个状态转移（每次取子串另算 O(n)），空间 O(n)。<\/p>"},{"key":"112","rank":93,"id":"112","title":"路径总和","difficulty":"简单","tags":["二叉树","DFS"],"freq":72,"link":"https://leetcode.cn/problems/path-sum/","desc":"判断二叉树中是否存在一条从根到叶子的路径，节点值之和等于 targetSum。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>每往下走一步，把目标减去当前节点的值，问题变成「在子树里找和为剩余值的根到叶子路径」。<\/li><li>走到<strong>叶子<\/strong>时，看剩余值是否正好等于叶子的值。<\/li><li>左右子树有一边成立即可。<\/li><li>要输出所有路径就是 <a href=\"#/113\">113<\/a>，那题需要 <code>path<\/code> + 回溯。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>必须在叶子处判断：路径走到一半和就够了不算。<\/li><li>空树返回 false（即使 <code>targetSum<\/code> 是 0）。<\/li><li>节点值可能为负，不能因为超过目标就提前剪枝。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">hasPathSum<\/span>(self, root: Optional[TreeNode], targetSum: int) -&gt; bool:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root:\n            <span class=\"k\">return<\/span> <span class=\"k\">False<\/span>\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root.left <span class=\"k\">and<\/span> <span class=\"k\">not<\/span> root.right:         <span class=\"c\"># 叶子<\/span>\n            <span class=\"k\">return<\/span> root.val == targetSum\n        rest = targetSum - root.val\n        <span class=\"k\">return<\/span> self.hasPathSum(root.left, rest) <span class=\"k\">or<\/span> self.hasPathSum(root.right, rest)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> hasPathSum(<span class=\"t\">TreeNode<\/span> root, <span class=\"k\">int<\/span> targetSum) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> <span class=\"k\">false<\/span>;\n        <span class=\"k\">if<\/span> (root.left == <span class=\"k\">null<\/span> &amp;&amp; root.right == <span class=\"k\">null<\/span>) {   <span class=\"c\">// 叶子<\/span>\n            <span class=\"k\">return<\/span> root.val == targetSum;\n        }\n        <span class=\"k\">int<\/span> rest = targetSum - root.val;\n        <span class=\"k\">return<\/span> hasPathSum(root.left, rest) || hasPathSum(root.right, rest);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(h)。<\/p>"},{"key":"718","rank":94,"id":"718","title":"最长重复子数组","difficulty":"中等","tags":["动态规划"],"freq":71,"link":"https://leetcode.cn/problems/maximum-length-of-repeated-subarray/","desc":"求两个整数数组中最长的公共子数组（要求连续）的长度。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li><code>dp[i][j]<\/code>：<strong>以 <code>nums1[i-1]<\/code> 和 <code>nums2[j-1]<\/code> 结尾<\/strong>的最长公共子数组长度。<\/li><li>这两个数相等：<code>dp[i][j] = dp[i-1][j-1] + 1<\/code>；不相等：以它们结尾的公共子数组不存在，<code>dp[i][j] = 0<\/code>。<\/li><li>答案是整张表里的最大值。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>和 <a href=\"#/1143\">1143 最长公共子序列<\/a> 的区别：子数组必须连续，所以不相等时是 <strong>0<\/strong>，而不是 <code>max(上, 左)<\/code>；答案也不是 <code>dp[m][n]<\/code>，要取全表最大值。<\/li><li><code>dp<\/code> 多开一行一列，下标 <code>i<\/code> 对应元素 <code>i - 1<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">findLength<\/span>(self, nums1: List[int], nums2: List[int]) -&gt; int:\n        m, n = len(nums1), len(nums2)\n        dp = [[<span class=\"n\">0<\/span>] * (n + <span class=\"n\">1<\/span>) <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(m + <span class=\"n\">1<\/span>)]\n        res = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, m + <span class=\"n\">1<\/span>):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, n + <span class=\"n\">1<\/span>):\n                <span class=\"k\">if<\/span> nums1[i - <span class=\"n\">1<\/span>] == nums2[j - <span class=\"n\">1<\/span>]:\n                    dp[i][j] = dp[i - <span class=\"n\">1<\/span>][j - <span class=\"n\">1<\/span>] + <span class=\"n\">1<\/span>\n                    res = max(res, dp[i][j])\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> findLength(<span class=\"k\">int<\/span>[] nums1, <span class=\"k\">int<\/span>[] nums2) {\n        <span class=\"k\">int<\/span> m = nums1.length, n = nums2.length;\n        <span class=\"k\">int<\/span>[][] dp = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[m + <span class=\"n\">1<\/span>][n + <span class=\"n\">1<\/span>];\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt;= m; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">1<\/span>; j &lt;= n; j++) {\n                <span class=\"k\">if<\/span> (nums1[i - <span class=\"n\">1<\/span>] == nums2[j - <span class=\"n\">1<\/span>]) {\n                    dp[i][j] = dp[i - <span class=\"n\">1<\/span>][j - <span class=\"n\">1<\/span>] + <span class=\"n\">1<\/span>;\n                    res = <span class=\"t\">Math<\/span>.max(res, dp[i][j]);\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(mn)，空间 O(mn)（可压成一维，内层要倒序遍历）。<\/p>"},{"key":"227","rank":95,"id":"227","title":"基本计算器 II","difficulty":"中等","tags":["栈","字符串"],"freq":70,"link":"https://leetcode.cn/problems/basic-calculator-ii/","desc":"计算只含非负整数、+ - * / 和空格的表达式的值，除法向零取整。","libs":["java-12","java-19"],"html":"<h2>思路<\/h2>\n<ul><li><strong>双栈（通用模板）<\/strong>：<code>nums<\/code> 放数字和中间结果，<code>ops<\/code> 放还没执行的运算符。<ul><li>数字：连续读完整个多位数，压入 <code>nums<\/code>；<\/li><li>运算符：<strong>先把栈顶优先级 ≥ 它的运算都算掉<\/strong>，再把它入栈；<\/li><li><code>(<\/code>：直接入 <code>ops<\/code> 当边界；<code>)<\/code>：一直算到遇到 <code>(<\/code>，再把 <code>(<\/code> 弹掉；<\/li><li>遍历完把 <code>ops<\/code> 里剩下的算完。<\/li><li>本题没有括号，保留括号处理是为了能直接复用到 224、772。<\/li><\/ul><\/li><li><strong>单栈（只针对本题）<\/strong>：记住每个数<strong>前面<\/strong>的运算符 <code>op<\/code>。数读完时：<code>+<\/code> 压入 <code>num<\/code>，<code>-<\/code> 压入 <code>-num<\/code>，<code>*<\/code> <code>/<\/code> 把栈顶弹出来和 <code>num<\/code> 算完再压回去。最后把栈里的数加起来。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>优先级比较用 <code>&gt;=<\/code> 不是 <code>&gt;<\/code>：同级运算要从左往右算（<code>8/4/2<\/code>）。<\/li><li><code>nums<\/code> 先压一个 0，处理表达式以 <code>-<\/code> 开头的情况；<code>(<\/code> 后面紧跟 <code>+<\/code> / <code>-<\/code> 时同样补 0。<\/li><li>除法向零取整：Python 的 <code>//<\/code> 是向下取整（<code>-3 // 2 == -2<\/code>），要自己处理符号或用 <code>int(a / b)<\/code>；Java 的 <code>/<\/code> 本身就向零取整。<\/li><li>单栈写法里，最后一个数后面没有运算符了，要在末尾补一个 <code>+<\/code> 触发最后一次结算。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：双栈<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">calculate<\/span>(self, s: str) -&gt; int:\n        s = s.replace(<span class=\"s\">&quot; &quot;<\/span>, <span class=\"s\">&quot;&quot;<\/span>)\n        n = len(s)\n        priority = {<span class=\"s\">&quot;+&quot;<\/span>: <span class=\"n\">1<\/span>, <span class=\"s\">&quot;-&quot;<\/span>: <span class=\"n\">1<\/span>, <span class=\"s\">&quot;*&quot;<\/span>: <span class=\"n\">2<\/span>, <span class=\"s\">&quot;/&quot;<\/span>: <span class=\"n\">2<\/span>}\n        nums = [<span class=\"n\">0<\/span>]                           <span class=\"c\"># 补 0，处理表达式开头的正负号<\/span>\n        ops = []\n\n        <span class=\"k\">def<\/span> <span class=\"f\">calc<\/span>():\n            b, a = nums.pop(), nums.pop()\n            op = ops.pop()\n            <span class=\"k\">if<\/span> op == <span class=\"s\">&quot;+&quot;<\/span>:\n                res = a + b\n            <span class=\"k\">elif<\/span> op == <span class=\"s\">&quot;-&quot;<\/span>:\n                res = a - b\n            <span class=\"k\">elif<\/span> op == <span class=\"s\">&quot;*&quot;<\/span>:\n                res = a * b\n            <span class=\"k\">else<\/span>:\n                q = abs(a) // abs(b)         <span class=\"c\"># 向零取整<\/span>\n                res = -q <span class=\"k\">if<\/span> (a &lt; <span class=\"n\">0<\/span>) != (b &lt; <span class=\"n\">0<\/span>) <span class=\"k\">else<\/span> q\n            nums.append(res)\n\n        i = <span class=\"n\">0<\/span>\n        <span class=\"k\">while<\/span> i &lt; n:\n            c = s[i]\n            <span class=\"k\">if<\/span> c.isdigit():\n                num = <span class=\"n\">0<\/span>\n                <span class=\"k\">while<\/span> i &lt; n <span class=\"k\">and<\/span> s[i].isdigit():\n                    num = num * <span class=\"n\">10<\/span> + int(s[i])\n                    i += <span class=\"n\">1<\/span>\n                nums.append(num)\n                <span class=\"k\">continue<\/span>                     <span class=\"c\"># i 已经指向数字之后<\/span>\n            <span class=\"k\">if<\/span> c == <span class=\"s\">&quot;(&quot;<\/span>:\n                ops.append(c)\n            <span class=\"k\">elif<\/span> c == <span class=\"s\">&quot;)&quot;<\/span>:\n                <span class=\"k\">while<\/span> ops[-<span class=\"n\">1<\/span>] != <span class=\"s\">&quot;(&quot;<\/span>:\n                    calc()\n                ops.pop()\n            <span class=\"k\">else<\/span>:\n                <span class=\"k\">if<\/span> c <span class=\"k\">in<\/span> <span class=\"s\">&quot;+-&quot;<\/span> <span class=\"k\">and<\/span> i &gt; <span class=\"n\">0<\/span> <span class=\"k\">and<\/span> s[i - <span class=\"n\">1<\/span>] == <span class=\"s\">&quot;(&quot;<\/span>:\n                    nums.append(<span class=\"n\">0<\/span>)\n                <span class=\"k\">while<\/span> ops <span class=\"k\">and<\/span> ops[-<span class=\"n\">1<\/span>] != <span class=\"s\">&quot;(&quot;<\/span> <span class=\"k\">and<\/span> priority[ops[-<span class=\"n\">1<\/span>]] &gt;= priority[c]:\n                    calc()                   <span class=\"c\"># 先算掉优先级更高或相同的<\/span>\n                ops.append(c)\n            i += <span class=\"n\">1<\/span>\n        <span class=\"k\">while<\/span> ops:\n            calc()\n        <span class=\"k\">return<\/span> nums[-<span class=\"n\">1<\/span>]<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; nums = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Character<\/span>&gt; ops = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> calculate(<span class=\"t\">String<\/span> s) {\n        s = s.replace(<span class=\"s\">&quot; &quot;<\/span>, <span class=\"s\">&quot;&quot;<\/span>);\n        <span class=\"k\">int<\/span> n = s.length();\n        nums.push(<span class=\"n\">0<\/span>);                                    <span class=\"c\">// 补 0，处理表达式开头的正负号<\/span>\n        <span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>;\n        <span class=\"k\">while<\/span> (i &lt; n) {\n            <span class=\"k\">char<\/span> c = s.charAt(i);\n            <span class=\"k\">if<\/span> (<span class=\"t\">Character<\/span>.isDigit(c)) {\n                <span class=\"k\">int<\/span> num = <span class=\"n\">0<\/span>;\n                <span class=\"k\">while<\/span> (i &lt; n &amp;&amp; <span class=\"t\">Character<\/span>.isDigit(s.charAt(i))) {\n                    num = num * <span class=\"n\">10<\/span> + (s.charAt(i++) - <span class=\"s\">&#x27;0&#x27;<\/span>);\n                }\n                nums.push(num);\n                <span class=\"k\">continue<\/span>;                                <span class=\"c\">// i 已经指向数字之后<\/span>\n            }\n            <span class=\"k\">if<\/span> (c == <span class=\"s\">&#x27;(&#x27;<\/span>) {\n                ops.push(c);\n            } <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (c == <span class=\"s\">&#x27;)&#x27;<\/span>) {\n                <span class=\"k\">while<\/span> (ops.peek() != <span class=\"s\">&#x27;(&#x27;<\/span>) calc();\n                ops.pop();\n            } <span class=\"k\">else<\/span> {\n                <span class=\"k\">if<\/span> ((c == <span class=\"s\">&#x27;+&#x27;<\/span> || c == <span class=\"s\">&#x27;-&#x27;<\/span>) &amp;&amp; i &gt; <span class=\"n\">0<\/span> &amp;&amp; s.charAt(i - <span class=\"n\">1<\/span>) == <span class=\"s\">&#x27;(&#x27;<\/span>) nums.push(<span class=\"n\">0<\/span>);\n                <span class=\"k\">while<\/span> (!ops.isEmpty() &amp;&amp; ops.peek() != <span class=\"s\">&#x27;(&#x27;<\/span> &amp;&amp; priority(ops.peek()) &gt;= priority(c)) {\n                    calc();                              <span class=\"c\">// 先算掉优先级更高或相同的<\/span>\n                }\n                ops.push(c);\n            }\n            i++;\n        }\n        <span class=\"k\">while<\/span> (!ops.isEmpty()) calc();\n        <span class=\"k\">return<\/span> nums.peek();\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> priority(<span class=\"k\">char<\/span> op) {\n        <span class=\"k\">return<\/span> op == <span class=\"s\">&#x27;+&#x27;<\/span> || op == <span class=\"s\">&#x27;-&#x27;<\/span> ? <span class=\"n\">1<\/span> : <span class=\"n\">2<\/span>;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> calc() {\n        <span class=\"k\">int<\/span> b = nums.pop(), a = nums.pop();\n        <span class=\"k\">char<\/span> op = ops.pop();\n        <span class=\"k\">if<\/span> (op == <span class=\"s\">&#x27;+&#x27;<\/span>) nums.push(a + b);\n        <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (op == <span class=\"s\">&#x27;-&#x27;<\/span>) nums.push(a - b);\n        <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (op == <span class=\"s\">&#x27;*&#x27;<\/span>) nums.push(a * b);\n        <span class=\"k\">else<\/span> nums.push(a / b);                           <span class=\"c\">// Java 的 / 向零取整<\/span>\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：单栈<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">calculate<\/span>(self, s: str) -&gt; int:\n        stack, num, op = [], <span class=\"n\">0<\/span>, <span class=\"s\">&quot;+&quot;<\/span>          <span class=\"c\"># op：当前数字前面的运算符<\/span>\n        <span class=\"k\">for<\/span> c <span class=\"k\">in<\/span> s + <span class=\"s\">&quot;+&quot;<\/span>:                    <span class=\"c\"># 末尾补一个 +，触发最后一次结算<\/span>\n            <span class=\"k\">if<\/span> c.isdigit():\n                num = num * <span class=\"n\">10<\/span> + int(c)\n            <span class=\"k\">elif<\/span> c != <span class=\"s\">&quot; &quot;<\/span>:\n                <span class=\"k\">if<\/span> op == <span class=\"s\">&quot;+&quot;<\/span>:\n                    stack.append(num)\n                <span class=\"k\">elif<\/span> op == <span class=\"s\">&quot;-&quot;<\/span>:\n                    stack.append(-num)\n                <span class=\"k\">elif<\/span> op == <span class=\"s\">&quot;*&quot;<\/span>:\n                    stack.append(stack.pop() * num)\n                <span class=\"k\">else<\/span>:\n                    stack.append(int(stack.pop() / num))     <span class=\"c\"># 向零取整<\/span>\n                op, num = c, <span class=\"n\">0<\/span>\n        <span class=\"k\">return<\/span> sum(stack)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> calculate(<span class=\"t\">String<\/span> s) {\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; stack = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        <span class=\"k\">int<\/span> num = <span class=\"n\">0<\/span>;\n        <span class=\"k\">char<\/span> op = <span class=\"s\">&#x27;+&#x27;<\/span>;                                   <span class=\"c\">// 当前数字前面的运算符<\/span>\n        s = s + <span class=\"s\">&quot;+&quot;<\/span>;                                     <span class=\"c\">// 末尾补一个 +，触发最后一次结算<\/span>\n        <span class=\"k\">for<\/span> (<span class=\"k\">char<\/span> c : s.toCharArray()) {\n            <span class=\"k\">if<\/span> (<span class=\"t\">Character<\/span>.isDigit(c)) {\n                num = num * <span class=\"n\">10<\/span> + (c - <span class=\"s\">&#x27;0&#x27;<\/span>);\n            } <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (c != <span class=\"s\">&#x27; &#x27;<\/span>) {\n                <span class=\"k\">if<\/span> (op == <span class=\"s\">&#x27;+&#x27;<\/span>) stack.push(num);\n                <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (op == <span class=\"s\">&#x27;-&#x27;<\/span>) stack.push(-num);\n                <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (op == <span class=\"s\">&#x27;*&#x27;<\/span>) stack.push(stack.pop() * num);\n                <span class=\"k\">else<\/span> stack.push(stack.pop() / num);\n                op = c;\n                num = <span class=\"n\">0<\/span>;\n            }\n        }\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> x : stack) res += x;\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n)。<\/p>"},{"key":"207","rank":96,"id":"207","title":"课程表","difficulty":"中等","tags":["图","DFS","BFS"],"freq":69,"link":"https://leetcode.cn/problems/course-schedule/","desc":"给定课程之间的先修关系，判断能否修完所有课程（即有向图中是否无环）。","libs":["python-0","python-11","java-12"],"html":"<h2>思路<\/h2>\n<ul><li>本质：<strong>判断有向图有没有环<\/strong>。先建邻接表，<code>[cur, pre]<\/code> 表示先修 <code>pre<\/code> 才能修 <code>cur<\/code>，建边 <code>pre → cur<\/code>。<\/li><li><strong>DFS 判环<\/strong>：两个标记数组——<ul><li><code>visited<\/code>：这个点搜过了，不用再搜；<\/li><li><code>onPath<\/code>：这个点在<strong>当前这条 DFS 路径<\/strong>上。<\/li><li>走到一个 <code>onPath<\/code> 为真的点，说明绕回了自己的祖先，有环。离开节点时把 <code>onPath<\/code> 复位。<\/li><\/ul><\/li><li><strong>BFS 拓扑排序<\/strong>：统计每个点的入度，入度为 0 的先入队；出队一个就把它指向的点入度减一，减到 0 的入队。最后出队的点数等于课程数就无环。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>onPath<\/code> 离开节点时必须复位，<code>visited<\/code> 不用。只用一个 <code>visited<\/code> 会把「从别的路径访问过」误判成环。<\/li><li>图可能不连通，每个点都要作为起点 DFS 一次。<\/li><li>边的方向别建反：<code>graph[pre].add(cur)<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：DFS 判环<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">canFinish<\/span>(self, numCourses: int, prerequisites: List[List[int]]) -&gt; bool:\n        graph = [[] <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(numCourses)]\n        <span class=\"k\">for<\/span> cur, pre <span class=\"k\">in<\/span> prerequisites:\n            graph[pre].append(cur)           <span class=\"c\"># pre -&gt; cur<\/span>\n        visited = [<span class=\"k\">False<\/span>] * numCourses\n        on_path = [<span class=\"k\">False<\/span>] * numCourses\n        found = <span class=\"k\">False<\/span>                        <span class=\"c\"># 是否发现环<\/span>\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(i):\n            <span class=\"k\">nonlocal<\/span> found\n            <span class=\"k\">if<\/span> found:\n                <span class=\"k\">return<\/span>\n            <span class=\"k\">if<\/span> on_path[i]:                   <span class=\"c\"># 绕回当前路径上的点：有环<\/span>\n                found = <span class=\"k\">True<\/span>\n                <span class=\"k\">return<\/span>\n            <span class=\"k\">if<\/span> visited[i]:\n                <span class=\"k\">return<\/span>\n            visited[i] = on_path[i] = <span class=\"k\">True<\/span>\n            <span class=\"k\">for<\/span> course <span class=\"k\">in<\/span> graph[i]:\n                dfs(course)\n            on_path[i] = <span class=\"k\">False<\/span>               <span class=\"c\"># 离开节点<\/span>\n\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(numCourses):\n            dfs(i)\n        <span class=\"k\">return<\/span> <span class=\"k\">not<\/span> found<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;[] graph;\n    <span class=\"k\">private<\/span> <span class=\"k\">boolean<\/span>[] onPath, visited;\n    <span class=\"k\">private<\/span> <span class=\"k\">boolean<\/span> found = <span class=\"k\">false<\/span>;               <span class=\"c\">// 是否发现环<\/span>\n\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> canFinish(<span class=\"k\">int<\/span> numCourses, <span class=\"k\">int<\/span>[][] prerequisites) {\n        graph = <span class=\"k\">new<\/span> <span class=\"t\">List<\/span>[numCourses];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; numCourses; i++) graph[i] = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span>[] edge : prerequisites) {\n            graph[edge[<span class=\"n\">1<\/span>]].add(edge[<span class=\"n\">0<\/span>]);         <span class=\"c\">// pre -&gt; cur<\/span>\n        }\n        onPath = <span class=\"k\">new<\/span> <span class=\"k\">boolean<\/span>[numCourses];\n        visited = <span class=\"k\">new<\/span> <span class=\"k\">boolean<\/span>[numCourses];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; numCourses; i++) dfs(i);\n        <span class=\"k\">return<\/span> !found;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> dfs(<span class=\"k\">int<\/span> i) {\n        <span class=\"k\">if<\/span> (found) <span class=\"k\">return<\/span>;\n        <span class=\"k\">if<\/span> (onPath[i]) {                         <span class=\"c\">// 绕回当前路径上的点：有环<\/span>\n            found = <span class=\"k\">true<\/span>;\n            <span class=\"k\">return<\/span>;\n        }\n        <span class=\"k\">if<\/span> (visited[i]) <span class=\"k\">return<\/span>;\n        visited[i] = <span class=\"k\">true<\/span>;\n        onPath[i] = <span class=\"k\">true<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> course : graph[i]) dfs(course);\n        onPath[i] = <span class=\"k\">false<\/span>;                       <span class=\"c\">// 离开节点<\/span>\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：BFS 拓扑排序<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">canFinish<\/span>(self, numCourses: int, prerequisites: List[List[int]]) -&gt; bool:\n        graph = [[] <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(numCourses)]\n        indegree = [<span class=\"n\">0<\/span>] * numCourses\n        <span class=\"k\">for<\/span> cur, pre <span class=\"k\">in<\/span> prerequisites:\n            graph[pre].append(cur)\n            indegree[cur] += <span class=\"n\">1<\/span>\n        q = deque(i <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(numCourses) <span class=\"k\">if<\/span> indegree[i] == <span class=\"n\">0<\/span>)\n        count = <span class=\"n\">0<\/span>                            <span class=\"c\"># 已经能修完的课程数<\/span>\n        <span class=\"k\">while<\/span> q:\n            i = q.popleft()\n            count += <span class=\"n\">1<\/span>\n            <span class=\"k\">for<\/span> course <span class=\"k\">in<\/span> graph[i]:\n                indegree[course] -= <span class=\"n\">1<\/span>\n                <span class=\"k\">if<\/span> indegree[course] == <span class=\"n\">0<\/span>:\n                    q.append(course)\n        <span class=\"k\">return<\/span> count == numCourses<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> canFinish(<span class=\"k\">int<\/span> numCourses, <span class=\"k\">int<\/span>[][] prerequisites) {\n        <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; graph = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; numCourses; i++) graph.add(<span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;());\n        <span class=\"k\">int<\/span>[] indegree = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[numCourses];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span>[] edge : prerequisites) {\n            graph.get(edge[<span class=\"n\">1<\/span>]).add(edge[<span class=\"n\">0<\/span>]);\n            indegree[edge[<span class=\"n\">0<\/span>]]++;\n        }\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; numCourses; i++) {\n            <span class=\"k\">if<\/span> (indegree[i] == <span class=\"n\">0<\/span>) q.offer(i);\n        }\n        <span class=\"k\">int<\/span> count = <span class=\"n\">0<\/span>;                           <span class=\"c\">// 已经能修完的课程数<\/span>\n        <span class=\"k\">while<\/span> (!q.isEmpty()) {\n            <span class=\"k\">int<\/span> i = q.poll();\n            count++;\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> course : graph.get(i)) {\n                <span class=\"k\">if<\/span> (--indegree[course] == <span class=\"n\">0<\/span>) q.offer(course);\n            }\n        }\n        <span class=\"k\">return<\/span> count == numCourses;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(V + E)，空间 O(V + E)。<\/p>"},{"key":"83","rank":97,"id":"83","title":"删除排序链表中的重复元素","difficulty":"简单","tags":["链表"],"freq":69,"link":"https://leetcode.cn/problems/remove-duplicates-from-sorted-list/","desc":"删除升序链表中的重复元素，让每个值只保留一个节点。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>链表有序，相同的值一定挨在一起。<\/li><li><code>cur<\/code> 站在当前节点上，只要下一个节点的值和它相同，就把下一个节点跳过；删干净了再往后走。<\/li><li>头节点不会被删，所以不需要 <code>dummy<\/code>（对比 <a href=\"#/82\">82<\/a>：重复的全删，头可能被删）。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>删掉一个之后不能马上移动 <code>cur<\/code>：后面可能还有相同的值，要用 <code>while<\/code> 删完。<\/li><li>循环条件要保证 <code>cur<\/code> 和 <code>cur.next<\/code> 都不为空。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">deleteDuplicates<\/span>(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:\n        cur = head\n        <span class=\"k\">while<\/span> cur <span class=\"k\">and<\/span> cur.next:\n            <span class=\"k\">while<\/span> cur.next <span class=\"k\">and<\/span> cur.val == cur.next.val:      <span class=\"c\"># 把后面相同的都跳过<\/span>\n                cur.next = cur.next.next\n            cur = cur.next\n        <span class=\"k\">return<\/span> head<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> deleteDuplicates(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"t\">ListNode<\/span> cur = head;\n        <span class=\"k\">while<\/span> (cur != <span class=\"k\">null<\/span> &amp;&amp; cur.next != <span class=\"k\">null<\/span>) {\n            <span class=\"k\">while<\/span> (cur.next != <span class=\"k\">null<\/span> &amp;&amp; cur.val == cur.next.val) {   <span class=\"c\">// 把后面相同的都跳过<\/span>\n                cur.next = cur.next.next;\n            }\n            cur = cur.next;\n        }\n        <span class=\"k\">return<\/span> head;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"283","rank":98,"id":"283","title":"移动零","difficulty":"简单","tags":["双指针","数组"],"freq":68,"link":"https://leetcode.cn/problems/move-zeroes/","desc":"把数组里所有的 0 原地移到末尾，同时保持非零元素的相对顺序。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>双指针：<code>i<\/code> 负责遍历，<code>start0<\/code> 指向<strong>下一个非零元素应该放的位置<\/strong>。数组始终分三段：<code>[0, start0)<\/code> 是已归位的非零元素，<code>[start0, i)<\/code> 全是 0，<code>[i, n)<\/code> 还没看。<\/li><li>遇到 0 只移动 <code>i<\/code>；遇到非零元素就和 <code>nums[start0]<\/code> 交换，然后 <code>start0<\/code> 右移。<\/li><li>为什么顺序不乱：非零元素是按扫描顺序依次归位的。<code>start0 &lt; i<\/code> 时被换出去的一定是 0；<code>start0 == i<\/code> 时是自己和自己换。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>必须原地操作。<\/li><li>也可以写成「先把非零元素依次覆盖到前面，再把后面全部填 0」，交换的写法一趟就够。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">moveZeroes<\/span>(self, nums: List[int]) -&gt; <span class=\"k\">None<\/span>:\n        start0 = <span class=\"n\">0<\/span>                           <span class=\"c\"># 下一个非零元素应放入的位置<\/span>\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(len(nums)):\n            <span class=\"k\">if<\/span> nums[i] != <span class=\"n\">0<\/span>:\n                nums[i], nums[start0] = nums[start0], nums[i]\n                start0 += <span class=\"n\">1<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">void<\/span> moveZeroes(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span> start0 = <span class=\"n\">0<\/span>;                      <span class=\"c\">// 下一个非零元素应放入的位置<\/span>\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; nums.length; i++) {\n            <span class=\"k\">if<\/span> (nums[i] != <span class=\"n\">0<\/span>) {\n                <span class=\"k\">int<\/span> temp = nums[i];\n                nums[i] = nums[start0];\n                nums[start0] = temp;\n                start0++;\n            }\n        }\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"226","rank":99,"id":"226","title":"翻转二叉树","difficulty":"简单","tags":["二叉树","DFS","BFS"],"freq":68,"link":"https://leetcode.cn/problems/invert-binary-tree/","desc":"翻转二叉树：把每个节点的左右子树交换，得到镜像。","libs":["python-0","java-12"],"html":"<h2>思路<\/h2>\n<ul><li>对每个节点交换它的左右孩子就行。交换的是节点引用，不是节点值。<\/li><li><strong>递归<\/strong>：<code>dfs(root)<\/code> 的含义是「翻转以 <code>root<\/code> 为根的子树并返回它的根」。先翻转左右子树，再把两棵翻转好的子树交换。<\/li><li><strong>迭代<\/strong>：用队列（或栈）遍历所有节点，出队一个就交换它的左右孩子，再把非空孩子入队。只要每个节点都访问到，不需要分层。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>递归函数要返回 <code>root<\/code>，否则父节点接到的是空，子树就丢了。<\/li><li>先存下两个递归结果再赋值；写成 <code>root.left = dfs(root.right)<\/code> 之后再用 <code>root.left<\/code> 就已经被改掉了。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：递归<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">invertTree<\/span>(self, root: Optional[TreeNode]) -&gt; Optional[TreeNode]:\n        <span class=\"k\">if<\/span> root <span class=\"k\">is<\/span> <span class=\"k\">None<\/span>:\n            <span class=\"k\">return<\/span> <span class=\"k\">None<\/span>\n        l = self.invertTree(root.left)       <span class=\"c\"># 翻转原左子树<\/span>\n        r = self.invertTree(root.right)      <span class=\"c\"># 翻转原右子树<\/span>\n        root.left, root.right = r, l\n        <span class=\"k\">return<\/span> root<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">TreeNode<\/span> invertTree(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> <span class=\"k\">null<\/span>;\n        <span class=\"t\">TreeNode<\/span> l = invertTree(root.left);      <span class=\"c\">// 翻转原左子树<\/span>\n        <span class=\"t\">TreeNode<\/span> r = invertTree(root.right);     <span class=\"c\">// 翻转原右子树<\/span>\n        root.left = r;\n        root.right = l;\n        <span class=\"k\">return<\/span> root;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：BFS<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">invertTree<\/span>(self, root: Optional[TreeNode]) -&gt; Optional[TreeNode]:\n        <span class=\"k\">if<\/span> root <span class=\"k\">is<\/span> <span class=\"k\">None<\/span>:\n            <span class=\"k\">return<\/span> <span class=\"k\">None<\/span>\n        q = deque([root])\n        <span class=\"k\">while<\/span> q:\n            node = q.popleft()\n            node.left, node.right = node.right, node.left\n            <span class=\"k\">if<\/span> node.left:\n                q.append(node.left)\n            <span class=\"k\">if<\/span> node.right:\n                q.append(node.right)\n        <span class=\"k\">return<\/span> root<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">TreeNode<\/span> invertTree(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> <span class=\"k\">null<\/span>;\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">TreeNode<\/span>&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        q.offer(root);\n        <span class=\"k\">while<\/span> (!q.isEmpty()) {\n            <span class=\"t\">TreeNode<\/span> node = q.poll();\n            <span class=\"t\">TreeNode<\/span> temp = node.left;\n            node.left = node.right;\n            node.right = temp;\n            <span class=\"k\">if<\/span> (node.left != <span class=\"k\">null<\/span>) q.offer(node.left);\n            <span class=\"k\">if<\/span> (node.right != <span class=\"k\">null<\/span>) q.offer(node.right);\n        }\n        <span class=\"k\">return<\/span> root;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)；空间递归 O(h)，BFS O(n)。<\/p>"},{"key":"169","rank":100,"id":"169","title":"多数元素","difficulty":"简单","tags":["数组"],"freq":68,"link":"https://leetcode.cn/problems/majority-element/","desc":"找出数组中出现次数超过 n/2 的元素（题目保证存在）。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li><strong>摩尔投票<\/strong>：不同的元素两两抵消，多数元素最后一定剩下。<\/li><li>维护候选 <code>res<\/code> 和血量 <code>hp<\/code>（还没被抵消掉的候选个数，不是它的出现次数）：<ul><li><code>hp == 0<\/code>：前面的全部抵消完了，当前元素当新候选，<code>hp = 1<\/code>；<\/li><li>遇到和候选相同的：<code>hp + 1<\/code>；<\/li><li>遇到不同的：抵消一个，<code>hp - 1<\/code>。<\/li><\/ul><\/li><li>为什么对：多数元素的个数比其它所有元素加起来还多，就算每个其它元素都拿去抵消它，它仍有剩余；其它元素互相抵消更不影响。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>只有「保证存在多数元素」时才能直接返回候选；不保证的话要再遍历一次验证次数。<\/li><li>更直接的做法：哈希表计数 O(n) 空间，或者排序后取中间元素 O(n log n)。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">majorityElement<\/span>(self, nums: List[int]) -&gt; int:\n        res, hp = <span class=\"n\">0<\/span>, <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> num <span class=\"k\">in<\/span> nums:\n            <span class=\"k\">if<\/span> hp == <span class=\"n\">0<\/span>:\n                res, hp = num, <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:\n                hp += <span class=\"n\">1<\/span> <span class=\"k\">if<\/span> res == num <span class=\"k\">else<\/span> -<span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> majorityElement(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>, hp = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> num : nums) {\n            <span class=\"k\">if<\/span> (hp == <span class=\"n\">0<\/span>) {\n                res = num;\n                hp = <span class=\"n\">1<\/span>;\n            } <span class=\"k\">else<\/span> {\n                hp += res == num ? <span class=\"n\">1<\/span> : -<span class=\"n\">1<\/span>;\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"}],"libs":{"html":"<h1>算法常用库速查<\/h1>\n<p>刷题时反复用到的标准库，按语言分两栏。每一节末尾会自动列出本仓库里用到它的题目。<\/p>\n<p>LeetCode 的 Python 环境已经预先 <code>from collections import *<\/code>、<code>from heapq import *<\/code>、<code>from bisect import *<\/code>、<code>from functools import *<\/code>、<code>from math import *<\/code>、<code>import random<\/code> 等，所以笔记里的代码都省略了 import；本地运行时需要自己补上。Java 环境预先 <code>import java.util.*<\/code>。<\/p>\n<h2 id=\"lib-python\">Python<\/h2>\n<h3 id=\"lib-python-0\"><code>deque<\/code> — 双端队列（队列 / BFS / 单调队列）<\/h3>\n<p>两端进出都是 O(1)。<code>list.pop(0)<\/code> 是 O(n)，所以队列一律用 <code>deque<\/code>。<\/p>\n<div class=\"code\"><pre data-lang=\"python\"><code><span class=\"k\">from<\/span> collections <span class=\"k\">import<\/span> deque\n\nq = deque()                <span class=\"c\"># 也可以 deque([root])、deque(iterable)<\/span>\nq.append(x)                <span class=\"c\"># 右端进<\/span>\nq.appendleft(x)            <span class=\"c\"># 左端进<\/span>\nq.pop()                    <span class=\"c\"># 右端出<\/span>\nq.popleft()                <span class=\"c\"># 左端出<\/span>\nq[<span class=\"n\">0<\/span>], q[-<span class=\"n\">1<\/span>]                <span class=\"c\"># 看两端，不弹出<\/span>\nlen(q)                     <span class=\"c\"># 判空直接 while q:<\/span><\/code><\/pre><\/div>\n<ul><li>BFS 模板：<code>q = deque([root])<\/code>，循环里 <code>for _ in range(len(q))<\/code> 处理一整层（<code>range<\/code> 的长度在进入循环时就定了）。<\/li><li>单调队列：队尾 <code>pop()<\/code> 维护单调性，队头 <code>popleft()<\/code> 淘汰过期元素。<\/li><li>可以放 <code>None<\/code>（Java 的 <code>ArrayDeque<\/code> 不行）。<\/li><li>按下标访问中间元素是 O(n)，不要当数组用。<\/li><\/ul>\n<p>相关题目：<a href=\"#/200\">200<\/a> · <a href=\"#/102\">102<\/a> · <a href=\"#/103\">103<\/a> · <a href=\"#/199\">199<\/a> · <a href=\"#/239\">239<\/a> · <a href=\"#/695\">695<\/a> · <a href=\"#/101\">101<\/a> · <a href=\"#/104\">104<\/a> · <a href=\"#/662\">662<\/a> · <a href=\"#/207\">207<\/a> · <a href=\"#/226\">226<\/a><\/p>\n<h3 id=\"lib-python-1\"><code>heapq<\/code> — 堆（优先队列）<\/h3>\n<p>对一个普通 <code>list<\/code> 做堆操作，<strong>只有小顶堆<\/strong>。<\/p>\n<div class=\"code\"><pre data-lang=\"python\"><code><span class=\"k\">import<\/span> heapq\n\nh = []\nheapq.heappush(h, x)       <span class=\"c\"># 入堆 O(log n)<\/span>\nx = heapq.heappop(h)       <span class=\"c\"># 弹出最小值 O(log n)<\/span>\nh[<span class=\"n\">0<\/span>]                       <span class=\"c\"># 看最小值，不弹出<\/span>\nheapq.heapify(nums)        <span class=\"c\"># 原地建堆 O(n)<\/span>\nheapq.heapreplace(h, x)    <span class=\"c\"># 先弹出最小值再压入 x，比分开写快<\/span>\nheapq.heappushpop(h, x)    <span class=\"c\"># 先压入 x 再弹出最小值<\/span>\nheapq.nlargest(k, nums)    <span class=\"c\"># 最大的 k 个；nsmallest 同理<\/span><\/code><\/pre><\/div>\n<ul><li>大顶堆：存相反数，<code>heappush(h, -x)<\/code>，取出来再取反。<\/li><li>堆里放元组时按字典序比较：<code>(优先级, 序号, 对象)<\/code>。中间加一个唯一的序号，优先级相同时就不会去比较后面那个不可比的对象（如 <code>ListNode<\/code>）。<\/li><li>「第 k 大」：维护一个大小为 k 的<strong>小<\/strong>顶堆，堆顶就是答案。<\/li><li>堆只保证 <code>h[0]<\/code> 最小，整个列表并不是有序的。<\/li><\/ul>\n<p>相关题目：<a href=\"#/215\">215<\/a> · <a href=\"#/23\">23<\/a><\/p>\n<h3 id=\"lib-python-2\"><code>defaultdict<\/code> / <code>Counter<\/code> — 计数与分组<\/h3>\n<div class=\"code\"><pre data-lang=\"python\"><code><span class=\"k\">from<\/span> collections <span class=\"k\">import<\/span> defaultdict, Counter\n\ncnt = defaultdict(int)     <span class=\"c\"># 不存在的 key 默认是 0<\/span>\ncnt[x] += <span class=\"n\">1<\/span>\ngraph = defaultdict(list)  <span class=\"c\"># 默认是空列表，建图 / 分组<\/span>\ngraph[u].append(v)\n\nc = Counter(<span class=\"s\">&quot;abca&quot;<\/span>)        <span class=\"c\"># {&#x27;a&#x27;: 2, &#x27;b&#x27;: 1, &#x27;c&#x27;: 1}<\/span>\nc[<span class=\"s\">&quot;z&quot;<\/span>]                     <span class=\"c\"># 不存在返回 0，不报错<\/span>\nc.most_common(<span class=\"n\">2<\/span>)           <span class=\"c\"># 出现最多的 2 个：[(&#x27;a&#x27;, 2), (&#x27;b&#x27;, 1)]<\/span>\nCounter(s) == Counter(t)   <span class=\"c\"># 判断是否是字母异位词<\/span><\/code><\/pre><\/div>\n<ul><li><code>defaultdict<\/code> <strong>读取<\/strong>不存在的 key 也会把它插进去（<code>if d[k]<\/code> 会让字典变大）；只想判断存在用 <code>k in d<\/code>。<\/li><li><code>Counter<\/code> 读取不存在的 key 返回 0 且不会插入；<code>len(c)<\/code> 是不同元素的个数。<\/li><li>普通字典的等价写法：<code>d[x] = d.get(x, 0) + 1<\/code>。<\/li><\/ul>\n<p>相关题目：<a href=\"#/76\">76<\/a> · <a href=\"#/560\">560<\/a><\/p>\n<h3 id=\"lib-python-3\"><code>OrderedDict<\/code> — 记住顺序的字典<\/h3>\n<p>LRU 这类「既要 O(1) 查找、又要维护先后顺序」的场景。<\/p>\n<div class=\"code\"><pre data-lang=\"python\"><code><span class=\"k\">from<\/span> collections <span class=\"k\">import<\/span> OrderedDict\n\nod = OrderedDict()\nod[k] = v                  <span class=\"c\"># 新 key 放在末尾；已有的 key 只改值、位置不变<\/span>\nod.move_to_end(k)          <span class=\"c\"># 挪到末尾（最近使用）<\/span>\nod.move_to_end(k, last=<span class=\"k\">False<\/span>)   <span class=\"c\"># 挪到开头<\/span>\nod.popitem(last=<span class=\"k\">False<\/span>)     <span class=\"c\"># 弹出开头（最久未用），返回 (k, v)<\/span>\nod.popitem()               <span class=\"c\"># 弹出末尾<\/span>\nnext(iter(od))             <span class=\"c\"># 看第一个 key<\/span><\/code><\/pre><\/div>\n<ul><li>Python 3.7+ 普通 <code>dict<\/code> 也保持插入顺序，但没有 <code>move_to_end<\/code>，<code>popitem()<\/code> 也只能弹末尾。<\/li><\/ul>\n<p>相关题目：<a href=\"#/146\">146<\/a><\/p>\n<h3 id=\"lib-python-4\"><code>bisect<\/code> — 二分查找<\/h3>\n<p>在<strong>已排序<\/strong>的列表上二分，返回插入位置。<\/p>\n<div class=\"code\"><pre data-lang=\"python\"><code><span class=\"k\">from<\/span> bisect <span class=\"k\">import<\/span> bisect_left, bisect_right\n\ni = bisect_left(a, x)      <span class=\"c\"># 第一个 &gt;= x 的位置（lower_bound）<\/span>\nj = bisect_right(a, x)     <span class=\"c\"># 第一个 &gt;  x 的位置（upper_bound）<\/span>\nj - i                      <span class=\"c\"># x 出现的次数<\/span>\nbisect_left(a, x, lo, hi)  <span class=\"c\"># 只在 a[lo:hi] 里找<\/span><\/code><\/pre><\/div>\n<ul><li>判断 <code>x<\/code> 是否存在：<code>i &lt; len(a) and a[i] == x<\/code>。<\/li><li>最后一个 <code>&lt;= x<\/code> 的位置是 <code>bisect_right(a, x) - 1<\/code>；最后一个 <code>&lt; x<\/code> 的位置是 <code>bisect_left(a, x) - 1<\/code>。<\/li><li>3.10+ 支持 <code>key=<\/code> 参数。<\/li><li>面试让手写时，对应的模板见 <a href=\"#/34\">34<\/a>、<a href=\"#/704\">704<\/a>。<\/li><\/ul>\n<p>相关题目：<a href=\"#/300\">300<\/a><\/p>\n<h3 id=\"lib-python-5\">排序：<code>sort<\/code> / <code>sorted<\/code> / <code>cmp_to_key<\/code><\/h3>\n<div class=\"code\"><pre data-lang=\"python\"><code>nums.sort()                            <span class=\"c\"># 原地排序，返回 None<\/span>\nb = sorted(nums)                       <span class=\"c\"># 返回新列表，可以排任意可迭代对象<\/span>\nnums.sort(reverse=<span class=\"k\">True<\/span>)                <span class=\"c\"># 降序<\/span>\nintervals.sort(key=<span class=\"k\">lambda<\/span> x: x[<span class=\"n\">0<\/span>])     <span class=\"c\"># 按某个字段<\/span>\npeople.sort(key=<span class=\"k\">lambda<\/span> p: (-p[<span class=\"n\">0<\/span>], p[<span class=\"n\">1<\/span>]))   <span class=\"c\"># 多关键字：第一个降序、第二个升序<\/span>\n\n<span class=\"k\">from<\/span> functools <span class=\"k\">import<\/span> cmp_to_key\nstrs.sort(key=cmp_to_key(<span class=\"k\">lambda<\/span> a, b: -<span class=\"n\">1<\/span> <span class=\"k\">if<\/span> a + b &gt; b + a <span class=\"k\">else<\/span> <span class=\"n\">1<\/span>))   <span class=\"c\"># 自定义两两比较<\/span><\/code><\/pre><\/div>\n<ul><li>排序是稳定的（Timsort），相等的元素保持原来的相对顺序。<\/li><li><code>cmp<\/code> 函数返回负数表示 <code>a<\/code> 排前面，对应 Java 比较器 <code>(a, b) -&gt; ...<\/code> 的返回值。<\/li><li><code>x = nums.sort()<\/code> 得到的是 <code>None<\/code>，常见手误。<\/li><\/ul>\n<p>相关题目：<a href=\"#/15\">15<\/a> · <a href=\"#/56\">56<\/a> · <a href=\"#/39\">39<\/a> · <a href=\"#/179\">179<\/a><\/p>\n<h3 id=\"lib-python-6\"><code>@cache<\/code> — 记忆化<\/h3>\n<p>给递归函数加一行装饰器，就是自顶向下的 DP。<\/p>\n<div class=\"code\"><pre data-lang=\"python\"><code><span class=\"k\">from<\/span> functools <span class=\"k\">import<\/span> cache            <span class=\"c\"># 3.9+；老版本用 lru_cache(None)<\/span>\n\n@cache\n<span class=\"k\">def<\/span> <span class=\"f\">dp<\/span>(i, j):\n    <span class=\"k\">if<\/span> i == <span class=\"n\">0<\/span>:\n        <span class=\"k\">return<\/span> <span class=\"n\">1<\/span>\n    <span class=\"k\">return<\/span> dp(i - <span class=\"n\">1<\/span>, j) + dp(i, j - <span class=\"n\">1<\/span>)<\/code><\/pre><\/div>\n<ul><li>参数必须可哈希：传下标、元组，不要传 <code>list<\/code>。<\/li><li>状态只放在参数里，函数体不要依赖会变化的外部变量。<\/li><li>递归太深会栈溢出，见下面「递归」一节。<\/li><\/ul>\n<p>相关题目：<a href=\"#/72\">72<\/a> · <a href=\"#/70\">70<\/a> · <a href=\"#/62\">62<\/a> · <a href=\"#/198\">198<\/a> · <a href=\"#/139\">139<\/a><\/p>\n<h3 id=\"lib-python-7\"><code>inf<\/code>、<code>divmod<\/code> — 无穷大与取整<\/h3>\n<div class=\"code\"><pre data-lang=\"python\"><code><span class=\"k\">from<\/span> math <span class=\"k\">import<\/span> inf       <span class=\"c\"># 等价于 float(&quot;inf&quot;)<\/span>\nres = inf                  <span class=\"c\"># 求最小值时的初始值；-inf 用于求最大值<\/span>\n\ncarry, digit = divmod(s, <span class=\"n\">10<\/span>)   <span class=\"c\"># 同时拿到商和余数<\/span>\n\n<span class=\"n\">7<\/span> // <span class=\"n\">2<\/span>      <span class=\"c\"># 3<\/span>\n-<span class=\"n\">7<\/span> // <span class=\"n\">2<\/span>     <span class=\"c\"># -4   向下取整<\/span>\nint(-<span class=\"n\">7<\/span> / <span class=\"n\">2<\/span>) <span class=\"c\"># -3   向零取整（C / Java 的行为）<\/span>\n-<span class=\"n\">7<\/span> % <span class=\"n\">2<\/span>      <span class=\"c\"># 1    余数符号跟除数走；Java 里是 -1<\/span><\/code><\/pre><\/div>\n<ul><li>Python 整数不会溢出；题目要求 32 位截断时自己夹一下：<code>max(-2**31, min(x, 2**31 - 1))<\/code>。<\/li><li><code>inf<\/code> 是浮点数，只用来比较，不要参与最后的整数结果。<\/li><\/ul>\n<p>相关题目：<a href=\"#/121\">121<\/a> · <a href=\"#/415\">415<\/a> · <a href=\"#/124\">124<\/a> · <a href=\"#/4\">4<\/a> · <a href=\"#/76\">76<\/a> · <a href=\"#/98\">98<\/a> · <a href=\"#/209\">209<\/a><\/p>\n<h3 id=\"lib-python-8\">列表、切片与常用内置函数<\/h3>\n<div class=\"code\"><pre data-lang=\"python\"><code>stack = []                 <span class=\"c\"># 列表直接当栈<\/span>\nstack.append(x); stack.pop(); stack[-<span class=\"n\">1<\/span>]\n\ndp = [<span class=\"n\">0<\/span>] * n\ngrid = [[<span class=\"n\">0<\/span>] * n <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(m)]     <span class=\"c\"># 二维数组；不要写 [[0] * n] * m（每行是同一个对象）<\/span>\n\na[::-<span class=\"n\">1<\/span>]                    <span class=\"c\"># 反转（新列表）<\/span>\na[i:j]                     <span class=\"c\"># 左闭右开，拷贝<\/span>\npath[:]                    <span class=\"c\"># 浅拷贝，回溯收集答案时用<\/span>\na[i], a[j] = a[j], a[i]    <span class=\"c\"># 交换<\/span>\n\n<span class=\"k\">for<\/span> i, x <span class=\"k\">in<\/span> enumerate(nums): ...\n<span class=\"k\">for<\/span> x, y <span class=\"k\">in<\/span> zip(a, b): ...\n<span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(n - <span class=\"n\">1<\/span>, -<span class=\"n\">1<\/span>, -<span class=\"n\">1<\/span>): ...     <span class=\"c\"># 倒序<\/span>\nmax(nums), min(a, b), sum(nums), abs(x)\nany(...), all(...)<\/code><\/pre><\/div>\n<ul><li>交换时两边如果有互相依赖的下标（<code>nums[i], nums[nums[i] - 1] = ...<\/code>），先把下标存到变量里再换。<\/li><\/ul>\n<h3 id=\"lib-python-9\">字符串常用操作<\/h3>\n<div class=\"code\"><pre data-lang=\"python\"><code>s.split()                  <span class=\"c\"># 按任意空白切分，自动去掉多余空格<\/span>\ns.split(<span class=\"s\">&quot;.&quot;<\/span>)               <span class=\"c\"># 按指定分隔符<\/span>\n<span class=\"s\">&quot; &quot;<\/span>.join(words)            <span class=\"c\"># 拼接；循环里用 += 拼长字符串是 O(n²)<\/span>\ns.strip()                  <span class=\"c\"># 去首尾空白；lstrip(&quot;0&quot;) 去前导 0<\/span>\ns[::-<span class=\"n\">1<\/span>]                    <span class=\"c\"># 反转<\/span>\nc.isdigit(), c.isalpha(), c.isalnum()\nord(<span class=\"s\">&quot;a&quot;<\/span>), chr(<span class=\"n\">97<\/span>)          <span class=\"c\"># 字符 &lt;-&gt; 编码；ord(c) - ord(&quot;a&quot;) 得到 0~25<\/span>\nint(<span class=\"s\">&quot;042&quot;<\/span>), str(<span class=\"n\">42<\/span>)\ns.startswith(p), s.find(p) <span class=\"c\"># find 找不到返回 -1<\/span><\/code><\/pre><\/div>\n<ul><li>字符串不可变：要改字符先 <code>list(s)<\/code>，改完再 <code>&quot;&quot;.join(...)<\/code>。<\/li><\/ul>\n<h3 id=\"lib-python-10\"><code>random<\/code> — 随机数<\/h3>\n<div class=\"code\"><pre data-lang=\"python\"><code><span class=\"k\">import<\/span> random\n\nrandom.randint(lo, hi)     <span class=\"c\"># [lo, hi] 两端都包含<\/span>\nrandom.randrange(n)        <span class=\"c\"># [0, n)<\/span>\nrandom.choice(nums)\nrandom.shuffle(nums)       <span class=\"c\"># 原地打乱<\/span><\/code><\/pre><\/div>\n<ul><li>快排 / 快速选择随机选 pivot 用 <code>randint(lo, hi)<\/code>，注意它是闭区间。<\/li><\/ul>\n<p>相关题目：<a href=\"#/215\">215<\/a> · <a href=\"#/bu4\">补充题4<\/a><\/p>\n<h3 id=\"lib-python-11\">递归：<code>nonlocal<\/code> 与递归深度<\/h3>\n<div class=\"code\"><pre data-lang=\"python\"><code><span class=\"k\">def<\/span> <span class=\"f\">solve<\/span>(root):\n    res = <span class=\"n\">0<\/span>\n\n    <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(node):\n        <span class=\"k\">nonlocal<\/span> res       <span class=\"c\"># 内层函数要给外层变量重新赋值，必须声明<\/span>\n        ...\n        res = max(res, x)\n\n    dfs(root)\n    <span class=\"k\">return<\/span> res<\/code><\/pre><\/div>\n<ul><li>只是调用方法修改对象（<code>res.append(x)<\/code>、<code>path.pop()<\/code>）不需要 <code>nonlocal<\/code>；重新赋值（<code>res = ...<\/code>、<code>res += 1<\/code>）才需要。<\/li><li>默认递归深度上限约 1000。本地跑深递归要 <code>sys.setrecursionlimit(10**6)<\/code>；网格 DFS、长链表递归容易踩到，可以改成 BFS / 迭代。<\/li><\/ul>\n<p>相关题目：<a href=\"#/124\">124<\/a> · <a href=\"#/129\">129<\/a> · <a href=\"#/110\">110<\/a> · <a href=\"#/662\">662<\/a> · <a href=\"#/98\">98<\/a> · <a href=\"#/543\">543<\/a> · <a href=\"#/207\">207<\/a><\/p>\n<h2 id=\"lib-java\">Java<\/h2>\n<h3 id=\"lib-java-12\"><code>ArrayDeque<\/code> — 栈 / 队列 / 双端队列<\/h3>\n<p>一个类顶三个用。栈不要用 <code>Stack<\/code>（继承自 <code>Vector<\/code>，带同步，慢）。<\/p>\n<div class=\"code\"><pre data-lang=\"java\"><code><span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; stack = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\nstack.push(x);      <span class=\"c\">// 压栈<\/span>\nstack.pop();        <span class=\"c\">// 弹栈，空了抛异常<\/span>\nstack.peek();       <span class=\"c\">// 看栈顶，空了返回 null<\/span>\n\n<span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\nq.offer(x);         <span class=\"c\">// 入队（队尾）<\/span>\nq.poll();           <span class=\"c\">// 出队（队头），空了返回 null<\/span>\nq.peek();           <span class=\"c\">// 看队头<\/span>\n\n<span class=\"c\">// 双端：单调队列、滑动窗口<\/span>\nq.offerFirst(x); q.offerLast(x);\nq.pollFirst();   q.pollLast();\nq.peekFirst();   q.peekLast();\n\nq.isEmpty(); q.size();<\/code><\/pre><\/div>\n<ul><li><strong>不能放 <code>null<\/code><\/strong>（会抛 NPE）。需要把 null 入队时（如 <a href=\"#/101\">101<\/a> 的迭代写法）用 <code>LinkedList<\/code>。<\/li><li><code>push / pop / peek<\/code> 都在队头操作，<code>offer<\/code> 在队尾加——同一个对象不要混着当栈和队列用。<\/li><li><code>poll()<\/code> / <code>peek()<\/code> 空时返回 <code>null<\/code>，直接赋给 <code>int<\/code> 会 NPE，先判 <code>isEmpty()<\/code>。<\/li><li>BFS 一层：先 <code>int sz = q.size()<\/code> 再循环，循环里队列长度会变。<\/li><li>两个栈顶比较时是 <code>Integer<\/code> 对象，用 <code>equals<\/code> 或先拆箱成 <code>int<\/code>。<\/li><\/ul>\n<p>相关题目：<a href=\"#/200\">200<\/a> · <a href=\"#/102\">102<\/a> · <a href=\"#/20\">20<\/a> · <a href=\"#/103\">103<\/a> · <a href=\"#/199\">199<\/a> · <a href=\"#/239\">239<\/a> · <a href=\"#/32\">32<\/a> · <a href=\"#/94\">94<\/a> · <a href=\"#/232\">232<\/a> · <a href=\"#/394\">394<\/a> · <a href=\"#/155\">155<\/a> · <a href=\"#/695\">695<\/a> · <a href=\"#/101\">101<\/a> · <a href=\"#/104\">104<\/a> · <a href=\"#/662\">662<\/a> · <a href=\"#/144\">144<\/a> · <a href=\"#/227\">227<\/a> · <a href=\"#/207\">207<\/a> · <a href=\"#/226\">226<\/a><\/p>\n<h3 id=\"lib-java-13\"><code>LinkedList<\/code> — 链表 / 能放 null 的队列<\/h3>\n<p>同时实现了 <code>List<\/code> 和 <code>Deque<\/code>。<\/p>\n<div class=\"code\"><pre data-lang=\"java\"><code><span class=\"t\">LinkedList<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; path = <span class=\"k\">new<\/span> <span class=\"t\">LinkedList<\/span>&lt;&gt;();\npath.add(x);  path.addLast(x);  path.addFirst(x);\npath.removeLast();  path.removeFirst();\npath.getLast();     path.getFirst();\n\n<span class=\"t\">Queue<\/span>&lt;<span class=\"t\">TreeNode<\/span>&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">LinkedList<\/span>&lt;&gt;();   <span class=\"c\">// 需要放 null 的队列<\/span><\/code><\/pre><\/div>\n<ul><li>回溯里的 <code>path<\/code> 声明成 <code>LinkedList<\/code> 才有 <code>removeLast()<\/code>；声明成 <code>List<\/code> 的话（Java 21 之前）只能 <code>path.remove(path.size() - 1)<\/code>。<\/li><li><code>get(i)<\/code> 是 O(n)，要按下标访问用 <code>ArrayList<\/code>。<\/li><li>收集答案时拷贝：<code>res.add(new ArrayList&lt;&gt;(path))<\/code>。<\/li><li>当普通队列 / 栈用时，<code>ArrayDeque<\/code> 更快。<\/li><\/ul>\n<p>相关题目：<a href=\"#/46\">46<\/a> · <a href=\"#/103\">103<\/a> · <a href=\"#/56\">56<\/a> · <a href=\"#/93\">93<\/a> · <a href=\"#/78\">78<\/a> · <a href=\"#/101\">101<\/a> · <a href=\"#/39\">39<\/a> · <a href=\"#/113\">113<\/a><\/p>\n<h3 id=\"lib-java-14\"><code>PriorityQueue<\/code> — 堆<\/h3>\n<p>默认是小顶堆，传比较器改变顺序。<\/p>\n<div class=\"code\"><pre data-lang=\"java\"><code><span class=\"t\">PriorityQueue<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; minHeap = <span class=\"k\">new<\/span> <span class=\"t\">PriorityQueue<\/span>&lt;&gt;();\n<span class=\"t\">PriorityQueue<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; maxHeap = <span class=\"k\">new<\/span> <span class=\"t\">PriorityQueue<\/span>&lt;&gt;((a, b) -&gt; b - a);\n<span class=\"t\">PriorityQueue<\/span>&lt;<span class=\"k\">int<\/span>[]&gt; pq = <span class=\"k\">new<\/span> <span class=\"t\">PriorityQueue<\/span>&lt;&gt;((a, b) -&gt; a[<span class=\"n\">0<\/span>] - b[<span class=\"n\">0<\/span>]);          <span class=\"c\">// 按数组第一个元素<\/span>\n<span class=\"t\">PriorityQueue<\/span>&lt;<span class=\"t\">ListNode<\/span>&gt; pq2 = <span class=\"k\">new<\/span> <span class=\"t\">PriorityQueue<\/span>&lt;&gt;((a, b) -&gt; a.val - b.val);    <span class=\"c\">// 按节点值<\/span>\n\npq.offer(x);        <span class=\"c\">// 入堆 O(log n)<\/span>\npq.poll();          <span class=\"c\">// 弹出堆顶 O(log n)<\/span>\npq.peek();          <span class=\"c\">// 看堆顶<\/span>\npq.size(); pq.isEmpty();<\/code><\/pre><\/div>\n<ul><li>比较器 <code>(a, b) -&gt; a - b<\/code> 是升序（小顶堆），<code>b - a<\/code> 是降序（大顶堆）。数值可能很大时减法会溢出，用 <code>Integer.compare(a, b)<\/code>。<\/li><li>「第 k 大」：大小为 k 的小顶堆，<code>size() &gt; k<\/code> 就 <code>poll()<\/code>，最后 <code>peek()<\/code>。<\/li><li>遍历 <code>PriorityQueue<\/code> 不是有序的，只有不断 <code>poll()<\/code> 才有序。<\/li><li><code>remove(Object)<\/code> 是 O(n)。<\/li><\/ul>\n<p>相关题目：<a href=\"#/215\">215<\/a> · <a href=\"#/23\">23<\/a><\/p>\n<h3 id=\"lib-java-15\"><code>HashMap<\/code> / <code>HashSet<\/code> — 哈希表<\/h3>\n<div class=\"code\"><pre data-lang=\"java\"><code><span class=\"t\">Map<\/span>&lt;<span class=\"t\">Integer<\/span>, <span class=\"t\">Integer<\/span>&gt; map = <span class=\"k\">new<\/span> <span class=\"t\">HashMap<\/span>&lt;&gt;();\nmap.put(k, v);\nmap.get(k);                              <span class=\"c\">// 不存在返回 null<\/span>\nmap.containsKey(k);\nmap.remove(k);\nmap.getOrDefault(k, <span class=\"n\">0<\/span>);\nmap.put(k, map.getOrDefault(k, <span class=\"n\">0<\/span>) + <span class=\"n\">1<\/span>);  <span class=\"c\">// 计数<\/span>\nmap.merge(k, <span class=\"n\">1<\/span>, <span class=\"t\">Integer<\/span>::sum);           <span class=\"c\">// 计数的另一种写法<\/span>\nmap.putIfAbsent(k, v);\nmap.computeIfAbsent(k, x -&gt; <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;()).add(v);   <span class=\"c\">// 分组 / 建图<\/span>\n\n<span class=\"k\">for<\/span> (<span class=\"t\">Map<\/span>.<span class=\"t\">Entry<\/span>&lt;<span class=\"t\">Integer<\/span>, <span class=\"t\">Integer<\/span>&gt; e : map.entrySet()) { e.getKey(); e.getValue(); }\n<span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> key : map.keySet()) { }\n<span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> val : map.values()) { }\n\n<span class=\"t\">Set<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; set = <span class=\"k\">new<\/span> <span class=\"t\">HashSet<\/span>&lt;&gt;();\nset.add(x);          <span class=\"c\">// 已存在返回 false<\/span>\nset.contains(x);\nset.remove(x);<\/code><\/pre><\/div>\n<ul><li><strong><code>Integer<\/code> 之间比较用 <code>equals<\/code><\/strong>：<code>map.get(a) == map.get(b)<\/code> 比的是引用，只有 -128~127 走缓存碰巧相等（<a href=\"#/76\">76<\/a> 的经典坑）。和 <code>int<\/code> 字面量或 <code>int<\/code> 变量比较会自动拆箱，没问题。<\/li><li><code>map.get(k)<\/code> 返回 <code>null<\/code> 时赋给 <code>int<\/code> 会 NPE，先 <code>containsKey<\/code> 或用 <code>getOrDefault<\/code>。<\/li><li>key 是字符时类型写 <code>Character<\/code>；字符集固定时（26 个字母、ASCII）直接用 <code>int[26]<\/code> / <code>int[128]<\/code> 更快。<\/li><li>遍历顺序不确定；需要顺序用 <code>LinkedHashMap<\/code> / <code>TreeMap<\/code>。<\/li><\/ul>\n<p>相关题目：<a href=\"#/3\">3<\/a> · <a href=\"#/146\">146<\/a> · <a href=\"#/1\">1<\/a> · <a href=\"#/76\">76<\/a> · <a href=\"#/105\">105<\/a> · <a href=\"#/128\">128<\/a> · <a href=\"#/560\">560<\/a> · <a href=\"#/662\">662<\/a> · <a href=\"#/139\">139<\/a><\/p>\n<h3 id=\"lib-java-16\"><code>LinkedHashMap<\/code> — 记住插入顺序的哈希表<\/h3>\n<p>哈希表 + 双向链表，LRU 的现成实现。<\/p>\n<div class=\"code\"><pre data-lang=\"java\"><code><span class=\"t\">LinkedHashMap<\/span>&lt;<span class=\"t\">Integer<\/span>, <span class=\"t\">Integer<\/span>&gt; map = <span class=\"k\">new<\/span> <span class=\"t\">LinkedHashMap<\/span>&lt;&gt;();\nmap.put(k, v)         <span class=\"c\">// 字符、数字、字符串都可以<\/span>\nsb.append(s, start, end);        <span class=\"c\">// 追加 s[start, end)<\/span>\nsb.reverse();                    <span class=\"c\">// 原地反转<\/span>\nsb.deleteCharAt(sb.length() - <span class=\"n\">1<\/span>);    <span class=\"c\">// 删掉最后一个字符（回溯撤销）<\/span>\nsb.insert(<span class=\"n\">0<\/span>, x);                 <span class=\"c\">// 头插，O(n)<\/span>\nsb.charAt(i); sb.setCharAt(i, c);\nsb.length();\nsb.toString();<\/code><\/pre><\/div>\n<ul><li><code>sb.append(a + b)<\/code> 里的 <code>+<\/code>：如果 <code>a<\/code>、<code>b<\/code> 都是 <code>char<\/code>，会先做整数加法。分开 <code>append<\/code>。<\/li><li>两个 <code>StringBuilder<\/code> 不能用 <code>equals<\/code> 比内容，先 <code>toString()<\/code>。<\/li><\/ul>\n<p>相关题目：<a href=\"#/415\">415<\/a> · <a href=\"#/22\">22<\/a> · <a href=\"#/43\">43<\/a> · <a href=\"#/151\">151<\/a> · <a href=\"#/394\">394<\/a> · <a href=\"#/179\">179<\/a><\/p>\n<h3 id=\"lib-java-19\"><code>String<\/code> / <code>Character<\/code> 常用方法<\/h3>\n<div class=\"code\"><pre data-lang=\"java\"><code>s.length();  s.charAt(i);\ns.substring(l, r);               <span class=\"c\">// 左闭右开 [l, r)<\/span>\ns.toCharArray();                 <span class=\"c\">// 转成 char[]，for (char c : s.toCharArray())<\/span>\ns.split(<span class=\"s\">&quot;\\\\.&quot;<\/span>);                  <span class=\"c\">// 参数是正则：. | * + 等要转义；&quot;\\\\s+&quot; 是一个或多个空白<\/span>\ns.trim();                        <span class=\"c\">// 去首尾空白，返回新串，要接住：s = s.trim()<\/span>\ns.equals(t);                     <span class=\"c\">// 比较内容，不要用 ==<\/span>\ns.compareTo(t);                  <span class=\"c\">// 字典序比较，负数表示 s 在前<\/span>\ns.indexOf(<span class=\"s\">&quot;ab&quot;<\/span>);  s.startsWith(<span class=\"s\">&quot;ab&quot;<\/span>);\n<span class=\"t\">String<\/span>.valueOf(x);  <span class=\"t\">Integer<\/span>.parseInt(s);\n<span class=\"t\">String<\/span>.join(<span class=\"s\">&quot;.&quot;<\/span>, list);          <span class=\"c\">// 用分隔符拼接<\/span>\n< t);\n<span class=\"t\">Collections<\/span>.sort(list, (a, b) -&gt; b - a);\n<span class=\"t\">Collections<\/span>.reverse(list);\n<span class=\"t\">Collections<\/span>.swap(list, i, j);\n<span class=\"t\">Collections<\/span>.max(list);  <span class=\"t\">Collections<\/span>.min(list);\n\nlist.toArray(<span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[<span class=\"n\">0<\/span>][]);            <span class=\"c\">// List&lt;int[]&gt; -&gt; int[][]<\/span>\nlist.stream().mapToInt(<span class=\"t\">Integer<\/span>::intValue).toArray();   <span class=\"c\">// List&lt;Integer&gt; -&gt; int[]<\/span><\/code><\/pre><\/div>\n<ul><li><code>List.of(...)<\/code> 返回的列表不能修改，也不能放 <code>null<\/code>。<\/li><li>返回空结果用 <code>new ArrayList&lt;&gt;()<\/code> 最稳。<\/li><\/ul>\n<p>相关题目：<a href=\"#/15\">15<\/a> · <a href=\"#/151\">151<\/a><\/p>\n<h3 id=\"lib-java-22\"><code>Integer<\/code> / <code>Long<\/code> — 边界、溢出与类型转换<\/h3>\n<div class=\"code\"><pre data-lang=\"java\"><code><span class=\"t\">Integer<\/span>.MAX_VALUE   <span class=\"c\">//  2147483647 ≈ 2.1e9<\/span>\n<span class=\"t\">Integer<\/span>.MIN_VALUE   <span class=\"c\">// -2147483648<\/span>\n<span class=\"t\">Long<\/span>.MAX_VALUE      <span class=\"c\">// ≈ 9.2e18<\/span>\n\n<span class=\"k\">int<\/span> mid = l + (r - l) / <span class=\"n\">2<\/span>;        <span class=\"c\">// 不写 (l + r) / 2，防溢出<\/span>\n<span class=\"k\">long<\/span> sq = (<span class=\"k\">long<\/span>) mid * mid;       <span class=\"c\">// 先转 long 再乘；long sq = mid * mid 已经溢出了<\/span>\n<span class=\"t\">Integer<\/span>.parseInt(<span class=\"s\">&quot;042&quot;<\/span>);          <span class=\"c\">// 42<\/span>\n<span class=\"t\">Integer<\/span>.compare(a, b);            <span class=\"c\">// 比 a - b 安全的比较器写法<\/span>\n<span class=\"t\">Math<\/span>.abs(<span class=\"t\">Integer<\/span>.MIN_VALUE);      <span class=\"c\">// 还是负数，溢出<\/span><\/code><\/pre><\/div>\n<ul><li>用 <code>Integer.MAX_VALUE<\/code> 当「无穷大」时不能再 <code>+ 1<\/code>，会变成负数；DP 里
