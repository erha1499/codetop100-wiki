<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeTop 100 复习</title>
<style>
:root {
  --bg: #ffffff; --side: #f7f7f4; --text: #23262b; --muted: #737780; --line: #e5e4df;
  --code: #f6f6f2; --hover: #eeede8; --sel: #e4e9e4; --accent: #1f6f54;
  --red: #cf4b3f; --amber: #c58a12; --green: #3b9460;
  --k: #8a3ea8; --s: #1e6b3e; --c: #8a8f98; --n: #a8580a; --f: #1456b0; --t: #2f6a86;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181b; --side: #1c1d21; --text: #e2e2de; --muted: #8d919a; --line: #2c2e33;
    --code: #1f2125; --hover: #25272c; --sel: #26302b; --accent: #6fbf9c;
    --red: #e0695e; --amber: #d9a441; --green: #5fb583;
    --k: #c79bf2; --s: #8fcf9f; --c: #747983; --n: #e0a66c; --f: #7fb4f5; --t: #7fc1d9;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.75 var(--sans); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.app { display: grid; grid-template-columns: 330px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
.main { min-width: 0; overflow-y: auto; }

/* 侧栏 */
.side-head { padding: 12px 12px 8px; }
.searchrow { display: flex; gap: 6px; }
.searchrow input { flex: 1; min-width: 0; }
#more { width: 32px; color: var(--muted); border-radius: 6px; font-size: 16px; }
#more { position: relative; }
#more:hover, #more.on { background: var(--hover); color: var(--text); }
#more.filtered::after { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.panel { margin-top: 10px; }
.panel .acts { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
.panel .acts button { color: var(--muted); } .panel .acts button:hover { color: var(--text); }
.panel .acts label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.panel[hidden] { display: none; }
.bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--line); margin-bottom: 10px; }
.bar i { display: block; }
.bar .l3 { background: var(--green); } .bar .l2 { background: var(--amber); } .bar .l1 { background: var(--red); }
.searchrow input[type=search], .panel select {
  width: 100%; height: 32px; padding: 0 9px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; outline: none;
  font-size: 13px; -webkit-appearance: none; appearance: none;
}
.searchrow input:focus, .panel select:focus { border-color: var(--accent); }
.panel .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chips button { font-size: 12px; line-height: 22px; padding: 0 8px; border-radius: 11px; color: var(--muted); border: 1px solid transparent; }
.chips button:hover { background: var(--hover); }
.chips button.on { color: var(--text); background: var(--bg); border-color: var(--line); }
.chips b { font-weight: 400; opacity: .7; margin-left: 2px; font-variant-numeric: tabular-nums; }

.list { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 4px 8px 12px; list-style: none; border-top: 1px solid var(--line); }
.list .group { padding: 12px 8px 4px; font-size: 12px; color: var(--muted); }
.item { display: grid; grid-template-columns: 24px minmax(0, 1fr) 8px; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14.5px; }
.item:hover { background: var(--hover); }
.item.active { background: var(--sel); }
.item .no { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.item .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.dot.l1 { background: var(--red); border-color: var(--red); }
.dot.l2 { background: var(--amber); border-color: var(--amber); }
.dot.l3 { background: var(--green); border-color: var(--green); }
.empty { padding: 24px 8px; color: var(--muted); font-size: 13px; text-align: center; }


:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.searchrow input:focus-visible, .panel select:focus-visible { outline: none; }

/* 正文 */
.doc { max-width: 760px; margin: 0 auto; padding: 48px 32px 80px; }
.back { display: none; color: var(--muted); }
.head { display: flex; align-items: flex-start; gap: 16px; }
.head h2.title { flex: 1; font-size: 26px; line-height: 1.35; margin: 0; font-weight: 650; }
.solve { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 8px;
  background: var(--accent); color: var(--bg); font-size: 14px; font-weight: 600; }
.solve:hover { text-decoration: none; filter: brightness(1.08); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
.tags span { font-size: 13px; line-height: 26px; padding: 0 10px; border-radius: 13px; background: var(--sel); color: var(--text); }
.tags .lv1 { color: var(--green); } .tags .lv2 { color: var(--amber); } .tags .lv3 { color: var(--red); }
.desc { margin: 16px 0 8px; padding: 12px 16px; background: var(--code); border-radius: 8px; font-size: 16px; }
.reveal { display: block; width: 100%; margin-top: 28px; padding: 32px 0; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
.reveal:hover { background: var(--code); color: var(--text); }
.end { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; padding: 6px 0; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
.seg button:hover { background: var(--hover); color: var(--text); }
.seg button.on { color: #fff; border-color: transparent; }
.seg button.on.l1 { background: var(--red); } .seg button.on.l2 { background: var(--amber); } .seg button.on.l3 { background: var(--green); }
.pager { display: flex; justify-content: space-between; gap: 16px; }
.pager a { max-width: 48%; color: var(--muted); }
.pager a:hover { color: var(--text); text-decoration: none; }
.pager .nx { margin-left: auto; text-align: right; }

.note h1 { font-size: 22px; margin: 0 0 10px; }
.note h2 { font-size: 19px; margin: 36px 0 10px; font-weight: 650; }
.note h3 { font-size: 16.5px; margin: 20px 0 6px; font-weight: 650; }
.note h4 { font-size: 16px; margin: 16px 0 4px; }
.note p { margin: 10px 0; }
.note ul, .note ol { margin: 6px 0; padding-left: 22px; }
.note li { margin: 5px 0; }
.note blockquote { margin: 10px 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.note code { font: 14px var(--mono); background: var(--code); padding: 1px 5px; border-radius: 4px; }
.code { position: relative; margin: 10px 0 14px; }
.code pre { margin: 0; padding: 14px 16px; background: var(--code); border-radius: 8px; overflow-x: auto; }
.code pre code { font: 14px/1.65 var(--mono); background: none; padding: 0; white-space: pre; tab-size: 4; }
.code .langs { position: absolute; top: 8px; right: 10px; opacity: 0; transition: opacity .15s; display: flex; gap: 2px; z-index: 1; }
.code:hover .langs, .code .langs:focus-within { opacity: 1; }
.code .langs .copy { margin-left: 4px; }
.code .langs button { font-size: 12px; padding: 0 7px; line-height: 20px; border-radius: 4px; color: var(--muted); background: var(--code); }
.code .langs button:hover { color: var(--text); }
body[data-lang=python] .langs [data-set-lang=python], body[data-lang=java] .langs [data-set-lang=java] { color: var(--text); background: var(--bg); box-shadow: 0 0 0 1px var(--line); }
body[data-lang=python] .code.multi pre[data-lang=java], body[data-lang=java] .code.multi pre[data-lang=python] { display: none; }
.code .k { color: var(--k); } .code .s { color: var(--s); } .code .c { color: var(--c); font-style: italic; }
.code .n { color: var(--n); } .code .f { color: var(--f); } .code .t { color: var(--t); }
.libs-doc h2 { font-size: 21px; margin-top: 40px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.libs-doc h3 { font-size: 17px; margin-top: 28px; scroll-margin-top: 16px; }
.toc { font-size: 14px; color: var(--muted); margin: 6px 0; }
.toc a { margin-right: 10px; white-space: nowrap; }
.welcome { color: var(--muted); padding-top: 18vh; text-align: center; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .app .main { display: none; }
  .app.detail .side { display: none; }
  .app.detail .main { display: block; }
  .doc { padding: 0 16px 60px; }
  .back { display: block; position: sticky; top: 0; z-index: 2; width: calc(100% + 32px); text-align: left; margin: 0 -16px 12px; padding: 12px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .head { flex-direction: column; gap: 12px; }
  .code .langs { opacity: 1; }
  .item { padding: 8px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="searchrow">
        <input id="q" type="search" placeholder="搜索" autocomplete="off">
        <button id="more" type="button" aria-label="更多" title="筛选 / 工具">⋯</button>
      </div>
      <div class="panel" id="panel" hidden>
        <div class="bar" id="bar"></div>
        <div class="row">
          <select id="tag" aria-label="分类"></select>
          <select id="sort" aria-label="排序">
            <option value="rank">按频度</option>
            <option value="tag">按分类</option>
            <option value="level">按掌握</option>
          </select>
        </div>
        <div class="chips" id="chips"></div>
        <div class="acts">
          <label title="先回忆，再显示笔记 (空格)"><input type="checkbox" id="recall"> 回忆</label>
          <button id="random" type="button">随机</button>
          <button id="export" type="button">导出</button>
          <button id="import" type="button">导入</button>
          <a href="#/libs">常用库</a>
          <input id="file" type="file" accept="application/json,.json" hidden>
        </div>
      </div>
    </div>
    <ol class="list" id="list"></ol>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
const DATA = {"problems":[{"key":"3","rank":1,"id":"3","title":"无重复字符的最长子串","difficulty":"中等","tags":["滑动窗口","哈希表"],"freq":1228,"link":"https://leetcode.cn/problems/longest-substring-without-repeating-characters/","desc":"求字符串中不含重复字符的最长子串的长度。","libs":["java-15"],"html":"<h2>思路<\/h2>\n<ul><li>滑动窗口，左闭右开 <code>[l, r)<\/code>，<code>window<\/code> 记录窗口内每个字符的出现次数。<\/li><li>右边进一个字符 <code>c<\/code> → 只要 <code>window[c] &gt; 1<\/code> 就一直收缩左边 → 窗口合法后更新答案。<\/li><li>进 <code>c<\/code> 之前窗口无重复，所以进来之后<strong>只有 <code>c<\/code> 可能重复<\/strong>，不用检查整个表。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>收缩用 <code>while<\/code> 不是 <code>if<\/code>：<code>&quot;abcb&quot;<\/code> 要连续移出 <code>a<\/code>、<code>b<\/code>。<\/li><li>先收缩、再更新答案；长度是 <code>r - l<\/code>（<code>r<\/code> 已经自增过）。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">lengthOfLongestSubstring<\/span>(self, s: str) -&gt; int:\n        window = {}                      <span class=\"c\"># 字符 -&gt; 窗口内出现次数<\/span>\n        l = r = res = <span class=\"n\">0<\/span>\n        <span class=\"k\">while<\/span> r &lt; len(s):\n            c = s[r]\n            r += <span class=\"n\">1<\/span>\n            window[c] = window.get(c, <span class=\"n\">0<\/span>) + <span class=\"n\">1<\/span>\n            <span class=\"k\">while<\/span> window[c] &gt; <span class=\"n\">1<\/span>:         <span class=\"c\"># 只有刚进来的 c 可能重复<\/span>\n                window[s[l]] -= <span class=\"n\">1<\/span>\n                l += <span class=\"n\">1<\/span>\n            res = max(res, r - l)        <span class=\"c\"># 左闭右开，长度 r - l<\/span>\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> lengthOfLongestSubstring(<span class=\"t\">String<\/span> s) {\n        <span class=\"t\">Map<\/span>&lt;<span class=\"t\">Character<\/span>, <span class=\"t\">Integer<\/span>&gt; window = <span class=\"k\">new<\/span> <span class=\"t\">HashMap<\/span>&lt;&gt;();   <span class=\"c\">// 字符 -&gt; 窗口内出现次数<\/span>\n        <span class=\"k\">int<\/span> l = <span class=\"n\">0<\/span>, r = <span class=\"n\">0<\/span>, res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">while<\/span> (r &lt; s.length()) {\n            <span class=\"k\">char<\/span> c = s.charAt(r++);\n            window.merge(c, <span class=\"n\">1<\/span>, <span class=\"t\">Integer<\/span>::sum);\n            <span class=\"k\">while<\/span> (window.get(c) &gt; <span class=\"n\">1<\/span>) {                     <span class=\"c\">// 只有刚进来的 c 可能重复<\/span>\n                window.merge(s.charAt(l++), -<span class=\"n\">1<\/span>, <span class=\"t\">Integer<\/span>::sum);\n            }\n            res = <span class=\"t\">Math<\/span>.max(res, r - l);                     <span class=\"c\">// 左闭右开，长度 r - l<\/span>\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)（左右指针都只向右走），空间 O(字符集)。<\/p>"},{"key":"146","rank":2,"id":"146","title":"LRU缓存机制","difficulty":"中等","tags":["设计","哈希表","链表"],"freq":969,"link":"https://leetcode.cn/problems/lru-cache/","desc":"实现 get / put 都是 O(1) 的 LRU 缓存，超出容量时淘汰最久未使用的 key。","libs":["python-3","java-15","java-16"],"html":"<h2>思路<\/h2>\n<ul><li><strong>哈希表 + 双向链表<\/strong>：哈希表 O(1) 找节点，双向链表维护使用顺序。<\/li><li>约定：<strong>刚访问的放尾部，头部永远是最久未用的<\/strong>，淘汰时删头。<\/li><li><code>get<\/code>：存在就挪到尾部。<code>put<\/code>：已存在则更新并挪到尾部；不存在则插到尾部，超容量删头。<\/li><li>写法一直接用语言自带的有序哈希表；面试官说「不能用库」时写写法二。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>手写链表时节点要存 <code>key<\/code>：淘汰头节点时还得用它去删哈希表。<\/li><li>用两个哨兵 <code>head<\/code> / <code>tail<\/code>，<code>remove<\/code>、<code>addLast<\/code> 就不用判空。<\/li><li><code>put<\/code> 已存在的 key 也算一次访问，要挪到尾部。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：LinkedHashMap / OrderedDict<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">LRUCache<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">__init__<\/span>(self, capacity: int):\n        self.cap = capacity\n        self.cache = OrderedDict()             <span class=\"c\"># 头部最久未用，尾部最近使用<\/span>\n\n    <span class=\"k\">def<\/span> <span class=\"f\">get<\/span>(self, key: int) -&gt; int:\n        <span class=\"k\">if<\/span> key <span class=\"k\">not<\/span> <span class=\"k\">in<\/span> self.cache:\n            <span class=\"k\">return<\/span> -<span class=\"n\">1<\/span>\n        self.cache.move_to_end(key)\n        <span class=\"k\">return<\/span> self.cache[key]\n\n    <span class=\"k\">def<\/span> <span class=\"f\">put<\/span>(self, key: int, value: int) -&gt; <span class=\"k\">None<\/span>:\n        self.cache[key] = value\n        self.cache.move_to_end(key)\n        <span class=\"k\">if<\/span> len(self.cache) &gt; self.cap:\n            self.cache.popitem(last=<span class=\"k\">False<\/span>)     <span class=\"c\"># 弹出头部<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">LRUCache<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"k\">int<\/span> cap;\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">LinkedHashMap<\/span>&lt;<span class=\"t\">Integer<\/span>, <span class=\"t\">Integer<\/span>&gt; map = <span class=\"k\">new<\/span> <span class=\"t\">LinkedHashMap<\/span>&lt;&gt;();   <span class=\"c\">// 头部最久未用，尾部最近使用<\/span>\n\n    <span class=\"k\">public<\/span> <span class=\"t\">LRUCache<\/span>(<span class=\"k\">int<\/span> capacity) {\n        cap = capacity;\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> get(<span class=\"k\">int<\/span> key) {\n        <span class=\"k\">if<\/span> (!map.containsKey(key)) <span class=\"k\">return<\/span> -<span class=\"n\">1<\/span>;\n        <span class=\"k\">int<\/span> val = map.remove(key);             <span class=\"c\">// 删掉再放回尾部 = 标记为最近使用<\/span>\n        map.put(key, val);\n        <span class=\"k\">return<\/span> val;\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">void<\/span> put(<span class=\"k\">int<\/span> key, <span class=\"k\">int<\/span> value) {\n        map.remove(key);\n        map.put(key, value);\n        <span class=\"k\">if<\/span> (map.size() &gt; cap) {\n            map.remove(map.keySet().iterator().next());   <span class=\"c\">// 第一个 key 就是最久未用<\/span>\n        }\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：手写双向链表<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Node<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">__init__<\/span>(self, key=<span class=\"n\">0<\/span>, val=<span class=\"n\">0<\/span>):\n        self.key, self.val = key, val\n        self.prev = self.next = <span class=\"k\">None<\/span>\n\n\n<span class=\"k\">class<\/span> <span class=\"f\">LRUCache<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">__init__<\/span>(self, capacity: int):\n        self.cap = capacity\n        self.map = {}                          <span class=\"c\"># key -&gt; Node<\/span>\n        self.head, self.tail = Node(), Node()  <span class=\"c\"># 哨兵：head 后面最久未用，tail 前面最近使用<\/span>\n        self.head.next, self.tail.prev = self.tail, self.head\n\n    <span class=\"k\">def<\/span> <span class=\"f\">_remove<\/span>(self, node):\n        node.prev.next, node.next.prev = node.next, node.prev\n\n    <span class=\"k\">def<\/span> <span class=\"f\">_add_last<\/span>(self, node):\n        node.prev, node.next = self.tail.prev, self.tail\n        self.tail.prev.next = node\n        self.tail.prev = node\n\n    <span class=\"k\">def<\/span> <span class=\"f\">get<\/span>(self, key: int) -&gt; int:\n        <span class=\"k\">if<\/span> key <span class=\"k\">not<\/span> <span class=\"k\">in<\/span> self.map:\n            <span class=\"k\">return<\/span> -<span class=\"n\">1<\/span>\n        node = self.map[key]\n        self._remove(node)\n        self._add_last(node)\n        <span class=\"k\">return<\/span> node.val\n\n    <span class=\"k\">def<\/span> <span class=\"f\">put<\/span>(self, key: int, value: int) -&gt; <span class=\"k\">None<\/span>:\n        <span class=\"k\">if<\/span> key <span class=\"k\">in<\/span> self.map:\n            node = self.map[key]\n            node.val = value\n            self._remove(node)\n        <span class=\"k\">else<\/span>:\n            <span class=\"k\">if<\/span> len(self.map) == self.cap:\n                old = self.head.next\n                self._remove(old)\n                <span class=\"k\">del<\/span> self.map[old.key]\n            node = Node(key, value)\n            self.map[key] = node\n        self._add_last(node)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">LRUCache<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">static<\/span> <span class=\"k\">class<\/span> <span class=\"t\">Node<\/span> {\n        <span class=\"k\">int<\/span> key, val;\n        <span class=\"t\">Node<\/span> prev, next;\n        <span class=\"t\">Node<\/span>(<span class=\"k\">int<\/span> key, <span class=\"k\">int<\/span> val) { <span class=\"k\">this<\/span>.key = key; <span class=\"k\">this<\/span>.val = val; }\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"k\">int<\/span> cap;\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Map<\/span>&lt;<span class=\"t\">Integer<\/span>, <span class=\"t\">Node<\/span>&gt; map = <span class=\"k\">new<\/span> <span class=\"t\">HashMap<\/span>&lt;&gt;();\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Node<\/span> head = <span class=\"k\">new<\/span> <span class=\"t\">Node<\/span>(<span class=\"n\">0<\/span>, <span class=\"n\">0<\/span>), tail = <span class=\"k\">new<\/span> <span class=\"t\">Node<\/span>(<span class=\"n\">0<\/span>, <span class=\"n\">0<\/span>);   <span class=\"c\">// 哨兵：head 后面最久未用，tail 前面最近使用<\/span>\n\n    <span class=\"k\">public<\/span> <span class=\"t\">LRUCache<\/span>(<span class=\"k\">int<\/span> capacity) {\n        cap = capacity;\n        head.next = tail;\n        tail.prev = head;\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> get(<span class=\"k\">int<\/span> key) {\n        <span class=\"t\">Node<\/span> node = map.get(key);\n        <span class=\"k\">if<\/span> (node == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> -<span class=\"n\">1<\/span>;\n        remove(node);\n        addLast(node);\n        <span class=\"k\">return<\/span> node.val;\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">void<\/span> put(<span class=\"k\">int<\/span> key, <span class=\"k\">int<\/span> value) {\n        <span class=\"t\">Node<\/span> node = map.get(key);\n        <span class=\"k\">if<\/span> (node != <span class=\"k\">null<\/span>) {\n            node.val = value;\n            remove(node);\n        } <span class=\"k\">else<\/span> {\n            <span class=\"k\">if<\/span> (map.size() == cap) {\n                <span class=\"t\">Node<\/span> old = head.next;\n                remove(old);\n                map.remove(old.key);\n            }\n            node = <span class=\"k\">new<\/span> <span class=\"t\">Node<\/span>(key, value);\n            map.put(key, node);\n        }\n        addLast(node);\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> remove(<span class=\"t\">Node<\/span> node) {\n        node.prev.next = node.next;\n        node.next.prev = node.prev;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> addLast(<span class=\"t\">Node<\/span> node) {\n        node.prev = tail.prev;\n        node.next = tail;\n        tail.prev.next = node;\n        tail.prev = node;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：<code>get<\/code> / <code>put<\/code> 均 O(1)，空间 O(capacity)。<\/p>"},{"key":"206","rank":3,"id":"206","title":"反转链表","difficulty":"简单","tags":["链表"],"freq":762,"link":"https://leetcode.cn/problems/reverse-linked-list/","desc":"反转单链表，返回新的头节点。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li><strong>迭代<\/strong>：<code>pre / cur / nxt<\/code> 三指针滚动，每轮只做一件事——把 <code>cur.next<\/code> 指向 <code>pre<\/code>，然后整体后移。<\/li><li><strong>递归<\/strong>：先反转后面的链表拿到新头 <code>last<\/code>，再把当前节点接到尾部：<code>head.next.next = head; head.next = null<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>迭代必须先存 <code>nxt<\/code> 再改指针，否则断链；最后返回 <code>pre<\/code>（此时 <code>cur<\/code> 为空）。<\/li><li>递归别忘了 <code>head.next = null<\/code>，否则头两个节点成环。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>迭代<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">reverseList<\/span>(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:\n        pre, cur = <span class=\"k\">None<\/span>, head\n        <span class=\"k\">while<\/span> cur:\n            nxt = cur.next\n            cur.next = pre\n            pre, cur = cur, nxt\n        <span class=\"k\">return<\/span> pre<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> reverseList(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"t\">ListNode<\/span> pre = <span class=\"k\">null<\/span>, cur = head;\n        <span class=\"k\">while<\/span> (cur != <span class=\"k\">null<\/span>) {\n            <span class=\"t\">ListNode<\/span> nxt = cur.next;\n            cur.next = pre;\n            pre = cur;\n            cur = nxt;\n        }\n        <span class=\"k\">return<\/span> pre;\n    }\n}<\/code><\/pre><\/div>\n<h3>递归<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">reverseList<\/span>(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> head <span class=\"k\">or<\/span> <span class=\"k\">not<\/span> head.next:\n            <span class=\"k\">return<\/span> head\n        last = self.reverseList(head.next)   <span class=\"c\"># last 始终是反转后的新头<\/span>\n        head.next.next = head\n        head.next = <span class=\"k\">None<\/span>\n        <span class=\"k\">return<\/span> last<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> reverseList(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"k\">if<\/span> (head == <span class=\"k\">null<\/span> || head.next == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> head;\n        <span class=\"t\">ListNode<\/span> last = reverseList(head.next);   <span class=\"c\">// last 始终是反转后的新头<\/span>\n        head.next.next = head;\n        head.next = <span class=\"k\">null<\/span>;\n        <span class=\"k\">return<\/span> last;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)；空间迭代 O(1)，递归 O(n)（栈）。<\/p>"},{"key":"215","rank":4,"id":"215","title":"数组中的第K个最大元素","difficulty":"中等","tags":["排序","快速选择","堆"],"freq":608,"link":"https://leetcode.cn/problems/kth-largest-element-in-an-array/","desc":"求数组中第 k 大的元素（排序后的第 k 大，不去重）。","libs":["python-1","python-10","java-14","java-23"],"html":"<h2>思路<\/h2>\n<ul><li><strong>快速选择<\/strong>：第 k 大 = 升序后下标 <code>target = n - k<\/code>。每次 partition 后 pivot 落在最终位置，只需往 <code>target<\/code> 所在的那一侧继续找，平均 O(n)。<\/li><li><strong>小顶堆<\/strong>：堆里只留最大的 k 个，堆顶就是答案，O(n log k)；数据流或 k 很小时更合适。<\/li><li>手写堆（建堆 + siftDown）见 <a href=\"#/bu4\">补充题4<\/a> 的堆排序。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>pivot 要<strong>随机选<\/strong>，否则有序输入退化到 O(n²)。<\/li><li>用<strong>三路划分<\/strong>（<code>&lt;<\/code>、<code>==<\/code>、<code>&gt;<\/code>）：LeetCode 有大量重复元素的用例，双路划分会超时。原笔记里固定取 <code>nums[lo]<\/code> 的双路 partition 现在过不了。<\/li><li><code>target<\/code> 落在 <code>[lt, gt]<\/code> 内说明就是 pivot，直接返回。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：快速选择<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">findKthLargest<\/span>(self, nums: List[int], k: int) -&gt; int:\n        target = len(nums) - k               <span class=\"c\"># 第 k 大 = 升序后的下标 n - k<\/span>\n        lo, hi = <span class=\"n\">0<\/span>, len(nums) - <span class=\"n\">1<\/span>\n        <span class=\"k\">while<\/span> <span class=\"k\">True<\/span>:\n            pivot = nums[random.randint(lo, hi)]\n            lt, i, gt = lo, lo, hi           <span class=\"c\"># [lo,lt) &lt; pivot，[lt,i) == pivot，(gt,hi] &gt; pivot<\/span>\n            <span class=\"k\">while<\/span> i &lt;= gt:\n                <span class=\"k\">if<\/span> nums[i] &lt; pivot:\n                    nums[lt], nums[i] = nums[i], nums[lt]\n                    lt += <span class=\"n\">1<\/span>\n                    i += <span class=\"n\">1<\/span>\n                <span class=\"k\">elif<\/span> nums[i] &gt; pivot:\n                    nums[gt], nums[i] = nums[i], nums[gt]\n                    gt -= <span class=\"n\">1<\/span>\n                <span class=\"k\">else<\/span>:\n                    i += <span class=\"n\">1<\/span>\n            <span class=\"k\">if<\/span> target &lt; lt:\n                hi = lt - <span class=\"n\">1<\/span>\n            <span class=\"k\">elif<\/span> target &gt; gt:\n                lo = gt + <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:\n                <span class=\"k\">return<\/span> pivot<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Random<\/span> rand = <span class=\"k\">new<\/span> <span class=\"t\">Random<\/span>();\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> findKthLargest(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> k) {\n        <span class=\"k\">int<\/span> target = nums.length - k;            <span class=\"c\">// 第 k 大 = 升序后的下标 n - k<\/span>\n        <span class=\"k\">int<\/span> lo = <span class=\"n\">0<\/span>, hi = nums.length - <span class=\"n\">1<\/span>;\n        <span class=\"k\">while<\/span> (<span class=\"k\">true<\/span>) {\n            <span class=\"k\">int<\/span> pivot = nums[lo + rand.nextInt(hi - lo + <span class=\"n\">1<\/span>)];\n            <span class=\"k\">int<\/span> lt = lo, i = lo, gt = hi;        <span class=\"c\">// [lo,lt) &lt; pivot，[lt,i) == pivot，(gt,hi] &gt; pivot<\/span>\n            <span class=\"k\">while<\/span> (i &lt;= gt) {\n                <span class=\"k\">if<\/span> (nums[i] &lt; pivot) swap(nums, lt++, i++);\n                <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (nums[i] &gt; pivot) swap(nums, i, gt--);\n                <span class=\"k\">else<\/span> i++;\n            }\n            <span class=\"k\">if<\/span> (target &lt; lt) hi = lt - <span class=\"n\">1<\/span>;\n            <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (target &gt; gt) lo = gt + <span class=\"n\">1<\/span>;\n            <span class=\"k\">else<\/span> <span class=\"k\">return<\/span> pivot;\n        }\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> swap(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> i, <span class=\"k\">int<\/span> j) {\n        <span class=\"k\">int<\/span> tmp = nums[i];\n        nums[i] = nums[j];\n        nums[j] = tmp;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：大小为 k 的小顶堆<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">findKthLargest<\/span>(self, nums: List[int], k: int) -&gt; int:\n        heap = []                            <span class=\"c\"># 小顶堆，只留最大的 k 个<\/span>\n        <span class=\"k\">for<\/span> x <span class=\"k\">in<\/span> nums:\n            heapq.heappush(heap, x)\n            <span class=\"k\">if<\/span> len(heap) &gt; k:\n                heapq.heappop(heap)\n        <span class=\"k\">return<\/span> heap[<span class=\"n\">0<\/span>]<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> findKthLargest(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> k) {\n        <span class=\"t\">PriorityQueue<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; pq = <span class=\"k\">new<\/span> <span class=\"t\">PriorityQueue<\/span>&lt;&gt;();   <span class=\"c\">// 小顶堆，只留最大的 k 个<\/span>\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> x : nums) {\n            pq.offer(x);\n            <span class=\"k\">if<\/span> (pq.size() &gt; k) pq.poll();\n        }\n        <span class=\"k\">return<\/span> pq.peek();\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：快速选择平均 O(n)、空间 O(1)；堆 O(n log k)、空间 O(k)。<\/p>"},{"key":"25","rank":5,"id":"25","title":"K 个一组翻转链表","difficulty":"困难","tags":["链表"],"freq":541,"link":"https://leetcode.cn/problems/reverse-nodes-in-k-group/","desc":"每 k 个节点一组翻转链表，最后不足 k 个的保持原样。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>递归：先让 <code>b<\/code> 从 <code>head<\/code> 走 k 步，走不满说明不足 k 个，直接返回 <code>head<\/code>。<\/li><li>反转 <code>[a, b)<\/code> 这一组，得到新头 <code>newHead<\/code>；反转后 <code>a<\/code> 变成这组的尾。<\/li><li><code>a.next = reverseKGroup(b, k)<\/code> 接上后面递归处理好的部分，返回 <code>newHead<\/code>。<\/li><li>「反转 <code>[a, b)<\/code>」就是 <a href=\"#/206\">206<\/a> 的迭代写法，把终止条件从 <code>null<\/code> 换成 <code>b<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>先数够 k 个再反转；不足 k 个要原样返回（不是返回 <code>null<\/code>）。<\/li><li>反转的是左闭右开 <code>[a, b)<\/code>，循环条件 <code>cur != b<\/code>。<\/li><li>递归深度 n/k；要求 O(1) 额外空间时改成迭代：用 <code>dummy<\/code> + 每组的前驱节点 <code>pre<\/code>，逐组「反转 + 接回」。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">reverseKGroup<\/span>(self, head: Optional[ListNode], k: int) -&gt; Optional[ListNode]:\n        a = b = head\n        <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(k):                   <span class=\"c\"># b 走到下一组的头；不足 k 个直接返回<\/span>\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> b:\n                <span class=\"k\">return<\/span> head\n            b = b.next\n        new_head = self.reverse(a, b)        <span class=\"c\"># 反转 [a, b)，反转后 a 是这组的尾<\/span>\n        a.next = self.reverseKGroup(b, k)\n        <span class=\"k\">return<\/span> new_head\n\n    <span class=\"k\">def<\/span> <span class=\"f\">reverse<\/span>(self, a, b):\n        <span class=\"s\">&quot;&quot;&quot;反转左闭右开区间 [a, b)，返回新头&quot;&quot;&quot;<\/span>\n        pre, cur = <span class=\"k\">None<\/span>, a\n        <span class=\"k\">while<\/span> cur <span class=\"k\">is<\/span> <span class=\"k\">not<\/span> b:\n            nxt = cur.next\n            cur.next = pre\n            pre, cur = cur, nxt\n        <span class=\"k\">return<\/span> pre<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> reverseKGroup(<span class=\"t\">ListNode<\/span> head, <span class=\"k\">int<\/span> k) {\n        <span class=\"t\">ListNode<\/span> a = head, b = head;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; k; i++) {            <span class=\"c\">// b 走到下一组的头；不足 k 个直接返回<\/span>\n            <span class=\"k\">if<\/span> (b == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> head;\n            b = b.next;\n        }\n        <span class=\"t\">ListNode<\/span> newHead = reverse(a, b);        <span class=\"c\">// 反转 [a, b)，反转后 a 是这组的尾<\/span>\n        a.next = reverseKGroup(b, k);\n        <span class=\"k\">return<\/span> newHead;\n    }\n\n    <span class=\"c\">// 反转左闭右开区间 [a, b)，返回新头<\/span>\n    <span class=\"k\">private<\/span> <span class=\"t\">ListNode<\/span> reverse(<span class=\"t\">ListNode<\/span> a, <span class=\"t\">ListNode<\/span> b) {\n        <span class=\"t\">ListNode<\/span> pre = <span class=\"k\">null<\/span>, cur = a;\n        <span class=\"k\">while<\/span> (cur != b) {\n            <span class=\"t\">ListNode<\/span> nxt = cur.next;\n            cur.next = pre;\n            pre = cur;\n            cur = nxt;\n        }\n        <span class=\"k\">return<\/span> pre;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n/k)（递归栈）。<\/p>"},{"key":"15","rank":6,"id":"15","title":"三数之和","difficulty":"中等","tags":["双指针","排序"],"freq":498,"link":"https://leetcode.cn/problems/3sum/","desc":"找出数组中所有和为 0 且不重复的三元组。","libs":["python-5","java-20","java-21"],"html":"<h2>思路<\/h2>\n<ul><li><strong>排序 + 固定一个数 + 两数之和（左右双指针）<\/strong>。<\/li><li>枚举第一个数 <code>nums[i]<\/code>，在 <code>[i+1, n-1]<\/code> 里用 <code>lo / hi<\/code> 夹：和小了 <code>lo++<\/code>，大了 <code>hi--<\/code>，等于 0 记录答案。<\/li><li>剪枝：排序后 <code>nums[i] &gt; 0<\/code> 直接 <code>break<\/code>。<\/li><li>同套路：最接近的三数之和、四数之和。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>去重有两处：① 第一个数 <code>i &gt; 0 &amp;&amp; nums[i] == nums[i-1]<\/code> 跳过；② 找到答案后 <code>lo<\/code>、<code>hi<\/code> 各自跳过相同值。<\/li><li>去重之后<strong>还要再 <code>lo++ / hi--<\/code><\/strong>，否则死循环。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">threeSum<\/span>(self, nums: List[int]) -&gt; List[List[int]]:\n        nums.sort()\n        n, res = len(nums), []\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(n):\n            <span class=\"k\">if<\/span> nums[i] &gt; <span class=\"n\">0<\/span>:\n                <span class=\"k\">break<\/span>\n            <span class=\"k\">if<\/span> i &gt; <span class=\"n\">0<\/span> <span class=\"k\">and<\/span> nums[i] == nums[i - <span class=\"n\">1<\/span>]:      <span class=\"c\"># 第一个数去重<\/span>\n                <span class=\"k\">continue<\/span>\n            lo, hi = i + <span class=\"n\">1<\/span>, n - <span class=\"n\">1<\/span>\n            <span class=\"k\">while<\/span> lo &lt; hi:\n                s = nums[i] + nums[lo] + nums[hi]\n                <span class=\"k\">if<\/span> s &lt; <span class=\"n\">0<\/span>:\n                    lo += <span class=\"n\">1<\/span>\n                <span class=\"k\">elif<\/span> s &gt; <span class=\"n\">0<\/span>:\n                    hi -= <span class=\"n\">1<\/span>\n                <span class=\"k\">else<\/span>:\n                    res.append([nums[i], nums[lo], nums[hi]])\n                    <span class=\"k\">while<\/span> lo &lt; hi <span class=\"k\">and<\/span> nums[lo] == nums[lo + <span class=\"n\">1<\/span>]:   <span class=\"c\"># 左右去重<\/span>\n                        lo += <span class=\"n\">1<\/span>\n                    <span class=\"k\">while<\/span> lo &lt; hi <span class=\"k\">and<\/span> nums[hi] == nums[hi - <span class=\"n\">1<\/span>]:\n                        hi -= <span class=\"n\">1<\/span>\n                    lo += <span class=\"n\">1<\/span>\n                    hi -= <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; threeSum(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n        <span class=\"t\">Arrays<\/span>.sort(nums);\n        <span class=\"k\">int<\/span> n = nums.length;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; n; i++) {\n            <span class=\"k\">if<\/span> (nums[i] &gt; <span class=\"n\">0<\/span>) <span class=\"k\">break<\/span>;\n            <span class=\"k\">if<\/span> (i &gt; <span class=\"n\">0<\/span> &amp;&amp; nums[i] == nums[i - <span class=\"n\">1<\/span>]) <span class=\"k\">continue<\/span>;       <span class=\"c\">// 第一个数去重<\/span>\n            <span class=\"k\">int<\/span> lo = i + <span class=\"n\">1<\/span>, hi = n - <span class=\"n\">1<\/span>;\n            <span class=\"k\">while<\/span> (lo &lt; hi) {\n                <span class=\"k\">int<\/span> sum = nums[i] + nums[lo] + nums[hi];\n                <span class=\"k\">if<\/span> (sum &lt; <span class=\"n\">0<\/span>) {\n                    lo++;\n                } <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (sum &gt; <span class=\"n\">0<\/span>) {\n                    hi--;\n                } <span class=\"k\">else<\/span> {\n                    res.add(<span class=\"t\">List<\/span>.of(nums[i], nums[lo], nums[hi]));\n                    <span class=\"k\">while<\/span> (lo &lt; hi &amp;&amp; nums[lo] == nums[lo + <span class=\"n\">1<\/span>]) lo++;   <span class=\"c\">// 左右去重<\/span>\n                    <span class=\"k\">while<\/span> (lo &lt; hi &amp;&amp; nums[hi] == nums[hi - <span class=\"n\">1<\/span>]) hi--;\n                    lo++;\n                    hi--;\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n²)，空间 O(log n)（排序栈，不计答案）。<\/p>"},{"key":"53","rank":7,"id":"53","title":"最大子数组和","difficulty":"中等","tags":["动态规划"],"freq":382,"link":"https://leetcode.cn/problems/maximum-subarray/","desc":"求和最大的连续子数组的和。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li><code>dp[i]<\/code>：<strong>以 <code>nums[i]<\/code> 结尾<\/strong>的最大子数组和。<\/li><li>两种选择：接在前面后面，或者自己重新开始 → <code>dp[i] = max(nums[i], dp[i-1] + nums[i])<\/code>。<\/li><li>本质：前面的和是负数就丢掉。<code>dp[i]<\/code> 只依赖 <code>dp[i-1]<\/code>，压成一个变量。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>答案是所有 <code>dp[i]<\/code> 的最大值，不是 <code>dp[n-1]<\/code>。<\/li><li><code>res<\/code> 初始化成 <code>nums[0]<\/code> 而不是 0（全负数时答案是负的）。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">maxSubArray<\/span>(self, nums: List[int]) -&gt; int:\n        dp = res = nums[<span class=\"n\">0<\/span>]\n        <span class=\"k\">for<\/span> x <span class=\"k\">in<\/span> nums[<span class=\"n\">1<\/span>:]:\n            dp = max(x, dp + x)        <span class=\"c\"># 自己重新开始 or 接在前面后面<\/span>\n            res = max(res, dp)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> maxSubArray(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span> dp = nums[<span class=\"n\">0<\/span>], res = nums[<span class=\"n\">0<\/span>];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt; nums.length; i++) {\n            dp = <span class=\"t\">Math<\/span>.max(nums[i], dp + nums[i]);   <span class=\"c\">// 自己重新开始 or 接在前面后面<\/span>\n            res = <span class=\"t\">Math<\/span>.max(res, dp);\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"5","rank":8,"id":"5","title":"最长回文子串","difficulty":"中等","tags":["字符串","双指针"],"freq":366,"link":"https://leetcode.cn/problems/longest-palindromic-substring/","desc":"返回字符串中最长的回文子串。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li><strong>中心扩散<\/strong>：回文一定有中心，枚举每个中心向两边扩。<\/li><li>两种中心都要试：奇数长度 <code>(i, i)<\/code>，偶数长度 <code>(i, i+1)<\/code>。<\/li><li>扩散函数只返回区间不返回字符串，最后统一截取一次。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>循环退出时 <code>l<\/code>、<code>r<\/code> 已经越界或不相等，真正的回文是左闭右开 <code>[l+1, r)<\/code>，长度 <code>r - l - 1<\/code>。<\/li><li>Java <code>substring(start, end)<\/code> 本身就是左闭右开，不用 <code>+1<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">longestPalindrome<\/span>(self, s: str) -&gt; str:\n        <span class=\"k\">def<\/span> <span class=\"f\">find<\/span>(l, r):\n            <span class=\"k\">while<\/span> l &gt;= <span class=\"n\">0<\/span> <span class=\"k\">and<\/span> r &lt; len(s) <span class=\"k\">and<\/span> s[l] == s[r]:\n                l -= <span class=\"n\">1<\/span>\n                r += <span class=\"n\">1<\/span>\n            <span class=\"k\">return<\/span> l + <span class=\"n\">1<\/span>, r                  <span class=\"c\"># 回文区间 [l+1, r)<\/span>\n\n        start = end = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(len(s)):\n            <span class=\"k\">for<\/span> l, r <span class=\"k\">in<\/span> (find(i, i), find(i, i + <span class=\"n\">1<\/span>)):\n                <span class=\"k\">if<\/span> r - l &gt; end - start:\n                    start, end = l, r\n        <span class=\"k\">return<\/span> s[start:end]<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">String<\/span> longestPalindrome(<span class=\"t\">String<\/span> s) {\n        <span class=\"k\">int<\/span> start = <span class=\"n\">0<\/span>, end = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; s.length(); i++) {\n            <span class=\"k\">int<\/span>[] odd = find(s, i, i), even = find(s, i, i + <span class=\"n\">1<\/span>);\n            <span class=\"k\">if<\/span> (odd[<span class=\"n\">1<\/span>] - odd[<span class=\"n\">0<\/span>] &gt; end - start) { start = odd[<span class=\"n\">0<\/span>]; end = odd[<span class=\"n\">1<\/span>]; }\n            <span class=\"k\">if<\/span> (even[<span class=\"n\">1<\/span>] - even[<span class=\"n\">0<\/span>] &gt; end - start) { start = even[<span class=\"n\">0<\/span>]; end = even[<span class=\"n\">1<\/span>]; }\n        }\n        <span class=\"k\">return<\/span> s.substring(start, end);\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span>[] find(<span class=\"t\">String<\/span> s, <span class=\"k\">int<\/span> l, <span class=\"k\">int<\/span> r) {\n        <span class=\"k\">while<\/span> (l &gt;= <span class=\"n\">0<\/span> &amp;&amp; r &lt; s.length() &amp;&amp; s.charAt(l) == s.charAt(r)) {\n            l--;\n            r++;\n        }\n        <span class=\"k\">return<\/span> <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[]{l + <span class=\"n\">1<\/span>, r};          <span class=\"c\">// 回文区间 [l+1, r)<\/span>\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n²)，空间 O(1)。<\/p>"},{"key":"bu4","rank":9,"id":"补充题4","title":"手撕快速排序","difficulty":"中等","tags":["排序"],"freq":360,"link":"https://leetcode.cn/problems/sort-an-array/","desc":"手写排序（LeetCode 912 排序数组）：快排为主，归并、堆排也要会。","libs":["python-10","java-23"],"html":"<h2>思路<\/h2>\n<ul><li><strong>快排<\/strong> = 随机选 pivot + partition + 递归排左右两段。这里用三路划分：<code>&lt; pivot | == pivot | &gt; pivot<\/code>，中间一段已到位，只递归两边。<\/li><li><strong>归并<\/strong> = 排左半 + 排右半 + 合并两个有序数组（<a href=\"#/88\">88<\/a> / <a href=\"#/21\">21<\/a> 的思路）。稳定，固定 O(n log n)，要额外数组。<\/li><li><strong>堆排<\/strong> = 建大顶堆 → 堆顶换到末尾 → 堆范围减一 → 对堆顶 <code>siftDown<\/code>，重复。原地，不稳定。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>快排必须随机化（随机 pivot 或先 shuffle），否则有序数组退化成 O(n²)。<\/li><li>912 有「全部相同」的大用例：<code>nums[i] &lt;= pivot<\/code> 的双路 partition 每次只切下一个元素，会超时，所以用三路划分。<\/li><li>归并合并时 <code>tmp[i] &lt;= tmp[j]<\/code> 取左边，保证稳定。<\/li><li>堆排：从最后一个非叶子节点 <code>n/2 - 1<\/code> 开始往前建堆；排序阶段 <code>siftDown(0, end)<\/code> 的堆大小是 <code>end<\/code> 不是 <code>n<\/code>，否则会破坏已排好的部分。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>快速排序<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">sortArray<\/span>(self, nums: List[int]) -&gt; List[int]:\n        <span class=\"k\">def<\/span> <span class=\"f\">quick_sort<\/span>(lo, hi):\n            <span class=\"k\">if<\/span> lo &gt;= hi:\n                <span class=\"k\">return<\/span>\n            pivot = nums[random.randint(lo, hi)]\n            lt, i, gt = lo, lo, hi           <span class=\"c\"># [lo,lt) &lt; pivot，[lt,i) == pivot，(gt,hi] &gt; pivot<\/span>\n            <span class=\"k\">while<\/span> i &lt;= gt:\n                <span class=\"k\">if<\/span> nums[i] &lt; pivot:\n                    nums[lt], nums[i] = nums[i], nums[lt]\n                    lt += <span class=\"n\">1<\/span>\n                    i += <span class=\"n\">1<\/span>\n                <span class=\"k\">elif<\/span> nums[i] &gt; pivot:\n                    nums[gt], nums[i] = nums[i], nums[gt]\n                    gt -= <span class=\"n\">1<\/span>\n                <span class=\"k\">else<\/span>:\n                    i += <span class=\"n\">1<\/span>\n            quick_sort(lo, lt - <span class=\"n\">1<\/span>)\n            quick_sort(gt + <span class=\"n\">1<\/span>, hi)\n\n        quick_sort(<span class=\"n\">0<\/span>, len(nums) - <span class=\"n\">1<\/span>)\n        <span class=\"k\">return<\/span> nums<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Random<\/span> rand = <span class=\"k\">new<\/span> <span class=\"t\">Random<\/span>();\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span>[] sortArray(<span class=\"k\">int<\/span>[] nums) {\n        quickSort(nums, <span class=\"n\">0<\/span>, nums.length - <span class=\"n\">1<\/span>);\n        <span class=\"k\">return<\/span> nums;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> quickSort(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> lo, <span class=\"k\">int<\/span> hi) {\n        <span class=\"k\">if<\/span> (lo &gt;= hi) <span class=\"k\">return<\/span>;\n        <span class=\"k\">int<\/span> pivot = nums[lo + rand.nextInt(hi - lo + <span class=\"n\">1<\/span>)];\n        <span class=\"k\">int<\/span> lt = lo, i = lo, gt = hi;            <span class=\"c\">// [lo,lt) &lt; pivot，[lt,i) == pivot，(gt,hi] &gt; pivot<\/span>\n        <span class=\"k\">while<\/span> (i &lt;= gt) {\n            <span class=\"k\">if<\/span> (nums[i] &lt; pivot) swap(nums, lt++, i++);\n            <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (nums[i] &gt; pivot) swap(nums, i, gt--);\n            <span class=\"k\">else<\/span> i++;\n        }\n        quickSort(nums, lo, lt - <span class=\"n\">1<\/span>);\n        quickSort(nums, gt + <span class=\"n\">1<\/span>, hi);\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> swap(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> i, <span class=\"k\">int<\/span> j) {\n        <span class=\"k\">int<\/span> tmp = nums[i];\n        nums[i] = nums[j];\n        nums[j] = tmp;\n    }\n}<\/code><\/pre><\/div>\n<h3>归并排序<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">sortArray<\/span>(self, nums: List[int]) -&gt; List[int]:\n        tmp = [<span class=\"n\">0<\/span>] * len(nums)\n\n        <span class=\"k\">def<\/span> <span class=\"f\">merge_sort<\/span>(lo, hi):\n            <span class=\"k\">if<\/span> lo &gt;= hi:\n                <span class=\"k\">return<\/span>\n            mid = (lo + hi) // <span class=\"n\">2<\/span>\n            merge_sort(lo, mid)\n            merge_sort(mid + <span class=\"n\">1<\/span>, hi)\n            tmp[lo:hi + <span class=\"n\">1<\/span>] = nums[lo:hi + <span class=\"n\">1<\/span>]\n            i, j = lo, mid + <span class=\"n\">1<\/span>\n            <span class=\"k\">for<\/span> k <span class=\"k\">in<\/span> range(lo, hi + <span class=\"n\">1<\/span>):      <span class=\"c\"># 合并 tmp[lo..mid] 和 tmp[mid+1..hi]<\/span>\n                <span class=\"k\">if<\/span> j &gt; hi <span class=\"k\">or<\/span> (i &lt;= mid <span class=\"k\">and<\/span> tmp[i] &lt;= tmp[j]):\n                    nums[k] = tmp[i]\n                    i += <span class=\"n\">1<\/span>\n                <span class=\"k\">else<\/span>:\n                    nums[k] = tmp[j]\n                    j += <span class=\"n\">1<\/span>\n\n        merge_sort(<span class=\"n\">0<\/span>, len(nums) - <span class=\"n\">1<\/span>)\n        <span class=\"k\">return<\/span> nums<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span>[] tmp;\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span>[] sortArray(<span class=\"k\">int<\/span>[] nums) {\n        tmp = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[nums.length];\n        mergeSort(nums, <span class=\"n\">0<\/span>, nums.length - <span class=\"n\">1<\/span>);\n        <span class=\"k\">return<\/span> nums;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> mergeSort(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> lo, <span class=\"k\">int<\/span> hi) {\n        <span class=\"k\">if<\/span> (lo &gt;= hi) <span class=\"k\">return<\/span>;\n        <span class=\"k\">int<\/span> mid = lo + (hi - lo) / <span class=\"n\">2<\/span>;\n        mergeSort(nums, lo, mid);\n        mergeSort(nums, mid + <span class=\"n\">1<\/span>, hi);\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> k = lo; k &lt;= hi; k++) tmp[k] = nums[k];\n        <span class=\"k\">int<\/span> i = lo, j = mid + <span class=\"n\">1<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> k = lo; k &lt;= hi; k++) {         <span class=\"c\">// 合并 tmp[lo..mid] 和 tmp[mid+1..hi]<\/span>\n            <span class=\"k\">if<\/span> (j &gt; hi || (i &lt;= mid &amp;&amp; tmp[i] &lt;= tmp[j])) nums[k] = tmp[i++];\n            <span class=\"k\">else<\/span> nums[k] = tmp[j++];\n        }\n    }\n}<\/code><\/pre><\/div>\n<h3>堆排序<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">sortArray<\/span>(self, nums: List[int]) -&gt; List[int]:\n        <span class=\"k\">def<\/span> <span class=\"f\">sift_down<\/span>(i, n):                 <span class=\"c\"># 在大小为 n 的大顶堆里把 i 下沉到位<\/span>\n            <span class=\"k\">while<\/span> <span class=\"k\">True<\/span>:\n                l, r, mx = <span class=\"n\">2<\/span> * i + <span class=\"n\">1<\/span>, <span class=\"n\">2<\/span> * i + <span class=\"n\">2<\/span>, i\n                <span class=\"k\">if<\/span> l &lt; n <span class=\"k\">and<\/span> nums[l] &gt; nums[mx]:\n                    mx = l\n                <span class=\"k\">if<\/span> r &lt; n <span class=\"k\">and<\/span> nums[r] &gt; nums[mx]:\n                    mx = r\n                <span class=\"k\">if<\/span> mx == i:\n                    <span class=\"k\">return<\/span>\n                nums[i], nums[mx] = nums[mx], nums[i]\n                i = mx\n\n        n = len(nums)\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(n // <span class=\"n\">2<\/span> - <span class=\"n\">1<\/span>, -<span class=\"n\">1<\/span>, -<span class=\"n\">1<\/span>):  <span class=\"c\"># 建堆：从最后一个非叶子节点往前<\/span>\n            sift_down(i, n)\n        <span class=\"k\">for<\/span> end <span class=\"k\">in<\/span> range(n - <span class=\"n\">1<\/span>, <span class=\"n\">0<\/span>, -<span class=\"n\">1<\/span>):      <span class=\"c\"># 堆顶（最大）换到末尾，堆大小缩成 end<\/span>\n            nums[<span class=\"n\">0<\/span>], nums[end] = nums[end], nums[<span class=\"n\">0<\/span>]\n            sift_down(<span class=\"n\">0<\/span>, end)\n        <span class=\"k\">return<\/span> nums<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span>[] sortArray(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span> n = nums.length;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = n / <span class=\"n\">2<\/span> - <span class=\"n\">1<\/span>; i &gt;= <span class=\"n\">0<\/span>; i--) {   <span class=\"c\">// 建堆：从最后一个非叶子节点往前<\/span>\n            siftDown(nums, i, n);\n        }\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> end = n - <span class=\"n\">1<\/span>; end &gt; <span class=\"n\">0<\/span>; end--) {  <span class=\"c\">// 堆顶（最大）换到末尾，堆大小缩成 end<\/span>\n            swap(nums, <span class=\"n\">0<\/span>, end);\n            siftDown(nums, <span class=\"n\">0<\/span>, end);\n        }\n        <span class=\"k\">return<\/span> nums;\n    }\n\n    <span class=\"c\">// 在大小为 n 的大顶堆里把 i 下沉到位<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> siftDown(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> i, <span class=\"k\">int<\/span> n) {\n        <span class=\"k\">while<\/span> (<span class=\"k\">true<\/span>) {\n            <span class=\"k\">int<\/span> l = <span class=\"n\">2<\/span> * i + <span class=\"n\">1<\/span>, r = <span class=\"n\">2<\/span> * i + <span class=\"n\">2<\/span>, max = i;\n            <span class=\"k\">if<\/span> (l &lt; n &amp;&amp; nums[l] &gt; nums[max]) max = l;\n            <span class=\"k\">if<\/span> (r &lt; n &amp;&amp; nums[r] &gt; nums[max]) max = r;\n            <span class=\"k\">if<\/span> (max == i) <span class=\"k\">return<\/span>;\n            swap(nums, i, max);\n            i = max;\n        }\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> swap(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> i, <span class=\"k\">int<\/span> j) {\n        <span class=\"k\">int<\/span> tmp = nums[i];\n        nums[i] = nums[j];\n        nums[j] = tmp;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：快排平均 O(n log n)、最坏 O(n²)、空间 O(log n)；归并 O(n log n)、空间 O(n)；堆排 O(n log n)、空间 O(1)。<\/p>"},{"key":"200","rank":10,"id":"200","title":"岛屿数量","difficulty":"中等","tags":["图","DFS","BFS","矩阵"],"freq":337,"link":"https://leetcode.cn/problems/number-of-islands/","desc":"统计由 '1' 组成的四连通岛屿的数量。","libs":["python-0","java-12"],"html":"<h2>思路<\/h2>\n<ul><li><strong>连通块计数 + Flood Fill<\/strong>：遍历网格，遇到 <code>&#x27;1&#x27;<\/code> 就是一座新岛，<code>res++<\/code>，然后用 DFS / BFS 把整座岛淹成 <code>&#x27;0&#x27;<\/code>。<\/li><li>还能看到 <code>&#x27;1&#x27;<\/code> 说明它没被之前的岛淹过，一定是新连通块。<\/li><li>同类：<a href=\"#/695\">695 岛屿的最大面积<\/a>、飞地数量、被围绕的区域、腐烂的橘子。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>DFS 终止条件：越界，或者当前格不是 <code>&#x27;1&#x27;<\/code>（海水 / 已访问）。<\/li><li>BFS 要在<strong>入队时<\/strong>就标记，出队时才标记会重复入队。<\/li><li>网格里是字符 <code>&#x27;1&#x27;<\/code> 不是数字 1。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>DFS<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">numIslands<\/span>(self, grid: List[List[str]]) -&gt; int:\n        m, n = len(grid), len(grid[<span class=\"n\">0<\/span>])\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(x, y):\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> (<span class=\"n\">0<\/span> &lt;= x &lt; m <span class=\"k\">and<\/span> <span class=\"n\">0<\/span> &lt;= y &lt; n) <span class=\"k\">or<\/span> grid[x][y] != <span class=\"s\">&quot;1&quot;<\/span>:\n                <span class=\"k\">return<\/span>\n            grid[x][y] = <span class=\"s\">&quot;0&quot;<\/span>                 <span class=\"c\"># 淹掉<\/span>\n            dfs(x - <span class=\"n\">1<\/span>, y)\n            dfs(x + <span class=\"n\">1<\/span>, y)\n            dfs(x, y - <span class=\"n\">1<\/span>)\n            dfs(x, y + <span class=\"n\">1<\/span>)\n\n        res = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(m):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(n):\n                <span class=\"k\">if<\/span> grid[i][j] == <span class=\"s\">&quot;1&quot;<\/span>:\n                    res += <span class=\"n\">1<\/span>\n                    dfs(i, j)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> numIslands(<span class=\"k\">char<\/span>[][] grid) {\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; grid.length; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">0<\/span>; j &lt; grid[<span class=\"n\">0<\/span>].length; j++) {\n                <span class=\"k\">if<\/span> (grid[i][j] == <span class=\"s\">&#x27;1&#x27;<\/span>) {\n                    res++;\n                    dfs(grid, i, j);\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> dfs(<span class=\"k\">char<\/span>[][] grid, <span class=\"k\">int<\/span> x, <span class=\"k\">int<\/span> y) {\n        <span class=\"k\">if<\/span> (x &lt; <span class=\"n\">0<\/span> || x &gt;= grid.length || y &lt; <span class=\"n\">0<\/span> || y &gt;= grid[<span class=\"n\">0<\/span>].length || grid[x][y] != <span class=\"s\">&#x27;1&#x27;<\/span>) <span class=\"k\">return<\/span>;\n        grid[x][y] = <span class=\"s\">&#x27;0&#x27;<\/span>;                        <span class=\"c\">// 淹掉<\/span>\n        dfs(grid, x - <span class=\"n\">1<\/span>, y);\n        dfs(grid, x + <span class=\"n\">1<\/span>, y);\n        dfs(grid, x, y - <span class=\"n\">1<\/span>);\n        dfs(grid, x, y + <span class=\"n\">1<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<h3>BFS<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">numIslands<\/span>(self, grid: List[List[str]]) -&gt; int:\n        m, n = len(grid), len(grid[<span class=\"n\">0<\/span>])\n        res = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(m):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(n):\n                <span class=\"k\">if<\/span> grid[i][j] != <span class=\"s\">&quot;1&quot;<\/span>:\n                    <span class=\"k\">continue<\/span>\n                res += <span class=\"n\">1<\/span>\n                grid[i][j] = <span class=\"s\">&quot;0&quot;<\/span>             <span class=\"c\"># 入队时就淹掉<\/span>\n                q = deque([(i, j)])\n                <span class=\"k\">while<\/span> q:\n                    x, y = q.popleft()\n                    <span class=\"k\">for<\/span> nx, ny <span class=\"k\">in<\/span> (x - <span class=\"n\">1<\/span>, y), (x + <span class=\"n\">1<\/span>, y), (x, y - <span class=\"n\">1<\/span>), (x, y + <span class=\"n\">1<\/span>):\n                        <span class=\"k\">if<\/span> <span class=\"n\">0<\/span> &lt;= nx &lt; m <span class=\"k\">and<\/span> <span class=\"n\">0<\/span> &lt;= ny &lt; n <span class=\"k\">and<\/span> grid[nx][ny] == <span class=\"s\">&quot;1&quot;<\/span>:\n                            grid[nx][ny] = <span class=\"s\">&quot;0&quot;<\/span>\n                            q.append((nx, ny))\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">static<\/span> <span class=\"k\">final<\/span> <span class=\"k\">int<\/span>[][] DIRS = {{-<span class=\"n\">1<\/span>, <span class=\"n\">0<\/span>}, {<span class=\"n\">1<\/span>, <span class=\"n\">0<\/span>}, {<span class=\"n\">0<\/span>, -<span class=\"n\">1<\/span>}, {<span class=\"n\">0<\/span>, <span class=\"n\">1<\/span>}};\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> numIslands(<span class=\"k\">char<\/span>[][] grid) {\n        <span class=\"k\">int<\/span> m = grid.length, n = grid[<span class=\"n\">0<\/span>].length, res = <span class=\"n\">0<\/span>;\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"k\">int<\/span>[]&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; m; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">0<\/span>; j &lt; n; j++) {\n                <span class=\"k\">if<\/span> (grid[i][j] != <span class=\"s\">&#x27;1&#x27;<\/span>) <span class=\"k\">continue<\/span>;\n                res++;\n                grid[i][j] = <span class=\"s\">&#x27;0&#x27;<\/span>;                <span class=\"c\">// 入队时就淹掉<\/span>\n                q.offer(<span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[]{i, j});\n                <span class=\"k\">while<\/span> (!q.isEmpty()) {\n                    <span class=\"k\">int<\/span>[] cur = q.poll();\n                    <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span>[] d : DIRS) {\n                        <span class=\"k\">int<\/span> nx = cur[<span class=\"n\">0<\/span>] + d[<span class=\"n\">0<\/span>], ny = cur[<span class=\"n\">1<\/span>] + d[<span class=\"n\">1<\/span>];\n                        <span class=\"k\">if<\/span> (nx &lt; <span class=\"n\">0<\/span> || nx &gt;= m || ny &lt; <span class=\"n\">0<\/span> || ny &gt;= n || grid[nx][ny] != <span class=\"s\">&#x27;1&#x27;<\/span>) <span class=\"k\">continue<\/span>;\n                        grid[nx][ny] = <span class=\"s\">&#x27;0&#x27;<\/span>;\n                        q.offer(<span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[]{nx, ny});\n                    }\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(mn)，空间最坏 O(mn)（递归栈 / 队列）。<\/p>"},{"key":"21","rank":11,"id":"21","title":"合并两个有序链表","difficulty":"简单","tags":["链表"],"freq":336,"link":"https://leetcode.cn/problems/merge-two-sorted-lists/","desc":"把两个升序链表合并成一个升序链表。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li><strong>虚拟头节点 + 双指针<\/strong>：<code>p1<\/code>、<code>p2<\/code> 各指一个链表，谁小就把谁接到 <code>p<\/code> 后面。<\/li><li>一个走完后，另一个剩下的部分本来就有序，直接整段接上。<\/li><li><code>dummy<\/code> 免去单独处理头节点，最后返回 <code>dummy.next<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">mergeTwoLists<\/span>(self, list1: Optional[ListNode], list2: Optional[ListNode]) -&gt; Optional[ListNode]:\n        dummy = p = ListNode(-<span class=\"n\">1<\/span>)\n        p1, p2 = list1, list2\n        <span class=\"k\">while<\/span> p1 <span class=\"k\">and<\/span> p2:\n            <span class=\"k\">if<\/span> p1.val &lt; p2.val:\n                p.next = p1\n                p1 = p1.next\n            <span class=\"k\">else<\/span>:\n                p.next = p2\n                p2 = p2.next\n            p = p.next\n        p.next = p1 <span class=\"k\">or<\/span> p2                    <span class=\"c\"># 剩下的整段接上<\/span>\n        <span class=\"k\">return<\/span> dummy.next<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> mergeTwoLists(<span class=\"t\">ListNode<\/span> list1, <span class=\"t\">ListNode<\/span> list2) {\n        <span class=\"t\">ListNode<\/span> dummy = <span class=\"k\">new<\/span> <span class=\"t\">ListNode<\/span>(-<span class=\"n\">1<\/span>), p = dummy;\n        <span class=\"t\">ListNode<\/span> p1 = list1, p2 = list2;\n        <span class=\"k\">while<\/span> (p1 != <span class=\"k\">null<\/span> &amp;&amp; p2 != <span class=\"k\">null<\/span>) {\n            <span class=\"k\">if<\/span> (p1.val &lt; p2.val) {\n                p.next = p1;\n                p1 = p1.next;\n            } <span class=\"k\">else<\/span> {\n                p.next = p2;\n                p2 = p2.next;\n            }\n            p = p.next;\n        }\n        p.next = p1 != <span class=\"k\">null<\/span> ? p1 : p2;       <span class=\"c\">// 剩下的整段接上<\/span>\n        <span class=\"k\">return<\/span> dummy.next;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(m + n)，空间 O(1)。<\/p>"},{"key":"102","rank":12,"id":"102","title":"二叉树的层序遍历","difficulty":"中等","tags":["二叉树","BFS"],"freq":334,"link":"https://leetcode.cn/problems/binary-tree-level-order-traversal/","desc":"按层从左到右输出二叉树的节点值，每层一个列表。","libs":["python-0","java-12"],"html":"<h2>思路<\/h2>\n<ul><li>层序遍历 = <strong>BFS + 队列<\/strong>。<\/li><li>每轮先记下当前队列大小 <code>sz<\/code>，只处理这 <code>sz<\/code> 个节点——正好是一整层；处理时把左右孩子入队。<\/li><li>这个模板直接套：<a href=\"#/103\">103 锯齿形<\/a>、<a href=\"#/199\">199 右视图<\/a>、<a href=\"#/662\">662 最大宽度<\/a>、107、637、994。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>sz<\/code> 必须在 for 循环前取：循环里孩子入队后 <code>q.size()<\/code> 会变。<\/li><li>空树直接返回空列表。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">levelOrder<\/span>(self, root: Optional[TreeNode]) -&gt; List[List[int]]:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root:\n            <span class=\"k\">return<\/span> []\n        res, q = [], deque([root])\n        <span class=\"k\">while<\/span> q:\n            level = []\n            <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(len(q)):          <span class=\"c\"># 当前层的节点数<\/span>\n                cur = q.popleft()\n                level.append(cur.val)\n                <span class=\"k\">if<\/span> cur.left:\n                    q.append(cur.left)\n                <span class=\"k\">if<\/span> cur.right:\n                    q.append(cur.right)\n            res.append(level)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; levelOrder(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> res;\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">TreeNode<\/span>&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        q.offer(root);\n        <span class=\"k\">while<\/span> (!q.isEmpty()) {\n            <span class=\"k\">int<\/span> sz = q.size();                   <span class=\"c\">// 当前层的节点数<\/span>\n            <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; level = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; sz; i++) {\n                <span class=\"t\">TreeNode<\/span> cur = q.poll();\n                level.add(cur.val);\n                <span class=\"k\">if<\/span> (cur.left != <span class=\"k\">null<\/span>) q.offer(cur.left);\n                <span class=\"k\">if<\/span> (cur.right != <span class=\"k\">null<\/span>) q.offer(cur.right);\n            }\n            res.add(level);\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n)。<\/p>"},{"key":"33","rank":13,"id":"33","title":"搜索旋转排序数组","difficulty":"中等","tags":["二分"],"freq":323,"link":"https://leetcode.cn/problems/search-in-rotated-sorted-array/","desc":"在旋转过的升序数组（无重复元素）中查找 target 的下标，要求 O(log n)。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>二分。用 <code>nums[mid]<\/code> 和 <code>nums[right]<\/code> 比较，判断哪一半有序：<ul><li><code>nums[mid] &gt; nums[right]<\/code>：<code>mid<\/code> 在左边的大值段，<code>[left, mid]<\/code> 有序；<\/li><li>否则 <code>mid<\/code> 在右边的小值段，<code>[mid, right]<\/code> 有序。<\/li><\/ul><\/li><li>再看 <code>target<\/code> 是否落在有序的那一半里，决定丢掉哪一半。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>循环条件 <code>left &lt;= right<\/code>：找具体元素，<code>left == right<\/code> 时那个位置还没检查。<\/li><li>前面已经判过 <code>nums[mid] == target<\/code>，所以收缩时可以放心 <code>mid ± 1<\/code>。<\/li><li>判断 <code>target<\/code> 在有序半边内时，靠 <code>mid<\/code> 的一侧是开的（<code>target &lt; nums[mid]<\/code>），靠边界的一侧是闭的（<code>nums[left] &lt;= target<\/code>）。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">search<\/span>(self, nums: List[int], target: int) -&gt; int:\n        left, right = <span class=\"n\">0<\/span>, len(nums) - <span class=\"n\">1<\/span>\n        <span class=\"k\">while<\/span> left &lt;= right:\n            mid = (left + right) // <span class=\"n\">2<\/span>\n            <span class=\"k\">if<\/span> nums[mid] == target:\n                <span class=\"k\">return<\/span> mid\n            <span class=\"k\">if<\/span> nums[mid] &gt; nums[right]:              <span class=\"c\"># [left, mid] 有序<\/span>\n                <span class=\"k\">if<\/span> nums[left] &lt;= target &lt; nums[mid]:\n                    right = mid - <span class=\"n\">1<\/span>\n                <span class=\"k\">else<\/span>:\n                    left = mid + <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:                                    <span class=\"c\"># [mid, right] 有序<\/span>\n                <span class=\"k\">if<\/span> nums[mid] &lt; target &lt;= nums[right]:\n                    left = mid + <span class=\"n\">1<\/span>\n                <span class=\"k\">else<\/span>:\n                    right = mid - <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> -<span class=\"n\">1<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> search(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> target) {\n        <span class=\"k\">int<\/span> left = <span class=\"n\">0<\/span>, right = nums.length - <span class=\"n\">1<\/span>;\n        <span class=\"k\">while<\/span> (left &lt;= right) {\n            <span class=\"k\">int<\/span> mid = left + (right - left) / <span class=\"n\">2<\/span>;\n            <span class=\"k\">if<\/span> (nums[mid] == target) <span class=\"k\">return<\/span> mid;\n            <span class=\"k\">if<\/span> (nums[mid] &gt; nums[right]) {               <span class=\"c\">// [left, mid] 有序<\/span>\n                <span class=\"k\">if<\/span> (nums[left] &lt;= target &amp;&amp; target &lt; nums[mid]) right = mid - <span class=\"n\">1<\/span>;\n                <span class=\"k\">else<\/span> left = mid + <span class=\"n\">1<\/span>;\n            } <span class=\"k\">else<\/span> {                                     <span class=\"c\">// [mid, right] 有序<\/span>\
