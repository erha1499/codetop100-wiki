hon\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">climbStairs<\/span>(self, n: int) -&gt; int:\n        a, b = <span class=\"n\">1<\/span>, <span class=\"n\">1<\/span>                          <span class=\"c\"># f(0), f(1)<\/span>\n        <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(n - <span class=\"n\">1<\/span>):\n            a, b = b, a + b\n        <span class=\"k\">return<\/span> b<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> climbStairs(<span class=\"k\">int<\/span> n) {\n        <span class=\"k\">int<\/span> a = <span class=\"n\">1<\/span>, b = <span class=\"n\">1<\/span>;                    <span class=\"c\">// f(0), f(1)<\/span>\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">2<\/span>; i &lt;= n; i++) {\n            <span class=\"k\">int<\/span> c = a + b;\n            a = b;\n            b = c;\n        }\n        <span class=\"k\">return<\/span> b;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：记忆化递归<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    @cache\n    <span class=\"k\">def<\/span> <span class=\"f\">climbStairs<\/span>(self, n: int) -&gt; int:\n        <span class=\"k\">if<\/span> n &lt;= <span class=\"n\">2<\/span>:\n            <span class=\"k\">return<\/span> n\n        <span class=\"k\">return<\/span> self.climbStairs(n - <span class=\"n\">1<\/span>) + self.climbStairs(n - <span class=\"n\">2<\/span>)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span>[] memo;\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> climbStairs(<span class=\"k\">int<\/span> n) {\n        memo = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[n + <span class=\"n\">1<\/span>];\n        <span class=\"k\">return<\/span> climb(n);\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> climb(<span class=\"k\">int<\/span> n) {\n        <span class=\"k\">if<\/span> (n &lt;= <span class=\"n\">2<\/span>) <span class=\"k\">return<\/span> n;\n        <span class=\"k\">if<\/span> (memo[n] != <span class=\"n\">0<\/span>) <span class=\"k\">return<\/span> memo[n];\n        <span class=\"k\">return<\/span> memo[n] = climb(n - <span class=\"n\">1<\/span>) + climb(n - <span class=\"n\">2<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)；空间滚动变量 O(1)，记忆化 O(n)。<\/p>"},{"key":"43","rank":53,"id":"43","title":"字符串相乘","difficulty":"中等","tags":["字符串","模拟"],"freq":134,"link":"https://leetcode.cn/problems/multiply-strings/","desc":"两个用字符串表示的非负整数相乘，返回字符串形式的积（不能直接转成整数）。","libs":["java-18"],"html":"<h2>思路<\/h2>\n<ul><li>模拟竖式乘法。<code>m<\/code> 位 × <code>n<\/code> 位，结果最多 <code>m + n<\/code> 位，用 <code>int[m + n]<\/code> 存每一位。<\/li><li><code>num1[i] * num2[j]<\/code> 的结果落在两个位置：低位 <code>res[i + j + 1]<\/code>，进位 <code>res[i + j]<\/code>。<\/li><li>从低位往高位两层循环，每次 <code>mul = n1 * n2 + res[i + j + 1]<\/code>（加上这个位置已有的值），个位留在 <code>res[i + j + 1]<\/code>，十位累加到 <code>res[i + j]<\/code>。<\/li><li>最后跳过前导 0 拼成字符串。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>数组长度是 <code>m + n<\/code>，不是 <code>m + n - 1<\/code>（<code>99 * 99 = 9801<\/code>）。<\/li><li><code>mul<\/code> 要加上当前位置的旧值；进位是 <code>+=<\/code> 不是 <code>=<\/code>。<\/li><li>结果全是 0（有一个乘数是 <code>&quot;0&quot;<\/code>）时返回 <code>&quot;0&quot;<\/code>，不是空串。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">multiply<\/span>(self, num1: str, num2: str) -&gt; str:\n        m, n = len(num1), len(num2)\n        res = [<span class=\"n\">0<\/span>] * (m + n)\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(m - <span class=\"n\">1<\/span>, -<span class=\"n\">1<\/span>, -<span class=\"n\">1<\/span>):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(n - <span class=\"n\">1<\/span>, -<span class=\"n\">1<\/span>, -<span class=\"n\">1<\/span>):\n                mul = int(num1[i]) * int(num2[j]) + res[i + j + <span class=\"n\">1<\/span>]\n                res[i + j + <span class=\"n\">1<\/span>] = mul % <span class=\"n\">10<\/span>    <span class=\"c\"># 个位留下<\/span>\n                res[i + j] += mul // <span class=\"n\">10<\/span>      <span class=\"c\"># 进位累加到高一位<\/span>\n        s = <span class=\"s\">&quot;&quot;<\/span>.join(map(str, res)).lstrip(<span class=\"s\">&quot;0&quot;<\/span>)\n        <span class=\"k\">return<\/span> s <span class=\"k\">or<\/span> <span class=\"s\">&quot;0&quot;<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">String<\/span> multiply(<span class=\"t\">String<\/span> num1, <span class=\"t\">String<\/span> num2) {\n        <span class=\"k\">int<\/span> m = num1.length(), n = num2.length();\n        <span class=\"k\">int<\/span>[] res = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[m + n];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = m - <span class=\"n\">1<\/span>; i &gt;= <span class=\"n\">0<\/span>; i--) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = n - <span class=\"n\">1<\/span>; j &gt;= <span class=\"n\">0<\/span>; j--) {\n                <span class=\"k\">int<\/span> mul = (num1.charAt(i) - <span class=\"s\">&#x27;0&#x27;<\/span>) * (num2.charAt(j) - <span class=\"s\">&#x27;0&#x27;<\/span>) + res[i + j + <span class=\"n\">1<\/span>];\n                res[i + j + <span class=\"n\">1<\/span>] = mul % <span class=\"n\">10<\/span>;   <span class=\"c\">// 个位留下<\/span>\n                res[i + j] += mul / <span class=\"n\">10<\/span>;      <span class=\"c\">// 进位累加到高一位<\/span>\n            }\n        }\n        <span class=\"t\">StringBuilder<\/span> sb = <span class=\"k\">new<\/span> <span class=\"t\">StringBuilder<\/span>();\n        <span class=\"k\">int<\/span> k = <span class=\"n\">0<\/span>;\n        <span class=\"k\">while<\/span> (k &lt; res.length &amp;&amp; res[k] == <span class=\"n\">0<\/span>) k++;   <span class=\"c\">// 跳过前导 0<\/span>\n        <span class=\"k\">for<\/span> (; k &lt; res.length; k++) sb.append(res[k]);\n        <span class=\"k\">return<\/span> sb.length() == <span class=\"n\">0<\/span> ? <span class=\"s\">&quot;0&quot;<\/span> : sb.toString();\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(mn)，空间 O(m + n)。<\/p>"},{"key":"8","rank":54,"id":"8","title":"字符串转换整数 (atoi)","difficulty":"中等","tags":["字符串","模拟"],"freq":134,"link":"https://leetcode.cn/problems/string-to-integer-atoi/","desc":"实现 atoi：把字符串转成 32 位有符号整数，处理空格、符号、非数字截断和溢出。","libs":["java-22"],"html":"<h2>思路<\/h2>\n<p>一个指针从左到右，按固定顺序处理四件事：<\/p>\n<ol><li>跳过前导空格；<\/li><li>读符号（至多一个 <code>+<\/code> 或 <code>-<\/code>）；<\/li><li>读连续的数字，遇到非数字立即停；<\/li><li>溢出时截断到 <code>[-2³¹, 2³¹ - 1]<\/code>。<\/li><\/ol>\n<h2>易错点<\/h2>\n<ul><li>全是空格 / 空串：跳完空格要判越界，返回 0。<\/li><li>符号只认一个：<code>&quot;+-12&quot;<\/code> 读完 <code>+<\/code> 后遇到 <code>-<\/code> 不是数字，直接停，结果 0。<\/li><li>Java 的溢出判断：先记 <code>last = res<\/code>，算完 <code>res = res * 10 + num<\/code> 后如果 <code>res / 10 != last<\/code> 就是溢出了，按符号返回边界值。也可以在乘之前判断 <code>res &gt; (Integer.MAX_VALUE - num) / 10<\/code>。<\/li><li>Python 整数不会溢出，读完后统一夹到范围内即可。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">myAtoi<\/span>(self, s: str) -&gt; int:\n        n, index = len(s), <span class=\"n\">0<\/span>\n        <span class=\"k\">while<\/span> index &lt; n <span class=\"k\">and<\/span> s[index] == <span class=\"s\">&quot; &quot;<\/span>:         <span class=\"c\"># 1. 前导空格<\/span>\n            index += <span class=\"n\">1<\/span>\n        <span class=\"k\">if<\/span> index == n:\n            <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>\n        sign = <span class=\"n\">1<\/span>\n        <span class=\"k\">if<\/span> s[index] <span class=\"k\">in<\/span> <span class=\"s\">&quot;+-&quot;<\/span>:                         <span class=\"c\"># 2. 符号<\/span>\n            sign = -<span class=\"n\">1<\/span> <span class=\"k\">if<\/span> s[index] == <span class=\"s\">&quot;-&quot;<\/span> <span class=\"k\">else<\/span> <span class=\"n\">1<\/span>\n            index += <span class=\"n\">1<\/span>\n        res = <span class=\"n\">0<\/span>\n        <span class=\"k\">while<\/span> index &lt; n <span class=\"k\">and<\/span> <span class=\"s\">&quot;0&quot;<\/span> &lt;= s[index] &lt;= <span class=\"s\">&quot;9&quot;<\/span>:  <span class=\"c\"># 3. 数字，遇到非数字就停<\/span>\n            res = res * <span class=\"n\">10<\/span> + int(s[index])\n            index += <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> max(-<span class=\"n\">2<\/span> ** <span class=\"n\">31<\/span>, min(sign * res, <span class=\"n\">2<\/span> ** <span class=\"n\">31<\/span> - <span class=\"n\">1<\/span>))   <span class=\"c\"># 4. 截断<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> myAtoi(<span class=\"t\">String<\/span> s) {\n        <span class=\"k\">int<\/span> len = s.length(), index = <span class=\"n\">0<\/span>;\n        <span class=\"k\">while<\/span> (index &lt; len &amp;&amp; s.charAt(index) == <span class=\"s\">&#x27; &#x27;<\/span>) {      <span class=\"c\">// 1. 前导空格<\/span>\n            index++;\n        }\n        <span class=\"k\">if<\/span> (index == len) <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n        <span class=\"k\">int<\/span> sign = <span class=\"n\">1<\/span>;\n        <span class=\"k\">if<\/span> (s.charAt(index) == <span class=\"s\">&#x27;+&#x27;<\/span>) {                        <span class=\"c\">// 2. 符号<\/span>\n            index++;\n        } <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (s.charAt(index) == <span class=\"s\">&#x27;-&#x27;<\/span>) {\n            sign = -<span class=\"n\">1<\/span>;\n            index++;\n        }\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">while<\/span> (index &lt; len) {                                <span class=\"c\">// 3. 数字，遇到非数字就停<\/span>\n            <span class=\"k\">char<\/span> c = s.charAt(index);\n            <span class=\"k\">if<\/span> (c &lt; <span class=\"s\">&#x27;0&#x27;<\/span> || c &gt; <span class=\"s\">&#x27;9&#x27;<\/span>) <span class=\"k\">break<\/span>;\n            <span class=\"k\">int<\/span> last = res;\n            res = res * <span class=\"n\">10<\/span> + (c - <span class=\"s\">&#x27;0&#x27;<\/span>);\n            <span class=\"k\">if<\/span> (res / <span class=\"n\">10<\/span> != last) {                          <span class=\"c\">// 4. 溢出了，截断<\/span>\n                <span class=\"k\">return<\/span> sign == <span class=\"n\">1<\/span> ? <span class=\"t\">Integer<\/span>.MAX_VALUE : <span class=\"t\">Integer<\/span>.MIN_VALUE;\n            }\n            index++;\n        }\n        <span class=\"k\">return<\/span> sign * res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"2","rank":55,"id":"2","title":"两数相加","difficulty":"中等","tags":["链表","模拟"],"freq":133,"link":"https://leetcode.cn/problems/add-two-numbers/","desc":"两个逆序存储数字的链表相加，返回同样逆序存储的和。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>链表版竖式加法。逆序存储正好从个位开始，直接从头节点往后加。<\/li><li><code>p1<\/code>、<code>p2<\/code> 遍历两个链表，<code>p<\/code> 构造结果，<code>c<\/code> 是进位。每轮 <code>val = c + p1.val + p2.val<\/code>，新节点存 <code>val % 10<\/code>，进位 <code>val / 10<\/code>。<\/li><li><code>dummy<\/code> 省去头节点的特判。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>循环条件是 <code>p1 != null || p2 != null || c &gt; 0<\/code>：两个链表都走完了还可能剩一个进位（<code>5 + 5 = 10<\/code>）。<\/li><li>某个链表先走完时不能再取它的 <code>val<\/code>，要判空。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">addTwoNumbers<\/span>(self, l1: Optional[ListNode], l2: Optional[ListNode]) -&gt; Optional[ListNode]:\n        dummy = p = ListNode(-<span class=\"n\">1<\/span>)\n        p1, p2, c = l1, l2, <span class=\"n\">0<\/span>\n        <span class=\"k\">while<\/span> p1 <span class=\"k\">or<\/span> p2 <span class=\"k\">or<\/span> c:\n            val = c\n            <span class=\"k\">if<\/span> p1:\n                val += p1.val\n                p1 = p1.next\n            <span class=\"k\">if<\/span> p2:\n                val += p2.val\n                p2 = p2.next\n            p.next = ListNode(val % <span class=\"n\">10<\/span>)\n            p = p.next\n            c = val // <span class=\"n\">10<\/span>\n        <span class=\"k\">return<\/span> dummy.next<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> addTwoNumbers(<span class=\"t\">ListNode<\/span> l1, <span class=\"t\">ListNode<\/span> l2) {\n        <span class=\"t\">ListNode<\/span> dummy = <span class=\"k\">new<\/span> <span class=\"t\">ListNode<\/span>(-<span class=\"n\">1<\/span>), p = dummy;\n        <span class=\"t\">ListNode<\/span> p1 = l1, p2 = l2;\n        <span class=\"k\">int<\/span> c = <span class=\"n\">0<\/span>;\n        <span class=\"k\">while<\/span> (p1 != <span class=\"k\">null<\/span> || p2 != <span class=\"k\">null<\/span> || c &gt; <span class=\"n\">0<\/span>) {\n            <span class=\"k\">int<\/span> val = c;\n            <span class=\"k\">if<\/span> (p1 != <span class=\"k\">null<\/span>) {\n                val += p1.val;\n                p1 = p1.next;\n            }\n            <span class=\"k\">if<\/span> (p2 != <span class=\"k\">null<\/span>) {\n                val += p2.val;\n                p2 = p2.next;\n            }\n            p.next = <span class=\"k\">new<\/span> <span class=\"t\">ListNode<\/span>(val % <span class=\"n\">10<\/span>);\n            p = p.next;\n            c = val / <span class=\"n\">10<\/span>;\n        }\n        <span class=\"k\">return<\/span> dummy.next;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(max(m, n))，空间 O(1)（不计答案）。<\/p>"},{"key":"105","rank":56,"id":"105","title":"从前序与中序遍历序列构造二叉树","difficulty":"中等","tags":["二叉树","分治","哈希表"],"freq":118,"link":"https://leetcode.cn/problems/construct-binary-tree-from-preorder-and-inorder-traversal/","desc":"根据前序遍历和中序遍历的结果（无重复值）构造二叉树。","libs":["java-15"],"html":"<h2>思路<\/h2>\n<ul><li><strong>前序定根，中序切左右<\/strong>：前序区间的第一个元素 <code>pre[ps]<\/code> 是当前子树的根；在中序里找到根的位置 <code>index<\/code>，左边是左子树、右边是右子树。<\/li><li>左子树大小 <code>leftSize = index - is<\/code>，由此切出两个遍历里左右子树各自的区间：<ul><li>左子树：前序 <code>[ps + 1, ps + leftSize]<\/code>，中序 <code>[is, index - 1]<\/code>；<\/li><li>右子树：前序 <code>[ps + leftSize + 1, pe]<\/code>，中序 <code>[index + 1, ie]<\/code>。<\/li><\/ul><\/li><li>用哈希表预存「中序的值 → 下标」，找根 O(1)；全程传下标区间，不复制数组。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>leftSize<\/code> 是 <code>index - is<\/code>，不是 <code>index<\/code>（只有 <code>is == 0<\/code> 时两者才相等）。<\/li><li>前序左子树从 <code>ps + 1<\/code> 开始。<\/li><li>每次线性找根或者 <code>copyOfRange<\/code> 切数组都会退化成 O(n²)。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">buildTree<\/span>(self, preorder: List[int], inorder: List[int]) -&gt; Optional[TreeNode]:\n        index_of = {v: i <span class=\"k\">for<\/span> i, v <span class=\"k\">in<\/span> enumerate(inorder)}     <span class=\"c\"># 中序：值 -&gt; 下标<\/span>\n\n        <span class=\"k\">def<\/span> <span class=\"f\">build<\/span>(ps, pe, i_s, i_e):         <span class=\"c\"># 前序 [ps, pe]，中序 [i_s, i_e]<\/span>\n            <span class=\"k\">if<\/span> ps &gt; pe:\n                <span class=\"k\">return<\/span> <span class=\"k\">None<\/span>\n            root = TreeNode(preorder[ps])\n            index = index_of[root.val]\n            left_size = index - i_s\n            root.left = build(ps + <span class=\"n\">1<\/span>, ps + left_size, i_s, index - <span class=\"n\">1<\/span>)\n            root.right = build(ps + left_size + <span class=\"n\">1<\/span>, pe, index + <span class=\"n\">1<\/span>, i_e)\n            <span class=\"k\">return<\/span> root\n\n        <span class=\"k\">return<\/span> build(<span class=\"n\">0<\/span>, len(preorder) - <span class=\"n\">1<\/span>, <span class=\"n\">0<\/span>, len(inorder) - <span class=\"n\">1<\/span>)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Map<\/span>&lt;<span class=\"t\">Integer<\/span>, <span class=\"t\">Integer<\/span>&gt; indexOf = <span class=\"k\">new<\/span> <span class=\"t\">HashMap<\/span>&lt;&gt;();   <span class=\"c\">// 中序：值 -&gt; 下标<\/span>\n\n    <span class=\"k\">public<\/span> <span class=\"t\">TreeNode<\/span> buildTree(<span class=\"k\">int<\/span>[] preorder, <span class=\"k\">int<\/span>[] inorder) {\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; inorder.length; i++) {\n            indexOf.put(inorder[i], i);\n        }\n        <span class=\"k\">return<\/span> build(preorder, <span class=\"n\">0<\/span>, preorder.length - <span class=\"n\">1<\/span>, <span class=\"n\">0<\/span>, inorder.length - <span class=\"n\">1<\/span>);\n    }\n\n    <span class=\"c\">// 前序 [ps, pe]，中序 [is, ie]<\/span>\n    <span class=\"k\">private<\/span> <span class=\"t\">TreeNode<\/span> build(<span class=\"k\">int<\/span>[] pre, <span class=\"k\">int<\/span> ps, <span class=\"k\">int<\/span> pe, <span class=\"k\">int<\/span> is, <span class=\"k\">int<\/span> ie) {\n        <span class=\"k\">if<\/span> (ps &gt; pe) <span class=\"k\">return<\/span> <span class=\"k\">null<\/span>;\n        <span class=\"t\">TreeNode<\/span> root = <span class=\"k\">new<\/span> <span class=\"t\">TreeNode<\/span>(pre[ps]);\n        <span class=\"k\">int<\/span> index = indexOf.get(root.val);\n        <span class=\"k\">int<\/span> leftSize = index - is;\n        root.left = build(pre, ps + <span class=\"n\">1<\/span>, ps + leftSize, is, index - <span class=\"n\">1<\/span>);\n        root.right = build(pre, ps + leftSize + <span class=\"n\">1<\/span>, pe, index + <span class=\"n\">1<\/span>, ie);\n        <span class=\"k\">return<\/span> root;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n)。<\/p>"},{"key":"41","rank":57,"id":"41","title":"缺失的第一个正数","difficulty":"困难","tags":["数组","哈希表"],"freq":116,"link":"https://leetcode.cn/problems/first-missing-positive/","desc":"找出未排序数组中没有出现的最小正整数，要求 O(n) 时间、O(1) 额外空间。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>长度为 <code>n<\/code> 的数组，答案只可能在 <code>[1, n + 1]<\/code>：<code>1 ~ n<\/code> 全出现了答案是 <code>n + 1<\/code>，否则是其中缺的最小那个。<\/li><li><strong>原地哈希：用下标 <code>x - 1<\/code> 位置的正负号，表示数字 <code>x<\/code> 有没有出现过。<\/strong><ol><li>先清理：<code>&lt;= 0<\/code> 或 <code>&gt; n<\/code> 的数不影响答案，统一改成 <code>n + 1<\/code>（这样全是正数了）；<\/li><li>遍历：对每个 <code>x = |nums[i]|<\/code>，若 <code>x &lt;= n<\/code>，把 <code>nums[x - 1]<\/code> 改成负数；<\/li><li>再遍历：第一个仍为正数的位置 <code>i<\/code> 说明 <code>i + 1<\/code> 没出现过；全为负则返回 <code>n + 1<\/code>。<\/li><\/ol><\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>第 2 步取数要用绝对值：当前位置可能已经被前面的数字标成负数了。<\/li><li>标记时写 <code>-|nums[x - 1]|<\/code>，不要直接取反——同一个数出现两次会被翻回正数。<\/li><li>另一种等价做法是「把 <code>x<\/code> 交换到下标 <code>x - 1<\/code>」，同样是原地哈希。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">firstMissingPositive<\/span>(self, nums: List[int]) -&gt; int:\n        n = len(nums)\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(n):                   <span class=\"c\"># 1. 无效数字统一改成 n + 1<\/span>\n            <span class=\"k\">if<\/span> nums[i] &lt;= <span class=\"n\">0<\/span> <span class=\"k\">or<\/span> nums[i] &gt; n:\n                nums[i] = n + <span class=\"n\">1<\/span>\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(n):                   <span class=\"c\"># 2. x 出现过 -&gt; 把下标 x - 1 标成负数<\/span>\n            x = abs(nums[i])\n            <span class=\"k\">if<\/span> x &lt;= n:\n                nums[x - <span class=\"n\">1<\/span>] = -abs(nums[x - <span class=\"n\">1<\/span>])\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(n):                   <span class=\"c\"># 3. 第一个没被标记的位置<\/span>\n            <span class=\"k\">if<\/span> nums[i] &gt; <span class=\"n\">0<\/span>:\n                <span class=\"k\">return<\/span> i + <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> n + <span class=\"n\">1<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> firstMissingPositive(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span> n = nums.length;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; n; i++) {        <span class=\"c\">// 1. 无效数字统一改成 n + 1<\/span>\n            <span class=\"k\">if<\/span> (nums[i] &lt;= <span class=\"n\">0<\/span> || nums[i] &gt; n) nums[i] = n + <span class=\"n\">1<\/span>;\n        }\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; n; i++) {        <span class=\"c\">// 2. x 出现过 -&gt; 把下标 x - 1 标成负数<\/span>\n            <span class=\"k\">int<\/span> x = <span class=\"t\">Math<\/span>.abs(nums[i]);\n            <span class=\"k\">if<\/span> (x &lt;= n) nums[x - <span class=\"n\">1<\/span>] = -<span class=\"t\">Math<\/span>.abs(nums[x - <span class=\"n\">1<\/span>]);\n        }\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; n; i++) {        <span class=\"c\">// 3. 第一个没被标记的位置<\/span>\n            <span class=\"k\">if<\/span> (nums[i] &gt; <span class=\"n\">0<\/span>) <span class=\"k\">return<\/span> i + <span class=\"n\">1<\/span>;\n        }\n        <span class=\"k\">return<\/span> n + <span class=\"n\">1<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"78","rank":58,"id":"78","title":"子集","difficulty":"中等","tags":["回溯"],"freq":108,"link":"https://leetcode.cn/problems/subsets/","desc":"返回不含重复元素的数组的所有子集。","libs":["java-13"],"html":"<h2>思路<\/h2>\n<ul><li>回溯树上的<strong>每个节点都是一个答案<\/strong>：进入递归时就把当前 <code>path<\/code> 记下来，不用等到叶子。<\/li><li><code>start<\/code> 控制只往后选，避免回头选出重复的组合（<code>[1,2]<\/code> 和 <code>[2,1]<\/code>）。<\/li><li>循环里还是三步：选 <code>nums[i]<\/code> → 递归 <code>i + 1<\/code> → 撤销。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>收集答案要拷贝 <code>path<\/code>。<\/li><li>递归传 <code>i + 1<\/code> 不是 <code>start + 1<\/code>。<\/li><li>Java 里 <code>List<\/code> 接口（Java 21 之前）没有 <code>removeLast()<\/code>：要么声明成 <code>LinkedList<\/code>，要么写 <code>path.remove(path.size() - 1)<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">subsets<\/span>(self, nums: List[int]) -&gt; List[List[int]]:\n        res, path = [], []\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(start):\n            res.append(path[:])              <span class=\"c\"># 每个节点都是答案<\/span>\n            <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(start, len(nums)):\n                path.append(nums[i])\n                dfs(i + <span class=\"n\">1<\/span>)\n                path.pop()\n\n        dfs(<span class=\"n\">0<\/span>)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">LinkedList<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; path = <span class=\"k\">new<\/span> <span class=\"t\">LinkedList<\/span>&lt;&gt;();\n\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; subsets(<span class=\"k\">int<\/span>[] nums) {\n        dfs(nums, <span class=\"n\">0<\/span>);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> dfs(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> start) {\n        res.add(<span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;(path));      <span class=\"c\">// 每个节点都是答案<\/span>\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = start; i &lt; nums.length; i++) {\n            path.add(nums[i]);\n            dfs(nums, i + <span class=\"n\">1<\/span>);\n            path.removeLast();\n        }\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n · 2ⁿ)，空间 O(n)（不计答案）。<\/p>"},{"key":"151","rank":59,"id":"151","title":"翻转字符串里的单词","difficulty":"中等","tags":["字符串","双指针"],"freq":107,"link":"https://leetcode.cn/problems/reverse-words-in-a-string/","desc":"反转字符串中单词的顺序，并去掉首尾和单词之间多余的空格。","libs":["java-18","java-19","java-20","java-21"],"html":"<h2>思路<\/h2>\n<ul><li>反转的是<strong>单词顺序<\/strong>，不是字符；同时要处理首尾空格和连续空格。<\/li><li><strong>库函数<\/strong>：按空白切分 → 反转单词列表 → 用单个空格拼起来。<\/li><li><strong>双指针<\/strong>（面试官不让用 split 时）：先去掉首尾空格，<code>i<\/code>、<code>j<\/code> 从右往左扫——<code>i<\/code> 往左走到单词前的空格，<code>[i + 1, j]<\/code> 就是一个单词；取出来后 <code>i<\/code> 跳过中间的连续空格，<code>j = i<\/code> 指向下一个单词的结尾。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>Java 的 <code>trim()<\/code> 不改原字符串，要写 <code>s = s.trim()<\/code>。<\/li><li>Java 切分用 <code>split(&quot;\\\\s+&quot;)<\/code>（一个或多个空白），而且要先 <code>trim()<\/code>，否则开头会多一个空串。Python 的 <code>split()<\/code> 不带参数就已经处理好了多余空格。<\/li><li>双指针写法里中间可能有多个空格，要用 <code>while<\/code> 跳过。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：库函数<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">reverseWords<\/span>(self, s: str) -&gt; str:\n        <span class=\"k\">return<\/span> <span class=\"s\">&quot; &quot;<\/span>.join(s.split()[::-<span class=\"n\">1<\/span>])<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">String<\/span> reverseWords(<span class=\"t\">String<\/span> s) {\n        <span class=\"t\">String<\/span>[] words = s.trim().split(<span class=\"s\">&quot;\\\\s+&quot;<\/span>);\n        <span class=\"t\">Collections<\/span>.reverse(<span class=\"t\">Arrays<\/span>.asList(words));\n        <span class=\"k\">return<\/span> <span class=\"t\">String<\/span>.join(<span class=\"s\">&quot; &quot;<\/span>, words);\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：双指针<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">reverseWords<\/span>(self, s: str) -&gt; str:\n        s = s.strip()\n        res = []\n        i = j = len(s) - <span class=\"n\">1<\/span>\n        <span class=\"k\">while<\/span> i &gt;= <span class=\"n\">0<\/span>:\n            <span class=\"k\">while<\/span> i &gt;= <span class=\"n\">0<\/span> <span class=\"k\">and<\/span> s[i] != <span class=\"s\">&quot; &quot;<\/span>:    <span class=\"c\"># i 走到单词前的空格<\/span>\n                i -= <span class=\"n\">1<\/span>\n            res.append(s[i + <span class=\"n\">1<\/span>:j + <span class=\"n\">1<\/span>])\n            <span class=\"k\">while<\/span> i &gt;= <span class=\"n\">0<\/span> <span class=\"k\">and<\/span> s[i] == <span class=\"s\">&quot; &quot;<\/span>:    <span class=\"c\"># 跳过单词间的空格<\/span>\n                i -= <span class=\"n\">1<\/span>\n            j = i\n        <span class=\"k\">return<\/span> <span class=\"s\">&quot; &quot;<\/span>.join(res)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">String<\/span> reverseWords(<span class=\"t\">String<\/span> s) {\n        s = s.trim();\n        <span class=\"t\">StringBuilder<\/span> res = <span class=\"k\">new<\/span> <span class=\"t\">StringBuilder<\/span>();\n        <span class=\"k\">int<\/span> i = s.length() - <span class=\"n\">1<\/span>, j = i;\n        <span class=\"k\">while<\/span> (i &gt;= <span class=\"n\">0<\/span>) {\n            <span class=\"k\">while<\/span> (i &gt;= <span class=\"n\">0<\/span> &amp;&amp; s.charAt(i) != <span class=\"s\">&#x27; &#x27;<\/span>) i--;    <span class=\"c\">// i 走到单词前的空格<\/span>\n            res.append(s, i + <span class=\"n\">1<\/span>, j + <span class=\"n\">1<\/span>).append(<span class=\"s\">&#x27; &#x27;<\/span>);\n            <span class=\"k\">while<\/span> (i &gt;= <span class=\"n\">0<\/span> &amp;&amp; s.charAt(i) == <span class=\"s\">&#x27; &#x27;<\/span>) i--;    <span class=\"c\">// 跳过单词间的空格<\/span>\n            j = i;\n        }\n        <span class=\"k\">return<\/span> res.toString().trim();\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n)。<\/p>"},{"key":"34","rank":60,"id":"34","title":"在排序数组中查找元素的第一个和最后一个位置","difficulty":"中等","tags":["二分"],"freq":104,"link":"https://leetcode.cn/problems/find-first-and-last-position-of-element-in-sorted-array/","desc":"在非递减数组中找 target 的第一个和最后一个位置，不存在返回 [-1, -1]，要求 O(log n)。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>两次二分找左右边界，都用闭区间 <code>[left, right]<\/code>：<ul><li><strong>左边界<\/strong> = 第一个 <code>&gt;= target<\/code> 的位置：<code>nums[mid] &lt; target<\/code> 往右，否则（<code>&gt;=<\/code>）收缩右边界 <code>right = mid - 1<\/code>。循环结束时 <code>left<\/code> 就是它。<\/li><li><strong>右边界<\/strong> = 最后一个 <code>&lt;= target<\/code> 的位置：<code>nums[mid] &gt; target<\/code> 往左，否则（<code>&lt;=<\/code>）收缩左边界 <code>left = mid + 1<\/code>。循环结束时 <code>right<\/code> 就是它。<\/li><\/ul><\/li><li>两个边界都要验证：下标没越界，且该位置的值确实等于 <code>target<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>找到 <code>nums[mid] == target<\/code> 时不能直接返回，要继续往边界那一侧收缩。<\/li><li>左边界返回 <code>left<\/code>，右边界返回 <code>right<\/code>，别记反：循环结束时 <code>left = right + 1<\/code>。<\/li><li><code>target<\/code> 不存在时，<code>left<\/code> / <code>right<\/code> 落在插入点附近甚至越界（<code>left == n<\/code> 或 <code>right == -1<\/code>），所以必须先判越界再比较值。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">searchRange<\/span>(self, nums: List[int], target: int) -&gt; List[int]:\n        <span class=\"k\">return<\/span> [self.leftBound(nums, target), self.rightBound(nums, target)]\n\n    <span class=\"k\">def<\/span> <span class=\"f\">leftBound<\/span>(self, nums, target):       <span class=\"c\"># 第一个 &gt;= target 的位置<\/span>\n        left, right = <span class=\"n\">0<\/span>, len(nums) - <span class=\"n\">1<\/span>\n        <span class=\"k\">while<\/span> left &lt;= right:\n            mid = (left + right) // <span class=\"n\">2<\/span>\n            <span class=\"k\">if<\/span> nums[mid] &lt; target:\n                left = mid + <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:\n                right = mid - <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> left <span class=\"k\">if<\/span> left &lt; len(nums) <span class=\"k\">and<\/span> nums[left] == target <span class=\"k\">else<\/span> -<span class=\"n\">1<\/span>\n\n    <span class=\"k\">def<\/span> <span class=\"f\">rightBound<\/span>(self, nums, target):      <span class=\"c\"># 最后一个 &lt;= target 的位置<\/span>\n        left, right = <span class=\"n\">0<\/span>, len(nums) - <span class=\"n\">1<\/span>\n        <span class=\"k\">while<\/span> left &lt;= right:\n            mid = (left + right) // <span class=\"n\">2<\/span>\n            <span class=\"k\">if<\/span> nums[mid] &gt; target:\n                right = mid - <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:\n                left = mid + <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> right <span class=\"k\">if<\/span> right &gt;= <span class=\"n\">0<\/span> <span class=\"k\">and<\/span> nums[right] == target <span class=\"k\">else<\/span> -<span class=\"n\">1<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span>[] searchRange(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> target) {\n        <span class=\"k\">return<\/span> <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[]{leftBound(nums, target), rightBound(nums, target)};\n    }\n\n    <span class=\"c\">// 第一个 &gt;= target 的位置<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> leftBound(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> target) {\n        <span class=\"k\">int<\/span> left = <span class=\"n\">0<\/span>, right = nums.length - <span class=\"n\">1<\/span>;\n        <span class=\"k\">while<\/span> (left &lt;= right) {\n            <span class=\"k\">int<\/span> mid = left + (right - left) / <span class=\"n\">2<\/span>;\n            <span class=\"k\">if<\/span> (nums[mid] &lt; target) left = mid + <span class=\"n\">1<\/span>;\n            <span class=\"k\">else<\/span> right = mid - <span class=\"n\">1<\/span>;\n        }\n        <span class=\"k\">return<\/span> left &lt; nums.length &amp;&amp; nums[left] == target ? left : -<span class=\"n\">1<\/span>;\n    }\n\n    <span class=\"c\">// 最后一个 &lt;= target 的位置<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> rightBound(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> target) {\n        <span class=\"k\">int<\/span> left = <span class=\"n\">0<\/span>, right = nums.length - <span class=\"n\">1<\/span>;\n        <span class=\"k\">while<\/span> (left &lt;= right) {\n            <span class=\"k\">int<\/span> mid = left + (right - left) / <span class=\"n\">2<\/span>;\n            <span class=\"k\">if<\/span> (nums[mid] &gt; target) right = mid - <span class=\"n\">1<\/span>;\n            <span class=\"k\">else<\/span> left = mid + <span class=\"n\">1<\/span>;\n        }\n        <span class=\"k\">return<\/span> right &gt;= <span class=\"n\">0<\/span> &amp;&amp; nums[right] == target ? right : -<span class=\"n\">1<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(log n)，空间 O(1)。<\/p>"},{"key":"394","rank":61,"id":"394","title":"字符串解码","difficulty":"中等","tags":["栈","字符串"],"freq":103,"link":"https://leetcode.cn/problems/decode-string/","desc":"解码形如 3[a2[c]] 的字符串：k[xxx] 表示 xxx 重复 k 次，可以嵌套。","libs":["java-12","java-18","java-19"],"html":"<h2>思路<\/h2>\n<ul><li>遇到 <code>[<\/code> 进入新的一层，遇到 <code>]<\/code> 回到上一层——用<strong>两个栈<\/strong>模拟递归：一个存「进括号之前已经拼好的字符串」，一个存「这层括号的重复次数」。<\/li><li>逐字符处理，<code>cur<\/code> 是当前层正在拼的字符串，<code>k<\/code> 是正在读的数字：<ul><li>数字：<code>k = k * 10 + 数字<\/code>；<\/li><li><code>[<\/code>：把 <code>k<\/code> 和 <code>cur<\/code> 分别压栈，然后都清空，开始拼括号里的内容；<\/li><li><code>]<\/code>：弹出 <code>prev<\/code> 和 <code>times<\/code>，<code>cur = prev + cur × times<\/code>；<\/li><li>字母：接到 <code>cur<\/code> 后面。<\/li><\/ul><\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>数字可能有多位（<code>10[a]<\/code>），要累加，不能只读一位。<\/li><li><code>[<\/code> 之后必须把 <code>cur<\/code> 和 <code>k<\/code> 都重置，否则上一层的内容会混进来。<\/li><li><code>]<\/code> 之后记得把拼好的结果赋回 <code>cur<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">decodeString<\/span>(self, s: str) -&gt; str:\n        str_stack, cnt_stack = [], []\n        k, cur = <span class=\"n\">0<\/span>, <span class=\"s\">&quot;&quot;<\/span>\n        <span class=\"k\">for<\/span> c <span class=\"k\">in<\/span> s:\n            <span class=\"k\">if<\/span> c.isdigit():\n                k = k * <span class=\"n\">10<\/span> + int(c)\n            <span class=\"k\">elif<\/span> c == <span class=\"s\">&quot;[&quot;<\/span>:\n                cnt_stack.append(k)\n                str_stack.append(cur)\n                k, cur = <span class=\"n\">0<\/span>, <span class=\"s\">&quot;&quot;<\/span>\n            <span class=\"k\">elif<\/span> c == <span class=\"s\">&quot;]&quot;<\/span>:\n                prev, times = str_stack.pop(), cnt_stack.pop()\n                cur = prev + cur * times\n            <span class=\"k\">else<\/span>:\n                cur += c\n        <span class=\"k\">return<\/span> cur<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">String<\/span> decodeString(<span class=\"t\">String<\/span> s) {\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">String<\/span>&gt; strStack = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; cntStack = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        <span class=\"k\">int<\/span> k = <span class=\"n\">0<\/span>;\n        <span class=\"t\">StringBuilder<\/span> cur = <span class=\"k\">new<\/span> <span class=\"t\">StringBuilder<\/span>();\n        <span class=\"k\">for<\/span> (<span class=\"k\">char<\/span> c : s.toCharArray()) {\n            <span class=\"k\">if<\/span> (<span class=\"t\">Character<\/span>.isDigit(c)) {\n                k = k * <span class=\"n\">10<\/span> + (c - <span class=\"s\">&#x27;0&#x27;<\/span>);\n            } <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (c == <span class=\"s\">&#x27;[&#x27;<\/span>) {\n                cntStack.push(k);\n                strStack.push(cur.toString());\n                k = <span class=\"n\">0<\/span>;\n                cur = <span class=\"k\">new<\/span> <span class=\"t\">StringBuilder<\/span>();\n            } <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (c == <span class=\"s\">&#x27;]&#x27;<\/span>) {\n                <span class=\"t\">StringBuilder<\/span> sb = <span class=\"k\">new<\/span> <span class=\"t\">StringBuilder<\/span>(strStack.pop());\n                <span class=\"k\">int<\/span> times = cntStack.pop();\n                <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; times; i++) sb.append(cur);\n                cur = sb;\n            } <span class=\"k\">else<\/span> {\n                cur.append(c);\n            }\n        }\n        <span class=\"k\">return<\/span> cur.toString();\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(解码后的长度)，空间 O(解码后的长度)。<\/p>"},{"key":"offer22","rank":62,"id":"剑指 Offer 22","title":"链表中倒数第k个节点","difficulty":"简单","tags":["链表","双指针"],"freq":103,"link":"https://leetcode.cn/problems/lian-biao-zhong-dao-shu-di-kge-jie-dian-lcof/","desc":"返回链表的倒数第 k 个节点（现为 LCR 140 训练计划 II，参数名是 cnt）。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>快慢指针拉开固定间隔：<code>fast<\/code> 先走 <code>cnt<\/code> 步，然后 <code>fast<\/code> 和 <code>p<\/code> 一起走。<\/li><li><code>fast<\/code> 走到 <code>null<\/code> 时，<code>p<\/code> 正好在倒数第 <code>cnt<\/code> 个节点。<\/li><li>和 <a href=\"#/19\">19<\/a> 是同一个套路：那题要删除，所以多一个 <code>dummy<\/code> 让慢指针停在前驱；这题只要找到，不需要 <code>dummy<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>第二个循环的条件是 <code>fast != null<\/code>，写成 <code>fast.next != null<\/code> 会错一位。<\/li><li>题目保证 <code>cnt<\/code> 不超过链表长度；<code>cnt == 长度<\/code> 时 <code>fast<\/code> 直接走到 <code>null<\/code>，返回 <code>head<\/code>，正确。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">trainingPlan<\/span>(self, head: Optional[ListNode], cnt: int) -&gt; Optional[ListNode]:\n        fast = head\n        <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(cnt):                 <span class=\"c\"># fast 先走 cnt 步<\/span>\n            fast = fast.next\n        p = head\n        <span class=\"k\">while<\/span> fast:\n            fast = fast.next\n            p = p.next\n        <span class=\"k\">return<\/span> p<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> trainingPlan(<span class=\"t\">ListNode<\/span> head, <span class=\"k\">int<\/span> cnt) {\n        <span class=\"t\">ListNode<\/span> fast = head;\n        <span class=\"k\">while<\/span> (cnt-- &gt; <span class=\"n\">0<\/span>) {                  <span class=\"c\">// fast 先走 cnt 步<\/span>\n            fast = fast.next;\n        }\n        <span class=\"t\">ListNode<\/span> p = head;\n        <span class=\"k\">while<\/span> (fast != <span class=\"k\">null<\/span>) {\n            fast = fast.next;\n            p = p.next;\n        }\n        <span class=\"k\">return<\/span> p;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"129","rank":63,"id":"129","title":"求根到叶子节点数字之和","difficulty":"中等","tags":["二叉树","DFS"],"freq":100,"link":"https://leetcode.cn/problems/sum-root-to-leaf-numbers/","desc":"每条从根到叶子的路径拼成一个数字，求所有这些数字的和。","libs":["python-11"],"html":"<h2>思路<\/h2>\n<ul><li>DFS 往下走，路径上的数字按十进制拼接：<code>path = path * 10 + node.val<\/code>（每下一层相当于原数左移一位）。<\/li><li>走到叶子节点（左右孩子都为空）时，把当前 <code>path<\/code> 加进结果。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>只在<strong>叶子<\/strong>节点累加，不是在空节点累加（否则只有一个孩子的节点会被多算）。<\/li><li><code>path<\/code> 当参数往下传时，每层有自己的副本，不用回溯。如果写成全局变量，递归返回前要撤销：<code>path = (path - node.val) / 10<\/code>，否则会污染兄弟节点的路径。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">sumNumbers<\/span>(self, root: Optional[TreeNode]) -&gt; int:\n        res = <span class=\"n\">0<\/span>\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(node, path):\n            <span class=\"k\">nonlocal<\/span> res\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> node:\n                <span class=\"k\">return<\/span>\n            path = path * <span class=\"n\">10<\/span> + node.val\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> node.left <span class=\"k\">and<\/span> <span class=\"k\">not<\/span> node.right:     <span class=\"c\"># 叶子<\/span>\n                res += path\n                <span class=\"k\">return<\/span>\n            dfs(node.left, path)\n            dfs(node.right, path)\n\n        dfs(root, <span class=\"n\">0<\/span>)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> sumNumbers(<span class=\"t\">TreeNode<\/span> root) {\n        dfs(root, <span class=\"n\">0<\/span>);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> dfs(<span class=\"t\">TreeNode<\/span> node, <span class=\"k\">int<\/span> path) {\n        <span class=\"k\">if<\/span> (node == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span>;\n        path = path * <span class=\"n\">10<\/span> + node.val;\n        <span class=\"k\">if<\/span> (node.left == <span class=\"k\">null<\/span> &amp;&amp; node.right == <span class=\"k\">null<\/span>) {   <span class=\"c\">// 叶子<\/span>\n            res += path;\n            <span class=\"k\">return<\/span>;\n        }\n        dfs(node.left, path);\n        dfs(node.right, path);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(h)。<\/p>"},{"key":"155","rank":64,"id":"155","title":"最小栈","difficulty":"简单","tags":["设计","栈"],"freq":99,"link":"https://leetcode.cn/problems/min-stack/","desc":"设计一个栈，支持 push、pop、top，并能在 O(1) 时间取到当前最小值。","libs":["java-12"],"html":"<h2>思路<\/h2>\n<ul><li>空间换时间：除了正常的数据栈 <code>stk<\/code>，再维护一个<strong>等长<\/strong>的最小栈 <code>minStk<\/code>，<code>minStk[i]<\/code> = 数据栈前 <code>i + 1<\/code> 个元素里的最小值。<\/li><li><code>push<\/code>：新元素比 <code>minStk<\/code> 栈顶小就压新元素，否则把栈顶（当前最小值）再压一遍。<\/li><li><code>pop<\/code>：两个栈同步弹。<code>getMin<\/code> 就是 <code>minStk<\/code> 的栈顶。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>最小值不变时也要重复压一遍：两个栈等长，弹栈时才能同步恢复出「弹之前的最小值」。<\/li><li>省空间的变体：只在 <code>val &lt;= 最小值<\/code> 时才压 <code>minStk<\/code>，弹栈时要判断弹出的值是否等于 <code>minStk<\/code> 栈顶。Java 里这个比较是两个 <code>Integer<\/code>，要用 <code>equals<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">MinStack<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">__init__<\/span>(self):\n        self.stk = []\n        self.min_stk = []                    <span class=\"c\"># min_stk[i]：stk[0..i] 的最小值<\/span>\n\n    <span class=\"k\">def<\/span> <span class=\"f\">push<\/span>(self, val: int) -&gt; <span class=\"k\">None<\/span>:\n        self.stk.append(val)\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> self.min_stk <span class=\"k\">or<\/span> val &lt; self.min_stk[-<span class=\"n\">1<\/span>]:\n            self.min_stk.append(val)\n        <span class=\"k\">else<\/span>:\n            self.min_stk.append(self.min_stk[-<span class=\"n\">1<\/span>])\n\n    <span class=\"k\">def<\/span> <span class=\"f\">pop<\/span>(self) -&gt; <span class=\"k\">None<\/span>:\n        self.stk.pop()\n        self.min_stk.pop()\n\n    <span class=\"k\">def<\/span> <span class=\"f\">top<\/span>(self) -&gt; int:\n        <span class=\"k\">return<\/span> self.stk[-<span class=\"n\">1<\/span>]\n\n    <span class=\"k\">def<\/span> <span class=\"f\">getMin<\/span>(self) -&gt; int:\n        <span class=\"k\">return<\/span> self.min_stk[-<span class=\"n\">1<\/span>]<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">MinStack<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; stk = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; minStk = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();   <span class=\"c\">// 与 stk 等长，栈顶是当前最小值<\/span>\n\n    <span class=\"k\">public<\/span> <span class=\"t\">MinStack<\/span>() {\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">void<\/span> push(<span class=\"k\">int<\/span> val) {\n        stk.push(val);\n        <span class=\"k\">if<\/span> (minStk.isEmpty() || val &lt; minStk.peek()) {\n            minStk.push(val);\n        } <span class=\"k\">else<\/span> {\n            minStk.push(minStk.peek());\n        }\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">void<\/span> pop() {\n        stk.pop();\n        minStk.pop();\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> top() {\n        <span class=\"k\">return<\/span> stk.peek();\n    }\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> getMin() {\n        <span class=\"k\">return<\/span> minStk.peek();\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：各操作 O(1)，空间 O(n)。<\/p>"},{"key":"695","rank":65,"id":"695","title":"岛屿的最大面积","difficulty":"中等","tags":["图","DFS","BFS","矩阵"],"freq":97,"link":"https://leetcode.cn/problems/max-area-of-island/","desc":"求网格中最大的岛屿面积（由 1 组成的四连通块的格子数）。","libs":["python-0","java-12"],"html":"<h2>思路<\/h2>\n<ul><li>和 <a href=\"#/200\">200 岛屿数量<\/a> 一样是 Flood Fill：遍历网格，遇到 <code>1<\/code> 就把整座岛淹掉，只是这次要<strong>数淹了多少格<\/strong>，取最大值。<\/li><li><strong>DFS<\/strong>：函数返回从 <code>(i, j)<\/code> 出发淹掉的格子数 = <code>1 + 四个方向的结果之和<\/code>。<\/li><li><strong>BFS<\/strong>：每座岛一个队列，出队一个 <code>area++<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>原地把访问过的格子置 0，否则重复访问 / 死循环。<\/li><li>DFS 的越界判断放最前面；BFS 入队时就置 0。<\/li><li>这题网格是数字 <code>1<\/code>，<a href=\"#/200\">200<\/a> 是字符 <code>&#x27;1&#x27;<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：DFS<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">maxAreaOfIsland<\/span>(self, grid: List[List[int]]) -&gt; int:\n        m, n = len(grid), len(grid[<span class=\"n\">0<\/span>])\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(i, j):                       <span class=\"c\"># 返回从 (i, j) 淹掉的面积<\/span>\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> (<span class=\"n\">0<\/span> &lt;= i &lt; m <span class=\"k\">and<\/span> <span class=\"n\">0<\/span> &lt;= j &lt; n) <span class=\"k\">or<\/span> grid[i][j] == <span class=\"n\">0<\/span>:\n                <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>\n            grid[i][j] = <span class=\"n\">0<\/span>\n            <span class=\"k\">return<\/span> <span class=\"n\">1<\/span> + dfs(i - <span class=\"n\">1<\/span>, j) + dfs(i + <span class=\"n\">1<\/span>, j) + dfs(i, j - <span class=\"n\">1<\/span>) + dfs(i, j + <span class=\"n\">1<\/span>)\n\n        <span class=\"k\">return<\/span> max(dfs(i, j) <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(m) <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(n))<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> maxAreaOfIsland(<span class=\"k\">int<\/span>[][] grid) {\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; grid.length; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">0<\/span>; j &lt; grid[<span class=\"n\">0<\/span>].length; j++) {\n                <span class=\"k\">if<\/span> (grid[i][j] == <span class=\"n\">1<\/span>) res = <span class=\"t\">Math<\/span>.max(res, dfs(grid, i, j));\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"c\">// 返回从 (i, j) 淹掉的面积<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> dfs(<span class=\"k\">int<\/span>[][] grid, <span class=\"k\">int<\/span> i, <span class=\"k\">int<\/span> j) {\n        <span class=\"k\">if<\/span> (i &lt; <span class=\"n\">0<\/span> || j &lt; <span class=\"n\">0<\/span> || i &gt;= grid.length || j &gt;= grid[<span class=\"n\">0<\/span>].length || grid[i][j] == <span class=\"n\">0<\/span>) <span class=\"k\">return<\/span> <span class=\"n\">0<\/span>;\n        grid[i][j] = <span class=\"n\">0<\/span>;\n        <span class=\"k\">return<\/span> <span class=\"n\">1<\/span> + dfs(grid, i - <span class=\"n\">1<\/span>, j) + dfs(grid, i + <span class=\"n\">1<\/span>, j) + dfs(grid, i, j - <span class=\"n\">1<\/span>) + dfs(grid, i, j + <span class=\"n\">1<\/span>);\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：BFS<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">maxAreaOfIsland<\/span>(self, grid: List[List[int]]) -&gt; int:\n        m, n = len(grid), len(grid[<span class=\"n\">0<\/span>])\n        res = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(m):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(n):\n                <span class=\"k\">if<\/span> grid[i][j] == <span class=\"n\">0<\/span>:\n                    <span class=\"k\">continue<\/span>\n                grid[i][j] = <span class=\"n\">0<\/span>               <span class=\"c\"># 入队时就标记<\/span>\n                q, area = deque([(i, j)]), <span class=\"n\">0<\/span>\n                <span class=\"k\">while<\/span> q:\n                    x, y = q.popleft()\n                    area += <span class=\"n\">1<\/span>\n                    <span class=\"k\">for<\/span> nx, ny <span class=\"k\">in<\/span> (x - <span class=\"n\">1<\/span>, y), (x + <span class=\"n\">1<\/span>, y), (x, y - <span class=\"n\">1<\/span>), (x, y + <span class=\"n\">1<\/span>):\n                        <span class=\"k\">if<\/span> <span class=\"n\">0<\/span> &lt;= nx &lt; m <span class=\"k\">and<\/span> <span class=\"n\">0<\/span> &lt;= ny &lt; n <span class=\"k\">and<\/span> grid[nx][ny] == <span class=\"n\">1<\/span>:\n                            grid[nx][ny] = <span class=\"n\">0<\/span>\n                            q.append((nx, ny))\n                res = max(res, area)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">static<\/span> <span class=\"k\">final<\/span> <span class=\"k\">int<\/span>[][] DIRS = {{-<span class=\"n\">1<\/span>, <span class=\"n\">0<\/span>}, {<span class=\"n\">1<\/span>, <span class=\"n\">0<\/span>}, {<span class=\"n\">0<\/span>, -<span class=\"n\">1<\/span>}, {<span class=\"n\">0<\/span>, <span class=\"n\">1<\/span>}};\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> maxAreaOfIsland(<span class=\"k\">int<\/span>[][] grid) {\n        <span class=\"k\">int<\/span> m = grid.length, n = grid[<span class=\"n\">0<\/span>].length, res = <span class=\"n\">0<\/span>;\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"k\">int<\/span>[]&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; m; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">0<\/span>; j &lt; n; j++) {\n                <span class=\"k\">if<\/span> (grid[i][j] == <span class=\"n\">0<\/span>) <span class=\"k\">continue<\/span>;\n                grid[i][j] = <span class=\"n\">0<\/span>;                  <span class=\"c\">// 入队时就标记<\/span>\n                q.offer(<span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[]{i, j});\n                <span class=\"k\">int<\/span> area = <span class=\"n\">0<\/span>;\n                <span class=\"k\">while<\/span> (!q.isEmpty()) {\n                    <span class=\"k\">int<\/span>[] cur = q.poll();\n                    area++;\n                    <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span>[] d : DIRS) {\n                        <span class=\"k\">int<\/span> x = cur[<span class=\"n\">0<\/span>] + d[<span class=\"n\">0<\/span>], y = cur[<span class=\"n\">1<\/span>] + d[<span class=\"n\">1<\/span>];\n                        <span class=\"k\">if<\/span> (x &lt; <span class=\"n\">0<\/span> || x &gt;= m || y &lt; <span class=\"n\">0<\/span> || y &gt;= n || grid[x][y] == <span class=\"n\">0<\/span>) <span class=\"k\">continue<\/span>;\n                        grid[x][y] = <span class=\"n\">0<\/span>;\n                        q.offer(<span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[]{x, y});\n                    }\n                }\n                res = <span class=\"t\">Math<\/span>.max(res, area);\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(mn)，空间最坏 O(mn)。<\/p>"},{"key":"128","rank":66,"id":"128","title":"最长连续序列","difficulty":"中等","tags":["哈希表","数组"],"freq":97,"link":"https://leetcode.cn/problems/longest-consecutive-sequence/","desc":"求未排序数组中数字连续的最长序列的长度（不要求在原数组里相邻），要求 O(n)。","libs":["java-15"],"html":"<h2>思路<\/h2>\n<ul><li>全部放进 <code>HashSet<\/code>，O(1) 查找。<\/li><li><strong>只从「序列的起点」开始往右数<\/strong>：<code>num - 1<\/code> 不在集合里，<code>num<\/code> 才是起点；然后不断看 <code>cur + 1<\/code> 在不在集合里。<\/li><li>每个数最多被「往右数」经过一次，所以总共是 O(n)。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>不判断起点、对每个数都往右数，会退化成 O(n²)。<\/li><li><strong>遍历集合而不是原数组<\/strong>：原数组有大量重复时，同一个起点会被反复扩展而超时。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">longestConsecutive<\/span>(self, nums: List[int]) -&gt; int:\n        num_set = set(nums)\n        res = <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> num <span class=\"k\">in<\/span> num_set:\n            <span class=\"k\">if<\/span> num - <span class=\"n\">1<\/span> <span class=\"k\">in<\/span> num_set:           <span class=\"c\"># 不是起点，跳过<\/span>\n                <span class=\"k\">continue<\/span>\n            cur = num\n            <span class=\"k\">while<\/span> cur + <span class=\"n\">1<\/span> <span class=\"k\">in<\/span> num_set:\n                cur += <span class=\"n\">1<\/span>\n            res = max(res, cur - num + <span class=\"n\">1<\/span>)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> longestConsecutive(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"t\">Set<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; set = <span class=\"k\">new<\/span> <span class=\"t\">HashSet<\/span>&lt;&gt;();\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> num : nums) set.add(num);\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> num : set) {\n            <span class=\"k\">if<\/span> (set.contains(num - <span class=\"n\">1<\/span>)) <span class=\"k\">continue<\/span>;     <span class=\"c\">// 不是起点，跳过<\/span>\n            <span class=\"k\">int<\/span> cur = num;\n            <span class=\"k\">while<\/span> (set.contains(cur + <span class=\"n\">1<\/span>)) cur++;\n            res = <span class=\"t\">Math<\/span>.max(res, cur - num + <span class=\"n\">1<\/span>);\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n)。<\/p>"},{"key":"470","rank":67,"id":"470","title":"用 Rand7() 实现 Rand10()","difficulty":"中等","tags":["数学","概率"],"freq":97,"link":"https://leetcode.cn/problems/implement-rand10-using-rand7/","desc":"只用等概率生成 1~7 的 rand7()，实现等概率生成 1~10 的 rand10()。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li><strong>等概率扩展 + 拒绝采样<\/strong>。<\/li><li>两次 <code>rand7()<\/code> 拼成等概率的 <code>[1, 49]<\/code>：<code>num = (a - 1) * 7 + b<\/code>（把 7×7 的格子展平成一维）。<\/li><li>49 不是 10 的倍数：只接受前 40 个数，映射成 <code>num % 10 + 1<\/code>；落在 <code>[41, 49]<\/code> 就丢弃重来。<\/li><li>优化（废物利用，减少重抽次数）：<ul><li>被丢弃的 <code>[41, 49]<\/code> 有 9 个数，等价于一个 rand9，再乘一次 <code>rand7()<\/code> 得到 <code>[1, 63]<\/code>，接受前 60 个；<\/li><li>剩下 <code>[61, 63]<\/code> 的 3 个数再乘一次得到 <code>[1, 21]<\/code>，接受前 20 个；剩 1 个数没法再利用，重来。<\/li><\/ul><\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>不能用 <code>rand7() + rand7()<\/code> 或直接 <code>% 10<\/code>：只有在大小是 10 的倍数的均匀区间上取模才等概率。<\/li><li><code>(a - 1) * 7 + b<\/code> 里的 <code>- 1<\/code> 不能丢，否则范围不是连续的 <code>[1, 49]<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：拒绝采样<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">rand10<\/span>(self) -&gt; int:\n        <span class=\"k\">while<\/span> <span class=\"k\">True<\/span>:\n            num = (rand7() - <span class=\"n\">1<\/span>) * <span class=\"n\">7<\/span> + rand7()    <span class=\"c\"># 均匀的 [1, 49]<\/span>\n            <span class=\"k\">if<\/span> num &lt;= <span class=\"n\">40<\/span>:\n                <span class=\"k\">return<\/span> num % <span class=\"n\">10<\/span> + <span class=\"n\">1<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> <span class=\"k\">extends<\/span> <span class=\"t\">SolBase<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> rand10() {\n        <span class=\"k\">while<\/span> (<span class=\"k\">true<\/span>) {\n            <span class=\"k\">int<\/span> num = (rand7() - <span class=\"n\">1<\/span>) * <span class=\"n\">7<\/span> + rand7();   <span class=\"c\">// 均匀的 [1, 49]<\/span>\n            <span class=\"k\">if<\/span> (num &lt;= <span class=\"n\">40<\/span>) <span class=\"k\">return<\/span> num % <span class=\"n\">10<\/span> + <span class=\"n\">1<\/span>;\n        }\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：复用被拒绝的数<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">rand10<\/span>(self) -&gt; int:\n        <span class=\"k\">while<\/span> <span class=\"k\">True<\/span>:\n            num = (rand7() - <span class=\"n\">1<\/span>) * <span class=\"n\">7<\/span> + rand7()            <span class=\"c\"># [1, 49]<\/span>\n            <span class=\"k\">if<\/span> num &lt;= <span class=\"n\">40<\/span>:\n                <span class=\"k\">return<\/span> num % <span class=\"n\">10<\/span> + <span class=\"n\">1<\/span>\n            num = (num - <span class=\"n\">40<\/span> - <span class=\"n\">1<\/span>) * <span class=\"n\">7<\/span> + rand7()           <span class=\"c\"># 剩 9 个数 -&gt; [1, 63]<\/span>\n            <span class=\"k\">if<\/span> num &lt;= <span class=\"n\">60<\/span>:\n                <span class=\"k\">return<\/span> num % <span class=\"n\">10<\/span> + <span class=\"n\">1<\/span>\n            num = (num - <span class=\"n\">60<\/span> - <span class=\"n\">1<\/span>) * <span class=\"n\">7<\/span> + rand7()           <span class=\"c\"># 剩 3 个数 -&gt; [1, 21]<\/span>\n            <span class=\"k\">if<\/span> num &lt;= <span class=\"n\">20<\/span>:\n                <span class=\"k\">return<\/span> num % <span class=\"n\">10<\/span> + <span class=\"n\">1<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> <span class=\"k\">extends<\/span> <span class=\"t\">SolBase<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> rand10() {\n        <span class=\"k\">while<\/span> (<span class=\"k\">true<\/span>) {\n            <span class=\"k\">int<\/span> num = (rand7() - <span class=\"n\">1<\/span>) * <span class=\"n\">7<\/span> + rand7();       <span class=\"c\">// [1, 49]<\/span>\n            <span class=\"k\">if<\/span> (num &lt;= <span class=\"n\">40<\/span>) <span class=\"k\">return<\/span> num % <span class=\"n\">10<\/span> + <span class=\"n\">1<\/span>;\n            num = (num - <span class=\"n\">40<\/span> - <span class=\"n\">1<\/span>) * <span class=\"n\">7<\/span> + rand7();          <span class=\"c\">// 剩 9 个数 -&gt; [1, 63]<\/span>\n            <span class=\"k\">if<\/span> (num &lt;= <span class=\"n\">60<\/span>) <span class=\"k\">return<\/span> num % <span class=\"n\">10<\/span> + <span class=\"n\">1<\/span>;\n            num = (num - <span class=\"n\">60<\/span> - <span class=\"n\">1<\/span>) * <span class=\"n\">7<\/span> + rand7();          <span class=\"c\">// 剩 3 个数 -&gt; [1, 21]<\/span>\n            <span class=\"k\">if<\/span> (num &lt;= <span class=\"n\">20<\/span>) <span class=\"k\">return<\/span> num % <span class=\"n\">10<\/span> + <span class=\"n\">1<\/span>;\n        }\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：期望 O(1)。写法一平均调用 rand7 约 2.45 次，写法二约 2.19 次。<\/p>"},{"key":"64","rank":68,"id":"64","title":"最小路径和","difficulty":"中等","tags":["动态规划","矩阵"],"freq":97,"link":"https://leetcode.cn/problems/minimum-path-sum/","desc":"从网格左上角走到右下角，每次只能向右或向下，求路径上数字之和的最小值。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li><code>dp[i][j]<\/code>：从 <code>(0, 0)<\/code> 走到 <code>(i, j)<\/code> 的最小路径和。<\/li><li>只能从上边或左边过来：<code>dp[i][j] = grid[i][j] + min(dp[i-1][j], dp[i][j-1])<\/code>。<\/li><li>初始化：<code>dp[0][0] = grid[0][0]<\/code>；第一行只能从左边来，第一列只能从上边来，各自累加。<\/li><li>自顶向下也可以：<code>dp(x, y)<\/code> 递归到 <code>(0, 0)<\/code>，加记忆化。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>第一行、第一列要单独初始化，不能直接套转移公式（没有上边 / 左边）。<\/li><li>转移时别漏了加当前格子 <code>grid[i][j]<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">minPathSum<\/span>(self, grid: List[List[int]]) -&gt; int:\n        m, n = len(grid), len(grid[<span class=\"n\">0<\/span>])\n        dp = [[<span class=\"n\">0<\/span>] * n <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(m)]\n        dp[<span class=\"n\">0<\/span>][<span class=\"n\">0<\/span>] = grid[<span class=\"n\">0<\/span>][<span class=\"n\">0<\/span>]\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, m):                <span class=\"c\"># 第一列：只能从上边来<\/span>\n            dp[i][<span class=\"n\">0<\/span>] = grid[i][<span class=\"n\">0<\/span>] + dp[i - <span class=\"n\">1<\/span>][<span class=\"n\">0<\/span>]\n        <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, n):                <span class=\"c\"># 第一行：只能从左边来<\/span>\n            dp[<span class=\"n\">0<\/span>][j] = grid[<span class=\"n\">0<\/span>][j] + dp[<span class=\"n\">0<\/span>][j - <span class=\"n\">1<\/span>]\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, m):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, n):\n                dp[i][j] = grid[i][j] + min(dp[i - <span class=\"n\">1<\/span>][j], dp[i][j - <span class=\"n\">1<\/span>])\n        <span class=\"k\">return<\/span> dp[m - <span class=\"n\">1<\/span>][n - <span class=\"n\">1<\/span>]<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> minPathSum(<span class=\"k\">int<\/span>[][] grid) {\n        <span class=\"k\">int<\/span> m = grid.length, n = grid[<span class=\"n\">0<\/span>].length;\n        <span class=\"k\">int<\/span>[][] dp = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[m][n];\n        dp[<span class=\"n\">0<\/span>][<span class=\"n\">0<\/span>] = grid[<span class=\"n\">0<\/span>][<span class=\"n\">0<\/span>];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt; m; i++) dp[i][<span class=\"n\">0<\/span>] = grid[i][<span class=\"n\">0<\/span>] + dp[i - <span class=\"n\">1<\/span>][<span class=\"n\">0<\/span>];   <span class=\"c\">// 第一列：只能从上边来<\/span>\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">1<\/span>; j &lt; n; j++) dp[<span class=\"n\">0<\/span>][j] = grid[<span class=\"n\">0<\/span>][j] + dp[<span class=\"n\">0<\/span>][j - <span class=\"n\">1<\/span>];   <span class=\"c\">// 第一行：只能从左边来<\/span>\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt; m; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">1<\/span>; j &lt; n; j++) {\n                dp[i][j] = grid[i][j] + <span class=\"t\">Math<\/span>.min(dp[i - <span class=\"n\">1<\/span>][j], dp[i][j - <span class=\"n\">1<\/span>]);\n            }\n        }\n        <span class=\"k\">return<\/span> dp[m - <span class=\"n\">1<\/span>][n - <span class=\"n\">1<\/span>];\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(mn)，空间 O(mn)（可压成一维 O(n)）。<\/p>"},{"key":"101","rank":69,"id":"101","title":"对称二叉树","difficulty":"简单","tags":["二叉树","DFS","BFS"],"freq":97,"link":"https://leetcode.cn/problems/symmetric-tree/","desc":"判断二叉树是否轴对称（左右子树互为镜像）。","libs":["python-0","java-12","java-13"],"html":"<h2>思路<\/h2>\n<ul><li>问题转化成：判断两棵树 <code>l<\/code>、<code>r<\/code> 是否互为<strong>镜像<\/strong>——根的值相等，且 <code>l.left ↔ r.right<\/code>、<code>l.right ↔ r.left<\/code> 分别互为镜像。<\/li><li><strong>递归<\/strong>：<code>check(l, r)<\/code>。两个都空 → true；只有一个空或值不等 → false；否则递归比较外侧一对和内侧一对。<\/li><li><strong>迭代<\/strong>：队列里永远成对放「应该互为镜像」的两个节点，每次弹两个出来比较，再按镜像顺序把它们的孩子成对入队。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>先判「都空」，再判「一个空或值不等」，顺序反了会空指针。<\/li><li>迭代入队顺序：<code>u.left<\/code> 配 <code>v.right<\/code>，<code>u.right<\/code> 配 <code>v.left<\/code>。<\/li><li>迭代要把 <code>null<\/code> 也入队：Java 的 <code>ArrayDeque<\/code> <strong>不允许放 null<\/strong>，这里要用 <code>LinkedList<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：递归<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">isSymmetric<\/span>(self, root: Optional[TreeNode]) -&gt; bool:\n        <span class=\"k\">def<\/span> <span class=\"f\">check<\/span>(l, r):                     <span class=\"c\"># l 和 r 是否互为镜像<\/span>\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> l <span class=\"k\">and<\/span> <span class=\"k\">not<\/span> r:\n                <span class=\"k\">return<\/span> <span class=\"k\">True<\/span>\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> l <span class=\"k\">or<\/span> <span class=\"k\">not<\/span> r <span class=\"k\">or<\/span> l.val != r.val:\n                <span class=\"k\">return<\/span> <span class=\"k\">False<\/span>\n            <span class=\"k\">return<\/span> check(l.left, r.right) <span class=\"k\">and<\/span> check(l.right, r.left)\n\n        <span class=\"k\">return<\/span> check(root.left, root.right)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> isSymmetric(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"k\">return<\/span> check(root.left, root.right);\n    }\n\n    <span class=\"c\">// l 和 r 是否互为镜像<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">boolean<\/span> check(<span class=\"t\">TreeNode<\/span> l, <span class=\"t\">TreeNode<\/span> r) {\n        <span class=\"k\">if<\/span> (l == <span class=\"k\">null<\/span> &amp;&amp; r == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> <span class=\"k\">true<\/span>;\n        <span class=\"k\">if<\/span> (l == <span class=\"k\">null<\/span> || r == <span class=\"k\">null<\/span> || l.val != r.val) <span class=\"k\">return<\/span> <span class=\"k\">false<\/span>;\n        <span class=\"k\">return<\/span> check(l.left, r.right) &amp;&amp; check(l.right, r.left);\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：迭代<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">isSymmetric<\/span>(self, root: Optional[TreeNode]) -&gt; bool:\n        q = deque([(root.left, root.right)])         <span class=\"c\"># 成对存放应互为镜像的节点<\/span>\n        <span class=\"k\">while<\/span> q:\n            u, v = q.popleft()\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> u <span class=\"k\">and<\/span> <span class=\"k\">not<\/span> v:\n                <span class=\"k\">continue<\/span>\n            <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> u <span class=\"k\">or<\/span> <span class=\"k\">not<\/span> v <span class=\"k\">or<\/span> u.val != v.val:\n                <span class=\"k\">return<\/span> <span class=\"k\">False<\/span>\n            q.append((u.left, v.right))\n            q.append((u.right, v.left))\n        <span class=\"k\">return<\/span> <span class=\"k\">True<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> isSymmetric(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"t\">Queue<\/span>&lt;<span class=\"t\">TreeNode<\/span>&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">LinkedList<\/span>&lt;&gt;();      <span class=\"c\">// 要放 null，不能用 ArrayDeque<\/span>\n        q.offer(root.left);\n        q.offer(root.right);\n        <span class=\"k\">while<\/span> (!q.isEmpty()) {\n            <span class=\"t\">TreeNode<\/span> u = q.poll(), v = q.poll();     <span class=\"c\">// 成对取出应互为镜像的节点<\/span>\n            <span class=\"k\">if<\/span> (u == <span class=\"k\">null<\/span> &amp;&amp; v == <span class=\"k\">null<\/span>) <span class=\"k\">continue<\/span>;\n            <span class=\"k\">if<\/span> (u == <span class=\"k\">null<\/span> || v == <span class=\"k\">null<\/span> || u.val != v.val) <span class=\"k\">return<\/span> <span class=\"k\">false<\/span>;\n            q.offer(u.left);\n            q.offer(v.right);\n            q.offer(u.right);\n            q.offer(v.left);\n        }\n        <span class=\"k\">return<\/span> <span class=\"k\">true<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n)。<\/p>"},{"key":"39","rank":70,"id":"39","title":"组合总和","difficulty":"中等","tags":["回溯"],"freq":96,"link":"https://leetcode.cn/problems/combination-sum/","desc":"从无重复元素的数组中选数（每个数可重复选），返回所有和为 target 的组合。","libs":["python-5","java-13","java-20"],"html":"<h2>思路<\/h2>\n<ul><li>回溯枚举组合：<code>path<\/code> 是当前组合，<code>target<\/code> 是还差多少，<code>start<\/code> 控制只往后选（避免 <code>[2,3]<\/code> 和 <code>[3,2]<\/code> 重复）。<\/li><li><strong>可以重复选<\/strong>：递归时传 <code>i<\/code> 而不是 <code>i + 1<\/code>，下一层还能再选当前这个数。<\/li><li><code>target == 0<\/code> 时收集答案。<\/li><li>剪枝：先排序，一旦 <code>target - num &lt; 0<\/code>，后面的数更大，直接 <code>break<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>传 <code>i<\/code> 还是 <code>i + 1<\/code> 是这题和「每个数只能用一次」（40 组合总和 II）的唯一区别。<\/li><li>没排序时只能 <code>continue<\/code>，排了序才能 <code>break<\/code>。<\/li><li>收集答案要拷贝 <code>path<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">combinationSum<\/span>(self, candidates: List[int], target: int) -&gt; List[List[int]]:\n        candidates.sort()\n        res, path = [], []\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(target, start):\n            <span class=\"k\">if<\/span> target == <span class=\"n\">0<\/span>:\n                res.append(path[:])\n                <span class=\"k\">return<\/span>\n            <span class=\"k\">for<\/span> i
