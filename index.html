n                <span class=\"k\">if<\/span> (nums[mid] &lt; target &amp;&amp; target &lt;= nums[right]) left = mid + <span class=\"n\">1<\/span>;\n                <span class=\"k\">else<\/span> right = mid - <span class=\"n\">1<\/span>;\n            }\n        }\n        <span class=\"k\">return<\/span> -<span class=\"n\">1<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(log n)，空间 O(1)。<\/p>"},{"key":"46","rank":14,"id":"46","title":"全排列","difficulty":"中等","tags":["回溯"],"freq":306,"link":"https://leetcode.cn/problems/permutations/","desc":"返回不含重复数字的数组的所有排列。","libs":["java-13"],"html":"<h2>思路<\/h2>\n<ul><li>回溯模板题：每个位置都尝试放一个还没用过的数。<\/li><li>三件套：<strong>路径<\/strong> <code>path<\/code>（已选的数）、<strong>选择列表<\/strong>（<code>visited[i]<\/code> 为 false 的数）、<strong>结束条件<\/strong>（<code>path<\/code> 长度等于 n）。<\/li><li>框架：<code>for 选择 in 选择列表: 做选择 → 递归 → 撤销选择<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>收集答案时必须拷贝一份 <code>path<\/code>，否则存进去的是同一个引用。<\/li><li>撤销选择要成对：<code>path<\/code> 弹出 + <code>visited<\/code> 复位。<\/li><li>排列每层都从 0 开始枚举、靠 <code>visited<\/code> 排除；组合 / 子集（<a href=\"#/78\">78<\/a>、<a href=\"#/39\">39<\/a>）才用 <code>start<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">permute<\/span>(self, nums: List[int]) -&gt; List[List[int]]:\n        res, path = [], []\n        visited = [<span class=\"k\">False<\/span>] * len(nums)\n\n        <span class=\"k\">def<\/span> <span class=\"f\">traverse<\/span>():\n            <span class=\"k\">if<\/span> len(path) == len(nums):\n                res.append(path[:])          <span class=\"c\"># 拷贝<\/span>\n                <span class=\"k\">return<\/span>\n            <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(len(nums)):\n                <span class=\"k\">if<\/span> visited[i]:\n                    <span class=\"k\">continue<\/span>\n                path.append(nums[i])         <span class=\"c\"># 做选择<\/span>\n                visited[i] = <span class=\"k\">True<\/span>\n                traverse()\n                visited[i] = <span class=\"k\">False<\/span>           <span class=\"c\"># 撤销选择<\/span>\n                path.pop()\n\n        traverse()\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">LinkedList<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; path = <span class=\"k\">new<\/span> <span class=\"t\">LinkedList<\/span>&lt;&gt;();\n    <span class=\"k\">private<\/span> <span class=\"k\">boolean<\/span>[] visited;\n\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; permute(<span class=\"k\">int<\/span>[] nums) {\n        visited = <span class=\"k\">new<\/span> <span class=\"k\">boolean<\/span>[nums.length];\n        traverse(nums);\n        <span class=\"k\">return<\/span> res;\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">void<\/span> traverse(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">if<\/span> (path.size() == nums.length) {\n            res.add(<span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;(path));      <span class=\"c\">// 拷贝<\/span>\n            <span class=\"k\">return<\/span>;\n        }\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; nums.length; i++) {\n            <span class=\"k\">if<\/span> (visited[i]) <span class=\"k\">continue<\/span>;\n            path.add(nums[i]);                   <span class=\"c\">// 做选择<\/span>\n            visited[i] = <span class=\"k\">true<\/span>;\n            traverse(nums);\n            visited[i] = <span class=\"k\">false<\/span>;                  <span class=\"c\">// 撤销选择<\/span>\n            path.removeLast();\n        }\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n · n!)，空间 O(n)（递归栈 + path + visited，不计答案）。<\/p>"},{"key":"1","rank":15,"id":"1","title":"两数之和","difficulty":"简单","tags":["哈希表"],"freq":306,"link":"https://leetcode.cn/problems/two-sum/","desc":"在数组中找出和为 target 的两个数，返回它们的下标。","libs":["java-15"],"html":"<h2>思路<\/h2>\n<ul><li>一次遍历 + 哈希表，存的是「<strong>我需要的数 → 我的下标<\/strong>」：遍历到 <code>x<\/code> 时登记 <code>need[target - x] = i<\/code>。<\/li><li>后面遇到某个数正好在表里，说明它就是前面某个数等的那个，直接配对返回。<\/li><li>等价的常见写法是存 <code>数 → 下标<\/code>，查 <code>target - x<\/code> 在不在表里。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><strong>先查再存<\/strong>：反过来的话 <code>[3, 3], target = 6<\/code> 这类会自己配自己。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">twoSum<\/span>(self, nums: List[int], target: int) -&gt; List[int]:\n        need = {}                            <span class=\"c\"># 需要的数 -&gt; 等它的那个下标<\/span>\n        <span class=\"k\">for<\/span> i, x <span class=\"k\">in<\/span> enumerate(nums):\n            <span class=\"k\">if<\/span> x <span class=\"k\">in<\/span> need:\n                <span class=\"k\">return<\/span> [need[x], i]\n            need[target - x] = i\n        <span class=\"k\">return<\/span> []<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span>[] twoSum(<span class=\"k\">int<\/span>[] nums, <span class=\"k\">int<\/span> target) {\n        <span class=\"t\">Map<\/span>&lt;<span class=\"t\">Integer<\/span>, <span class=\"t\">Integer<\/span>&gt; need = <span class=\"k\">new<\/span> <span class=\"t\">HashMap<\/span>&lt;&gt;();   <span class=\"c\">// 需要的数 -&gt; 等它的那个下标<\/span>\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; nums.length; i++) {\n            <span class=\"k\">if<\/span> (need.containsKey(nums[i])) {\n                <span class=\"k\">return<\/span> <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[]{need.get(nums[i]), i};\n            }\n            need.put(target - nums[i], i);\n        }\n        <span class=\"k\">return<\/span> <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[<span class=\"n\">0<\/span>];\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n)。<\/p>"},{"key":"88","rank":16,"id":"88","title":"合并两个有序数组","difficulty":"简单","tags":["双指针","数组"],"freq":305,"link":"https://leetcode.cn/problems/merge-sorted-array/","desc":"把有序数组 nums2 原地合并进有序数组 nums1（nums1 末尾已预留 n 个空位）。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>利用 <code>nums1<\/code> 末尾的空位，<strong>三个指针从后往前<\/strong>，谁大放谁。<\/li><li><code>p1 = m - 1<\/code>、<code>p2 = n - 1<\/code> 指向两个数组的有效末尾，<code>p = m + n - 1<\/code> 指向待填位置。<\/li><li>从后往前填不会覆盖 <code>nums1<\/code> 里还没处理的数；从前往后会。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>循环只需看 <code>p2 &gt;= 0<\/code>：<code>nums2<\/code> 放完后，<code>nums1<\/code> 剩下的本来就在正确位置，不用再拷。<\/li><li><code>p1<\/code> 可能先走完（如 <code>m = 0<\/code>），比较前要判 <code>p1 &gt;= 0<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">merge<\/span>(self, nums1: List[int], m: int, nums2: List[int], n: int) -&gt; <span class=\"k\">None<\/span>:\n        p1, p2, p = m - <span class=\"n\">1<\/span>, n - <span class=\"n\">1<\/span>, m + n - <span class=\"n\">1<\/span>\n        <span class=\"k\">while<\/span> p2 &gt;= <span class=\"n\">0<\/span>:\n            <span class=\"k\">if<\/span> p1 &gt;= <span class=\"n\">0<\/span> <span class=\"k\">and<\/span> nums1[p1] &gt; nums2[p2]:\n                nums1[p] = nums1[p1]\n                p1 -= <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:\n                nums1[p] = nums2[p2]\n                p2 -= <span class=\"n\">1<\/span>\n            p -= <span class=\"n\">1<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">void<\/span> merge(<span class=\"k\">int<\/span>[] nums1, <span class=\"k\">int<\/span> m, <span class=\"k\">int<\/span>[] nums2, <span class=\"k\">int<\/span> n) {\n        <span class=\"k\">int<\/span> p1 = m - <span class=\"n\">1<\/span>, p2 = n - <span class=\"n\">1<\/span>, p = m + n - <span class=\"n\">1<\/span>;\n        <span class=\"k\">while<\/span> (p2 &gt;= <span class=\"n\">0<\/span>) {\n            <span class=\"k\">if<\/span> (p1 &gt;= <span class=\"n\">0<\/span> &amp;&amp; nums1[p1] &gt; nums2[p2]) {\n                nums1[p--] = nums1[p1--];\n            } <span class=\"k\">else<\/span> {\n                nums1[p--] = nums2[p2--];\n            }\n        }\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(m + n)，空间 O(1)。<\/p>"},{"key":"20","rank":17,"id":"20","title":"有效的括号","difficulty":"简单","tags":["栈","字符串"],"freq":301,"link":"https://leetcode.cn/problems/valid-parentheses/","desc":"判断只含三种括号的字符串是否有效（类型匹配且顺序正确）。","libs":["java-12","java-19"],"html":"<h2>思路<\/h2>\n<ul><li>栈：左括号入栈；遇到右括号，看栈顶是不是与它配对的左括号，是就弹出，不是或栈空就 <code>false<\/code>。<\/li><li>最后栈为空才算全部匹配。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>遇到右括号时要先判栈空（如 <code>&quot;]&quot;<\/code>）。<\/li><li>结尾别忘了判栈空（如 <code>&quot;((&quot;<\/code>）。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">isValid<\/span>(self, s: str) -&gt; bool:\n        left_of = {<span class=\"s\">&quot;)&quot;<\/span>: <span class=\"s\">&quot;(&quot;<\/span>, <span class=\"s\">&quot;]&quot;<\/span>: <span class=\"s\">&quot;[&quot;<\/span>, <span class=\"s\">&quot;}&quot;<\/span>: <span class=\"s\">&quot;{&quot;<\/span>}\n        stack = []\n        <span class=\"k\">for<\/span> c <span class=\"k\">in<\/span> s:\n            <span class=\"k\">if<\/span> c <span class=\"k\">not<\/span> <span class=\"k\">in<\/span> left_of:             <span class=\"c\"># 左括号<\/span>\n                stack.append(c)\n            <span class=\"k\">elif<\/span> stack <span class=\"k\">and<\/span> stack[-<span class=\"n\">1<\/span>] == left_of[c]:\n                stack.pop()\n            <span class=\"k\">else<\/span>:\n                <span class=\"k\">return<\/span> <span class=\"k\">False<\/span>\n        <span class=\"k\">return<\/span> <span class=\"k\">not<\/span> stack<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> isValid(<span class=\"t\">String<\/span> s) {\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">Character<\/span>&gt; stack = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        <span class=\"k\">for<\/span> (<span class=\"k\">char<\/span> c : s.toCharArray()) {\n            <span class=\"k\">if<\/span> (c == <span class=\"s\">&#x27;(&#x27;<\/span> || c == <span class=\"s\">&#x27;[&#x27;<\/span> || c == <span class=\"s\">&#x27;{&#x27;<\/span>) {\n                stack.push(c);\n            } <span class=\"k\">else<\/span> <span class=\"k\">if<\/span> (!stack.isEmpty() &amp;&amp; stack.peek() == leftOf(c)) {\n                stack.pop();\n            } <span class=\"k\">else<\/span> {\n                <span class=\"k\">return<\/span> <span class=\"k\">false<\/span>;\n            }\n        }\n        <span class=\"k\">return<\/span> stack.isEmpty();\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"k\">char<\/span> leftOf(<span class=\"k\">char<\/span> c) {\n        <span class=\"k\">if<\/span> (c == <span class=\"s\">&#x27;)&#x27;<\/span>) <span class=\"k\">return<\/span> <span class=\"s\">&#x27;(&#x27;<\/span>;\n        <span class=\"k\">if<\/span> (c == <span class=\"s\">&#x27;]&#x27;<\/span>) <span class=\"k\">return<\/span> <span class=\"s\">&#x27;[&#x27;<\/span>;\n        <span class=\"k\">return<\/span> <span class=\"s\">&#x27;{&#x27;<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n)。<\/p>"},{"key":"121","rank":18,"id":"121","title":"买卖股票的最佳时机","difficulty":"简单","tags":["贪心","动态规划"],"freq":282,"link":"https://leetcode.cn/problems/best-time-to-buy-and-sell-stock/","desc":"只能买卖一次股票，求最大利润（赚不到返回 0）。","libs":["python-7","java-22"],"html":"<h2>思路<\/h2>\n<ul><li>枚举卖出日：在第 i 天卖，一定是在它之前的最低价买入最赚。<\/li><li>一次遍历维护两个量：<code>cost<\/code> = 到目前为止的最低价，<code>profit<\/code> = 到目前为止的最大利润。<\/li><li>每天先更新 <code>cost<\/code>，再用 <code>prices[i] - cost<\/code> 更新 <code>profit<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>必须先买后卖，所以 <code>cost<\/code> 只能来自当前及之前的价格。<\/li><li><code>profit<\/code> 初始为 0（赚不到就不交易）。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">maxProfit<\/span>(self, prices: List[int]) -&gt; int:\n        cost, profit = inf, <span class=\"n\">0<\/span>\n        <span class=\"k\">for<\/span> p <span class=\"k\">in<\/span> prices:\n            cost = min(cost, p)\n            profit = max(profit, p - cost)\n        <span class=\"k\">return<\/span> profit<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> maxProfit(<span class=\"k\">int<\/span>[] prices) {\n        <span class=\"k\">int<\/span> cost = <span class=\"t\">Integer<\/span>.MAX_VALUE, profit = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> p : prices) {\n            cost = <span class=\"t\">Math<\/span>.min(cost, p);\n            profit = <span class=\"t\">Math<\/span>.max(profit, p - cost);\n        }\n        <span class=\"k\">return<\/span> profit;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"300","rank":19,"id":"300","title":"最长上升子序列","difficulty":"中等","tags":["动态规划","二分"],"freq":276,"link":"https://leetcode.cn/problems/longest-increasing-subsequence/","desc":"求数组中最长严格递增子序列的长度。","libs":["python-4","java-20"],"html":"<h2>思路<\/h2>\n<ul><li><strong>DP，O(n²)<\/strong>：<code>dp[i]<\/code> = 以 <code>nums[i]<\/code> 结尾的最长递增子序列长度；枚举前面的 <code>j<\/code>，<code>nums[j] &lt; nums[i]<\/code> 时 <code>dp[i] = max(dp[i], dp[j] + 1)<\/code>。答案是所有 <code>dp[i]<\/code> 的最大值。<\/li><li><strong>贪心 + 二分，O(n log n)<\/strong>：<code>tail[i]<\/code> = 长度为 <code>i + 1<\/code> 的递增子序列的最小结尾。结尾越小，后面越容易接。<ul><li><code>tail<\/code> 一定递增，所以对每个 <code>num<\/code> 二分找第一个 <code>&gt;= num<\/code> 的位置换掉它；找不到（比所有结尾都大）就接在末尾，长度加一。<\/li><\/ul><\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>严格递增：DP 里是 <code>nums[j] &lt; nums[i]<\/code>；二分里是找第一个 <code>&gt;= num<\/code>（<code>tail[mid] &lt; num<\/code> 才右移），写成 <code>&lt;=<\/code> 会把重复元素也算进去。<\/li><li><code>tail<\/code> 的长度是答案，但 <code>tail<\/code> 本身不一定是一个真实的子序列。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：DP<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">lengthOfLIS<\/span>(self, nums: List[int]) -&gt; int:\n        dp = [<span class=\"n\">1<\/span>] * len(nums)\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(len(nums)):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(i):\n                <span class=\"k\">if<\/span> nums[j] &lt; nums[i]:\n                    dp[i] = max(dp[i], dp[j] + <span class=\"n\">1<\/span>)\n        <span class=\"k\">return<\/span> max(dp)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> lengthOfLIS(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span> n = nums.length, res = <span class=\"n\">1<\/span>;\n        <span class=\"k\">int<\/span>[] dp = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[n];\n        <span class=\"t\">Arrays<\/span>.fill(dp, <span class=\"n\">1<\/span>);\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; n; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">0<\/span>; j &lt; i; j++) {\n                <span class=\"k\">if<\/span> (nums[j] &lt; nums[i]) dp[i] = <span class=\"t\">Math<\/span>.max(dp[i], dp[j] + <span class=\"n\">1<\/span>);\n            }\n            res = <span class=\"t\">Math<\/span>.max(res, dp[i]);\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：贪心 + 二分<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">lengthOfLIS<\/span>(self, nums: List[int]) -&gt; int:\n        tail = []                            <span class=\"c\"># tail[i]：长度 i+1 的递增子序列的最小结尾<\/span>\n        <span class=\"k\">for<\/span> num <span class=\"k\">in<\/span> nums:\n            i = bisect_left(tail, num)       <span class=\"c\"># 第一个 &gt;= num 的位置<\/span>\n            <span class=\"k\">if<\/span> i == len(tail):\n                tail.append(num)\n            <span class=\"k\">else<\/span>:\n                tail[i] = num\n        <span class=\"k\">return<\/span> len(tail)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> lengthOfLIS(<span class=\"k\">int<\/span>[] nums) {\n        <span class=\"k\">int<\/span>[] tail = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[nums.length];       <span class=\"c\">// tail[i]：长度 i+1 的递增子序列的最小结尾<\/span>\n        <span class=\"k\">int<\/span> res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> num : nums) {\n            <span class=\"k\">int<\/span> left = <span class=\"n\">0<\/span>, right = res;           <span class=\"c\">// 在 [0, res) 找第一个 &gt;= num 的位置<\/span>\n            <span class=\"k\">while<\/span> (left &lt; right) {\n                <span class=\"k\">int<\/span> mid = left + (right - left) / <span class=\"n\">2<\/span>;\n                <span class=\"k\">if<\/span> (tail[mid] &lt; num) left = mid + <span class=\"n\">1<\/span>;\n                <span class=\"k\">else<\/span> right = mid;\n            }\n            tail[left] = num;\n            <span class=\"k\">if<\/span> (left == res) res++;\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：DP 时间 O(n²)；贪心 + 二分时间 O(n log n)；空间都是 O(n)。<\/p>"},{"key":"236","rank":20,"id":"236","title":"二叉树的最近公共祖先","difficulty":"中等","tags":["二叉树","DFS"],"freq":272,"link":"https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/","desc":"找出二叉树中两个节点 p、q 的最近公共祖先。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>后序遍历，自底向上回传结果。函数含义：在以 <code>root<\/code> 为根的子树里找 <code>p<\/code>、<code>q<\/code>。<\/li><li><code>root<\/code> 为空或者就是 <code>p<\/code> / <code>q<\/code>：直接返回 <code>root<\/code>。<\/li><li>递归左右子树得到 <code>l<\/code>、<code>r<\/code>：<ul><li>都不为空 → <code>p<\/code>、<code>q<\/code> 分居两侧，当前 <code>root<\/code> 就是最近公共祖先；<\/li><li>只有一边不为空 → 答案在那一边，把它往上传；<\/li><li>都为空 → 返回空。<\/li><\/ul><\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>一个节点可以是自己的祖先：遇到 <code>p<\/code> 或 <code>q<\/code> 立即返回、不再往下找——如果另一个在它的子树里，它本身就是答案。<\/li><li>必须是后序：要先知道左右子树各自有没有找到，才能判断当前节点。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">lowestCommonAncestor<\/span>(self, root: <span class=\"s\">&#x27;TreeNode&#x27;<\/span>, p: <span class=\"s\">&#x27;TreeNode&#x27;<\/span>, q: <span class=\"s\">&#x27;TreeNode&#x27;<\/span>) -&gt; <span class=\"s\">&#x27;TreeNode&#x27;<\/span>:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root <span class=\"k\">or<\/span> root <span class=\"k\">is<\/span> p <span class=\"k\">or<\/span> root <span class=\"k\">is<\/span> q:\n            <span class=\"k\">return<\/span> root\n        l = self.lowestCommonAncestor(root.left, p, q)\n        r = self.lowestCommonAncestor(root.right, p, q)\n        <span class=\"k\">if<\/span> l <span class=\"k\">and<\/span> r:                          <span class=\"c\"># 一边一个，root 就是答案<\/span>\n            <span class=\"k\">return<\/span> root\n        <span class=\"k\">return<\/span> l <span class=\"k\">or<\/span> r                        <span class=\"c\"># 只有一边找到（或都没找到）<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">TreeNode<\/span> lowestCommonAncestor(<span class=\"t\">TreeNode<\/span> root, <span class=\"t\">TreeNode<\/span> p, <span class=\"t\">TreeNode<\/span> q) {\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span> || root == p || root == q) <span class=\"k\">return<\/span> root;\n        <span class=\"t\">TreeNode<\/span> l = lowestCommonAncestor(root.left, p, q);\n        <span class=\"t\">TreeNode<\/span> r = lowestCommonAncestor(root.right, p, q);\n        <span class=\"k\">if<\/span> (l != <span class=\"k\">null<\/span> &amp;&amp; r != <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> root;     <span class=\"c\">// 一边一个，root 就是答案<\/span>\n        <span class=\"k\">return<\/span> l != <span class=\"k\">null<\/span> ? l : r;                    <span class=\"c\">// 只有一边找到（或都没找到）<\/span>\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(h)（递归栈）。<\/p>"},{"key":"103","rank":21,"id":"103","title":"二叉树的锯齿形层次遍历","difficulty":"中等","tags":["二叉树","BFS"],"freq":272,"link":"https://leetcode.cn/problems/binary-tree-zigzag-level-order-traversal/","desc":"层序遍历二叉树，但每层交替方向：先从左到右，下一层从右到左。","libs":["python-0","java-12","java-13"],"html":"<h2>思路<\/h2>\n<ul><li>还是 <a href=\"#/102\">102<\/a> 的层序遍历模板，只是<strong>每层决定往结果里插入的方向<\/strong>。<\/li><li>用 <code>flag<\/code> 记录方向：从左往右 → 尾插；从右往左 → 头插。每层结束 <code>flag<\/code> 取反。<\/li><li>入队顺序不用变，始终左孩子先、右孩子后，锯齿只体现在这一层的值怎么放。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>头插需要双端结构：Java 把每层声明成 <code>LinkedList&lt;Integer&gt;<\/code> 才有 <code>addFirst<\/code>；Python 用 <code>deque.appendleft<\/code>。<\/li><li><code>flag<\/code> 每层翻一次，不是每个节点翻一次。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">zigzagLevelOrder<\/span>(self, root: Optional[TreeNode]) -&gt; List[List[int]]:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> root:\n            <span class=\"k\">return<\/span> []\n        res, q, flag = [], deque([root]), <span class=\"k\">False<\/span>\n        <span class=\"k\">while<\/span> q:\n            level = deque()\n            <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(len(q)):\n                cur = q.popleft()\n                <span class=\"k\">if<\/span> flag:\n                    level.appendleft(cur.val)    <span class=\"c\"># 从右往左：头插<\/span>\n                <span class=\"k\">else<\/span>:\n                    level.append(cur.val)        <span class=\"c\"># 从左往右：尾插<\/span>\n                <span class=\"k\">if<\/span> cur.left:\n                    q.append(cur.left)\n                <span class=\"k\">if<\/span> cur.right:\n                    q.append(cur.right)\n            res.append(list(level))\n            flag = <span class=\"k\">not<\/span> flag\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; zigzagLevelOrder(<span class=\"t\">TreeNode<\/span> root) {\n        <span class=\"t\">List<\/span>&lt;<span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt;&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n        <span class=\"k\">if<\/span> (root == <span class=\"k\">null<\/span>) <span class=\"k\">return<\/span> res;\n        <span class=\"t\">Deque<\/span>&lt;<span class=\"t\">TreeNode<\/span>&gt; q = <span class=\"k\">new<\/span> <span class=\"t\">ArrayDeque<\/span>&lt;&gt;();\n        q.offer(root);\n        <span class=\"k\">boolean<\/span> flag = <span class=\"k\">false<\/span>;\n        <span class=\"k\">while<\/span> (!q.isEmpty()) {\n            <span class=\"k\">int<\/span> sz = q.size();\n            <span class=\"t\">LinkedList<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; level = <span class=\"k\">new<\/span> <span class=\"t\">LinkedList<\/span>&lt;&gt;();\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt; sz; i++) {\n                <span class=\"t\">TreeNode<\/span> cur = q.poll();\n                <span class=\"k\">if<\/span> (flag) level.addFirst(cur.val);   <span class=\"c\">// 从右往左：头插<\/span>\n                <span class=\"k\">else<\/span> level.addLast(cur.val);         <span class=\"c\">// 从左往右：尾插<\/span>\n                <span class=\"k\">if<\/span> (cur.left != <span class=\"k\">null<\/span>) q.offer(cur.left);\n                <span class=\"k\">if<\/span> (cur.right != <span class=\"k\">null<\/span>) q.offer(cur.right);\n            }\n            res.add(level);\n            flag = !flag;\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(n)。<\/p>"},{"key":"92","rank":22,"id":"92","title":"反转链表 II","difficulty":"中等","tags":["链表"],"freq":271,"link":"https://leetcode.cn/problems/reverse-linked-list-ii/","desc":"反转链表中第 left 到第 right 个节点（位置从 1 开始），返回头节点。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>三步：找到反转区间的前驱 <code>pre<\/code> → 用「反转前 n 个节点」的模板反转 → 接回去。<\/li><li><code>reverseN(head, n)<\/code>：三指针反转前 n 个；循环结束时 <code>cur<\/code> 正好是第 n+1 个节点，<code>head.next = cur<\/code> 就把反转后的尾（原来的头）接上了后面。<\/li><li><code>pre.next = reverseN(pre.next, right - left + 1)<\/code> 接上前面。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>left == 1<\/code> 时头节点会变：用 <code>dummy<\/code> 统一处理，<code>pre<\/code> 从 <code>dummy<\/code> 出发走 <code>left - 1<\/code> 步。<\/li><li><code>reverseN<\/code> 里 <code>head.next = cur<\/code> 这句是核心，漏了后半段就丢了。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">reverseBetween<\/span>(self, head: Optional[ListNode], left: int, right: int) -&gt; Optional[ListNode]:\n        dummy = ListNode(-<span class=\"n\">1<\/span>, head)\n        pre = dummy\n        <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(left - <span class=\"n\">1<\/span>):            <span class=\"c\"># pre 停在第 left 个节点的前一个<\/span>\n            pre = pre.next\n        pre.next = self.reverseN(pre.next, right - left + <span class=\"n\">1<\/span>)\n        <span class=\"k\">return<\/span> dummy.next\n\n    <span class=\"k\">def<\/span> <span class=\"f\">reverseN<\/span>(self, head, n):\n        <span class=\"s\">&quot;&quot;&quot;反转以 head 开头的前 n 个节点，返回新头，并接好后面的部分&quot;&quot;&quot;<\/span>\n        pre, cur = <span class=\"k\">None<\/span>, head\n        <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(n):\n            nxt = cur.next\n            cur.next = pre\n            pre, cur = cur, nxt\n        head.next = cur                      <span class=\"c\"># 原头变成尾，接上第 n+1 个节点<\/span>\n        <span class=\"k\">return<\/span> pre<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> reverseBetween(<span class=\"t\">ListNode<\/span> head, <span class=\"k\">int<\/span> left, <span class=\"k\">int<\/span> right) {\n        <span class=\"t\">ListNode<\/span> dummy = <span class=\"k\">new<\/span> <span class=\"t\">ListNode<\/span>(-<span class=\"n\">1<\/span>, head), pre = dummy;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt; left; i++) {         <span class=\"c\">// pre 停在第 left 个节点的前一个<\/span>\n            pre = pre.next;\n        }\n        pre.next = reverseN(pre.next, right - left + <span class=\"n\">1<\/span>);\n        <span class=\"k\">return<\/span> dummy.next;\n    }\n\n    <span class=\"c\">// 反转以 head 开头的前 n 个节点，返回新头，并接好后面的部分<\/span>\n    <span class=\"k\">private<\/span> <span class=\"t\">ListNode<\/span> reverseN(<span class=\"t\">ListNode<\/span> head, <span class=\"k\">int<\/span> n) {\n        <span class=\"t\">ListNode<\/span> pre = <span class=\"k\">null<\/span>, cur = head;\n        <span class=\"k\">while<\/span> (n-- &gt; <span class=\"n\">0<\/span>) {\n            <span class=\"t\">ListNode<\/span> nxt = cur.next;\n            cur.next = pre;\n            pre = cur;\n            cur = nxt;\n        }\n        head.next = cur;                         <span class=\"c\">// 原头变成尾，接上第 n+1 个节点<\/span>\n        <span class=\"k\">return<\/span> pre;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"23","rank":23,"id":"23","title":"合并K个排序链表","difficulty":"困难","tags":["链表","分治","堆"],"freq":264,"link":"https://leetcode.cn/problems/merge-k-sorted-lists/","desc":"把 k 个升序链表合并成一个升序链表。","libs":["python-1","java-14"],"html":"<h2>思路<\/h2>\n<ul><li><strong>分治<\/strong>（类似归并排序）：<code>traverse(lo, hi)<\/code> 表示合并 <code>lists[lo..hi]<\/code> 并返回头节点；拆成左右两半各自合并，再用 <a href=\"#/21\">21<\/a> 的方法合并两条。<\/li><li><strong>小顶堆<\/strong>：堆里放每条链表当前的头节点，每次弹出最小的接到结果后面，再把它的 <code>next<\/code> 入堆。堆里最多 k 个节点。<\/li><li>为什么不顺序合并 <code>((l1+l2)+l3)+…<\/code>：前面合出来的长链表被反复遍历，O(Nk)。分治每层总共处理 N 个节点，共 log k 层。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>lists<\/code> 为空数组要先返回空；数组里也可能有空链表（堆写法入堆前要判空）。<\/li><li>Python 的堆不能直接比较 <code>ListNode<\/code>：放 <code>(val, 链表下标, node)<\/code>，<code>val<\/code> 相同时用下标决胜，轮不到比节点。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：分治<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">mergeKLists<\/span>(self, lists: List[Optional[ListNode]]) -&gt; Optional[ListNode]:\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> lists:\n            <span class=\"k\">return<\/span> <span class=\"k\">None<\/span>\n\n        <span class=\"k\">def<\/span> <span class=\"f\">traverse<\/span>(lo, hi):                <span class=\"c\"># 合并 lists[lo..hi]<\/span>\n            <span class=\"k\">if<\/span> lo == hi:\n                <span class=\"k\">return<\/span> lists[lo]\n            mid = (lo + hi) // <span class=\"n\">2<\/span>\n            <span class=\"k\">return<\/span> self.mergeTwoLists(traverse(lo, mid), traverse(mid + <span class=\"n\">1<\/span>, hi))\n\n        <span class=\"k\">return<\/span> traverse(<span class=\"n\">0<\/span>, len(lists) - <span class=\"n\">1<\/span>)\n\n    <span class=\"k\">def<\/span> <span class=\"f\">mergeTwoLists<\/span>(self, p1, p2):\n        dummy = p = ListNode(-<span class=\"n\">1<\/span>)\n        <span class=\"k\">while<\/span> p1 <span class=\"k\">and<\/span> p2:\n            <span class=\"k\">if<\/span> p1.val &lt;= p2.val:\n                p.next = p1\n                p1 = p1.next\n            <span class=\"k\">else<\/span>:\n                p.next = p2\n                p2 = p2.next\n            p = p.next\n        p.next = p1 <span class=\"k\">or<\/span> p2\n        <span class=\"k\">return<\/span> dummy.next<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> mergeKLists(<span class=\"t\">ListNode<\/span>[] lists) {\n        <span class=\"k\">if<\/span> (lists.length == <span class=\"n\">0<\/span>) <span class=\"k\">return<\/span> <span class=\"k\">null<\/span>;\n        <span class=\"k\">return<\/span> traverse(lists, <span class=\"n\">0<\/span>, lists.length - <span class=\"n\">1<\/span>);\n    }\n\n    <span class=\"c\">// 合并 lists[lo..hi]<\/span>\n    <span class=\"k\">private<\/span> <span class=\"t\">ListNode<\/span> traverse(<span class=\"t\">ListNode<\/span>[] lists, <span class=\"k\">int<\/span> lo, <span class=\"k\">int<\/span> hi) {\n        <span class=\"k\">if<\/span> (lo == hi) <span class=\"k\">return<\/span> lists[lo];\n        <span class=\"k\">int<\/span> mid = lo + (hi - lo) / <span class=\"n\">2<\/span>;\n        <span class=\"k\">return<\/span> mergeTwoLists(traverse(lists, lo, mid), traverse(lists, mid + <span class=\"n\">1<\/span>, hi));\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"t\">ListNode<\/span> mergeTwoLists(<span class=\"t\">ListNode<\/span> p1, <span class=\"t\">ListNode<\/span> p2) {\n        <span class=\"t\">ListNode<\/span> dummy = <span class=\"k\">new<\/span> <span class=\"t\">ListNode<\/span>(-<span class=\"n\">1<\/span>), p = dummy;\n        <span class=\"k\">while<\/span> (p1 != <span class=\"k\">null<\/span> &amp;&amp; p2 != <span class=\"k\">null<\/span>) {\n            <span class=\"k\">if<\/span> (p1.val &lt;= p2.val) {\n                p.next = p1;\n                p1 = p1.next;\n            } <span class=\"k\">else<\/span> {\n                p.next = p2;\n                p2 = p2.next;\n            }\n            p = p.next;\n        }\n        p.next = p1 != <span class=\"k\">null<\/span> ? p1 : p2;\n        <span class=\"k\">return<\/span> dummy.next;\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：小顶堆<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">mergeKLists<\/span>(self, lists: List[Optional[ListNode]]) -&gt; Optional[ListNode]:\n        heap = [(node.val, i, node) <span class=\"k\">for<\/span> i, node <span class=\"k\">in<\/span> enumerate(lists) <span class=\"k\">if<\/span> node]\n        heapq.heapify(heap)\n        dummy = p = ListNode(-<span class=\"n\">1<\/span>)\n        <span class=\"k\">while<\/span> heap:\n            _, i, node = heapq.heappop(heap)\n            p.next = node\n            p = p.next\n            <span class=\"k\">if<\/span> node.next:\n                heapq.heappush(heap, (node.next.val, i, node.next))\n        <span class=\"k\">return<\/span> dummy.next<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> mergeKLists(<span class=\"t\">ListNode<\/span>[] lists) {\n        <span class=\"t\">PriorityQueue<\/span>&lt;<span class=\"t\">ListNode<\/span>&gt; pq = <span class=\"k\">new<\/span> <span class=\"t\">PriorityQueue<\/span>&lt;&gt;((a, b) -&gt; a.val - b.val);\n        <span class=\"k\">for<\/span> (<span class=\"t\">ListNode<\/span> head : lists) {\n            <span class=\"k\">if<\/span> (head != <span class=\"k\">null<\/span>) pq.offer(head);\n        }\n        <span class=\"t\">ListNode<\/span> dummy = <span class=\"k\">new<\/span> <span class=\"t\">ListNode<\/span>(-<span class=\"n\">1<\/span>), p = dummy;\n        <span class=\"k\">while<\/span> (!pq.isEmpty()) {\n            <span class=\"t\">ListNode<\/span> node = pq.poll();\n            p.next = node;\n            p = p.next;\n            <span class=\"k\">if<\/span> (node.next != <span class=\"k\">null<\/span>) pq.offer(node.next);\n        }\n        <span class=\"k\">return<\/span> dummy.next;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：两种写法时间都是 O(N log k)（N 为节点总数）；空间分治 O(log k)（递归栈），堆 O(k)。<\/p>"},{"key":"54","rank":24,"id":"54","title":"螺旋矩阵","difficulty":"中等","tags":["矩阵","模拟"],"freq":262,"link":"https://leetcode.cn/problems/spiral-matrix/","desc":"按顺时针螺旋顺序返回矩阵中的所有元素。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>维护还没遍历的矩形的四条边界 <code>up / down / left / right<\/code>。<\/li><li>每轮按「上边 → 右边 → 下边 → 左边」走一圈，每走完一条边就收缩对应的边界。<\/li><li>循环条件直接用「结果数量 <code>&lt; m * n<\/code>」，装满就停，最稳。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>每条边遍历前都要判断边界是否还合法（<code>up &lt;= down<\/code>、<code>left &lt;= right<\/code>）：只剩一行或一列时，不判断会把同一行 / 列走两遍。<\/li><li>走完一条边立刻收缩，后面的边才不会重复访问拐角。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">spiralOrder<\/span>(self, matrix: List[List[int]]) -&gt; List[int]:\n        m, n = len(matrix), len(matrix[<span class=\"n\">0<\/span>])\n        up, down, left, right = <span class=\"n\">0<\/span>, m - <span class=\"n\">1<\/span>, <span class=\"n\">0<\/span>, n - <span class=\"n\">1<\/span>\n        res = []\n        <span class=\"k\">while<\/span> len(res) &lt; m * n:\n            <span class=\"k\">if<\/span> up &lt;= down:                           <span class=\"c\"># 上边：从左到右<\/span>\n                <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(left, right + <span class=\"n\">1<\/span>):\n                    res.append(matrix[up][j])\n                up += <span class=\"n\">1<\/span>\n            <span class=\"k\">if<\/span> left &lt;= right:                        <span class=\"c\"># 右边：从上到下<\/span>\n                <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(up, down + <span class=\"n\">1<\/span>):\n                    res.append(matrix[i][right])\n                right -= <span class=\"n\">1<\/span>\n            <span class=\"k\">if<\/span> up &lt;= down:                           <span class=\"c\"># 下边：从右到左<\/span>\n                <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(right, left - <span class=\"n\">1<\/span>, -<span class=\"n\">1<\/span>):\n                    res.append(matrix[down][j])\n                down -= <span class=\"n\">1<\/span>\n            <span class=\"k\">if<\/span> left &lt;= right:                        <span class=\"c\"># 左边：从下到上<\/span>\n                <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(down, up - <span class=\"n\">1<\/span>, -<span class=\"n\">1<\/span>):\n                    res.append(matrix[i][left])\n                left += <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; spiralOrder(<span class=\"k\">int<\/span>[][] matrix) {\n        <span class=\"k\">int<\/span> m = matrix.length, n = matrix[<span class=\"n\">0<\/span>].length;\n        <span class=\"k\">int<\/span> up = <span class=\"n\">0<\/span>, down = m - <span class=\"n\">1<\/span>, left = <span class=\"n\">0<\/span>, right = n - <span class=\"n\">1<\/span>;\n        <span class=\"t\">List<\/span>&lt;<span class=\"t\">Integer<\/span>&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n        <span class=\"k\">while<\/span> (res.size() &lt; m * n) {\n            <span class=\"k\">if<\/span> (up &lt;= down) {                            <span class=\"c\">// 上边：从左到右<\/span>\n                <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = left; j &lt;= right; j++) res.add(matrix[up][j]);\n                up++;\n            }\n            <span class=\"k\">if<\/span> (left &lt;= right) {                         <span class=\"c\">// 右边：从上到下<\/span>\n                <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = up; i &lt;= down; i++) res.add(matrix[i][right]);\n                right--;\n            }\n            <span class=\"k\">if<\/span> (up &lt;= down) {                            <span class=\"c\">// 下边：从右到左<\/span>\n                <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = right; j &gt;= left; j--) res.add(matrix[down][j]);\n                down--;\n            }\n            <span class=\"k\">if<\/span> (left &lt;= right) {                         <span class=\"c\">// 左边：从下到上<\/span>\n                <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = down; i &gt;= up; i--) res.add(matrix[i][left]);\n                left++;\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(mn)，空间 O(1)（不计答案）。<\/p>"},{"key":"143","rank":25,"id":"143","title":"重排链表","difficulty":"中等","tags":["链表","双指针"],"freq":259,"link":"https://leetcode.cn/problems/reorder-list/","desc":"把链表 L0→L1→…→Ln 原地重排成 L0→Ln→L1→Ln-1→…。","libs":[],"html":"<h2>思路<\/h2>\n<p>三个链表模板的组合：<\/p>\n<ol><li><strong>快慢指针找中点<\/strong>：<code>slow<\/code> 停在前半段的最后一个节点，从这里断开成两条。<\/li><li><strong>反转后半段<\/strong>（<a href=\"#/206\">206<\/a>）。<\/li><li><strong>交替合并<\/strong>：前半段取一个、后半段取一个。<\/li><\/ol>\n<h2>易错点<\/h2>\n<ul><li>找中点的循环条件用 <code>fast.next != null &amp;&amp; fast.next.next != null<\/code>，这样 <code>slow<\/code> 停在前半段末尾（前半段长度 ≥ 后半段）。<\/li><li>一定要 <code>slow.next = null<\/code> 断开，否则合并时成环。<\/li><li>合并时先存两边的 <code>next<\/code> 再改指针。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">reorderList<\/span>(self, head: Optional[ListNode]) -&gt; <span class=\"k\">None<\/span>:\n        slow = fast = head\n        <span class=\"k\">while<\/span> fast.next <span class=\"k\">and<\/span> fast.next.next:          <span class=\"c\"># slow 停在前半段最后一个<\/span>\n            slow, fast = slow.next, fast.next.next\n        l2 = self.reverseList(slow.next)\n        slow.next = <span class=\"k\">None<\/span>                             <span class=\"c\"># 断开<\/span>\n        l1 = head\n        <span class=\"k\">while<\/span> l1 <span class=\"k\">and<\/span> l2:                             <span class=\"c\"># 交替合并<\/span>\n            p1, p2 = l1.next, l2.next\n            l1.next = l2\n            l2.next = p1\n            l1, l2 = p1, p2\n\n    <span class=\"k\">def<\/span> <span class=\"f\">reverseList<\/span>(self, head):\n        pre, cur = <span class=\"k\">None<\/span>, head\n        <span class=\"k\">while<\/span> cur:\n            nxt = cur.next\n            cur.next = pre\n            pre, cur = cur, nxt\n        <span class=\"k\">return<\/span> pre<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">void<\/span> reorderList(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"t\">ListNode<\/span> slow = head, fast = head;\n        <span class=\"k\">while<\/span> (fast.next != <span class=\"k\">null<\/span> &amp;&amp; fast.next.next != <span class=\"k\">null<\/span>) {   <span class=\"c\">// slow 停在前半段最后一个<\/span>\n            slow = slow.next;\n            fast = fast.next.next;\n        }\n        <span class=\"t\">ListNode<\/span> l1 = head, l2 = reverseList(slow.next);\n        slow.next = <span class=\"k\">null<\/span>;                                       <span class=\"c\">// 断开<\/span>\n        <span class=\"k\">while<\/span> (l1 != <span class=\"k\">null<\/span> &amp;&amp; l2 != <span class=\"k\">null<\/span>) {                      <span class=\"c\">// 交替合并<\/span>\n            <span class=\"t\">ListNode<\/span> p1 = l1.next, p2 = l2.next;\n            l1.next = l2;\n            l2.next = p1;\n            l1 = p1;\n            l2 = p2;\n        }\n    }\n\n    <span class=\"k\">private<\/span> <span class=\"t\">ListNode<\/span> reverseList(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"t\">ListNode<\/span> pre = <span class=\"k\">null<\/span>, cur = head;\n        <span class=\"k\">while<\/span> (cur != <span class=\"k\">null<\/span>) {\n            <span class=\"t\">ListNode<\/span> nxt = cur.next;\n            cur.next = pre;\n            pre = cur;\n            cur = nxt;\n        }\n        <span class=\"k\">return<\/span> pre;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"141","rank":26,"id":"141","title":"环形链表","difficulty":"简单","tags":["链表","双指针"],"freq":259,"link":"https://leetcode.cn/problems/linked-list-cycle/","desc":"判断链表中是否有环。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>快慢指针（Floyd 判圈）：<code>slow<\/code> 每次一步，<code>fast<\/code> 每次两步。<\/li><li>有环：进环后是追及问题，<code>fast<\/code> 每轮比 <code>slow<\/code> 多走一步，环长有限，一定追上。<\/li><li>无环：<code>fast<\/code> 先走到 <code>null<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>循环条件 <code>fast != null &amp;&amp; fast.next != null<\/code>：要走两步，两个都得判；<code>slow<\/code> 在后面，不用判。<\/li><li>先走再比较（起点两个指针本来就相等）。<\/li><li>比的是节点引用，不是值。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">hasCycle<\/span>(self, head: Optional[ListNode]) -&gt; bool:\n        slow = fast = head\n        <span class=\"k\">while<\/span> fast <span class=\"k\">and<\/span> fast.next:\n            slow = slow.next\n            fast = fast.next.next\n            <span class=\"k\">if<\/span> slow <span class=\"k\">is<\/span> fast:\n                <span class=\"k\">return<\/span> <span class=\"k\">True<\/span>\n        <span class=\"k\">return<\/span> <span class=\"k\">False<\/span><\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">public<\/span> <span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">boolean<\/span> hasCycle(<span class=\"t\">ListNode<\/span> head) {\n        <span class=\"t\">ListNode<\/span> slow = head, fast = head;\n        <span class=\"k\">while<\/span> (fast != <span class=\"k\">null<\/span> &amp;&amp; fast.next != <span class=\"k\">null<\/span>) {\n            slow = slow.next;\n            fast = fast.next.next;\n            <span class=\"k\">if<\/span> (slow == fast) <span class=\"k\">return<\/span> <span class=\"k\">true<\/span>;\n        }\n        <span class=\"k\">return<\/span> <span class=\"k\">false<\/span>;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"56","rank":27,"id":"56","title":"合并区间","difficulty":"中等","tags":["排序","数组"],"freq":251,"link":"https://leetcode.cn/problems/merge-intervals/","desc":"合并所有重叠的区间，返回不重叠的区间列表。","libs":["python-5","java-13","java-20"],"html":"<h2>思路<\/h2>\n<ul><li>区间题套路：<strong>先按左端点排序<\/strong>。<\/li><li>遍历每个区间 <code>cur<\/code>，和结果集最后一个区间 <code>last<\/code> 比：<ul><li><code>cur[0] &lt;= last[1]<\/code>：有重叠，把 <code>last<\/code> 的右端点更新成两者较大的；<\/li><li>否则不相交，<code>cur<\/code> 作为新区间加入结果。<\/li><\/ul><\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>判断重叠是 <code>&lt;=<\/code>：<code>[1,4]<\/code> 和 <code>[4,5]<\/code> 端点相接也算重叠。<\/li><li>合并时右端点取 <code>max<\/code>：<code>[1,4]<\/code> 和 <code>[2,3]<\/code> 合并后还是 <code>[1,4]<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">merge<\/span>(self, intervals: List[List[int]]) -&gt; List[List[int]]:\n        intervals.sort(key=<span class=\"k\">lambda<\/span> x: x[<span class=\"n\">0<\/span>])\n        res = [intervals[<span class=\"n\">0<\/span>]]\n        <span class=\"k\">for<\/span> cur <span class=\"k\">in<\/span> intervals[<span class=\"n\">1<\/span>:]:\n            last = res[-<span class=\"n\">1<\/span>]\n            <span class=\"k\">if<\/span> cur[<span class=\"n\">0<\/span>] &lt;= last[<span class=\"n\">1<\/span>]:\n                last[<span class=\"n\">1<\/span>] = max(last[<span class=\"n\">1<\/span>], cur[<span class=\"n\">1<\/span>])\n            <span class=\"k\">else<\/span>:\n                res.append(cur)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span>[][] merge(<span class=\"k\">int<\/span>[][] intervals) {\n        <span class=\"t\">Arrays<\/span>.sort(intervals, (a, b) -&gt; a[<span class=\"n\">0<\/span>] - b[<span class=\"n\">0<\/span>]);\n        <span class=\"t\">LinkedList<\/span>&lt;<span class=\"k\">int<\/span>[]&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">LinkedList<\/span>&lt;&gt;();\n        res.add(intervals[<span class=\"n\">0<\/span>]);\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt; intervals.length; i++) {\n            <span class=\"k\">int<\/span>[] cur = intervals[i], last = res.getLast();\n            <span class=\"k\">if<\/span> (cur[<span class=\"n\">0<\/span>] &lt;= last[<span class=\"n\">1<\/span>]) {\n                last[<span class=\"n\">1<\/span>] = <span class=\"t\">Math<\/span>.max(last[<span class=\"n\">1<\/span>], cur[<span class=\"n\">1<\/span>]);\n            } <span class=\"k\">else<\/span> {\n                res.add(cur);\n            }\n        }\n        <span class=\"k\">return<\/span> res.toArray(<span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[<span class=\"n\">0<\/span>][]);\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n log n)（排序），空间 O(log n)（不计答案）。<\/p>"},{"key":"415","rank":28,"id":"415","title":"字符串相加","difficulty":"简单","tags":["字符串","模拟"],"freq":246,"link":"https://leetcode.cn/problems/add-strings/","desc":"两个用字符串表示的非负整数相加，返回字符串形式的和（不能直接转成整数）。","libs":["python-7","java-18"],"html":"<h2>思路<\/h2>\n<ul><li>模拟竖式加法：两个指针从两个字符串末尾往前走，每位算 <code>n1 + n2 + 进位<\/code>，个位留下、十位进位。<\/li><li>某个字符串走完了就当它这一位是 0，统一逻辑。<\/li><li>结果是从低位到高位追加的，最后反转。<\/li><li>同套路：<a href=\"#/2\">2 两数相加<\/a>、<a href=\"#/43\">43 字符串相乘<\/a>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>最后的进位别漏（<code>&quot;999&quot; + &quot;1&quot;<\/code>）：把 <code>c &gt; 0<\/code> 也放进循环条件最省事。<\/li><li>字符转数字：Java 是 <code>ch - &#x27;0&#x27;<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">addStrings<\/span>(self, num1: str, num2: str) -&gt; str:\n        i, j, c = len(num1) - <span class=\"n\">1<\/span>, len(num2) - <span class=\"n\">1<\/span>, <span class=\"n\">0<\/span>\n        res = []\n        <span class=\"k\">while<\/span> i &gt;= <span class=\"n\">0<\/span> <span class=\"k\">or<\/span> j &gt;= <span class=\"n\">0<\/span> <span class=\"k\">or<\/span> c:\n            n1 = int(num1[i]) <span class=\"k\">if<\/span> i &gt;= <span class=\"n\">0<\/span> <span class=\"k\">else<\/span> <span class=\"n\">0<\/span>\n            n2 = int(num2[j]) <span class=\"k\">if<\/span> j &gt;= <span class=\"n\">0<\/span> <span class=\"k\">else<\/span> <span class=\"n\">0<\/span>\n            c, n = divmod(n1 + n2 + c, <span class=\"n\">10<\/span>)\n            res.append(str(n))\n            i -= <span class=\"n\">1<\/span>\n            j -= <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s\">&quot;&quot;<\/span>.join(reversed(res))<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">String<\/span> addStrings(<span class=\"t\">String<\/span> num1, <span class=\"t\">String<\/span> num2) {\n        <span class=\"t\">StringBuilder<\/span> res = <span class=\"k\">new<\/span> <span class=\"t\">StringBuilder<\/span>();\n        <span class=\"k\">int<\/span> i = num1.length() - <span class=\"n\">1<\/span>, j = num2.length() - <span class=\"n\">1<\/span>, c = <span class=\"n\">0<\/span>;\n        <span class=\"k\">while<\/span> (i &gt;= <span class=\"n\">0<\/span> || j &gt;= <span class=\"n\">0<\/span> || c &gt; <span class=\"n\">0<\/span>) {\n            <span class=\"k\">int<\/span> n1 = i &gt;= <span class=\"n\">0<\/span> ? num1.charAt(i) - <span class=\"s\">&#x27;0&#x27;<\/span> : <span class=\"n\">0<\/span>;\n            <span class=\"k\">int<\/span> n2 = j &gt;= <span class=\"n\">0<\/span> ? num2.charAt(j) - <span class=\"s\">&#x27;0&#x27;<\/span> : <span class=\"n\">0<\/span>;\n            <span class=\"k\">int<\/span> sum = n1 + n2 + c;\n            res.append(sum % <span class=\"n\">10<\/span>);\n            c = sum / <span class=\"n\">10<\/span>;\n            i--;\n            j--;\n        }\n        <span class=\"k\">return<\/span> res.reverse().toString();\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(max(m, n))，空间 O(1)（不计答案）。<\/p>"},{"key":"72","rank":29,"id":"72","title":"编辑距离","difficulty":"困难","tags":["动态规划","字符串"],"freq":208,"link":"https://leetcode.cn/problems/edit-distance/","desc":"求把 word1 变成 word2 最少需要多少次操作（插入、删除、替换一个字符）。","libs":["python-6","java-20"],"html":"<h2>思路<\/h2>\n<ul><li><code>dp[i][j]<\/code>：<code>word1<\/code> 前 <code>i<\/code> 个字符变成 <code>word2<\/code> 前 <code>j<\/code> 个字符的最少操作数。<\/li><li>看最后一个字符 <code>word1[i-1]<\/code> 和 <code>word2[j-1]<\/code>：<ul><li>相等：什么都不做，<code>dp[i][j] = dp[i-1][j-1]<\/code>；<\/li><li>不等：三种操作取最小再加 1——替换 <code>dp[i-1][j-1]<\/code>、删除 <code>dp[i-1][j]<\/code>、插入 <code>dp[i][j-1]<\/code>。<\/li><\/ul><\/li><li>初始化：<code>dp[i][0] = i<\/code>（全删），<code>dp[0][j] = j<\/code>（全插）。<\/li><li>自顶向下的想法一样：<code>dp(i, j)<\/code> 表示后缀 <code>word1[i:]<\/code> 变成 <code>word2[j:]<\/code> 的最少操作数，一个串走完时返回另一个串剩下的长度。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>dp<\/code> 开 <code>(m+1) × (n+1)<\/code>，下标 <code>i<\/code> 表示「前 i 个」，对应字符是 <code>i - 1<\/code>。<\/li><li>删除 / 插入对应哪个下标：删 <code>word1<\/code> 的字符 → <code>i<\/code> 退一步；往 <code>word1<\/code> 插一个字符去匹配 <code>word2[j-1]<\/code> → <code>j<\/code> 退一步。<\/li><li>不能贪心：只看下一个字符是否相同不够，必须枚举三种操作。<\/li><\/ul>\n<h2>代码<\/h2>\n<h3>写法一：自底向上<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">minDistance<\/span>(self, word1: str, word2: str) -&gt; int:\n        m, n = len(word1), len(word2)\n        dp = [[<span class=\"n\">0<\/span>] * (n + <span class=\"n\">1<\/span>) <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(m + <span class=\"n\">1<\/span>)]\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(m + <span class=\"n\">1<\/span>):\n            dp[i][<span class=\"n\">0<\/span>] = i\n        <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(n + <span class=\"n\">1<\/span>):\n            dp[<span class=\"n\">0<\/span>][j] = j\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, m + <span class=\"n\">1<\/span>):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, n + <span class=\"n\">1<\/span>):\n                <span class=\"k\">if<\/span> word1[i - <span class=\"n\">1<\/span>] == word2[j - <span class=\"n\">1<\/span>]:\n                    dp[i][j] = dp[i - <span class=\"n\">1<\/span>][j - <span class=\"n\">1<\/span>]\n                <span class=\"k\">else<\/span>:\n                    dp[i][j] = <span class=\"n\">1<\/span> + min(dp[i - <span class=\"n\">1<\/span>][j - <span class=\"n\">1<\/span>],   <span class=\"c\"># 替换<\/span>\n                                       dp[i - <span class=\"n\">1<\/span>][j],       <span class=\"c\"># 删除<\/span>\n                                       dp[i][j - <span class=\"n\">1<\/span>])       <span class=\"c\"># 插入<\/span>\n        <span class=\"k\">return<\/span> dp[m][n]<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> minDistance(<span class=\"t\">String<\/span> word1, <span class=\"t\">String<\/span> word2) {\n        <span class=\"k\">int<\/span> m = word1.length(), n = word2.length();\n        <span class=\"k\">int<\/span>[][] dp = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[m + <span class=\"n\">1<\/span>][n + <span class=\"n\">1<\/span>];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">0<\/span>; i &lt;= m; i++) dp[i][<span class=\"n\">0<\/span>] = i;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">0<\/span>; j &lt;= n; j++) dp[<span class=\"n\">0<\/span>][j] = j;\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt;= m; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">1<\/span>; j &lt;= n; j++) {\n                <span class=\"k\">if<\/span> (word1.charAt(i - <span class=\"n\">1<\/span>) == word2.charAt(j - <span class=\"n\">1<\/span>)) {\n                    dp[i][j] = dp[i - <span class=\"n\">1<\/span>][j - <span class=\"n\">1<\/span>];\n                } <span class=\"k\">else<\/span> {\n                    dp[i][j] = <span class=\"n\">1<\/span> + <span class=\"t\">Math<\/span>.min(dp[i - <span class=\"n\">1<\/span>][j - <span class=\"n\">1<\/span>],            <span class=\"c\">// 替换<\/span>\n                                   <span class=\"t\">Math<\/span>.min(dp[i - <span class=\"n\">1<\/span>][j], dp[i][j - <span class=\"n\">1<\/span>])); <span class=\"c\">// 删除 / 插入<\/span>\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> dp[m][n];\n    }\n}<\/code><\/pre><\/div>\n<h3>写法二：自顶向下（记忆化搜索）<\/h3>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">minDistance<\/span>(self, word1: str, word2: str) -&gt; int:\n        @cache\n        <span class=\"k\">def<\/span> <span class=\"f\">dp<\/span>(i, j):                        <span class=\"c\"># word1[i:] 变成 word2[j:] 的最少操作数<\/span>\n            <span class=\"k\">if<\/span> j == len(word2):\n                <span class=\"k\">return<\/span> len(word1) - i        <span class=\"c\"># 只能删<\/span>\n            <span class=\"k\">if<\/span> i == len(word1):\n                <span class=\"k\">return<\/span> len(word2) - j        <span class=\"c\"># 只能插<\/span>\n            <span class=\"k\">if<\/span> word1[i] == word2[j]:\n                <span class=\"k\">return<\/span> dp(i + <span class=\"n\">1<\/span>, j + <span class=\"n\">1<\/span>)\n            <span class=\"k\">return<\/span> <span class=\"n\">1<\/span> + min(dp(i + <span class=\"n\">1<\/span>, j),     <span class=\"c\"># 删除<\/span>\n                           dp(i + <span class=\"n\">1<\/span>, j + <span class=\"n\">1<\/span>), <span class=\"c\"># 替换<\/span>\n                           dp(i, j + <span class=\"n\">1<\/span>))     <span class=\"c\"># 插入<\/span>\n\n        <span class=\"k\">return<\/span> dp(<span class=\"n\">0<\/span>, <span class=\"n\">0<\/span>)<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span>[][] memo;\n\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> minDistance(<span class=\"t\">String<\/span> word1, <span class=\"t\">String<\/span> word2) {\n        memo = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[word1.length()][word2.length()];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span>[] row : memo) <span class=\"t\">Arrays<\/span>.fill(row, -<span class=\"n\">1<\/span>);\n        <span class=\"k\">return<\/span> dp(word1, <span class=\"n\">0<\/span>, word2, <span class=\"n\">0<\/span>);\n    }\n\n    <span class=\"c\">// word1[i..] 变成 word2[j..] 的最少操作数<\/span>\n    <span class=\"k\">private<\/span> <span class=\"k\">int<\/span> dp(<span class=\"t\">String<\/span> word1, <span class=\"k\">int<\/span> i, <span class=\"t\">String<\/span> word2, <span class=\"k\">int<\/span> j) {\n        <span class=\"k\">if<\/span> (j == word2.length()) <span class=\"k\">return<\/span> word1.length() - i;    <span class=\"c\">// 只能删<\/span>\n        <span class=\"k\">if<\/span> (i == word1.length()) <span class=\"k\">return<\/span> word2.length() - j;    <span class=\"c\">// 只能插<\/span>\n        <span class=\"k\">if<\/span> (memo[i][j] != -<span class=\"n\">1<\/span>) <span class=\"k\">return<\/span> memo[i][j];\n        <span class=\"k\">int<\/span> res;\n        <span class=\"k\">if<\/span> (word1.charAt(i) == word2.charAt(j)) {\n            res = dp(word1, i + <span class=\"n\">1<\/span>, word2, j + <span class=\"n\">1<\/span>);\n        } <span class=\"k\">else<\/span> {\n            res = <span class=\"n\">1<\/span> + <span class=\"t\">Math<\/span>.min(dp(word1, i + <span class=\"n\">1<\/span>, word2, j),               <span class=\"c\">// 删除<\/span>\n                      <span class=\"t\">Math<\/span>.min(dp(word1, i + <span class=\"n\">1<\/span>, word2, j + <span class=\"n\">1<\/span>),           <span class=\"c\">// 替换<\/span>\n                               dp(word1, i, word2, j + <span class=\"n\">1<\/span>)));             <span class=\"c\">// 插入<\/span>\n        }\n        <span class=\"k\">return<\/span> memo[i][j] = res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(mn)，空间 O(mn)（自底向上可用滚动数组压到 O(n)）。<\/p>"},{"key":"1143","rank":30,"id":"1143","title":"最长公共子序列","difficulty":"中等","tags":["动态规划","字符串"],"freq":203,"link":"https://leetcode.cn/problems/longest-common-subsequence/","desc":"求两个字符串的最长公共子序列的长度（子序列不要求连续）。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li><code>dp[i][j]<\/code>：<code>text1<\/code> 前 <code>i<\/code> 个字符和 <code>text2<\/code> 前 <code>j<\/code> 个字符的 LCS 长度。<\/li><li>看最后一个字符：<ul><li>相等：这个字符一定可以算进 LCS，<code>dp[i][j] = dp[i-1][j-1] + 1<\/code>；<\/li><li>不等：两个字符不可能同时在 LCS 里，丢掉其中一个，<code>dp[i][j] = max(dp[i-1][j], dp[i][j-1])<\/code>。<\/li><\/ul><\/li><li>第 0 行、第 0 列是空串，天然为 0，不用初始化。<\/li><li>自顶向下的写法结构同 <a href=\"#/72\">72<\/a>：<code>dp(i, j)<\/code> 表示两个后缀的 LCS，一方走完返回 0。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>不等时不用考虑 <code>dp[i-1][j-1]<\/code>：它不会比另外两个更大。<\/li><li>和 <a href=\"#/718\">718 最长重复子数组<\/a> 区分：子数组要求连续，不等时直接是 0；子序列不等时取 max。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">longestCommonSubsequence<\/span>(self, text1: str, text2: str) -&gt; int:\n        m, n = len(text1), len(text2)\n        dp = [[<span class=\"n\">0<\/span>] * (n + <span class=\"n\">1<\/span>) <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(m + <span class=\"n\">1<\/span>)]\n        <span class=\"k\">for<\/span> i <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, m + <span class=\"n\">1<\/span>):\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(<span class=\"n\">1<\/span>, n + <span class=\"n\">1<\/span>):\n                <span class=\"k\">if<\/span> text1[i - <span class=\"n\">1<\/span>] == text2[j - <span class=\"n\">1<\/span>]:\n                    dp[i][j] = dp[i - <span class=\"n\">1<\/span>][j - <span class=\"n\">1<\/span>] + <span class=\"n\">1<\/span>\n                <span class=\"k\">else<\/span>:\n                    dp[i][j] = max(dp[i - <span class=\"n\">1<\/span>][j], dp[i][j - <span class=\"n\">1<\/span>])\n        <span class=\"k\">return<\/span> dp[m][n]<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> longestCommonSubsequence(<span class=\"t\">String<\/span> text1, <span class=\"t\">String<\/span> text2) {\n        <span class=\"k\">int<\/span> m = text1.length(), n = text2.length();\n        <span class=\"k\">int<\/span>[][] dp = <span class=\"k\">new<\/span> <span class=\"k\">int<\/span>[m + <span class=\"n\">1<\/span>][n + <span class=\"n\">1<\/span>];\n        <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> i = <span class=\"n\">1<\/span>; i &lt;= m; i++) {\n            <span class=\"k\">for<\/span> (<span class=\"k\">int<\/span> j = <span class=\"n\">1<\/span>; j &lt;= n; j++) {\n                <span class=\"k\">if<\/span> (text1.charAt(i - <span class=\"n\">1<\/span>) == text2.charAt(j - <span class=\"n\">1<\/span>)) {\n                    dp[i][j] = dp[i - <span class=\"n\">1<\/span>][j - <span class=\"n\">1<\/span>] + <span class=\"n\">1<\/span>;\n                } <span class=\"k\">else<\/span> {\n                    dp[i][j] = <span class=\"t\">Math<\/span>.max(dp[i - <span class=\"n\">1<\/span>][j], dp[i][j - <span class=\"n\">1<\/span>]);\n                }\n            }\n        }\n        <span class=\"k\">return<\/span> dp[m][n];\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(mn)，空间 O(mn)（可用滚动数组压到 O(n)）。<\/p>"},{"key":"160","rank":31,"id":"160","title":"相交链表","difficulty":"简单","tags":["链表","双指针"],"freq":203,"link":"https://leetcode.cn/problems/intersection-of-two-linked-lists/","desc":"找出两个单链表相交的起始节点，不相交返回 null。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>双指针同时出发：<code>p1<\/code> 走 A，<code>p2<\/code> 走 B；走到末尾后分别跳到对方的头继续走。<\/li><li>两人走过的总路程都是 <code>A独有 + 公共 + B独有<\/code>，所以会同时到达相交点。<\/li><li>不相交时，两人各走 <code>m + n<\/code> 步后同时变成 <code>null<\/code>，循环一样结束，返回 <code>null<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>比较的是节点引用（<code>p1 == p2<\/code>），不是节点值。<\/li><li>切换条件是「<code>p1<\/code> 自己为空」时跳到对方头，不是 <code>p1.next<\/code> 为空——否则不相交时死循环。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">getIntersectionNode<\/span>(self, headA: ListNode, headB: ListNode) -&gt; Optional[ListNode]:\n        p1, p2 = headA, headB\n        <span class=\"k\">while<\/span> p1 <span class=\"k\">is<\/span> <span class=\"k\">not<\/span> p2:\n            p1 = p1.next <span class=\"k\">if<\/span> p1 <span class=\"k\">else<\/span> headB\n            p2 = p2.next <span class=\"k\">if<\/span> p2 <span class=\"k\">else<\/span> headA\n        <span class=\"k\">return<\/span> p1<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">public<\/span> <span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> getIntersectionNode(<span class=\"t\">ListNode<\/span> headA, <span class=\"t\">ListNode<\/span> headB) {\n        <span class=\"t\">ListNode<\/span> p1 = headA, p2 = headB;\n        <span class=\"k\">while<\/span> (p1 != p2) {\n            p1 = p1 == <span class=\"k\">null<\/span> ? headB : p1.next;\n            p2 = p2 == <span class=\"k\">null<\/span> ? headA : p2.next;\n        }\n        <span class=\"k\">return<\/span> p1;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(m + n)，空间 O(1)。<\/p>"},{"key":"42","rank":32,"id":"42","title":"接雨水","difficulty":"困难","tags":["双指针","数组"],"freq":201,"link":"https://leetcode.cn/problems/trapping-rain-water/","desc":"给定柱子高度数组，求下雨后能接多少雨水。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>位置 <code>i<\/code> 能接的水 = <code>min(左边最高, 右边最高) - height[i]<\/code>。<\/li><li>双指针：<code>l_max<\/code> 是 <code>[0, left]<\/code> 的最高柱子，<code>r_max<\/code> 是 <code>[right, n-1]<\/code> 的最高柱子。<\/li><li><strong>谁小处理谁<\/strong>：<code>l_max &lt; r_max<\/code> 时，<code>left<\/code> 位置的水量已经确定是 <code>l_max - height[left]<\/code>（右边再高也不影响 min），处理完 <code>left++<\/code>；否则对称地处理 <code>right<\/code>。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>先更新 <code>l_max<\/code> / <code>r_max<\/code>，再算水量，否则可能出现负数。<\/li><li>循环条件 <code>left &lt; right<\/code>。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">trap<\/span>(self, height: List[int]) -&gt; int:\n        left, right = <span class=\"n\">0<\/span>, len(height) - <span class=\"n\">1<\/span>\n        l_max = r_max = res = <span class=\"n\">0<\/span>\n        <span class=\"k\">while<\/span> left &lt; right:\n            l_max = max(l_max, height[left])\n            r_max = max(r_max, height[right])\n            <span class=\"k\">if<\/span> l_max &lt; r_max:\n                res += l_max - height[left]\n                left += <span class=\"n\">1<\/span>\n            <span class=\"k\">else<\/span>:\n                res += r_max - height[right]\n                right -= <span class=\"n\">1<\/span>\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"k\">int<\/span> trap(<span class=\"k\">int<\/span>[] height) {\n        <span class=\"k\">int<\/span> left = <span class=\"n\">0<\/span>, right = height.length - <span class=\"n\">1<\/span>;\n        <span class=\"k\">int<\/span> lMax = <span class=\"n\">0<\/span>, rMax = <span class=\"n\">0<\/span>, res = <span class=\"n\">0<\/span>;\n        <span class=\"k\">while<\/span> (left &lt; right) {\n            lMax = <span class=\"t\">Math<\/span>.max(lMax, height[left]);\n            rMax = <span class=\"t\">Math<\/span>.max(rMax, height[right]);\n            <span class=\"k\">if<\/span> (lMax &lt; rMax) {\n                res += lMax - height[left];\n                left++;\n            } <span class=\"k\">else<\/span> {\n                res += rMax - height[right];\n                right--;\n            }\n        }\n        <span class=\"k\">return<\/span> res;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"19","rank":33,"id":"19","title":"删除链表的倒数第N个节点","difficulty":"中等","tags":["链表","双指针"],"freq":190,"link":"https://leetcode.cn/problems/remove-nth-node-from-end-of-list/","desc":"删除链表的倒数第 n 个节点，返回头节点。","libs":[],"html":"<h2>思路<\/h2>\n<ul><li>快慢指针 + <code>dummy<\/code>：<code>fast<\/code> 从 <code>head<\/code> 先走 n 步，然后 <code>slow<\/code> 从 <code>dummy<\/code> 出发，两人一起走。<\/li><li><code>fast<\/code> 走到 <code>null<\/code> 时，<code>slow<\/code> 正好停在<strong>待删节点的前一个<\/strong>，<code>slow.next = slow.next.next<\/code> 删掉。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li><code>slow<\/code> 必须从 <code>dummy<\/code> 出发：这样才停在前驱上，也才能统一处理删除头节点的情况。<\/li><li>返回 <code>dummy.next<\/code>，不是 <code>head<\/code>（<code>head<\/code> 可能被删了）。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">removeNthFromEnd<\/span>(self, head: Optional[ListNode], n: int) -&gt; Optional[ListNode]:\n        dummy = ListNode(<span class=\"n\">0<\/span>, head)\n        fast = head\n        <span class=\"k\">for<\/span> _ <span class=\"k\">in<\/span> range(n):\n            fast = fast.next\n        slow = dummy\n        <span class=\"k\">while<\/span> fast:\n            fast = fast.next\n            slow = slow.next\n        slow.next = slow.next.next           <span class=\"c\"># slow 是待删节点的前一个<\/span>\n        <span class=\"k\">return<\/span> dummy.next<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">public<\/span> <span class=\"t\">ListNode<\/span> removeNthFromEnd(<span class=\"t\">ListNode<\/span> head, <span class=\"k\">int<\/span> n) {\n        <span class=\"t\">ListNode<\/span> dummy = <span class=\"k\">new<\/span> <span class=\"t\">ListNode<\/span>(<span class=\"n\">0<\/span>, head);\n        <span class=\"t\">ListNode<\/span> fast = head;\n        <span class=\"k\">while<\/span> (n-- &gt; <span class=\"n\">0<\/span>) {\n            fast = fast.next;\n        }\n        <span class=\"t\">ListNode<\/span> slow = dummy;\n        <span class=\"k\">while<\/span> (fast != <span class=\"k\">null<\/span>) {\n            fast = fast.next;\n            slow = slow.next;\n        }\n        slow.next = slow.next.next;          <span class=\"c\">// slow 是待删节点的前一个<\/span>\n        <span class=\"k\">return<\/span> dummy.next;\n    }\n}<\/code><\/pre><\/div>\n<p><strong>复杂度<\/strong>：时间 O(n)，空间 O(1)。<\/p>"},{"key":"93","rank":34,"id":"93","title":"复原IP地址","difficulty":"中等","tags":["回溯","字符串"],"freq":188,"link":"https://leetcode.cn/problems/restore-ip-addresses/","desc":"给一串数字，返回所有可能的合法 IP 地址（四段，每段 0~255，不能有前导 0）。","libs":["java-13","java-19","java-22"],"html":"<h2>思路<\/h2>\n<ul><li>回溯切四段：每次从位置 <code>i<\/code> 开始切出 1~3 位作为一段放进 <code>path<\/code>，递归切下一段。<\/li><li>每段的合法条件：长度 ≤ 3；数值 ≤ 255；不能有前导 0（单独一个 <code>&quot;0&quot;<\/code> 可以）。<\/li><li><code>path<\/code> 有 4 段时，只有恰好把字符串用完才是答案。<\/li><\/ul>\n<h2>易错点<\/h2>\n<ul><li>结束条件要同时满足「四段」和「用完整个字符串」，否则会出现 <code>1.2.3<\/code> 或者后面还剩字符的情况。<\/li><li>前导 0 的判断：长度大于 1 且首位是 <code>&#x27;0&#x27;<\/code>。<\/li><li>整体长度不在 <code>[4, 12]<\/code> 可以直接返回空。<\/li><\/ul>\n<h2>代码<\/h2>\n<div class=\"code multi\"><div class=\"langs\"><button type=\"button\" data-set-lang=\"python\">Python<\/button><button type=\"button\" data-set-lang=\"java\">Java<\/button><\/div><pre data-lang=\"python\"><code><span class=\"k\">class<\/span> <span class=\"f\">Solution<\/span>:\n    <span class=\"k\">def<\/span> <span class=\"f\">restoreIpAddresses<\/span>(self, s: str) -&gt; List[str]:\n        res, path = [], []\n        <span class=\"k\">if<\/span> <span class=\"k\">not<\/span> <span class=\"n\">4<\/span> &lt;= len(s) &lt;= <span class=\"n\">12<\/span>:\n            <span class=\"k\">return<\/span> res\n\n        <span class=\"k\">def<\/span> <span class=\"f\">dfs<\/span>(i):\n            <span class=\"k\">if<\/span> len(path) == <span class=\"n\">4<\/span>:\n                <span class=\"k\">if<\/span> i == len(s):                      <span class=\"c\"># 四段且刚好用完<\/span>\n                    res.append(<span class=\"s\">&quot;.&quot;<\/span>.join(path))\n                <span class=\"k\">return<\/span>\n            <span class=\"k\">for<\/span> j <span class=\"k\">in<\/span> range(i, min(i + <span class=\"n\">3<\/span>, len(s))):   <span class=\"c\"># 每段最多 3 位<\/span>\n                num = s[i:j + <span class=\"n\">1<\/span>]\n                <span class=\"k\">if<\/span> (len(num) &gt; <span class=\"n\">1<\/span> <span class=\"k\">and<\/span> num[<span class=\"n\">0<\/span>] == <span class=\"s\">&quot;0&quot;<\/span>) <span class=\"k\">or<\/span> int(num) &gt; <span class=\"n\">255<\/span>:\n                    <span class=\"k\">break<\/span>\n                path.append(num)\n                dfs(j + <span class=\"n\">1<\/span>)\n                path.pop()\n\n        dfs(<span class=\"n\">0<\/span>)\n        <span class=\"k\">return<\/span> res<\/code><\/pre><pre data-lang=\"java\"><code><span class=\"k\">class<\/span> <span class=\"t\">Solution<\/span> {\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">List<\/span>&lt;<span class=\"t\">String<\/span>&gt; res = <span class=\"k\">new<\/span> <span class=\"t\">ArrayList<\/span>&lt;&gt;();\n    <span class=\"k\">private<\/span> <span class=\"k\">final<\/span> <span class=\"t\">LinkedList<
